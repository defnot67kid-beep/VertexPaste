<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <title>Stonks Sever · Mobile & Desktop Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        /* Mobile-first responsive layout */
        .app {
            display: flex;
            height: 100%;
            width: 100%;
            position: relative;
        }

        /* Sidebar - transforms to slide-out on mobile */
        .sidebar {
            width: 280px;
            background: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 50;
            position: relative;
        }

        /* Mobile sidebar hidden by default, shown via menu */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                transform: translateX(-100%);
                z-index: 1000;
                box-shadow: 2px 0 20px rgba(0,0,0,0.5);
                width: 280px;
            }
            .sidebar.mobile-open {
                transform: translateX(0);
            }
            .chat-area {
                width: 100%;
            }
            .mobile-menu-btn {
                display: flex !important;
            }
            .chat-header {
                padding: 12px 16px !important;
            }
            .message {
                max-width: 95% !important;
            }
            .message-content {
                max-width: 100%;
            }
            .modal-content {
                width: 95% !important;
                max-height: 90vh !important;
                padding: 20px !important;
            }
            .embed-card {
                font-size: 0.85rem;
            }
            .embed-field {
                flex-direction: column;
                gap: 4px;
            }
            .embed-field-name {
                min-width: auto;
            }
            .input-area {
                padding: 12px !important;
                gap: 8px !important;
            }
            .input-area input {
                padding: 10px 14px !important;
                font-size: 16px !important; /* Prevents zoom on iOS */
            }
            .input-area button {
                padding: 0 18px !important;
                white-space: nowrap;
            }
            .user-profile {
                padding: 16px !important;
            }
            .avatar-img {
                width: 60px !important;
                height: 60px !important;
            }
            .sidebar-header {
                padding: 16px !important;
            }
            .logo {
                font-size: 1.2rem !important;
            }
            .messages-container {
                padding: 16px !important;
            }
        }

        @media (min-width: 769px) {
            .mobile-menu-btn {
                display: none !important;
            }
        }

        .mobile-menu-btn {
            background: #1e293b;
            border: none;
            color: #fbbf24;
            font-size: 1.2rem;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 12px;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 800;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #fbbf24, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .close-sidebar-mobile {
            display: none;
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.2rem;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .close-sidebar-mobile {
                display: block;
            }
        }

        .admin-badge {
            background: linear-gradient(135deg, #ef4444, #f59e0b);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 8px;
            color: white;
            display: inline-block;
        }

        .user-profile {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #1f2937;
        }

        .avatar-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fbbf24;
        }

        .user-name {
            margin-top: 10px;
            font-weight: 600;
            word-break: break-word;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            color: #9ca3af;
        }

        .nav-item:hover, .nav-item.active {
            background: #1f2937;
            color: #fbbf24;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f172a;
            width: 100%;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            background: #0f172a;
            flex-shrink: 0;
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .channel-name {
            font-size: 1.2rem;
            font-weight: 600;
            word-break: break-word;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.2s ease;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .message-content {
            background: #1e293b;
            padding: 10px 16px;
            border-radius: 18px;
            word-break: break-word;
            flex: 1;
        }

        .message-author {
            font-weight: 600;
            font-size: 0.8rem;
            display: flex;
            gap: 8px;
            align-items: baseline;
            flex-wrap: wrap;
        }

        .message-time {
            font-size: 0.65rem;
            color: #94a3b8;
            font-weight: normal;
        }

        .message-text {
            font-size: 0.9rem;
            margin-top: 4px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .system-message {
            background: linear-gradient(135deg, #1e293b, #1a1f2e);
            border-left: 3px solid #fbbf24;
        }

        .bot-tag {
            background: #8b5cf6;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            margin-left: 8px;
        }

        /* Rich Embed Card - Mobile friendly */
        .embed-card {
            background: #0f172a;
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 6px;
            border-left: 4px solid;
            overflow-x: auto;
        }

        .embed-title {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .embed-description {
            color: #cbd5e1;
            margin: 8px 0;
            line-height: 1.4;
        }

        .embed-field {
            margin: 6px 0;
            font-size: 0.85rem;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .embed-field-name {
            font-weight: bold;
            min-width: 80px;
        }

        .embed-field-value {
            color: #cbd5e1;
            word-break: break-word;
        }

        .embed-footer {
            margin-top: 8px;
            font-size: 0.7rem;
            color: #6b7280;
            border-top: 1px solid #1f2937;
            padding-top: 6px;
        }

        .input-area {
            padding: 16px 20px;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 12px;
            background: #0f172a;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            background: #1e293b;
            border: none;
            padding: 12px 18px;
            border-radius: 40px;
            color: white;
            outline: none;
            font-size: 0.95rem;
        }

        .input-area button {
            background: #fbbf24;
            border: none;
            padding: 0 24px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: #0f172a;
            white-space: nowrap;
        }

        /* Auth Overlay - Mobile Responsive */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0f;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            max-width: 400px;
            width: 100%;
            background: #1e293b;
            padding: 40px;
            border-radius: 32px;
            text-align: center;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            border-radius: 24px;
            padding: 28px;
            width: 90%;
            max-width: 850px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid #fbbf24;
        }

        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 10px;
            color: white;
            margin: 10px 0;
            font-size: 16px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-gold {
            background: #fbbf24;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-purple {
            background: #8b5cf6;
            color: white;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(70px);
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 40px;
            z-index: 1100;
            transition: 0.3s;
            border-left: 3px solid #fbbf24;
            white-space: nowrap;
            max-width: 90%;
            white-space: normal;
            text-align: center;
            font-size: 14px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .category-group {
            margin: 15px 0;
        }

        .category-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #6b7280;
            padding: 8px 12px;
            letter-spacing: 1px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px 8px 32px;
            border-radius: 8px;
            cursor: pointer;
            color: #9ca3af;
            font-size: 0.9rem;
            transition: 0.1s;
        }

        .channel-item:hover, .channel-item.active {
            background: #1f2937;
            color: #fbbf24;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .bot-card {
            background: #0f172a;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #8b5cf6;
        }

        .CodeMirror {
            height: 300px;
            border-radius: 12px;
            margin: 10px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .channel-select-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
            max-height: 150px;
            overflow-y: auto;
        }

        .channel-checkbox {
            background: #0f172a;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .channel-checkbox.selected {
            background: #fbbf24;
            color: #000;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #fbbf24;
            border-radius: 3px;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebarPanel">
        <div class="sidebar-header">
            <div class="logo">📈 STONKS SEVER</div>
            <button class="close-sidebar-mobile" id="closeSidebarMobile"><i class="fas fa-times"></i></button>

<!-- Admin Modal -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <h2><i class="fas fa-crown"></i> Admin Studio</h2>
        <div style="display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap;">

<!-- Bot Editor Modal -->
<div id="botEditorModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-code"></i> Create Custom Bot</h3>
        <input type="text" id="botName" placeholder="Bot Name (e.g., Stonks Trader)">
        <label>Target Channels (empty = ALL channels):</label>
        <div id="channelSelector" class="channel-select-grid"></div>
        <label>Bot Script - Return STRING or EMBED object:</label>
        <textarea id="botScript" rows="12">// Example: Working Bot with Embeds!
function onMessage(msg, author, userId, channelId) {
    if (msg === '/stonks') {
        return {
            embed: {
                title: "📈 STONKS MARKET LIVE",
                description: "Real-time market data",
                color: "#fbbf24",
                fields: [
                    { name: "🚀 STNK", value: "$142.50 (+12%)", inline: true },
                    { name: "📉 CRPT", value: "$87.30 (-5%)", inline: true },
                    { name: "🌙 MOON", value: "$315.20 (+8%)", inline: true }
                ],
                footer: "Prices update every 30 seconds"
            }
        };
    }
    if (msg === '/whoami') {
        return {
            embed: {
                title: "👤 User Profile",
                color: "#8b5cf6",
                fields: [
                    { name: "Username", value: author, inline: true },
                    { name: "User ID", value: userId, inline: true }
                ]
            }
        };
    }
    if (msg === '/ping') return "🏓 Pong! Bot is alive!";
    if (msg === '/help') return "Commands: /stonks, /whoami, /ping, /moon";
    return null;
}</textarea>
        <div class="modal-buttons">
            <button id="saveBotBtn" class="btn-gold">Save Bot</button>
            <button id="closeBotEditorBtn" class="btn-danger">Cancel</button>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast"></div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc",
        authDomain: "vertexpaste.firebaseapp.com",
        projectId: "vertexpaste",
        storageBucket: "vertexpaste.firebasestorage.app",
        messagingSenderId: "255275350380",
        appId: "1:255275350380:web:7be4e8add2cb5b04045b49"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    const ADMIN_EMAIL = "defnot67kid@gmail.com";
    let currentUser = null, isAdmin = false, currentChannelId = "general", unsubscribeMessages = null;
    let activeBots = [];
    
    // Helper functions
    function escapeHtml(s) { if(!s) return ''; return String(s).replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    function formatTime(ts) { if(!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
    function showToast(msg) { const t=document.getElementById('toastMsg'); t.innerText=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
    
    // Render embed responses
    function renderBotResponse(response) {
        if (!response) return null;
        if (typeof response === 'string') return response;
        if (response.embed) {
            const e = response.embed;
            const borderColor = e.color || "#fbbf24";
            let html = `<div class="embed-card" style="border-left-color: ${borderColor};">`;
            if (e.title) html += `<div class="embed-title" style="color: ${borderColor};">${escapeHtml(e.title)}</div>`;
            if (e.description) html += `<div class="embed-description">${escapeHtml(e.description)}</div>`;
            if (e.fields && e.fields.length) {
                for (const field of e.fields) {
                    html += `<div class="embed-field">
                        <span class="embed-field-name" style="color: ${borderColor};">${escapeHtml(field.name)}:</span>
                        <span class="embed-field-value">${escapeHtml(field.value)}</span>
                    </div>`;
                }
            }
            if (e.footer) html += `<div class="embed-footer">${escapeHtml(e.footer)}</div>`;
            html += `</div>`;
            return html;
        }
        return String(response);
    }
    
    async function executeBotScript(bot, msg, author, userId, channelId) {
        if (!bot.script) return null;
        try {
            const scriptFunc = new Function('msg', 'author', 'userId', 'channelId', 
                bot.script + '\n return typeof onMessage === "function" ? onMessage(msg, author, userId, channelId) : null;');
            const result = await scriptFunc(msg, author, userId, channelId);
            if (result) return { text: renderBotResponse(result), isEmbed: typeof result !== 'string' };
            return null;
        } catch(e) { return { text: `❌ Bot error: ${e.message}`, isEmbed: false }; }
    }
    
    async function loadBots() {
        const botsSnap = await db.collection("bots").get();
        activeBots = [];
        botsSnap.forEach(doc => { activeBots.push({ id: doc.id, ...doc.data() }); });
    }
    
    async function processBotCommands(msg, author, userId, channelId) {
        if (!msg.startsWith('/')) return null;
        for (const bot of activeBots) {
            const targetChannels = bot.channels || [];
            if (targetChannels.length && !targetChannels.includes(channelId)) continue;
            const response = await executeBotScript(bot, msg, author, userId, channelId);
            if (response) return { text: response.text, displayName: bot.name, isEmbed: response.isEmbed };
        }
        return null;
    }
    
    async function sendToChannel(channelId, text, displayName, isEmbed = false) {
        await db.collection("channels").doc(channelId).collection("messages").add({
            text: text, displayName: displayName,
            photoURL: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png",
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            isBot: true, isEmbed: isEmbed
        });
    }
    
    async function sendUserMessage() {
        if (!currentUser) return;
        const input = document.getElementById('messageInput');
        const msg = input.value.trim();
        if (!msg) return;
        const botResponse = await processBotCommands(msg, currentUser.displayName, currentUser.uid, currentChannelId);
        if (botResponse) {
            await sendToChannel(currentChannelId, botResponse.text, botResponse.displayName, botResponse.isEmbed);
            input.value = '';
            return;
        }
        await db.collection("channels").doc(currentChannelId).collection("messages").add({
            text: msg, uid: currentUser.uid, displayName: currentUser.displayName,
            photoURL: currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.displayName || 'User')}&background=6366f1&color=fff`,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(), isBot: false
        });
        input.value = '';
    }
    
    // Channel management
    async function loadChannels() {
        const docRef = db.collection("server").doc("structure");
        const docSnap = await docRef.get();
        if (docSnap.exists) return docSnap.data();
        const def = { categories: [{ name: "TEXT CHANNELS", channels: [{ id: "general", name: "general" }] }] };
        await docRef.set(def); return def;
    }
    async function saveChannels(data) { await db.collection("server").doc("structure").set(data); }
    
    async function renderSidebar() {
        const struct = await loadChannels();
        const container = document.getElementById('channelsList');
        let html = '';
        for (const cat of struct.categories) {
            html += `<div class="category-group"><div class="category-title">${escapeHtml(cat.name)}</div>`;
            for (const ch of cat.channels) {
                html += `<div class="channel-item ${currentChannelId === ch.id ? 'active' : ''}" data-channel-id="${ch.id}" data-channel-name="${ch.name}"><i class="fas fa-hashtag"></i> ${escapeHtml(ch.name)}</div>`;
            }
            html += `</div>`;
        }
        container.innerHTML = html;
        document.querySelectorAll('.channel-item').forEach(el => {
            el.addEventListener('click', () => switchChannel(el.dataset.channelId, el.dataset.channelName));
        });
    }
    
    function switchChannel(id, name) {
        if (unsubscribeMessages) unsubscribeMessages();
        currentChannelId = id;
        document.getElementById('currentChannelName').innerText = name;
        loadMessagesForChannel(id);
        renderSidebar();
        if (window.innerWidth <= 768) closeMobileSidebar();
    }
    
    function loadMessagesForChannel(channelId) {
        const container = document.getElementById('messagesContainer');
        unsubscribeMessages = db.collection("channels").doc(channelId).collection("messages").orderBy("createdAt","asc").onSnapshot(snapshot => {
            let html = '';
            snapshot.forEach(doc => {
                const d = doc.data();
                html += `<div class="message ${d.isBot ? 'system-message' : ''}">
                    <img src="${d.photoURL || 'https://ui-avatars.com/api/?name=User'}" class="message-avatar" onerror="this.src='https://ui-avatars.com/api/?name=User'">
                    <div class="message-content">
                        <div class="message-author">${escapeHtml(d.displayName)}${d.isBot ? '<span class="bot-tag">BOT</span>' : ''}<span class="message-time">${formatTime(d.createdAt)}</span></div>
                        <div class="message-text">${d.isEmbed ? d.text : escapeHtml(d.text)}</div>
                    </div>
                </div>`;
            });
            if (!html) html = '<div style="text-align:center;padding:40px;color:#6b7280;">✨ No messages yet. Try /help!</div>';
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        });
    }
    
    // Mobile sidebar controls
    function openMobileSidebar() { document.getElementById('sidebarPanel').classList.add('mobile-open'); }
    function closeMobileSidebar() { document.getElementById('sidebarPanel').classList.remove('mobile-open'); }
    
    // Admin Panel (simplified for space, keeps core functions)
    async function openAdminPanel() {
        if (!isAdmin) { showToast("Admin only"); return; }
        const modal = document.getElementById('adminModal');
        const struct = await loadChannels();
        const catsDiv = document.getElementById('categoriesListAdmin');
        catsDiv.innerHTML = '';
        struct.categories.forEach((cat, idx) => {
            catsDiv.innerHTML += `<div class="flex-between" style="background:#0f172a; padding:8px; margin:5px 0; border-radius:8px;"><span>📁 ${escapeHtml(cat.name)}</span><button class="btn-danger" onclick="deleteCategory(${idx})">Delete</button></div>`;
        });
        const catSelect = document.getElementById('categorySelect');
        catSelect.innerHTML = '';
        struct.categories.forEach((cat, idx) => { catSelect.innerHTML += `<option value="${idx}">${escapeHtml(cat.name)}</option>`; });
        await loadBots();
        const botsDiv = document.getElementById('botsList');
        botsDiv.innerHTML = '';
        activeBots.forEach(bot => {
            botsDiv.innerHTML += `<div class="bot-card"><div class="flex-between"><div><strong>🤖 ${escapeHtml(bot.name)}</strong><br><small>Channels: ${bot.channels?.length ? bot.channels.join(', ') : 'ALL'}</small></div><button class="btn-danger" onclick="deleteBot('${bot.id}')">Delete</button></div></div>`;
        });
        modal.classList.add('active');
    }
    
    window.deleteCategory = async (idx) => { const struct = await loadChannels(); struct.categories.splice(idx,1); await saveChannels(struct); await renderSidebar(); openAdminPanel(); showToast("Deleted"); };
    window.deleteBot = async (botId) => { await db.collection("bots").doc(botId).delete(); await loadBots(); openAdminPanel(); showToast("Bot deleted"); };
    
    document.getElementById('addCategoryBtn')?.addEventListener('click', async () => {
        const name = document.getElementById('newCategoryName').value.trim();
        if(!name) return;
        const struct = await loadChannels();
        struct.categories.push({ name: name.toUpperCase(), channels: [] });
        await saveChannels(struct); await renderSidebar(); openAdminPanel();
        document.getElementById('newCategoryName').value = ''; showToast("Category added");
    });
    document.getElementById('addChannelBtn')?.addEventListener('click', async () => {
        const catIdx = parseInt(document.getElementById('categorySelect').value);
        const chName = document.getElementById('newChannelName').value.trim();
        if(!chName) return;
        const struct = await loadChannels();
        const newId = chName.toLowerCase().replace(/\s/g,'_') + Date.now();
        struct.categories[catIdx].channels.push({ id: newId, name: chName });
        await saveChannels(struct); await renderSidebar(); openAdminPanel();
        document.getElementById('newChannelName').value = ''; showToast("Channel added");
    });
    
    async function populateChannelSelector(selectedChannels = []) {
        const struct = await loadChannels();
        const container = document.getElementById('channelSelector');
        let allChannels = [];
        for (const cat of struct.categories) for (const ch of cat.channels) allChannels.push(ch);
        container.innerHTML = allChannels.map(ch => `<div class="channel-checkbox ${selectedChannels.includes(ch.id) ? 'selected' : ''}" data-channel-id="${ch.id}">#${escapeHtml(ch.name)}</div>`).join('');
        container.querySelectorAll('.channel-checkbox').forEach(el => {
            el.addEventListener('click', () => el.classList.toggle('selected'));
        });
    }
    
    document.getElementById('createBotBtn')?.addEventListener('click', async () => {
        document.getElementById('botName').value = '';
        document.getElementById('botScript').value = `function onMessage(msg, author, userId, channelId) {
    if (msg === '/stonks') {
        return {
            embed: {
                title: "📈 STONKS MARKET",
                color: "#fbbf24",
                fields: [
                    { name: "STNK", value: "$142.50 🟢", inline: true },
                    { name: "CRPT", value: "$87.30 🔴", inline: true }
                ]
            }
        };
    }
    if (msg === '/ping') return "🏓 Pong!";
    return null;
}`;
        await populateChannelSelector([]);
        document.getElementById('botEditorModal').classList.add('active');
    });
    
    document.getElementById('saveBotBtn')?.addEventListener('click', async () => {
        const name = document.getElementById('botName').value.trim();
        const script = document.getElementById('botScript').value;
        const channelCheckboxes = document.querySelectorAll('#channelSelector .channel-checkbox.selected');
        const channels = Array.from(channelCheckboxes).map(cb => cb.dataset.channelId);
        if (!name || !script) { showToast("Bot name and script required"); return; }
        try {
            new Function('msg', 'author', 'userId', 'channelId', script + '\n return typeof onMessage === "function" ? onMessage("/ping", "Test", "test", "general") : null;')();
        } catch(e) { showToast("Script error: " + e.message); return; }
        await db.collection("bots").add({ name, script, channels, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        await loadBots();
        document.getElementById('botEditorModal').classList.remove('active');
        openAdminPanel();
        showToast(`Bot "${name}" created!`);
    });
    
    document.getElementById('tabBotsBtn')?.addEventListener('click', () => { document.getElementById('botsTab').style.display = 'block'; document.getElementById('categoriesTab').style.display = 'none'; });
    document.getElementById('tabCategoriesBtn')?.addEventListener('click', () => { document.getElementById('botsTab').style.display = 'none'; document.getElementById('categoriesTab').style.display = 'block'; });
    
    // Auth
    function updateUI(user) {
        const overlay = document.getElementById('authOverlay'), sidebar = document.getElementById('sidebarPanel'), chat = document.getElementById('chatArea');
        if (user) {
            overlay.style.display = 'none'; sidebar.style.display = 'flex'; chat.style.display = 'flex';
            document.getElementById('sidebarName').innerText = user.displayName || user.email;
            document.getElementById('sidebarAvatar').src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || 'User')}&background=6366f1&color=fff`;
            isAdmin = (user.email === ADMIN_EMAIL);
            document.getElementById('adminIndicator').classList.toggle('hidden', !isAdmin);
            document.getElementById('adminPanelBtn').style.display = isAdmin ? 'flex' : 'none';
            renderSidebar(); loadMessagesForChannel(currentChannelId); loadBots();
        } else {
            overlay.style.display = 'flex'; sidebar.style.display = 'none'; chat.style.display = 'none';
            if (unsubscribeMessages) unsubscribeMessages();
        }
    }
    
    async function signIn() { const provider = new firebase.auth.GoogleAuthProvider(); try { await auth.signInWithPopup(provider); showToast("Welcome!"); } catch(e) { showToast("Sign in failed"); } }
    async function signOut() { await auth.signOut(); updateUI(null); showToast("Signed out"); }
    
    // Event listeners
    document.getElementById('signInBtn')?.addEventListener('click', signIn);
    document.getElementById('signOutBtnNav')?.addEventListener('click', signOut);
    document.getElementById('signOutBtnTop')?.addEventListener('click', signOut);
    document.getElementById('sendBtn')?.addEventListener('click', sendUserMessage);
    document.getElementById('messageInput')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendUserMessage(); });
    document.getElementById('adminPanelBtn')?.addEventListener('click', openAdminPanel);
    document.getElementById('closeAdminBtn')?.addEventListener('click', () => document.getElementById('adminModal').classList.remove('active'));
    document.getElementById('closeBotEditorBtn')?.addEventListener('click', () => document.getElementById('botEditorModal').classList.remove('active'));
    document.getElementById('mobileMenuBtn')?.addEventListener('click', openMobileSidebar);
    document.getElementById('closeSidebarMobile')?.addEventListener('click', closeMobileSidebar);
    document.addEventListener('click', (e) => { if (e.target.classList.contains('modal')) e.target.classList.remove('active'); });
    
    auth.onAuthStateChanged(user => { currentUser = user; updateUI(user); });
    
    // Auto-create default bot
    setTimeout(async () => {
        const botsSnap = await db.collection("bots").get();
        if (botsSnap.empty && isAdmin) {
            await db.collection("bots").add({
                name: "Stonks Trader",
                script: `function onMessage(msg, author, userId, channelId) {
    if (msg === '/stonks') return { embed: { title: "📈 STONKS MARKET", color: "#fbbf24", fields: [{ name: "STNK", value: "$142.50 🟢" }, { name: "CRPT", value: "$87.30 🔴" }] } };
    if (msg === '/ping') return "🏓 Pong!";
    if (msg === '/help') return "Commands: /stonks, /ping";
    return null;
}`,
                channels: [],
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            await loadBots();
        }
    }, 2000);
</script>
</body>
</html>
