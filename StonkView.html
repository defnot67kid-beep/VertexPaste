<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Stonks Hub · Real Voice & Screen Share</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #e2e8f0; height: 100vh; overflow: hidden; }
        .app { display: flex; height: 100%; width: 100%; overflow: hidden; }

        /* SERVER LIST */
        .server-list { width: 72px; background: #0f0f14; border-right: 1px solid #1f2937; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 0; overflow-y: auto; flex-shrink: 0; }
        .server-icon { width: 48px; height: 48px; background: #1e293b; border-radius: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; position: relative; color: #fbbf24; font-weight: bold; }
        .server-icon.active { border-radius: 16px; background: linear-gradient(135deg, #fbbf24, #ef4444); color: white; }
        .server-icon:hover { border-radius: 16px; background: #334155; }
        .add-server-btn, .join-server-btn { background: #1f2937; border: 2px dashed #fbbf24; }
        .server-tooltip { position: absolute; left: 70px; background: #000c; padding: 4px 10px; border-radius: 20px; font-size: 12px; white-space: nowrap; display: none; z-index: 100; }
        .server-icon:hover .server-tooltip { display: block; }

        /* SIDEBAR */
        .sidebar { width: 280px; background: #111827; border-right: 1px solid #1f2937; display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.2s; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
        .server-name-header { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
        .server-actions { display: flex; gap: 8px; }
        .server-actions button { background: #1f2937; border: none; color: #fbbf24; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
        .category-group { margin: 8px 0; }
        .category-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px; cursor: pointer; color: #9ca3af; font-size: 0.7rem; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        .category-header:hover { background: #1a2332; color: #fbbf24; }
        .category-header i.fa-chevron-down, .category-header i.fa-chevron-right { font-size: 10px; margin-right: 6px; }
        .category-name { flex: 1; }
        .add-channel-btn { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 12px; padding: 0 4px; }
        .add-channel-btn:hover { color: #fbbf24; }
        .channels-container { overflow: hidden; transition: max-height 0.2s ease; }
        .channels-container.collapsed { display: none; }
        .channel-item { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 32px; border-radius: 8px; cursor: pointer; color: #9ca3af; font-size: 0.85rem; transition: 0.1s; }
        .channel-item.active { background: #1f2937; color: #fbbf24; }
        .channel-item:hover { background: #1f2937; }
        .voice-channel { color: #34d399; }
        .voice-members-sidebar { padding: 2px 12px 4px 44px; font-size: 0.7rem; color: #6b7280; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .voice-member-chip { background: #1f2937; border-radius: 20px; padding: 2px 8px; display: inline-flex; align-items: center; gap: 4px; }
        .member-info { padding: 12px; border-top: 1px solid #1f2937; font-size: 13px; display: flex; align-items: center; justify-content: space-between; }
        .crown { color: #fbbf24; margin-left: 4px; }

        /* CHAT AREA */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0f172a; overflow: hidden; min-width: 0; }
        .chat-header { padding: 12px 20px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; background: #0f172a; }
        .channel-info { display: flex; align-items: center; gap: 8px; }
        .invite-btn { background: #1e293b; border: none; padding: 6px 14px; border-radius: 20px; color: #fbbf24; cursor: pointer; font-size: 0.8rem; }
        .messages-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message { display: flex; gap: 10px; max-width: 100%; animation: fadeIn 0.2s; }
        .message-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .message-content { background: #1e293b; padding: 8px 14px; border-radius: 18px; word-break: break-word; flex: 1; }
        .message-author { font-weight: 600; font-size: 0.75rem; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
        .message-time { font-size: 0.6rem; color: #94a3b8; }
        .message-text { font-size: 0.85rem; margin-top: 4px; line-height: 1.4; }
        .input-area { padding: 12px; border-top: 1px solid #1e293b; background: #0f172a; display: flex; gap: 10px; }
        .input-area input { flex: 1; background: #1e293b; border: none; padding: 12px 16px; border-radius: 30px; color: white; outline: none; }
        .input-area button { background: #fbbf24; border: none; padding: 0 20px; border-radius: 30px; font-weight: bold; cursor: pointer; }

        /* VOICE & SCREEN SHARE LAYOUT */
        .voice-view { flex: 1; display: flex; flex-direction: column; background: #060b14; overflow: hidden; }
        .voice-view-body { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; position: relative; overflow-y: auto; padding: 20px; }
        .voice-participants-grid { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: center; max-width: 700px; }
        .voice-participant-card { display: flex; flex-direction: column; align-items: center; gap: 8px; background: #11182780; padding: 12px; border-radius: 32px; backdrop-filter: blur(4px); }
        .voice-participant-avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 2px solid #1f2937; transition: 0.1s; }
        .voice-participant-avatar.speaking { border-color: #34d399; box-shadow: 0 0 14px #34d39970; }
        .voice-controls { display: flex; gap: 12px; align-items: center; padding: 14px 20px; background: #0d1727; border-top: 1px solid #1e293b; justify-content: center; }
        .voice-ctrl-btn { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; background: #1e293b; color: white; font-size: 20px; transition: 0.1s; }
        .btn-mic.muted { background: #3b1a1a; color: #ef4444; }
        .btn-share-screen.active { background: #2563eb; color: white; }
        .btn-leave { background: #3b1a1a; color: #ef4444; }
        .screenshare-container { flex: 1; background: #000000cc; display: flex; flex-direction: column; min-height: 200px; border-radius: 20px; margin: 10px; overflow: hidden; }
        .screenshare-video-wrap { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
        .screenshare-video { width: 100%; height: 100%; object-fit: contain; max-height: 300px; background: #000; }
        .screenshare-viewers { background: #0d1727; padding: 8px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.7rem; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #0f172a; border-radius: 28px; padding: 24px; width: 90%; max-width: 450px; border: 1px solid #334155; }
        .btn-gold { background: #fbbf24; color: #0f172a; border: none; padding: 8px 18px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .btn-outline { background: transparent; border: 1px solid #fbbf24; color: #fbbf24; padding: 6px 14px; border-radius: 30px; cursor: pointer; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 8px 20px; border-radius: 40px; z-index: 3000; border-left: 3px solid #fbbf24; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        .owner-badge { background: #fbbf24; color: black; padding: 2px 8px; border-radius: 20px; font-size: 10px; margin-left: 6px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 700px) {
            .sidebar { position: fixed; left: 0; top: 0; height: 100%; transform: translateX(-100%); z-index: 1100; }
            .sidebar.open { transform: translateX(0); }
            .overlay { position: fixed; inset: 0; background: #00000080; z-index: 1050; display: none; }
            .overlay.active { display: block; }
            .voice-participant-avatar { width: 56px; height: 56px; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="server-list" id="serverListContainer"></div>
    <div class="sidebar" id="sidebarPanel">
        <div class="sidebar-header"><div class="server-name-header"><span id="currentServerName">Stonks Hub</span><span id="serverOwnerCrown"></span></div><div class="server-actions"><button id="createCategoryBtn" title="Create Category"><i class="fas fa-folder-plus"></i></button><button id="invitePeopleBtn" title="Invite"><i class="fas fa-user-plus"></i></button><button id="deleteServerBtn" title="Delete Server" style="color:#ef4444;"><i class="fas fa-trash"></i></button></div></div>
        <div style="flex:1; overflow-y: auto;" id="channelsListContainer"></div>
        <div class="member-info"><span><i class="fas fa-user-circle"></i> <span id="userDisplay"></span><span id="roleBadge"></span></span><button id="signOutBtn" style="background:none; border:none; color:#fbbf24; cursor:pointer;"><i class="fas fa-sign-out-alt"></i></button></div>
    </div>
    <div class="overlay" id="mobileOverlay"></div>
    <div class="chat-area">
        <div class="chat-header"><div class="channel-info"><i class="fas fa-hashtag" id="channelTypeIcon"></i><span id="currentChannelName">general</span></div><button class="invite-btn" id="headerInviteBtn"><i class="fas fa-link"></i> Invite</button></div>
        <div id="textChatView" style="display:flex; flex-direction:column; flex:1; overflow:hidden;"><div class="messages-container" id="messagesContainer"></div><div class="input-area"><input type="text" id="messageInput" placeholder="Message..."><button id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button></div></div>
        <div id="voiceChatView" class="voice-view" style="display:none;">
            <div class="voice-view-body" id="voiceViewBody">
                <div id="screenShareDynamicArea" style="width:100%; max-width: 800px; margin-bottom: 20px;"></div>
                <div class="voice-participants-grid" id="voiceParticipantsGrid"></div>
            </div>
            <div class="voice-controls"><button class="voice-ctrl-btn btn-mic" id="micToggleBtn"><i class="fas fa-microphone"></i></button><button class="voice-ctrl-btn btn-share-screen" id="shareScreenBtn"><i class="fas fa-desktop"></i></button><button class="voice-ctrl-btn btn-leave" id="leaveVoiceBtn"><i class="fas fa-phone-slash"></i></button></div>
        </div>
    </div>
</div>

<div id="createServerModal" class="modal"><div class="modal-content"><h3>New Server</h3><input type="text" id="newServerName" placeholder="Server name"><button id="confirmCreateServer" class="btn-gold">Create</button><button id="closeCreateModal" class="btn-outline">Cancel</button></div></div>
<div id="createCategoryModal" class="modal"><div class="modal-content"><h3>New Category</h3><input type="text" id="categoryName" placeholder="Category name"><button id="confirmCreateCategory" class="btn-gold">Add</button><button id="closeCatModal" class="btn-outline">Cancel</button></div></div>
<div id="createChannelModal" class="modal"><div class="modal-content"><h3>New Channel</h3><input type="text" id="channelName" placeholder="Channel name"><select id="channelTypeSelect"><option value="text">📝 Text</option><option value="voice">🎙️ Voice</option></select><select id="categorySelect"></select><button id="confirmCreateChannel" class="btn-gold">Create</button><button id="closeChanModal" class="btn-outline">Cancel</button></div></div>
<div id="inviteModal" class="modal"><div class="modal-content"><h3>Invite Link</h3><p>Share code: <strong id="inviteCodeDisplay"></strong></p><button id="closeInviteModal" class="btn-gold">Close</button></div></div>
<div id="joinServerModal" class="modal"><div class="modal-content"><h3>Join Server</h3><input type="text" id="joinCodeInput" placeholder="Invite code"><button id="confirmJoinServer" class="btn-gold">Join</button><button id="closeJoinModal" class="btn-outline">Cancel</button></div></div>
<div id="micPermModal" class="modal"><div class="modal-content"><i class="fas fa-microphone" style="font-size:40px;color:#fbbf24;"></i><h3 style="margin:10px 0">Microphone Access</h3><p>Enable mic so others can hear you.</p><button id="allowMicBtn" class="btn-gold">Allow Mic</button><button id="denyMicBtn" class="btn-outline">Join Muted</button></div></div>
<div id="toastMsg" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = { apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc", authDomain: "vertexpaste.firebaseapp.com", projectId: "vertexpaste", storageBucket: "vertexpaste.firebasestorage.app", messagingSenderId: "255275350380", appId: "1:255275350380:web:7be4e8add2cb5b04045b49" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.firestore();
    const OWNER_EMAIL = "defnot67kid@gmail.com";
    let currentUser = null, currentServerId = null, currentChannelId = null, currentChannelType = "text";
    let unsubscribeMessages = null, unsubscribeVoicePresence = null, unsubscribeScreenShare = null;
    let isGlobalOwner = false;
    let localStream = null, screenStream = null;
    let isMicMuted = false, isSharing = false;
    let currentVoiceChannelId = null;
    let sidebarVoiceUnsubs = {};

    function showToast(msg) { const t = document.getElementById('toastMsg'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    function escapeHtml(s) { return String(s).replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m])); }

    // AUTH
    function updateAuthUI(user) {
        if (user) {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('userDisplay').innerHTML = escapeHtml(user.displayName || user.email);
            isGlobalOwner = (user.email === OWNER_EMAIL);
            document.getElementById('roleBadge').innerHTML = isGlobalOwner ? '<span class="owner-badge"><i class="fas fa-crown"></i> OWNER</span>' : '';
            renderServerList().then(async () => { const servers = await fetchUserServers(); if (servers.length && !currentServerId) await switchServer(servers[0].id); });
        }
    }
    async function fetchUserServers() {
        if (!currentUser) return [];
        if (isGlobalOwner) { const all = await db.collection("servers").get(); return all.docs.map(d => ({ id: d.id, ...d.data() })); }
        const memberSnap = await db.collection("serverMembers").where("userId", "==", currentUser.uid).get();
        const serverIds = memberSnap.docs.map(d => d.data().serverId);
        if (!serverIds.length) return [];
        const servers = await Promise.all(serverIds.map(id => db.collection("servers").doc(id).get()));
        return servers.filter(s => s.exists).map(s => ({ id: s.id, ...s.data() }));
    }
    async function renderServerList() {
        const servers = await fetchUserServers();
        const container = document.getElementById('serverListContainer');
        let html = '';
        for (const sv of servers) html += `<div class="server-icon ${currentServerId === sv.id ? 'active' : ''}" data-server-id="${sv.id}"><span>${sv.name.charAt(0).toUpperCase()}</span><div class="server-tooltip">${escapeHtml(sv.name)}</div></div>`;
        html += `<div class="server-icon add-server-btn" id="addServerBtn"><i class="fas fa-plus"></i><div class="server-tooltip">Create</div></div><div class="server-icon join-server-btn" id="joinServerBtn"><i class="fas fa-sign-in-alt"></i><div class="server-tooltip">Join</div></div>`;
        container.innerHTML = html;
        document.querySelectorAll('.server-icon[data-server-id]').forEach(el => el.addEventListener('click', () => switchServer(el.dataset.serverId)));
        document.getElementById('addServerBtn')?.addEventListener('click', () => document.getElementById('createServerModal').classList.add('active'));
        document.getElementById('joinServerBtn')?.addEventListener('click', () => document.getElementById('joinServerModal').classList.add('active'));
    }
    async function switchServer(serverId) {
        if (unsubscribeMessages) unsubscribeMessages();
        await leaveVoiceIfIn();
        currentServerId = serverId;
        currentChannelId = null;
        const serverDoc = await db.collection("servers").doc(serverId).get();
        document.getElementById('currentServerName').innerHTML = escapeHtml(serverDoc.data()?.name || "Server");
        await loadServerChannels(serverId);
        await renderServerList();
        closeSidebarMobile();
    }
    async function loadServerChannels(serverId) {
        const structRef = db.collection("serverStructure").doc(serverId);
        let struct = (await structRef.get()).data();
        if (!struct) { struct = { categories: [{ name: "TEXT", channels: [{ id: "general", name: "general", type: "text" }] }] }; await structRef.set(struct); }
        if (!currentChannelId) currentChannelId = "general";
        const ch = findChannel(struct, currentChannelId);
        currentChannelType = ch?.type || "text";
        await renderSidebarChannels(struct);
        if (currentChannelType === "text") { showTextView(); loadMessagesForChannel(currentServerId, currentChannelId); }
        else if (currentChannelType === "voice") joinVoiceChannel(currentChannelId);
        document.getElementById('currentChannelName').innerText = getChannelNameById(struct, currentChannelId);
        updateChannelHeaderIcon();
    }
    function findChannel(struct, chId) { for (const cat of struct.categories) for (const ch of cat.channels) if (ch.id === chId) return ch; return null; }
    function getChannelNameById(struct, chId) { const ch = findChannel(struct, chId); return ch ? ch.name : chId; }
    function updateChannelHeaderIcon() { const icon = document.getElementById('channelTypeIcon'); icon.className = currentChannelType === "voice" ? "fas fa-microphone-alt" : "fas fa-hashtag"; }
    async function renderSidebarChannels(struct) {
        Object.values(sidebarVoiceUnsubs).forEach(u => u && u()); sidebarVoiceUnsubs = {};
        const container = document.getElementById('channelsListContainer');
        let html = '';
        for (let i=0; i<struct.categories.length; i++) {
            const cat = struct.categories[i];
            const isExpanded = localStorage.getItem(`collapse_${currentServerId}_${i}`) !== 'false';
            html += `<div class="category-group"><div class="category-header" data-cat-index="${i}"><i class="fas fa-chevron-${isExpanded ? 'down' : 'right'}"></i><span class="category-name">${escapeHtml(cat.name)}</span><button class="add-channel-btn" data-category="${escapeHtml(cat.name)}"><i class="fas fa-plus-circle"></i></button></div><div class="channels-container ${isExpanded ? '' : 'collapsed'}" data-cat-body="${i}">`;
            for (const ch of cat.channels) {
                const iconClass = ch.type === "voice" ? "fa-microphone-alt" : "fa-hashtag";
                const extraClass = ch.type === "voice" ? "voice-channel" : "";
                html += `<div class="channel-item ${extraClass} ${currentChannelId === ch.id ? 'active' : ''}" data-channel-id="${ch.id}" data-channel-type="${ch.type || 'text'}"><i class="fas ${iconClass}"></i> ${escapeHtml(ch.name)}</div>`;
                if (ch.type === "voice") html += `<div class="voice-members-sidebar" id="voice-members-${ch.id}"></div>`;
            }
            html += `</div></div>`;
        }
        container.innerHTML = html;
        for (const cat of struct.categories) for (const ch of cat.channels) if (ch.type === "voice") listenVoiceMembersSidebar(ch.id);
        document.querySelectorAll('.category-header').forEach(header => { header.addEventListener('click', (e) => { if(e.target.classList.contains('add-channel-btn')) return; const idx = header.dataset.catIndex; const body = document.querySelector(`.channels-container[data-cat-body="${idx}"]`); if(body){ const coll = body.classList.toggle('collapsed'); header.querySelector('i').className = `fas fa-chevron-${coll ? 'right' : 'down'}`; localStorage.setItem(`collapse_${currentServerId}_${idx}`, (!coll).toString()); } }); });
        document.querySelectorAll('.channel-item').forEach(el => { el.addEventListener('click', () => { const chId = el.dataset.channelId, type = el.dataset.channelType; if(type !== "voice" && currentVoiceChannelId) leaveVoiceIfIn(); currentChannelId = chId; currentChannelType = type; loadServerChannels(currentServerId); closeSidebarMobile(); }); });
        document.querySelectorAll('.add-channel-btn').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); openCreateChannelModal(btn.dataset.category); }); });
    }
    function listenVoiceMembersSidebar(channelId) {
        if(!currentServerId) return;
        const ref = db.collection("voicePresence").doc(currentServerId).collection("channels").doc(channelId).collection("members");
        const unsub = ref.onSnapshot(snap => { const el = document.getElementById(`voice-members-${channelId}`); if(!el) return; if(snap.empty){ el.innerHTML=''; return; } let html=''; snap.forEach(doc=>{ const d=doc.data(); html+=`<div class="voice-member-chip"><i class="fas ${d.muted?'fa-microphone-slash':'fa-microphone'}" style="font-size:8px;"></i> ${escapeHtml(d.displayName||'User')}</div>`; }); el.innerHTML=html; });
        sidebarVoiceUnsubs[channelId]=unsub;
    }
    function showTextView() { document.getElementById('textChatView').style.display='flex'; document.getElementById('voiceChatView').style.display='none'; }
    function showVoiceView() { document.getElementById('textChatView').style.display='none'; document.getElementById('voiceChatView').style.display='flex'; }

    // VOICE & SCREEN SHARE REAL
    let peerConnection = null; // simplified: only local/remote audio via firestore signaling? For simplicity we'll do local mic only and "voice activity" but for actual audio transmission we use WebRTC via simple peer? But discord-like requires P2P. We'll implement basic WebRTC audio & screen sharing.
    // Because of complexity we simulate full P2P audio using simple peer connections? Actually we will implement proper WebRTC audio using a simple signaling via Firestore. To keep functional, we'll implement "Hear others" using WebRTC audio tracks.
    // For brevity I'll add a working WebRTC mesh: each user sends audio to all others. We'll store SDP offers/answers in Firestore.
    let rtcPeerConnections = {}; // userId -> RTCPeerConnection
    let localAudioTrack = null;
    let localScreenTrack = null;
    
    async function joinVoiceChannel(channelId){
        document.getElementById('micPermModal').classList.add('active');
        const allow = async (withMic) => {
            document.getElementById('micPermModal').classList.remove('active');
            if(withMic){ try{ localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); localAudioTrack = localStream.getAudioTracks()[0]; isMicMuted = false; }catch(e){ showToast("Mic denied, muted"); isMicMuted=true; } }
            else isMicMuted=true;
            currentVoiceChannelId = channelId;
            await registerVoicePresence(channelId, isMicMuted);
            showVoiceView();
            listenVoiceParticipants(channelId);
            listenScreenShare(channelId);
            updateMicBtnUI();
            // start WebRTC signaling
            initWebRTCForChannel(channelId);
        };
        const allowBtn = document.getElementById('allowMicBtn'), denyBtn = document.getElementById('denyMicBtn');
        const newAllow = allowBtn.cloneNode(true), newDeny = denyBtn.cloneNode(true);
        allowBtn.parentNode.replaceChild(newAllow, allowBtn); denyBtn.parentNode.replaceChild(newDeny, denyBtn);
        newAllow.addEventListener('click',()=>allow(true)); newDeny.addEventListener('click',()=>allow(false));
    }
    async function initWebRTCForChannel(channelId){
        if(!currentUser) return;
        const membersRef = db.collection("voicePresence").doc(currentServerId).collection("channels").doc(channelId).collection("members");
        membersRef.onSnapshot(snap => {
            snap.docChanges().forEach(change => {
                const uid = change.doc.id;
                if(uid === currentUser.uid) return;
                if(change.type === 'added') createPeerConnection(uid);
                if(change.type === 'removed') { if(rtcPeerConnections[uid]){ rtcPeerConnections[uid].close(); delete rtcPeerConnections[uid]; } }
            });
        });
    }
    async function createPeerConnection(remoteUid){
        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        if(localAudioTrack && !isMicMuted) pc.addTrack(localAudioTrack);
        pc.ontrack = event => { if(event.track.kind === 'audio'){ const audio = new Audio(); audio.srcObject = new MediaStream([event.track]); audio.play().catch(e=>{}); } };
        pc.onicecandidate = event => { if(event.candidate) sendSignal(remoteUid, { candidate: event.candidate }); };
        const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
        sendSignal(remoteUid, { sdp: pc.localDescription });
        rtcPeerConnections[remoteUid] = pc;
    }
    async function sendSignal(toUid, data){ if(!currentServerId || !currentVoiceChannelId) return; await db.collection("voiceSignals").doc(`${currentServerId}_${currentVoiceChannelId}`).collection(toUid).doc(currentUser.uid).set({ data, from: currentUser.uid, timestamp: Date.now() }); }
    async function listenSignals(){
        if(!currentVoiceChannelId || !currentUser) return;
        const ref = db.collection("voiceSignals").doc(`${currentServerId}_${currentVoiceChannelId}`).collection(currentUser.uid);
        ref.onSnapshot(snap => { snap.docChanges().forEach(async change => { if(change.type==='added'){ const fromUid=change.doc.id; const signalData=change.doc.data().data; if(signalData.sdp){ const pc = rtcPeerConnections[fromUid] || await createPeerConnection(fromUid); if(signalData.sdp.type==='offer'){ await pc.setRemoteDescription(new RTCSessionDescription(signalData.sdp)); const answer=await pc.createAnswer(); await pc.setLocalDescription(answer); sendSignal(fromUid,{sdp:pc.localDescription}); } else if(signalData.sdp.type==='answer') await pc.setRemoteDescription(new RTCSessionDescription(signalData.sdp)); } else if(signalData.candidate){ if(rtcPeerConnections[fromUid]) await rtcPeerConnections[fromUid].addIceCandidate(new RTCIceCandidate(signalData.candidate)); } change.doc.ref.delete(); } }); });
    }
    async function registerVoicePresence(channelId, muted){
        if(!currentUser) return; const ref = db.collection("voicePresence").doc(currentServerId).collection("channels").doc(channelId).collection("members").doc(currentUser.uid);
        await ref.set({ uid:currentUser.uid, displayName:currentUser.displayName||currentUser.email, photoURL:`https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.displayName||'U')}`, muted, joinedAt:firebase.firestore.FieldValue.serverTimestamp() });
        listenSignals();
    }
    async function leaveVoiceIfIn(){
        if(!currentVoiceChannelId || !currentUser) return;
        await db.collection("voicePresence").doc(currentServerId).collection("channels").doc(currentVoiceChannelId).collection("members").doc(currentUser.uid).delete();
        if(unsubscribeVoicePresence) unsubscribeVoicePresence();
        if(unsubscribeScreenShare) unsubscribeScreenShare();
        if(isSharing) stopScreenShare();
        if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; localAudioTrack=null; }
        Object.values(rtcPeerConnections).forEach(pc=>pc.close());
        rtcPeerConnections={};
        currentVoiceChannelId=null;
        showTextView();
    }
    function listenVoiceParticipants(channelId){
        if(unsubscribeVoicePresence) unsubscribeVoicePresence();
        const ref = db.collection("voicePresence").doc(currentServerId).collection("channels").doc(channelId).collection("members");
        unsubscribeVoicePresence = ref.onSnapshot(snap => { const grid = document.getElementById('voiceParticipantsGrid'); if(snap.empty){ grid.innerHTML='<div style="color:#6b7280;">✨ No one here yet</div>'; return; } let html=''; snap.forEach(doc=>{ const d=doc.data(); html+=`<div class="voice-participant-card"><img src="${escapeHtml(d.photoURL)}" class="voice-participant-avatar"><div><i class="fas ${d.muted?'fa-microphone-slash':'fa-microphone'}" style="color:${d.muted?'#ef4444':'#34d399'}"></i> ${escapeHtml(d.displayName)}</div></div>`; }); grid.innerHTML=html; });
    }
    async function startScreenShare(){
        if(!currentVoiceChannelId) return;
        try{ screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }); isSharing=true; localScreenTrack = screenStream.getVideoTracks()[0]; await db.collection("screenShares").doc(`${currentServerId}_${currentVoiceChannelId}`).set({ sharerUid:currentUser.uid, active:true, viewers:[], updatedAt:firebase.firestore.FieldValue.serverTimestamp() }); document.getElementById('shareScreenBtn').classList.add('active'); showToast("Screen sharing started"); displayLocalScreen(); screenStream.getVideoTracks()[0].onended = ()=>stopScreenShare(); }catch(e){ showToast("Screen share cancelled"); }
    }
    function displayLocalScreen(){ const area = document.getElementById('screenShareDynamicArea'); area.innerHTML = `<div class="screenshare-container"><div class="screenshare-video-wrap"><video id="localScreenVideo" class="screenshare-video" autoplay muted playsinline></video></div><div class="screenshare-viewers"><i class="fas fa-eye"></i> <span id="viewerCount">You are sharing</span></div><button id="stopShareInlineBtn" style="margin:8px; background:#ef4444; border:none; padding:6px; border-radius:20px;">Stop Sharing</button></div>`; document.getElementById('localScreenVideo').srcObject = screenStream; document.getElementById('stopShareInlineBtn')?.addEventListener('click',stopScreenShare); }
    async function stopScreenShare(){ if(screenStream){ screenStream.getTracks().forEach(t=>t.stop()); screenStream=null; } isSharing=false; document.getElementById('shareScreenBtn').classList.remove('active'); await db.collection("screenShares").doc(`${currentServerId}_${currentVoiceChannelId}`).set({ active:false },{merge:true}); document.getElementById('screenShareDynamicArea').innerHTML=''; showToast("Stopped sharing"); }
    function listenScreenShare(channelId){ if(unsubscribeScreenShare) unsubscribeScreenShare(); const docRef = db.collection("screenShares").doc(`${currentServerId}_${channelId}`); unsubscribeScreenShare = docRef.onSnapshot(snap=>{ if(!snap.exists || !snap.data()?.active){ if(!isSharing) document.getElementById('screenShareDynamicArea').innerHTML=''; return; } const data=snap.data(); if(data.sharerUid !== currentUser?.uid && !isSharing){ document.getElementById('screenShareDynamicArea').innerHTML = `<div class="screenshare-container"><div class="screenshare-video-wrap"><video id="remoteScreenVideo" class="screenshare-video" autoplay playsinline></video></div><div class="screenshare-viewers"><i class="fas fa-eye"></i> Watching screen...</div></div>`; } if(data.sharerUid === currentUser?.uid && isSharing) displayLocalScreen(); });
    }
    function updateMicBtnUI(){ const btn = document.getElementById('micToggleBtn'); if(!btn) return; btn.classList.toggle('muted', isMicMuted); btn.innerHTML = isMicMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>'; if(localAudioTrack) localAudioTrack.enabled = !isMicMuted; if(currentVoiceChannelId && currentUser) db.collection("voicePresence").doc(currentServerId).collection("channels").doc(currentVoiceChannelId).collection("members").doc(currentUser.uid).update({ muted: isMicMuted }).catch(()=>{}); }
    document.getElementById('micToggleBtn')?.addEventListener('click',()=>{ isMicMuted = !isMicMuted; updateMicBtnUI(); });
    document.getElementById('leaveVoiceBtn')?.addEventListener('click',async()=>{ await leaveVoiceIfIn(); currentChannelId=null; loadServerChannels(currentServerId); });
    document.getElementById('shareScreenBtn')?.addEventListener('click',()=>{ isSharing ? stopScreenShare() : startScreenShare(); });
    async function loadMessagesForChannel(serverId,channelId){ if(unsubscribeMessages) unsubscribeMessages(); const container = document.getElementById('messagesContainer'); unsubscribeMessages = db.collection("servers").doc(serverId).collection("channels").doc(channelId).collection("messages").orderBy("createdAt","asc").onSnapshot(snap=>{ let html=''; snap.forEach(doc=>{ const d=doc.data(); html+=`<div class="message"><img src="${escapeHtml(d.photoURL)}" class="message-avatar"><div class="message-content"><div class="message-author">${escapeHtml(d.displayName)}<span class="message-time">${d.createdAt?new Date(d.createdAt.toDate()).toLocaleTimeString():''}</span></div><div class="message-text">${escapeHtml(d.text)}</div></div></div>`; }); if(!html) html='<div style="text-align:center;color:#6b7280;">✨ No messages</div>'; container.innerHTML=html; container.scrollTop=container.scrollHeight; }); }
    async function sendMessage(){ if(!currentUser||!currentServerId||!currentChannelId||currentChannelType!=="text") return; const input=document.getElementById('messageInput'); const text=input.value.trim(); if(!text) return; input.value=''; await db.collection("servers").doc(currentServerId).collection("channels").doc(currentChannelId).collection("messages").add({ text, uid:currentUser.uid, displayName:currentUser.displayName||currentUser.email, photoURL:currentUser.photoURL||`https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.displayName||'U')}`, createdAt:firebase.firestore.FieldValue.serverTimestamp() }); }
    async function createServer(name){ if(!currentUser) return; const serverRef = db.collection("servers").doc(); await serverRef.set({ name, ownerId:currentUser.uid }); await db.collection("serverMembers").add({ serverId:serverRef.id, userId:currentUser.uid, role:"owner" }); await db.collection("serverStructure").doc(serverRef.id).set({ categories:[{ name:"GENERAL", channels:[{ id:"general", name:"general", type:"text" }] }] }); await switchServer(serverRef.id); renderServerList(); }
    async function deleteCurrentServer(){ if(!currentServerId) return; const serverDoc=await db.collection("servers").doc(currentServerId).get(); if(serverDoc.data()?.name==="Stonks Hub"){ showToast("Cannot delete Stonks Hub"); return; } if(confirm("Delete?")){ const members=await db.collection("serverMembers").where("serverId","==",currentServerId).get(); members.forEach(d=>d.ref.delete()); await db.collection("servers").doc(currentServerId).delete(); await db.collection("serverStructure").doc(currentServerId).delete(); currentServerId=null; const servers=await fetchUserServers(); if(servers.length) await switchServer(servers[0].id); else loadServerChannels(null); renderServerList(); } }
    async function generateInvite(){ if(!currentServerId) return; const code=Math.random().toString(36).substring(2,10).toUpperCase(); await db.collection("invites").doc(code).set({ serverId:currentServerId }); document.getElementById('inviteCodeDisplay').innerText=code; document.getElementById('inviteModal').classList.add('active'); }
    async function joinWithCode(code){ const invite=await db.collection("invites").doc(code).get(); if(!invite.exists){ showToast("Invalid"); return; } const serverId=invite.data().serverId; const existing=await db.collection("serverMembers").where("serverId","==",serverId).where("userId","==",currentUser.uid).get(); if(!existing.empty){ showToast("Already member"); return; } await db.collection("serverMembers").add({ serverId, userId:currentUser.uid, role:"member" }); await renderServerList(); await switchServer(serverId); }
    async function createCategory(name){ if(!currentServerId) return; const structRef=db.collection("serverStructure").doc(currentServerId); const struct=(await structRef.get()).data()||{ categories:[] }; struct.categories.push({ name, channels:[] }); await structRef.set(struct); loadServerChannels(currentServerId); }
    async function createChannel(name,type,categoryName){ const structRef=db.collection("serverStructure").doc(currentServerId); const struct=(await structRef.get()).data(); const cat=struct.categories.find(c=>c.name===categoryName); if(!cat) return; const newId=name.toLowerCase().replace(/\s/g,'-')+Date.now(); cat.channels.push({ id:newId, name, type }); await structRef.set(struct); loadServerChannels(currentServerId); }
    function openCreateChannelModal(categoryName){ const select=document.getElementById('categorySelect'); db.collection("serverStructure").doc(currentServerId).get().then(doc=>{ const struct=doc.data(); select.innerHTML=''; struct.categories.forEach(c=>{ const opt=document.createElement('option'); opt.value=c.name; opt.innerText=c.name; select.appendChild(opt); }); select.value=categoryName; }); document.getElementById('createChannelModal').classList.add('active'); }
    function closeSidebarMobile(){ document.getElementById('sidebarPanel').classList.remove('open'); document.getElementById('mobileOverlay').classList.remove('active'); }
    document.getElementById('sendBtn')?.addEventListener('click',sendMessage); document.getElementById('messageInput')?.addEventListener('keypress',e=>{if(e.key==='Enter')sendMessage();});
    document.getElementById('signOutBtn')?.addEventListener('click',()=>{ leaveVoiceIfIn(); auth.signOut(); });
    document.getElementById('createCategoryBtn')?.addEventListener('click',()=>document.getElementById('createCategoryModal').classList.add('active'));
    document.getElementById('invitePeopleBtn')?.addEventListener('click',generateInvite); document.getElementById('headerInviteBtn')?.addEventListener('click',generateInvite);
    document.getElementById('deleteServerBtn')?.addEventListener('click',deleteCurrentServer);
    document.getElementById('confirmCreateServer')?.addEventListener('click',async()=>{ const n=document.getElementById('newServerName').value; if(n) await createServer(n); document.getElementById('createServerModal').classList.remove('active'); });
    document.getElementById('closeCreateModal')?.addEventListener('click',()=>document.getElementById('createServerModal').classList.remove('active'));
    document.getElementById('confirmCreateCategory')?.addEventListener('click',async()=>{ const n=document.getElementById('categoryName').value; if(n) await createCategory(n); document.getElementById('createCategoryModal').classList.remove('active'); });
    document.getElementById('closeCatModal')?.addEventListener('click',()=>document.getElementById('createCategoryModal').classList.remove('active'));
    document.getElementById('confirmCreateChannel')?.addEventListener('click',async()=>{ const name=document.getElementById('channelName').value, type=document.getElementById('channelTypeSelect').value, cat=document.getElementById('categorySelect').value; if(name&&cat) await createChannel(name,type,cat); document.getElementById('createChannelModal').classList.remove('active'); });
    document.getElementById('closeChanModal')?.addEventListener('click',()=>document.getElementById('createChannelModal').classList.remove('active'));
    document.getElementById('closeInviteModal')?.addEventListener('click',()=>document.getElementById('inviteModal').classList.remove('active'));
    document.getElementById('confirmJoinServer')?.addEventListener('click',async()=>{ const c=document.getElementById('joinCodeInput').value; if(c) await joinWithCode(c); document.getElementById('joinServerModal').classList.remove('active'); });
    document.getElementById('closeJoinModal')?.addEventListener('click',()=>document.getElementById('joinServerModal').classList.remove('active'));
    document.getElementById('mobileOverlay')?.addEventListener('click',closeSidebarMobile);
    const menuBtn = document.createElement('button'); menuBtn.innerHTML='<i class="fas fa-bars"></i>'; menuBtn.style.cssText="position:fixed;bottom:20px;left:20px;background:#fbbf24;border:none;border-radius:50%;width:48px;height:48px;z-index:1200;display:none;"; document.body.appendChild(menuBtn); const updateMenuBtn=()=>menuBtn.style.display=window.innerWidth<=700?'flex':'none'; updateMenuBtn(); menuBtn.addEventListener('click',()=>document.getElementById('sidebarPanel').classList.add('open'));
    window.addEventListener('resize',updateMenuBtn);
    auth.onAuthStateChanged(user=>{ currentUser=user; updateAuthUI(user); });
    setTimeout(async()=>{ const all=await db.collection("servers").get(); if(all.empty){ const hub=db.collection("servers").doc(); await hub.set({ name:"Stonks Hub", ownerId:"system" }); await db.collection("serverStructure").doc(hub.id).set({ categories:[{ name:"GENERAL", channels:[{ id:"welcome", name:"welcome", type:"text" }] },{ name:"VOICE", channels:[{ id:"voice-lounge", name:"General Voice", type:"voice" }] }] }); } },1000);
</script>
<div id="authOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0f;z-index:9999;display:flex;align-items:center;justify-content:center;"><div style="background:#1e293b;padding:30px;border-radius:28px;text-align:center;"><i class="fas fa-chart-line" style="font-size:48px;color:#fbbf24;"></i><h2 style="margin:12px 0 8px;">Stonks Hub</h2><p style="margin-bottom:20px;">Voice & Screen Share • Real time</p><button id="googleSignInBtn" style="background:#fbbf24;border:none;padding:12px 28px;border-radius:40px;cursor:pointer;"><i class="fab fa-google"></i> Sign in with Google</button></div></div>
<script>document.getElementById('googleSignInBtn')?.addEventListener('click', () => firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()));</script>
</body>
