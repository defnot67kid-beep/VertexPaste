<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stonks Sever · Admin Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }
        
        /* App Layout */
        .app {
            display: flex;
            height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #1f2937;
        }
        
        .logo {
            font-weight: 800;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #fbbf24, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .admin-badge {
            background: linear-gradient(135deg, #ef4444, #f59e0b);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 8px;
            color: white;
        }
        
        .user-profile {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #1f2937;
        }
        
        .avatar-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fbbf24;
        }
        
        .user-name {
            margin-top: 10px;
            font-weight: 600;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            color: #9ca3af;
        }
        .nav-item:hover, .nav-item.active {
            background: #1f2937;
            color: #fbbf24;
        }
        
        /* Main Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f172a;
        }
        
        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .channel-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .channel-name {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .message-content {
            background: #1e293b;
            padding: 8px 14px;
            border-radius: 18px;
        }
        .message-author {
            font-weight: 600;
            font-size: 0.8rem;
            display: flex;
            gap: 8px;
            align-items: baseline;
        }
        .message-time {
            font-size: 0.65rem;
            color: #94a3b8;
        }
        .message-text {
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .system-message {
            background: rgba(245, 158, 11, 0.2);
            border-left: 3px solid #fbbf24;
        }
        
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 12px;
            background: #0f172a;
        }
        .input-area input {
            flex: 1;
            background: #1e293b;
            border: none;
            padding: 12px 18px;
            border-radius: 40px;
            color: white;
            outline: none;
        }
        .input-area button {
            background: #fbbf24;
            border: none;
            padding: 0 24px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: #0f172a;
        }
        
        /* Auth Overlay */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0f;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            max-width: 400px;
            background: #1e293b;
            padding: 40px;
            border-radius: 32px;
            text-align: center;
        }
        .auth-card button {
            background: #fbbf24;
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        
        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1e293b;
            border-radius: 24px;
            padding: 28px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #fbbf24;
        }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 10px;
            color: white;
            margin: 10px 0;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .btn-gold {
            background: #fbbf24;
            color: black;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .hidden { display: none; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(70px);
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 40px;
            z-index: 1100;
            transition: 0.3s;
            border-left: 3px solid #fbbf24;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        
        .category-group {
            margin: 15px 0;
        }
        .category-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #6b7280;
            padding: 8px 12px;
            letter-spacing: 1px;
        }
        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px 8px 32px;
            border-radius: 8px;
            cursor: pointer;
            color: #9ca3af;
            font-size: 0.9rem;
        }
        .channel-item:hover, .channel-item.active {
            background: #1f2937;
            color: #fbbf24;
        }
        .add-channel {
            margin-left: auto;
            color: #6b7280;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .bot-tag {
            background: #8b5cf6;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebarPanel" style="display: none;">
        <div class="sidebar-header">
            <div class="logo">📈 STONKS SEVER</div>
        </div>
        <div class="user-profile">
            <img id="sidebarAvatar" class="avatar-img" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff">
            <div class="user-name" id="sidebarName">Loading...</div>
            <div id="adminIndicator" class="admin-badge hidden">👑 ADMIN</div>
        </div>
        <div style="flex:1; overflow-y: auto;" id="channelsList">
            <!-- Channels will be loaded here -->
        </div>
        <div class="nav-item" id="adminPanelBtn" style="margin-top: auto; margin-bottom: 20px; background:#1f2937;">
            <i class="fas fa-crown"></i> Admin Panel
        </div>
        <div class="nav-item" id="signOutBtnNav">
            <i class="fas fa-sign-out-alt"></i> Sign Out
        </div>
    </div>

    <!-- Main Chat -->
    <div class="chat-area" id="chatArea" style="display: none;">
        <div class="chat-header">
            <div class="channel-info">
                <i class="fas fa-hashtag"></i>
                <span class="channel-name" id="currentChannelName">general</span>
            </div>
            <button id="signOutBtnTop" style="background:#1e293b; border:none; padding:6px 16px; border-radius:20px; color:#fbbf24; cursor:pointer;">Exit</button>
        </div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
    </div>

    <!-- Auth Overlay -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <i class="fas fa-chart-line" style="font-size: 64px; color: #fbbf24; margin-bottom: 20px;"></i>
            <h2>STONKS SEVER</h2>
            <p style="margin: 16px 0">Sign in with Google</p>
            <button id="signInBtn"><i class="fab fa-google"></i> Continue</button>
        </div>
    </div>
</div>

<!-- ADMIN PANEL MODAL -->
<div id="adminModal" class="modal">
    <div class="modal-content" style="max-width: 700px; max-height: 80vh; overflow-y: auto;">
        <h2><i class="fas fa-crown"></i> Admin Control Panel</h2>
        <p style="color:#fbbf24; margin-bottom:20px;">Manage Categories, Channels & Bots</p>
        
        <!-- Categories & Channels Section -->
        <div style="background:#0f172a; padding:16px; border-radius:16px; margin-bottom:20px;">
            <h3><i class="fas fa-folder"></i> Manage Categories</h3>
            <div id="categoriesListAdmin" style="margin: 10px 0;"></div>
            <div class="flex-between" style="margin-top:10px;">
                <input type="text" id="newCategoryName" placeholder="New category name" style="flex:1; margin-right:10px;">
                <button class="btn-gold" id="addCategoryBtn">+ Add Category</button>
            </div>
        </div>
        
        <div style="background:#0f172a; padding:16px; border-radius:16px; margin-bottom:20px;">
            <h3><i class="fas fa-hashtag"></i> Add Channel to Category</h3>
            <select id="categorySelect" style="width:100%; margin:10px 0;"></select>
            <input type="text" id="newChannelName" placeholder="Channel name (e.g., announcements)" style="width:100%; margin:10px 0;">
            <button class="btn-gold" id="addChannelBtn">+ Add Channel</button>
        </div>
        
        <!-- Bot Management -->
        <div style="background:#0f172a; padding:16px; border-radius:16px; margin-bottom:20px;">
            <h3><i class="fas fa-robot"></i> Auto-Bot Manager</h3>
            <p style="font-size:0.8rem; color:#9ca3af;">Bots can send scheduled notifications or auto-reply</p>
            <div id="botsList" style="margin: 15px 0; max-height:200px; overflow-y:auto;"></div>
            <button class="btn-gold" id="createBotBtn"><i class="fas fa-plus"></i> Create New Bot</button>
        </div>
        
        <div class="modal-buttons">
            <button id="closeAdminBtn" class="btn-danger">Close</button>
        </div>
    </div>
</div>

<!-- Create Bot Modal -->
<div id="botModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-code"></i> Create Auto-Bot</h3>
        <input type="text" id="botName" placeholder="Bot Name (e.g., Announcement Bot)">
        <select id="botType">
            <option value="auto">Auto Message (sends every X minutes)</option>
            <option value="command">Command Bot (responds to /command)</option>
        </select>
        <textarea id="botMessage" rows="3" placeholder="Message to send / response text"></textarea>
        <input type="number" id="botInterval" placeholder="Interval (minutes) - for auto type" value="5">
        <div class="modal-buttons">
            <button id="saveBotBtn" class="btn-gold">Save Bot</button>
            <button id="closeBotModal" class="btn-danger">Cancel</button>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast">Toast</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc",
        authDomain: "vertexpaste.firebaseapp.com",
        projectId: "vertexpaste",
        storageBucket: "vertexpaste.firebasestorage.app",
        messagingSenderId: "255275350380",
        appId: "1:255275350380:web:7be4e8add2cb5b04045b49"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    // Admin email
    const ADMIN_EMAIL = "defnot67kid@gmail.com";
    let currentUser = null;
    let isAdmin = false;
    let currentChannelId = "general";
    let unsubscribeMessages = null;
    let botIntervals = [];
    
    // Helper functions
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }
    
    function formatTime(timestamp) {
        if (!timestamp) return '';
        const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    
    function showToast(msg, type = "info") {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    // Load channels structure from Firestore
    async function loadChannels() {
        const docRef = db.collection("server").doc("structure");
        const docSnap = await docRef.get();
        if (docSnap.exists) {
            return docSnap.data();
        } else {
            // Default structure
            const defaultData = {
                categories: [
                    { name: "TEXT CHANNELS", channels: [{ id: "general", name: "general" }, { id: "announcements", name: "announcements" }] },
                    { name: "TRADING", channels: [{ id: "stonks", name: "stonks" }, { id: "crypto", name: "crypto" }] }
                ]
            };
            await docRef.set(defaultData);
            return defaultData;
        }
    }
    
    async function saveChannels(data) {
        await db.collection("server").doc("structure").set(data);
    }
    
    // Render sidebar channels
    async function renderSidebar() {
        const structure = await loadChannels();
        const container = document.getElementById('channelsList');
        if (!container) return;
        let html = '';
        for (const cat of structure.categories) {
            html += `<div class="category-group"><div class="category-title">${escapeHtml(cat.name)}`;
            if (isAdmin) html += `<span class="add-channel" onclick="openAdminPanel()"> <i class="fas fa-plus"></i></span>`;
            html += `</div>`;
            for (const ch of cat.channels) {
                html += `<div class="channel-item ${currentChannelId === ch.id ? 'active' : ''}" data-channel-id="${ch.id}" data-channel-name="${ch.name}">
                            <i class="fas fa-hashtag"></i> ${escapeHtml(ch.name)}
                         </div>`;
            }
            html += `</div>`;
        }
        container.innerHTML = html;
        // attach click events
        document.querySelectorAll('.channel-item').forEach(el => {
            el.addEventListener('click', () => {
                const id = el.dataset.channelId;
                const name = el.dataset.channelName;
                if (id) switchChannel(id, name);
            });
        });
    }
    
    function switchChannel(channelId, channelName) {
        if (unsubscribeMessages) unsubscribeMessages();
        currentChannelId = channelId;
        document.getElementById('currentChannelName').innerText = channelName;
        loadMessagesForChannel(channelId);
        renderSidebar(); // re-render to update active class
    }
    
    function loadMessagesForChannel(channelId) {
        const container = document.getElementById('messagesContainer');
        container.innerHTML = '<div style="text-align:center; padding:40px;">Loading messages...</div>';
        unsubscribeMessages = db.collection("channels").doc(channelId).collection("messages")
            .orderBy("createdAt", "asc")
            .onSnapshot(snapshot => {
                let html = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const time = formatTime(data.createdAt);
                    const avatar = data.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(data.displayName || 'User')}&background=6366f1&color=fff`;
                    const isSystem = data.isBot || data.displayName === 'System Bot';
                    html += `
                        <div class="message ${isSystem ? 'system-message' : ''}">
                            <img src="${avatar}" class="message-avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&background=6366f1&color=fff'">
                            <div class="message-content">
                                <div class="message-author">
                                    ${escapeHtml(data.displayName || 'Anonymous')}
                                    ${data.isBot ? '<span class="bot-tag">BOT</span>' : ''}
                                    <span class="message-time">${time}</span>
                                </div>
                                <div class="message-text">${escapeHtml(data.text)}</div>
                            </div>
                        </div>
                    `;
                });
                if (html === '') html = '<div class="empty-chat"><i class="fas fa-comment-dots"></i> No messages in #' + escapeHtml(channelId) + '</div>';
                container.innerHTML = html;
                container.scrollTop = container.scrollHeight;
            });
    }
    
    async function sendMessage() {
        if (!currentUser) return;
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;
        try {
            await db.collection("channels").doc(currentChannelId).collection("messages").add({
                text: text,
                uid: currentUser.uid,
                displayName: currentUser.displayName,
                photoURL: currentUser.photoURL,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                isBot: false
            });
            input.value = '';
        } catch(e) { showToast("Failed", "error"); }
    }
    
    // Bot: send notification to all users (global channel)
    async function sendGlobalNotification(message, botName = "System Bot") {
        const channels = await loadChannels();
        for (const cat of channels.categories) {
            for (const ch of cat.channels) {
                await db.collection("channels").doc(ch.id).collection("messages").add({
                    text: `🤖 **${botName}**: ${message}`,
                    uid: "system_bot",
                    displayName: botName,
                    photoURL: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    isBot: true
                });
            }
        }
        showToast(`Notification sent by ${botName}`, "success");
    }
    
    // Load bots from Firestore and start intervals
    async function loadBots() {
        botIntervals.forEach(clearInterval);
        botIntervals = [];
        const botsSnap = await db.collection("bots").get();
        botsSnap.forEach(doc => {
            const bot = doc.data();
            if (bot.type === "auto" && bot.active !== false) {
                const intervalId = setInterval(async () => {
                    await sendGlobalNotification(bot.message, bot.name);
                }, (bot.interval || 5) * 60 * 1000);
                botIntervals.push(intervalId);
            }
        });
    }
    
    async function createBot(name, type, message, interval) {
        await db.collection("bots").add({
            name: name,
            type: type,
            message: message,
            interval: parseInt(interval) || 5,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            active: true
        });
        await loadBots();
        showToast(`Bot "${name}" created`, "success");
    }
    
    // Admin panel UI
    async function openAdminPanel() {
        if (!isAdmin) { showToast("Access denied", "error"); return; }
        const modal = document.getElementById('adminModal');
        const structure = await loadChannels();
        // Render categories
        const categoriesDiv = document.getElementById('categoriesListAdmin');
        categoriesDiv.innerHTML = '';
        structure.categories.forEach((cat, idx) => {
            categoriesDiv.innerHTML += `
                <div class="flex-between" style="background:#0f172a; padding:8px; margin:5px 0; border-radius:8px;">
                    <span><i class="fas fa-folder"></i> ${escapeHtml(cat.name)}</span>
                    <button class="btn-danger" style="padding:2px 10px;" onclick="deleteCategory(${idx})">Delete</button>
                </div>
            `;
        });
        // Populate category select
        const catSelect = document.getElementById('categorySelect');
        catSelect.innerHTML = '';
        structure.categories.forEach((cat, idx) => {
            catSelect.innerHTML += `<option value="${idx}">${escapeHtml(cat.name)}</option>`;
        });
        // Render bots list
        const botsSnap = await db.collection("bots").get();
        const botsDiv = document.getElementById('botsList');
        botsDiv.innerHTML = '';
        botsSnap.forEach(async (docSnap) => {
            const b = docSnap.data();
            botsDiv.innerHTML += `
                <div class="flex-between" style="background:#0f172a; padding:8px; margin:5px 0; border-radius:8px;">
                    <div><strong>${escapeHtml(b.name)}</strong><br><small>${b.type} | ${b.message.substring(0,30)}</small></div>
                    <button class="btn-danger" onclick="deleteBot('${docSnap.id}')">Delete</button>
                </div>
            `;
        });
        modal.classList.add('active');
    }
    
    window.deleteCategory = async (index) => {
        const structure = await loadChannels();
        structure.categories.splice(index, 1);
        await saveChannels(structure);
        await renderSidebar();
        openAdminPanel();
        showToast("Category deleted", "info");
    };
    
    window.deleteBot = async (botId) => {
        await db.collection("bots").doc(botId).delete();
        await loadBots();
        openAdminPanel();
        showToast("Bot deleted", "info");
    };
    
    // Add category
    document.getElementById('addCategoryBtn')?.addEventListener('click', async () => {
        const name = document.getElementById('newCategoryName').value.trim();
        if (!name) return;
        const structure = await loadChannels();
        structure.categories.push({ name: name.toUpperCase(), channels: [] });
        await saveChannels(structure);
        await renderSidebar();
        openAdminPanel();
        document.getElementById('newCategoryName').value = '';
        showToast("Category added", "success");
    });
    
    document.getElementById('addChannelBtn')?.addEventListener('click', async () => {
        const catIdx = parseInt(document.getElementById('categorySelect').value);
        const chName = document.getElementById('newChannelName').value.trim();
        if (!chName) return;
        const structure = await loadChannels();
        const newId = chName.toLowerCase().replace(/\s/g, '_') + Date.now();
        structure.categories[catIdx].channels.push({ id: newId, name: chName });
        await saveChannels(structure);
        await renderSidebar();
        openAdminPanel();
        document.getElementById('newChannelName').value = '';
        showToast("Channel added", "success");
    });
    
    // Bot creation modal
    let currentBotCallback = null;
    document.getElementById('createBotBtn')?.addEventListener('click', () => {
        document.getElementById('botModal').classList.add('active');
    });
    document.getElementById('saveBotBtn')?.addEventListener('click', async () => {
        const name = document.getElementById('botName').value.trim();
        const type = document.getElementById('botType').value;
        const message = document.getElementById('botMessage').value.trim();
        const interval = document.getElementById('botInterval').value;
        if (!name || !message) { showToast("Fill all fields", "error"); return; }
        await createBot(name, type, message, interval);
        document.getElementById('botModal').classList.remove('active');
        document.getElementById('botName').value = '';
        document.getElementById('botMessage').value = '';
        openAdminPanel();
    });
    document.getElementById('closeBotModal')?.addEventListener('click', () => {
        document.getElementById('botModal').classList.remove('active');
    });
    document.getElementById('closeAdminBtn')?.addEventListener('click', () => {
        document.getElementById('adminModal').classList.remove('active');
    });
    document.getElementById('adminPanelBtn')?.addEventListener('click', openAdminPanel);
    
    // Auth & UI
    function updateUI(user) {
        const authOverlay = document.getElementById('authOverlay');
        const sidebar = document.getElementById('sidebarPanel');
        const chatArea = document.getElementById('chatArea');
        if (user) {
            authOverlay.style.display = 'none';
            sidebar.style.display = 'flex';
            chatArea.style.display = 'flex';
            document.getElementById('sidebarName').innerText = user.displayName || user.email;
            document.getElementById('sidebarAvatar').src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || 'User')}&background=6366f1&color=fff`;
            isAdmin = (user.email === ADMIN_EMAIL);
            if (isAdmin) {
                document.getElementById('adminIndicator').classList.remove('hidden');
                document.getElementById('adminPanelBtn').style.display = 'flex';
            } else {
                document.getElementById('adminIndicator').classList.add('hidden');
                document.getElementById('adminPanelBtn').style.display = 'none';
            }
            renderSidebar();
            loadMessagesForChannel(currentChannelId);
            loadBots();
        } else {
            authOverlay.style.display = 'flex';
            sidebar.style.display = 'none';
            chatArea.style.display = 'none';
            if (unsubscribeMessages) unsubscribeMessages();
        }
    }
    
    // Sign In
    async function signIn() {
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
            const result = await auth.signInWithPopup(provider);
            currentUser = result.user;
            updateUI(currentUser);
            showToast(`Welcome ${currentUser.displayName}`, "success");
        } catch(e) { showToast("Sign in failed", "error"); }
    }
    
    async function signOutUser() {
        await auth.signOut();
        updateUI(null);
        showToast("Signed out", "info");
    }
    
    // Event Listeners
    document.getElementById('signInBtn')?.addEventListener('click', signIn);
    document.getElementById('signOutBtnNav')?.addEventListener('click', signOutUser);
    document.getElementById('signOutBtnTop')?.addEventListener('click', signOutUser);
    document.getElementById('sendBtn')?.addEventListener('click', sendMessage);
    document.getElementById('messageInput')?.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    
    // Close modals on backdrop click
    document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
    });
    
    auth.onAuthStateChanged((user) => {
        currentUser = user;
        updateUI(user);
    });
    
    // Expose global for admin callbacks
    window.openAdminPanel = openAdminPanel;
    window.deleteCategory = deleteCategory;
    window.deleteBot = deleteBot;
</script>
</body>
</html>
