<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Stonks Hub · Mobile Voice & Screen Share</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
            touch-action: pan-x pan-y;
        }

        .app {
            display: flex;
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        /* SERVER LIST - improved touch */
        .server-list {
            width: 72px;
            background: #0f0f14;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 16px 0;
            overflow-y: auto;
            flex-shrink: 0;
            -webkit-overflow-scrolling: touch;
        }

        .server-icon {
            width: 52px;
            height: 52px;
            background: #1e293b;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            color: #fbbf24;
            font-weight: bold;
            font-size: 1.2rem;
            touch-action: manipulation;
        }

        .server-icon.active {
            border-radius: 16px;
            background: linear-gradient(135deg, #fbbf24, #ef4444);
            color: white;
            transform: scale(1.02);
        }

        .add-server-btn, .join-server-btn {
            background: #1f2937;
            border: 2px dashed #fbbf24;
        }

        /* MOBILE BOTTOM NAV */
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f0f14e6;
            backdrop-filter: blur(12px);
            border-top: 1px solid #1f2937;
            padding: 8px 20px;
            justify-content: space-around;
            z-index: 1200;
            gap: 16px;
        }

        .mobile-nav-item {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            border-radius: 32px;
            background: #1e293b;
            color: #94a3b8;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.1s;
            touch-action: manipulation;
        }

        .mobile-nav-item.active {
            background: #fbbf24;
            color: #0f172a;
        }

        /* SIDEBAR - slide out */
        .sidebar {
            width: 280px;
            background: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: 1100;
            box-shadow: 4px 0 20px rgba(0,0,0,0.5);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: #00000080;
            z-index: 1050;
            display: none;
            backdrop-filter: blur(2px);
        }

        .overlay.active {
            display: block;
        }

        /* CHAT AREA */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f172a;
            overflow: hidden;
            min-width: 0;
        }

        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            gap: 12px;
            flex-wrap: wrap;
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .invite-btn {
            background: #1e293b;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            color: #fbbf24;
            cursor: pointer;
            font-size: 0.75rem;
            touch-action: manipulation;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 100%;
            animation: fadeIn 0.2s;
            transition: background 0.1s;
            padding: 4px;
            border-radius: 16px;
        }
        .message.holding {
            background: #2d3748;
        }
        .reply-context {
            font-size: 0.7rem;
            color: #fbbf24;
            margin-bottom: 4px;
            border-left: 2px solid #fbbf24;
            padding-left: 8px;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .message-content {
            background: #1e293b;
            padding: 10px 14px;
            border-radius: 20px;
            word-break: break-word;
            flex: 1;
        }

        .input-area {
            padding: 12px;
            border-top: 1px solid #1e293b;
            background: #0f172a;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            background: #1e293b;
            border: none;
            padding: 14px 18px;
            border-radius: 40px;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        /* VOICE VIEW */
        .voice-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #060b14;
            overflow: hidden;
        }

        .voice-view-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            -webkit-overflow-scrolling: touch;
        }

        .voice-participants-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .voice-participant-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: #111827cc;
            padding: 12px 16px;
            border-radius: 48px;
            backdrop-filter: blur(8px);
            width: 100px;
        }

        .voice-participant-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fbbf24;
        }

        .voice-controls {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 16px 20px;
            background: #0d1727;
            border-top: 1px solid #1e293b;
            justify-content: center;
        }

        .voice-ctrl-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: #1e293b;
            color: white;
            font-size: 26px;
            transition: 0.1s;
            touch-action: manipulation;
        }

        .btn-mic.muted {
            background: #3b1a1a;
            color: #ef4444;
        }

        .btn-share-screen.active {
            background: #2563eb;
            color: white;
        }

        .screenshare-container {
            width: 100%;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .screenshare-video {
            width: 100%;
            max-height: 240px;
            object-fit: contain;
            background: #000;
        }

        /* FULLSCREEN SETTINGS MODAL (2 TABS) */
        .fullscreen-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: #0a0c15;
            z-index: 3000;
            flex-direction: column;
            overflow-y: auto;
        }
        .fullscreen-modal.active {
            display: flex;
        }
        .settings-tabs {
            display: flex;
            background: #111827;
            border-bottom: 1px solid #1f2937;
            padding: 12px 20px;
            gap: 24px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .settings-tab {
            font-weight: 600;
            padding-bottom: 8px;
            cursor: pointer;
            color: #94a3b8;
            border-bottom: 2px solid transparent;
        }
        .settings-tab.active {
            color: #fbbf24;
            border-bottom-color: #fbbf24;
        }
        .settings-pane {
            padding: 24px;
            display: none;
            flex-direction: column;
            gap: 24px;
        }
        .settings-pane.active {
            display: flex;
        }
        .setting-group {
            background: #111827;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .setting-label {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .setting-input, .setting-select {
            background: #1e293b;
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: white;
            font-size: 1rem;
            width: 100%;
        }
        .toggle-switch {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toggle-btn {
            width: 52px;
            height: 28px;
            background: #334155;
            border-radius: 40px;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }
        .toggle-btn.active {
            background: #fbbf24;
        }
        .toggle-btn span {
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 4px;
            transition: 0.2s;
        }
        .toggle-btn.active span {
            left: 24px;
        }
        .member-tag {
            background: #1f2937;
            padding: 8px 12px;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .remove-icon {
            color: #ef4444;
            cursor: pointer;
            margin-left: 12px;
        }
        .add-member-btn {
            background: #2563eb;
            border: none;
            padding: 10px;
            border-radius: 40px;
            color: white;
            margin-top: 8px;
        }
        .close-settings {
            background: #fbbf24;
            color: black;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: bold;
            margin-top: 16px;
        }

        @media (max-width: 700px) {
            .sidebar { transform: translateX(-100%); position: fixed; top: 0; height: 100%; }
            .sidebar.open { transform: translateX(0); }
            .server-list { display: none; }
            .mobile-bottom-nav { display: flex; }
            .chat-area { margin-bottom: 70px; }
            .voice-controls { margin-bottom: 60px; }
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            cursor: pointer;
        }
        .category-settings-icon {
            cursor: pointer;
            color: #9ca3af;
            font-size: 0.9rem;
        }
        .channel-item {
            padding: 10px 12px 10px 32px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            padding: 10px 24px;
            border-radius: 40px;
            z-index: 4000;
            border-left: 4px solid #fbbf24;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
<div class="app">
    <div class="server-list" id="serverListContainer"></div>
    <div class="sidebar" id="sidebarPanel">
        <div class="sidebar-header" style="padding:16px;"><div><span id="currentServerName">Stonks Hub</span><span id="serverOwnerCrown"></span></div><div><button id="createCategoryBtn" style="background:#1f2937;border:none;padding:6px 12px;border-radius:20px;"><i class="fas fa-folder-plus"></i></button><button id="invitePeopleBtn" style="background:#1f2937;border:none;padding:6px 12px;border-radius:20px;"><i class="fas fa-user-plus"></i></button></div></div>
        <div style="flex:1; overflow-y: auto;" id="channelsListContainer"></div>
        <div style="padding:12px;display:flex;justify-content:space-between;border-top:1px solid #1f2937;"><span><i class="fas fa-user-circle"></i> <span id="userDisplay"></span></span><button id="signOutBtn" style="background:none; border:none; color:#fbbf24;"><i class="fas fa-sign-out-alt"></i></button></div>
    </div>
    <div class="overlay" id="mobileOverlay"></div>
    <div class="chat-area">
        <div class="chat-header"><div class="channel-info"><i class="fas fa-hashtag" id="channelTypeIcon"></i><span id="currentChannelName">general</span></div><button class="invite-btn" id="headerInviteBtn"><i class="fas fa-link"></i> Invite</button></div>
        <div id="textChatView" style="display:flex; flex-direction:column; flex:1;"><div class="messages-container" id="messagesContainer"></div><div class="input-area"><input type="text" id="messageInput" placeholder="Message..."><button id="sendBtn" style="background:#fbbf24; border:none; border-radius:40px; padding:0 18px;"><i class="fas fa-paper-plane"></i></button></div></div>
        <div id="voiceChatView" class="voice-view" style="display:none;"><div class="voice-view-body"><div id="screenShareDynamicArea"></div><div class="voice-participants-grid" id="voiceParticipantsGrid"></div></div><div class="voice-controls"><button class="voice-ctrl-btn btn-mic" id="micToggleBtn"><i class="fas fa-microphone"></i></button><button class="voice-ctrl-btn btn-share-screen" id="shareScreenBtn"><i class="fas fa-desktop"></i></button><button class="voice-ctrl-btn btn-leave" id="leaveVoiceBtn"><i class="fas fa-phone-slash"></i></button></div></div>
    </div>
    <div class="mobile-bottom-nav"><div class="mobile-nav-item" data-nav="servers"><i class="fas fa-server"></i><span>Servers</span></div><div class="mobile-nav-item" data-nav="channels"><i class="fas fa-comments"></i><span>Channels</span></div><div class="mobile-nav-item" data-nav="voice"><i class="fas fa-microphone-alt"></i><span>Voice</span></div></div>
</div>

<!-- Fullscreen Settings Modal (Overview + Permissions) -->
<div id="settingsModal" class="fullscreen-modal">
    <div class="settings-tabs"><div class="settings-tab" data-tab="overview">Overview</div><div class="settings-tab" data-tab="permissions">Permissions</div><i class="fas fa-times" id="closeSettingsBtn" style="margin-left:auto; font-size:24px; cursor:pointer;"></i></div>
    <div id="overviewPane" class="settings-pane"><div class="setting-group"><div class="setting-label">Channel Name</div><input type="text" id="settingsChannelName" class="setting-input" placeholder="Channel name"></div><div class="setting-group"><div class="setting-label">Channel Topic</div><input type="text" id="settingsChannelTopic" class="setting-input" placeholder="Topic"></div><div class="setting-group"><div class="setting-label">Slow Mode (cooldown)</div><select id="settingsSlowMode" class="setting-select"><option value="0">Off</option><option value="5">5s</option><option value="10">10s</option><option value="15">15s</option><option value="30">30s</option><option value="60">1m</option><option value="120">2m</option><option value="300">5m</option><option value="600">10m</option><option value="900">15m</option><option value="1800">30m</option><option value="3600">1h</option><option value="7200">2h</option><option value="21600">6h</option></select></div><button id="saveOverviewBtn" class="close-settings">Save Changes</button></div>
    <div id="permissionsPane" class="settings-pane"><div class="setting-group"><div class="toggle-switch"><span class="setting-label">Private Channel</span><div id="privateToggleBtn" class="toggle-btn"><span></span></div></div><div class="setting-label" style="margin-top:4px;">make your channel seen by certain people</div></div>
        <div id="privateSettingsExpand" style="display:none; flex-direction:column; gap:16px;"><div class="setting-group"><div class="setting-label">Add members or Roles</div><div id="allowedRolesContainer"><div class="member-tag">@everyone <span class="remove-icon" data-role="everyone">✖</span></div></div><input type="text" id="newRoleInput" placeholder="Role name" class="setting-input" style="margin-top:8px;"><button id="addRoleBtn" class="add-member-btn">➕ Add Role</button><div class="setting-label" style="margin-top:12px;">Allowed Members</div><div id="allowedMembersContainer"></div><input type="text" id="newMemberInput" placeholder="User ID or email" class="setting-input"><button id="addMemberBtn" class="add-member-btn">👤 Add Member</button></div></div>
        <button id="savePermissionsBtn" class="close-settings">Save Permissions</button>
    </div>
</div>

<!-- Modals -->
<div id="createServerModal" class="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); align-items:center; justify-content:center; z-index:5000;"><div style="background:#0f172a; padding:24px; border-radius:32px; width:300px;"><h3>New Server</h3><input id="newServerName" placeholder="Name" style="width:100%; margin:12px 0; padding:12px; border-radius:30px;"><button id="confirmCreateServer" style="background:#fbbf24; padding:10px; border-radius:30px;">Create</button><button id="closeCreateModal" style="margin-top:8px;">Cancel</button></div></div>
<div id="createCategoryModal" class="modal" style="display:none;"><div style="background:#0f172a; padding:24px; border-radius:32px;"><h3>Category</h3><input id="categoryName" placeholder="Name"><button id="confirmCreateCategory">Add</button><button id="closeCatModal">Cancel</button></div></div>
<div id="joinServerModal" class="modal" style="display:none;"><div style="background:#0f172a; padding:24px; border-radius:32px;"><h3>Join</h3><input id="joinCodeInput" placeholder="Code"><button id="confirmJoinServer">Join</button><button id="closeJoinModal">Cancel</button></div></div>
<div id="inviteModal" class="modal" style="display:none;"><div style="background:#0f172a; padding:24px;"><h3>Invite Code</h3><p id="inviteCodeDisplay"></p><button id="closeInviteModal">Close</button></div></div>
<div id="micPermModal" class="modal" style="display:none;"><div style="background:#0f172a; padding:24px;"><h3>Mic Access</h3><button id="allowMicBtn">Allow</button><button id="denyMicBtn">Muted</button></div></div>
<div id="toastMsg" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = { apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc", authDomain: "vertexpaste.firebaseapp.com", projectId: "vertexpaste", storageBucket: "vertexpaste.firebasestorage.app", messagingSenderId: "255275350380", appId: "1:255275350380:web:7be4e8add2cb5b04045b49" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.firestore();
    let currentUser = null, currentServerId = null, currentChannelId = "general", currentChannelType = "text";
    let unsubscribeMessages = null, currentVoiceChannelId = null, isMicMuted = false, localStream = null, isSharing = false, screenStream = null;
    let selectedCategoryForSettings = null;
    const OWNER_EMAIL = "defnot67kid@gmail.com";
    let isGlobalOwner = false;

    function showToast(m) { const t = document.getElementById('toastMsg'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
    function escapeHtml(s) { return String(s).replace(/[&<>]/g, function(m){ if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m;}); }

    // Load servers and structure
    async function fetchUserServers() { if(!currentUser) return []; if(isGlobalOwner) { const snap = await db.collection("servers").get(); return snap.docs.map(d=>({id:d.id,...d.data()})); } const mem = await db.collection("serverMembers").where("userId","==",currentUser.uid).get(); const ids = mem.docs.map(d=>d.data().serverId); const servers = await Promise.all(ids.map(id=>db.collection("servers").doc(id).get())); return servers.filter(s=>s.exists).map(s=>({id:s.id,...s.data()})); }
    async function renderServerList() { const servers = await fetchUserServers(); let html=''; servers.forEach(s=>{ html+=`<div class="server-icon ${currentServerId===s.id?'active':''}" data-server-id="${s.id}"><span>${s.name.charAt(0)}</span></div>`; }); html+=`<div class="server-icon add-server-btn" id="addServerBtn"><i class="fas fa-plus"></i></div><div class="server-icon join-server-btn" id="joinServerBtn"><i class="fas fa-sign-in-alt"></i></div>`; document.getElementById('serverListContainer').innerHTML=html; document.querySelectorAll('.server-icon[data-server-id]').forEach(el=>el.addEventListener('click',()=>switchServer(el.dataset.serverId))); document.getElementById('addServerBtn')?.addEventListener('click',()=>document.getElementById('createServerModal').style.display='flex'); document.getElementById('joinServerBtn')?.addEventListener('click',()=>document.getElementById('joinServerModal').style.display='flex'); }
    async function switchServer(id) { if(unsubscribeMessages) unsubscribeMessages(); await leaveVoiceIfIn(); currentServerId=id; await loadServerChannels(id); renderServerList(); closeSidebar(); }
    async function loadServerChannels(serverId) { const structRef = db.collection("serverStructure").doc(serverId); let struct = (await structRef.get()).data(); if(!struct) { struct = { categories:[{ name:"GENERAL", channels:[{ id:"general", name:"general", type:"text" }] }] }; await structRef.set(struct); } if(!currentChannelId) currentChannelId="general"; const found = findChannel(struct, currentChannelId); currentChannelType = found?.type || "text"; await renderSidebarChannels(struct); if(currentChannelType==="text") { showTextView(); loadMessagesForChannel(serverId,currentChannelId); } else joinVoiceChannel(currentChannelId); document.getElementById('currentChannelName').innerText = getChannelNameById(struct,currentChannelId); document.getElementById('channelTypeIcon').className = currentChannelType==="voice" ? "fas fa-microphone-alt" : "fas fa-hashtag"; }
    function findChannel(struct,id) { for(let c of struct.categories) for(let ch of c.channels) if(ch.id===id) return ch; return null; }
    function getChannelNameById(struct,id) { let ch = findChannel(struct,id); return ch?ch.name:id; }
    async function renderSidebarChannels(struct) { let container=document.getElementById('channelsListContainer'); let html=''; for(let i=0;i<struct.categories.length;i++){ let cat=struct.categories[i]; html+=`<div><div class="category-header"><span><i class="fas fa-chevron-right"></i> ${escapeHtml(cat.name)}</span><i class="fas fa-cog category-settings-icon" data-cat-name="${escapeHtml(cat.name)}"></i></div><div class="channels-container">`; cat.channels.forEach(ch=>{ html+=`<div class="channel-item" data-channel-id="${ch.id}" data-channel-type="${ch.type}"><i class="fas ${ch.type==='voice'?'fa-microphone-alt':'fa-hashtag'}"></i> ${escapeHtml(ch.name)}</div>`; }); html+=`</div></div>`; } container.innerHTML=html; document.querySelectorAll('.channel-item').forEach(el=>{ el.addEventListener('click',()=>{ let type=el.dataset.channelType; if(type!=='voice'&&currentVoiceChannelId) leaveVoiceIfIn(); currentChannelId=el.dataset.channelId; currentChannelType=type; loadServerChannels(currentServerId); closeSidebar(); }); }); document.querySelectorAll('.category-settings-icon').forEach(icon=>{ icon.addEventListener('click',(e)=>{ e.stopPropagation(); let catName = icon.dataset.catName; openFullSettingsForCategory(catName); }); }); }
    function openFullSettingsForCategory(catName) { selectedCategoryForSettings = catName; document.getElementById('settingsModal').classList.add('active'); loadSettingsData(catName); }
    async function loadSettingsData(catName) { const struct = (await db.collection("serverStructure").doc(currentServerId).get()).data(); const category = struct.categories.find(c=>c.name===catName); if(!category) return; document.getElementById('settingsChannelName').value = category.name; let topic = category.topic || ''; document.getElementById('settingsChannelTopic').value = topic; let slow = category.slowMode || 0; document.getElementById('settingsSlowMode').value = slow; let isPrivate = category.private || false; let privateToggle = document.getElementById('privateToggleBtn'); let expandDiv = document.getElementById('privateSettingsExpand'); if(isPrivate) { privateToggle.classList.add('active'); expandDiv.style.display = 'flex'; } else { privateToggle.classList.remove('active'); expandDiv.style.display = 'none'; } let roles = category.allowedRoles || ['everyone']; let members = category.allowedMembers || []; let rolesDiv = document.getElementById('allowedRolesContainer'); rolesDiv.innerHTML = roles.map(r=>`<div class="member-tag">@${escapeHtml(r)} <span class="remove-icon" data-role="${escapeHtml(r)}">✖</span></div>`).join(''); let membersDiv = document.getElementById('allowedMembersContainer'); membersDiv.innerHTML = members.map(m=>`<div class="member-tag">${escapeHtml(m)} <span class="remove-icon" data-member="${escapeHtml(m)}">✖</span></div>`).join(''); document.querySelectorAll('[data-role]').forEach(el=>el.addEventListener('click',(e)=>{ let role = el.dataset.role; roles.splice(roles.indexOf(role),1); loadSettingsData(catName); })); document.querySelectorAll('[data-member]').forEach(el=>el.addEventListener('click',(e)=>{ let mem = el.dataset.member; members.splice(members.indexOf(mem),1); loadSettingsData(catName); })); window.tempCatData = { roles, members, isPrivate }; }
    function showTextView() { document.getElementById('textChatView').style.display='flex'; document.getElementById('voiceChatView').style.display='none'; }
    function showVoiceView() { document.getElementById('textChatView').style.display='none'; document.getElementById('voiceChatView').style.display='flex'; }
    async function joinVoiceChannel(channelId){ document.getElementById('micPermModal').style.display='flex'; const onAllow = async (withMic)=>{ document.getElementById('micPermModal').style.display='none'; if(withMic) try{ localStream = await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){} currentVoiceChannelId=channelId; showVoiceView(); updateMicBtnUI(); listenVoiceParticipants(channelId); listenScreenShare(channelId); }; document.getElementById('allowMicBtn').onclick=()=>onAllow(true); document.getElementById('denyMicBtn').onclick=()=>onAllow(false); }
    function listenVoiceParticipants(channelId){ const ref = db.collection("voicePresence").doc(currentServerId).collection("channels").doc(channelId).collection("members"); ref.onSnapshot(snap=>{ let grid=document.getElementById('voiceParticipantsGrid'); if(snap.empty){ grid.innerHTML='<div>✨ No one here</div>'; return; } let html=''; snap.forEach(doc=>{ let d=doc.data(); html+=`<div class="voice-participant-card"><img src="${escapeHtml(d.photoURL)}" class="voice-participant-avatar"><div><i class="fas ${d.muted?'fa-microphone-slash':'fa-microphone'}"></i> ${escapeHtml(d.displayName)}</div></div>`; }); grid.innerHTML=html; }); }
    async function startScreenShare(){ if(!currentVoiceChannelId) return; try{ screenStream = await navigator.mediaDevices.getDisplayMedia({video:true}); isSharing=true; document.getElementById('shareScreenBtn').classList.add('active'); const area=document.getElementById('screenShareDynamicArea'); area.innerHTML=`<div class="screenshare-container"><video id="localScreenVideo" class="screenshare-video" autoplay muted playsinline></video><button id="stopShareInlineBtn" style="margin:12px;">Stop</button></div>`; document.getElementById('localScreenVideo').srcObject=screenStream; document.getElementById('stopShareInlineBtn')?.addEventListener('click',stopScreenShare); screenStream.getVideoTracks()[0].onended=()=>stopScreenShare(); }catch(e){ showToast("Share cancelled"); } }
    async function stopScreenShare(){ if(screenStream) screenStream.getTracks().forEach(t=>t.stop()); screenStream=null; isSharing=false; document.getElementById('shareScreenBtn').classList.remove('active'); document.getElementById('screenShareDynamicArea').innerHTML=''; }
    function listenScreenShare(channelId){ const ref = db.collection("screenShares").doc(`${currentServerId}_${channelId}`); ref.onSnapshot(snap=>{ if(!snap.exists || !snap.data()?.active){ if(!isSharing) document.getElementById('screenShareDynamicArea').innerHTML=''; return; } if(snap.data().sharerUid !== currentUser?.uid && !isSharing){ document.getElementById('screenShareDynamicArea').innerHTML=`<div class="screenshare-container"><video id="remoteScreenVideo" class="screenshare-video" autoplay playsinline></video><div>🔴 Live screen</div></div>`; } }); }
    async function leaveVoiceIfIn(){ if(currentVoiceChannelId && currentUser) await db.collection("voicePresence").doc(currentServerId).collection("channels").doc(currentVoiceChannelId).collection("members").doc(currentUser.uid).delete(); if(localStream) localStream.getTracks().forEach(t=>t.stop()); localStream=null; isSharing=false; currentVoiceChannelId=null; showTextView(); }
    function updateMicBtnUI(){ let btn=document.getElementById('micToggleBtn'); if(btn) btn.classList.toggle('muted',isMicMuted); if(localStream) localStream.getAudioTracks().forEach(t=>t.enabled=!isMicMuted); }
    document.getElementById('micToggleBtn')?.addEventListener('click',()=>{ isMicMuted=!isMicMuted; updateMicBtnUI(); if(currentVoiceChannelId&&currentUser) db.collection("voicePresence").doc(currentServerId).collection("channels").doc(currentVoiceChannelId).collection("members").doc(currentUser.uid).set({muted:isMicMuted},{merge:true}); });
    document.getElementById('leaveVoiceBtn')?.addEventListener('click',async()=>{ await leaveVoiceIfIn(); loadServerChannels(currentServerId); });
    document.getElementById('shareScreenBtn')?.addEventListener('click',()=>{ isSharing?stopScreenShare():startScreenShare(); });
    async function loadMessagesForChannel(serverId,channelId){ if(unsubscribeMessages) unsubscribeMessages(); const msgsRef = db.collection("servers").doc(serverId).collection("channels").doc(channelId).collection("messages").orderBy("createdAt","asc"); unsubscribeMessages = msgsRef.onSnapshot(snap=>{ let container=document.getElementById('messagesContainer'); let html=''; snap.forEach(doc=>{ let d=doc.data(); html+=`<div class="message" data-msg-id="${doc.id}"><img src="${escapeHtml(d.photoURL)}" class="message-avatar"><div class="message-content"><div class="message-author">${escapeHtml(d.displayName)}<span style="font-size:0.7rem;"> ${d.createdAt?new Date(d.createdAt.toDate()).toLocaleTimeString():''}</span></div><div class="message-text">${escapeHtml(d.text)}</div></div></div>`; }); if(!html) html='<div>✨ No messages</div>'; container.innerHTML=html; container.scrollTop=container.scrollHeight; attachHoldToReply(); }); }
    function attachHoldToReply(){ let msgs = document.querySelectorAll('.message'); msgs.forEach(msg=>{ let timer; msg.addEventListener('touchstart',(e)=>{ timer = setTimeout(()=>{ msg.classList.add('holding'); let replyText = msg.querySelector('.message-text')?.innerText; document.getElementById('messageInput').value = `> ${replyText}\n`; setTimeout(()=>msg.classList.remove('holding'),500); },500); }); msg.addEventListener('touchend',()=>clearTimeout(timer)); }); }
    async function sendMessage(){ let input=document.getElementById('messageInput'); let text=input.value.trim(); if(!text) return; input.value=''; await db.collection("servers").doc(currentServerId).collection("channels").doc(currentChannelId).collection("messages").add({ text, uid:currentUser.uid, displayName:currentUser.displayName||currentUser.email, photoURL:`https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.displayName||'U')}`, createdAt:firebase.firestore.FieldValue.serverTimestamp() }); }
    document.getElementById('sendBtn')?.addEventListener('click',sendMessage);
    document.getElementById('messageInput')?.addEventListener('keypress',e=>{if(e.key==='Enter')sendMessage();});
    async function createServer(name){ if(!currentUser) return; let ref=db.collection("servers").doc(); await ref.set({name, ownerId:currentUser.uid}); await db.collection("serverMembers").add({serverId:ref.id, userId:currentUser.uid, role:"owner"}); await db.collection("serverStructure").doc(ref.id).set({ categories:[{ name:"GENERAL", channels:[{ id:"general", name:"general", type:"text" }] }] }); await switchServer(ref.id); renderServerList(); }
    document.getElementById('confirmCreateServer')?.addEventListener('click',async()=>{ let n=document.getElementById('newServerName').value; if(n) await createServer(n); document.getElementById('createServerModal').style.display='none'; });
    document.getElementById('closeCreateModal')?.addEventListener('click',()=>document.getElementById('createServerModal').style.display='none');
    document.getElementById('confirmJoinServer')?.addEventListener('click',async()=>{ let code=document.getElementById('joinCodeInput').value; if(code){ let inv=await db.collection("invites").doc(code).get(); if(inv.exists){ let serverId=inv.data().serverId; await db.collection("serverMembers").add({serverId, userId:currentUser.uid, role:"member"}); await renderServerList(); await switchServer(serverId); } else showToast("Invalid code"); } document.getElementById('joinServerModal').style.display='none'; });
    document.getElementById('invitePeopleBtn')?.addEventListener('click',async()=>{ let code=Math.random().toString(36).substring(2,10); await db.collection("invites").doc(code).set({serverId:currentServerId}); document.getElementById('inviteCodeDisplay').innerText=code; document.getElementById('inviteModal').style.display='flex'; });
    document.getElementById('headerInviteBtn')?.addEventListener('click',()=>document.getElementById('invitePeopleBtn').click());
    document.getElementById('closeInviteModal')?.addEventListener('click',()=>document.getElementById('inviteModal').style.display='none');
    document.getElementById('createCategoryBtn')?.addEventListener('click',()=>document.getElementById('createCategoryModal').style.display='flex');
    document.getElementById('confirmCreateCategory')?.addEventListener('click',async()=>{ let catName=document.getElementById('categoryName').value; if(catName){ let struct=(await db.collection("serverStructure").doc(currentServerId).get()).data(); struct.categories.push({name:catName, channels:[]}); await db.collection("serverStructure").doc(currentServerId).set(struct); loadServerChannels(currentServerId); } document.getElementById('createCategoryModal').style.display='none'; });
    document.getElementById('closeCatModal')?.addEventListener('click',()=>document.getElementById('createCategoryModal').style.display='none');
    document.getElementById('signOutBtn')?.addEventListener('click',()=>{ auth.signOut(); window.location.reload(); });
    document.getElementById('closeSettingsBtn')?.addEventListener('click',()=>document.getElementById('settingsModal').classList.remove('active'));
    document.getElementById('saveOverviewBtn')?.addEventListener('click',async()=>{ if(!selectedCategoryForSettings) return; let struct=(await db.collection("serverStructure").doc(currentServerId).get()).data(); let cat=struct.categories.find(c=>c.name===selectedCategoryForSettings); if(cat){ cat.name=document.getElementById('settingsChannelName').value; cat.topic=document.getElementById('settingsChannelTopic').value; cat.slowMode=parseInt(document.getElementById('settingsSlowMode').value); await db.collection("serverStructure").doc(currentServerId).set(struct); loadServerChannels(currentServerId); showToast("Overview saved"); } document.getElementById('settingsModal').classList.remove('active'); });
    document.getElementById('savePermissionsBtn')?.addEventListener('click',async()=>{ if(!selectedCategoryForSettings) return; let struct=(await db.collection("serverStructure").doc(currentServerId).get()).data(); let cat=struct.categories.find(c=>c.name===selectedCategoryForSettings); let isPrivate = document.getElementById('privateToggleBtn').classList.contains('active'); cat.private = isPrivate; if(window.tempCatData){ cat.allowedRoles = window.tempCatData.roles; cat.allowedMembers = window.tempCatData.members; } await db.collection("serverStructure").doc(currentServerId).set(struct); loadServerChannels(currentServerId); showToast("Permissions saved"); document.getElementById('settingsModal').classList.remove('active'); });
    let privBtn = document.getElementById('privateToggleBtn'); privBtn?.addEventListener('click',()=>{ privBtn.classList.toggle('active'); let expand=document.getElementById('privateSettingsExpand'); expand.style.display = privBtn.classList.contains('active') ? 'flex' : 'none'; });
    document.getElementById('addRoleBtn')?.addEventListener('click',()=>{ let role=document.getElementById('newRoleInput').value.trim(); if(role && window.tempCatData){ if(!window.tempCatData.roles.includes(role)) window.tempCatData.roles.push(role); loadSettingsData(selectedCategoryForSettings); document.getElementById('newRoleInput').value=''; } });
    document.getElementById('addMemberBtn')?.addEventListener('click',()=>{ let mem=document.getElementById('newMemberInput').value.trim(); if(mem && window.tempCatData){ if(!window.tempCatData.members.includes(mem)) window.tempCatData.members.push(mem); loadSettingsData(selectedCategoryForSettings); document.getElementById('newMemberInput').value=''; } });
    document.querySelectorAll('.settings-tab').forEach(tab=>{ tab.addEventListener('click',()=>{ let paneId = tab.dataset.tab; document.querySelectorAll('.settings-pane').forEach(p=>p.classList.remove('active')); document.getElementById(`${paneId}Pane`).classList.add('active'); document.querySelectorAll('.settings-tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); }); });
    function closeSidebar(){ document.getElementById('sidebarPanel').classList.remove('open'); document.getElementById('mobileOverlay').classList.remove('active'); }
    document.querySelectorAll('.mobile-nav-item').forEach(item=>{ item.addEventListener('click',()=>{ if(item.dataset.nav==='servers') document.getElementById('joinServerModal').style.display='flex'; if(item.dataset.nav==='channels') { document.getElementById('sidebarPanel').classList.add('open'); document.getElementById('mobileOverlay').classList.add('active'); } if(item.dataset.nav==='voice' && currentServerId) loadServerChannels(currentServerId); }); });
    document.getElementById('mobileOverlay')?.addEventListener('click',closeSidebar);
    auth.onAuthStateChanged(user=>{ currentUser=user; if(user){ isGlobalOwner = (user.email === OWNER_EMAIL); document.getElementById('userDisplay').innerText = user.displayName||user.email; renderServerList().then(async()=>{ let servers = await fetchUserServers(); if(servers.length && !currentServerId) await switchServer(servers[0].id); }); document.getElementById('authOverlay')?.remove(); } });
    setTimeout(async()=>{ let all=await db.collection("servers").get(); if(all.empty){ let hub=db.collection("servers").doc(); await hub.set({name:"Stonks Hub", ownerId:"system"}); await db.collection("serverStructure").doc(hub.id).set({ categories:[{ name:"GENERAL", channels:[{ id:"welcome", name:"welcome", type:"text" }] },{ name:"VOICE", channels:[{ id:"voice-lounge", name:"General Voice", type:"voice" }] }] }); } },1000);
</script>
<div id="authOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0f;z-index:9999;display:flex;align-items:center;justify-content:center;"><div style="background:#1e293b;padding:30px;border-radius:28px;text-align:center;"><i class="fas fa-chart-line" style="font-size:48px;color:#fbbf24;"></i><h2>Stonks Hub</h2><button id="googleSignInBtn" style="background:#fbbf24;border:none;padding:12px 28px;border-radius:40px;"><i class="fab fa-google"></i> Sign in with Google</button></div></div>
<script>document.getElementById('googleSignInBtn')?.addEventListener('click',()=>firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()));</script>
</body>
