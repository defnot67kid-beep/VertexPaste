<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <title>Stonks Sever · Mobile Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .app {
            display: flex;
            height: 100%;
            width: 100%;
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 1000;
            position: fixed;
            left: 0;
            top: 0;
            height: 100%;
            transform: translateX(-100%);
        }

        .sidebar.mobile-open {
            transform: translateX(0);
        }

        /* Chat Area - ALWAYS VISIBLE */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f172a;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            background: #0f172a;
            flex-shrink: 0;
        }

        .mobile-menu-btn {
            background: #1e293b;
            border: none;
            color: #fbbf24;
            font-size: 1.2rem;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .channel-name {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .sign-out-btn {
            background: #1e293b;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            color: #fbbf24;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Messages Container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 90%;
            animation: fadeIn 0.2s ease;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .message-content {
            background: #1e293b;
            padding: 8px 14px;
            border-radius: 18px;
            word-break: break-word;
            flex: 1;
        }

        .message-author {
            font-weight: 600;
            font-size: 0.75rem;
            display: flex;
            gap: 6px;
            align-items: baseline;
            flex-wrap: wrap;
        }

        .message-time {
            font-size: 0.6rem;
            color: #94a3b8;
        }

        .message-text {
            font-size: 0.85rem;
            margin-top: 4px;
            line-height: 1.4;
        }

        .system-message {
            background: linear-gradient(135deg, #1e293b, #1a1f2e);
            border-left: 3px solid #fbbf24;
        }

        .bot-tag {
            background: #8b5cf6;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.6rem;
            margin-left: 6px;
        }

        /* Embed Card */
        .embed-card {
            background: #0f172a;
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 6px;
            border-left: 3px solid;
        }

        .embed-title {
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .embed-field {
            margin: 4px 0;
            font-size: 0.75rem;
            display: flex;
            align-items: baseline;
            gap: 6px;
            flex-wrap: wrap;
        }

        .embed-field-name {
            font-weight: bold;
        }

        /* Input Area - ALWAYS VISIBLE AND TAPPABLE */
        .input-area {
            padding: 12px;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 10px;
            background: #0f172a;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            background: #1e293b;
            border: none;
            padding: 12px 16px;
            border-radius: 30px;
            color: white;
            outline: none;
            font-size: 16px;
        }

        .input-area input:focus {
            outline: none;
            border: 1px solid #fbbf24;
        }

        .input-area button {
            background: #fbbf24;
            border: none;
            padding: 0 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            color: #0f172a;
            font-size: 14px;
        }

        /* Auth Overlay */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0f;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            max-width: 350px;
            width: 100%;
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 28px;
            text-align: center;
        }

        .auth-card h2 {
            font-size: 1.5rem;
            margin: 15px 0;
        }

        .auth-card button {
            background: #fbbf24;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            font-size: 1rem;
            width: 100%;
        }

        /* Sidebar inner */
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #fbbf24, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .close-sidebar {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .user-profile {
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid #1f2937;
        }

        .avatar-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fbbf24;
        }

        .user-name {
            margin-top: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .admin-badge {
            background: linear-gradient(135deg, #ef4444, #f59e0b);
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.6rem;
            margin-left: 6px;
            display: inline-block;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .nav-item:hover, .nav-item.active {
            background: #1f2937;
            color: #fbbf24;
        }

        .category-group {
            margin: 10px 0;
        }

        .category-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #6b7280;
            padding: 6px 12px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px 8px 28px;
            border-radius: 8px;
            cursor: pointer;
            color: #9ca3af;
            font-size: 0.85rem;
        }

        .channel-item.active {
            background: #1f2937;
            color: #fbbf24;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(70px);
            background: #1e293b;
            padding: 8px 16px;
            border-radius: 30px;
            z-index: 1100;
            transition: 0.3s;
            border-left: 3px solid #fbbf24;
            font-size: 13px;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 10px;
            color: white;
            margin: 8px 0;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .btn-gold {
            background: #fbbf24;
            color: black;
            padding: 8px 16px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            cursor: pointer;
            border: none;
        }

        .btn-purple {
            background: #8b5cf6;
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            cursor: pointer;
            border: none;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-chat {
            text-align: center;
            padding: 40px;
            color: #6b7280;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebarPanel">
        <div class="sidebar-header">
            <div class="logo">📈 STONKS SEVER</div>
            <button class="close-sidebar" id="closeSidebarBtn"><i class="fas fa-times"></i></button>
        </div>
        <div class="user-profile">
            <img id="sidebarAvatar" class="avatar-img" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff">
            <div class="user-name" id="sidebarName">Guest</div>
            <div id="adminIndicator" class="admin-badge hidden">ADMIN</div>
        </div>
        <div style="flex:1; overflow-y: auto;" id="channelsList"></div>
        <div class="nav-item" id="adminPanelBtn" style="margin-top: auto; margin-bottom: 16px;">
            <i class="fas fa-crown"></i> Admin Panel
        </div>
        <div class="nav-item" id="signOutSidebarBtn">
            <i class="fas fa-sign-out-alt"></i> Sign Out
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="chat-area" id="chatArea">
        <div class="chat-header">
            <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
            <div class="channel-info">
                <i class="fas fa-hashtag"></i>
                <span class="channel-name" id="currentChannelName">general</span>
            </div>
            <button class="sign-out-btn" id="signOutTopBtn">Exit</button>
        </div>
        <div class="messages-container" id="messagesContainer">
            <div class="empty-chat">✨ Sign in to start chatting!</div>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type a message or /stonks...">
            <button id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
    </div>

    <!-- Auth Overlay -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <i class="fas fa-chart-line" style="font-size: 48px; color: #fbbf24;"></i>
            <h2>STONKS SEVER</h2>
            <p>Sign in with Google to join the chat</p>
            <button id="signInBtn"><i class="fab fa-google"></i> Continue with Google</button>
        </div>
    </div>
</div>

<!-- Admin Modal (simplified) -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <h3>Admin Panel</h3>
        <div id="adminInfo"></div>
        <div class="modal-buttons">
            <button class="btn-danger" id="closeAdminModalBtn">Close</button>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc",
        authDomain: "vertexpaste.firebaseapp.com",
        projectId: "vertexpaste",
        storageBucket: "vertexpaste.firebasestorage.app",
        messagingSenderId: "255275350380",
        appId: "1:255275350380:web:7be4e8add2cb5b04045b49"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    const ADMIN_EMAIL = "defnot67kid@gmail.com";
    let currentUser = null;
    let isAdmin = false;
    let currentChannelId = "general";
    let unsubscribeMessages = null;
    
    // Helper functions
    function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    function formatTime(ts) {
        if (!ts) return '';
        const d = ts.toDate ? ts.toDate() : new Date(ts);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    
    function showToast(msg) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
    
    // Bot command responses
    function handleBotCommands(msg, author) {
        const lower = msg.toLowerCase();
        
        if (lower === '/stonks') {
            return {
                embed: true,
                html: `<div class="embed-card" style="border-left-color: #fbbf24;">
                    <div class="embed-title" style="color: #fbbf24;">📈 STONKS MARKET LIVE</div>
                    <div class="embed-field"><span class="embed-field-name">🚀 STNK:</span> $142.50 (+12%)</div>
                    <div class="embed-field"><span class="embed-field-name">📉 CRPT:</span> $87.30 (-5%)</div>
                    <div class="embed-field"><span class="embed-field-name">🌙 MOON:</span> $315.20 (+8%)</div>
                    <div class="embed-field"><span class="embed-field-name">🐕 DOGE:</span> $0.52 (+25%)</div>
                    <div style="font-size:0.7rem; margin-top:6px;">Prices update in real-time</div>
                </div>`
            };
        }
        
        if (lower === '/help') {
            return {
                embed: true,
                html: `<div class="embed-card" style="border-left-color: #8b5cf6;">
                    <div class="embed-title">🤖 Available Commands</div>
                    <div class="embed-field">📈 <strong>/stonks</strong> - View market</div>
                    <div class="embed-field">🏓 <strong>/ping</strong> - Test bot</div>
                    <div class="embed-field">👤 <strong>/whoami</strong> - Your info</div>
                    <div class="embed-field">🌙 <strong>/moon</strong> - Moon prediction</div>
                    <div class="embed-field">❓ <strong>/help</strong> - This menu</div>
                </div>`
            };
        }
        
        if (lower === '/ping') {
            return { text: "🏓 Pong! Bot is alive and responding!" };
        }
        
        if (lower === '/whoami') {
            return {
                embed: true,
                html: `<div class="embed-card" style="border-left-color: #8b5cf6;">
                    <div class="embed-title">👤 User Profile</div>
                    <div class="embed-field"><strong>Username:</strong> ${escapeHtml(author)}</div>
                    <div class="embed-field"><strong>Channel:</strong> #${currentChannelId}</div>
                </div>`
            };
        }
        
        if (lower === '/moon') {
            const predictions = ["🌕 TO THE MOON! 🚀", "📈 Bullish pattern!", "🐻 Bear market, wait for dip", "💎 DIAMOND HANDS!"];
            const random = predictions[Math.floor(Math.random() * predictions.length)];
            return { text: random };
        }
        
        return null;
    }
    
    async function sendMessage() {
        if (!currentUser) {
            showToast("Please sign in first");
            return;
        }
        
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;
        
        // Check for bot commands
        const botResponse = handleBotCommands(text, currentUser.displayName);
        
        if (botResponse) {
            // Send bot response
            await db.collection("channels").doc(currentChannelId).collection("messages").add({
                text: botResponse.embed ? botResponse.html : botResponse.text,
                displayName: "🤖 Stonks Bot",
                photoURL: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png",
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                isBot: true,
                isEmbed: botResponse.embed || false
            });
            input.value = '';
            return;
        }
        
        // Normal message
        await db.collection("channels").doc(currentChannelId).collection("messages").add({
            text: text,
            uid: currentUser.uid,
            displayName: currentUser.displayName,
            photoURL: currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.displayName || 'User')}&background=6366f1&color=fff`,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            isBot: false
        });
        input.value = '';
    }
    
    // Load channels and messages
    async function loadChannels() {
        const docRef = db.collection("server").doc("structure");
        const docSnap = await docRef.get();
        if (docSnap.exists) return docSnap.data();
        const def = { categories: [{ name: "TEXT CHANNELS", channels: [{ id: "general", name: "general" }] }] };
        await docRef.set(def);
        return def;
    }
    
    async function renderSidebar() {
        const struct = await loadChannels();
        const container = document.getElementById('channelsList');
        let html = '';
        for (const cat of struct.categories) {
            html += `<div class="category-group"><div class="category-title">${escapeHtml(cat.name)}</div>`;
            for (const ch of cat.channels) {
                html += `<div class="channel-item ${currentChannelId === ch.id ? 'active' : ''}" data-channel-id="${ch.id}" data-channel-name="${ch.name}"><i class="fas fa-hashtag"></i> ${escapeHtml(ch.name)}</div>`;
            }
            html += `</div>`;
        }
        container.innerHTML = html;
        
        document.querySelectorAll('.channel-item').forEach(el => {
            el.addEventListener('click', () => {
                const id = el.dataset.channelId;
                const name = el.dataset.channelName;
                switchChannel(id, name);
            });
        });
    }
    
    function switchChannel(id, name) {
        if (unsubscribeMessages) unsubscribeMessages();
        currentChannelId = id;
        document.getElementById('currentChannelName').innerText = name;
        loadMessagesForChannel(id);
        renderSidebar();
        // Close sidebar on mobile after channel selection
        if (window.innerWidth <= 768) {
            document.getElementById('sidebarPanel').classList.remove('mobile-open');
        }
    }
    
    function loadMessagesForChannel(channelId) {
        const container = document.getElementById('messagesContainer');
        unsubscribeMessages = db.collection("channels").doc(channelId).collection("messages")
            .orderBy("createdAt", "asc")
            .onSnapshot(snapshot => {
                let html = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    html += `<div class="message ${d.isBot ? 'system-message' : ''}">
                        <img src="${d.photoURL || 'https://ui-avatars.com/api/?name=User'}" class="message-avatar" onerror="this.src='https://ui-avatars.com/api/?name=User'">
                        <div class="message-content">
                            <div class="message-author">${escapeHtml(d.displayName)}${d.isBot ? '<span class="bot-tag">BOT</span>' : ''}<span class="message-time">${formatTime(d.createdAt)}</span></div>
                            <div class="message-text">${d.isEmbed ? d.text : escapeHtml(d.text)}</div>
                        </div>
                    </div>`;
                });
                if (!html) html = '<div class="empty-chat">✨ No messages yet. Type /help to see commands!</div>';
                container.innerHTML = html;
                container.scrollTop = container.scrollHeight;
            });
    }
    
    // UI Update
    function updateUI(user) {
        const authOverlay = document.getElementById('authOverlay');
        const chatArea = document.getElementById('chatArea');
        
        if (user) {
            authOverlay.style.display = 'none';
            chatArea.style.display = 'flex';
            document.getElementById('sidebarName').innerText = user.displayName || user.email;
            document.getElementById('sidebarAvatar').src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || 'User')}&background=6366f1&color=fff`;
            
            isAdmin = (user.email === ADMIN_EMAIL);
            const adminIndicator = document.getElementById('adminIndicator');
            if (adminIndicator) {
                adminIndicator.classList.toggle('hidden', !isAdmin);
            }
            
            renderSidebar();
            loadMessagesForChannel(currentChannelId);
        } else {
            authOverlay.style.display = 'flex';
            chatArea.style.display = 'flex';
            if (unsubscribeMessages) unsubscribeMessages();
            document.getElementById('messagesContainer').innerHTML = '<div class="empty-chat">✨ Sign in to start chatting!</div>';
            document.getElementById('sidebarName').innerText = 'Guest';
        }
    }
    
    // Admin panel (simplified)
    function openAdminPanel() {
        if (!isAdmin) {
            showToast("Admin only - defnot67kid@gmail.com");
            return;
        }
        const modal = document.getElementById('adminModal');
        const infoDiv = document.getElementById('adminInfo');
        infoDiv.innerHTML = `
            <p style="margin: 10px 0;">✅ Admin: ${currentUser.email}</p>
            <p style="margin: 10px 0;">🔧 You can manage channels and bots here.</p>
            <p style="margin: 10px 0;">💡 To add channels, use Firestore console or contact dev.</p>
        `;
        modal.classList.add('active');
    }
    
    // Auth functions
    async function signIn() {
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
            const result = await auth.signInWithPopup(provider);
            showToast(`Welcome ${result.user.displayName}!`);
        } catch (e) {
            showToast("Sign in failed: " + e.message);
        }
    }
    
    async function signOut() {
        await auth.signOut();
        showToast("Signed out");
        updateUI(null);
    }
    
    // Mobile sidebar
    function openMobileSidebar() {
        document.getElementById('sidebarPanel').classList.add('mobile-open');
    }
    
    function closeMobileSidebar() {
        document.getElementById('sidebarPanel').classList.remove('mobile-open');
    }
    
    // Event listeners
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('signInBtn')?.addEventListener('click', signIn);
        document.getElementById('signOutTopBtn')?.addEventListener('click', signOut);
        document.getElementById('signOutSidebarBtn')?.addEventListener('click', signOut);
        document.getElementById('sendBtn')?.addEventListener('click', sendMessage);
        document.getElementById('mobileMenuBtn')?.addEventListener('click', openMobileSidebar);
        document.getElementById('closeSidebarBtn')?.addEventListener('click', closeMobileSidebar);
        document.getElementById('adminPanelBtn')?.addEventListener('click', openAdminPanel);
        document.getElementById('closeAdminModalBtn')?.addEventListener('click', () => {
            document.getElementById('adminModal').classList.remove('active');
        });
        
        document.getElementById('messageInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        // Close modals on backdrop click
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('active');
            });
        });
    });
    
    auth.onAuthStateChanged(user => {
        currentUser = user;
        updateUI(user);
    });
</script>
</body>
</html>
