<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Stonks Sever · Admin Chat Controls</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        .app { display: flex; height: 100%; width: 100%; }
        
        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            position: fixed;
            left: 0;
            top: 0;
            height: 100%;
            transform: translateX(-100%);
            z-index: 1000;
        }
        .sidebar.mobile-open { transform: translateX(0); }
        @media (min-width: 769px) { .sidebar { position: relative; transform: translateX(0); } }
        
        .sidebar-header { padding: 16px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; }
        .logo { font-weight: 800; font-size: 1.2rem; background: linear-gradient(135deg, #fbbf24, #ef4444); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .close-sidebar { background: none; border: none; color: #9ca3af; font-size: 1.2rem; cursor: pointer; display: none; }
        @media (max-width: 768px) { .close-sidebar { display: block; } }
        
        .user-profile { padding: 16px; text-align: center; border-bottom: 1px solid #1f2937; }
        .avatar-img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 3px solid #fbbf24; }
        .user-name { margin-top: 8px; font-weight: 600; font-size: 0.9rem; }
        .admin-badge { background: linear-gradient(135deg, #ef4444, #f59e0b); padding: 2px 8px; border-radius: 20px; font-size: 0.6rem; display: inline-block; margin-left: 6px; }
        .hidden { display: none; }
        
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin: 4px 12px; border-radius: 12px; cursor: pointer; color: #9ca3af; }
        .nav-item:hover { background: #1f2937; color: #fbbf24; }
        
        .category-group { margin: 10px 0; }
        .category-title { font-size: 0.65rem; text-transform: uppercase; color: #6b7280; padding: 6px 12px; }
        .channel-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 28px; border-radius: 8px; cursor: pointer; color: #9ca3af; font-size: 0.85rem; }
        .channel-item.active { background: #1f2937; color: #fbbf24; }
        
        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0f172a; width: 100%; overflow: hidden; }
        .chat-header { padding: 12px 16px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; background: #0f172a; }
        .mobile-menu-btn { background: #1e293b; border: none; color: #fbbf24; padding: 8px 12px; border-radius: 10px; cursor: pointer; margin-right: 12px; display: flex; }
        @media (min-width: 769px) { .mobile-menu-btn { display: none; } }
        
        .channel-info { flex: 1; display: flex; align-items: center; gap: 8px; }
        .channel-name { font-size: 1.1rem; font-weight: 600; }
        .sign-out-btn { background: #1e293b; border: none; padding: 6px 14px; border-radius: 20px; color: #fbbf24; cursor: pointer; font-size: 0.8rem; }
        
        /* Messages */
        .messages-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
        .message { display: flex; gap: 10px; max-width: 90%; animation: fadeIn 0.2s ease; position: relative; transition: 0.1s; }
        .message-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .message-content { background: #1e293b; padding: 8px 14px; border-radius: 18px; word-break: break-word; flex: 1; }
        .message-author { font-weight: 600; font-size: 0.75rem; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
        .message-time { font-size: 0.6rem; color: #94a3b8; }
        .message-text { font-size: 0.85rem; margin-top: 4px; line-height: 1.4; }
        .system-message { background: linear-gradient(135deg, #1e293b, #1a1f2e); border-left: 3px solid #fbbf24; }
        .bot-tag { background: #8b5cf6; padding: 2px 6px; border-radius: 10px; font-size: 0.6rem; margin-left: 6px; }
        
        /* Reply Indicator */
        .reply-indicator { background: #334155; padding: 6px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 0.7rem; color: #fbbf24; border-left: 3px solid #fbbf24; }
        .replying-to { font-size: 0.65rem; color: #94a3b8; margin-bottom: 6px; }
        
        /* Action Buttons (appear on shift+click) */
        .message-actions { position: absolute; right: 5px; top: 5px; display: flex; gap: 6px; background: #1e293b; padding: 4px 8px; border-radius: 20px; border: 1px solid #fbbf24; z-index: 10; backdrop-filter: blur(4px); }
        .action-btn { background: none; border: none; color: #94a3b8; cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: 0.7rem; transition: 0.1s; }
        .action-btn:hover { background: #334155; color: #fbbf24; }
        .action-btn.delete { color: #ef4444; }
        .action-btn.delete:hover { background: #7f1d1d; color: white; }
        
        /* Input */
        .input-area { padding: 12px; border-top: 1px solid #1e293b; display: flex; gap: 10px; background: #0f172a; }
        .input-area input { flex: 1; background: #1e293b; border: none; padding: 12px 16px; border-radius: 30px; color: white; outline: none; font-size: 16px; }
        .input-area button { background: #fbbf24; border: none; padding: 0 20px; border-radius: 30px; font-weight: bold; cursor: pointer; color: #0f172a; }
        .cancel-reply { background: #334155; margin-right: 8px; padding: 0 12px; border-radius: 20px; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        
        .embed-card { background: #0f172a; border-radius: 10px; padding: 10px; margin-top: 6px; border-left: 3px solid; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(70px); background: #1e293b; padding: 8px 16px; border-radius: 30px; z-index: 1100; transition: 0.3s; border-left: 3px solid #fbbf24; font-size: 13px; white-space: nowrap; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #1e293b; border-radius: 20px; padding: 20px; width: 90%; max-width: 400px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .btn-gold { background: #fbbf24; color: black; padding: 8px 16px; border-radius: 25px; font-weight: bold; cursor: pointer; border: none; }
        .btn-danger { background: #ef4444; color: white; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .empty-chat { text-align: center; padding: 40px; color: #6b7280; }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar" id="sidebarPanel">
        <div class="sidebar-header">
            <div class="logo">📈 STONKS SEVER</div>
            <button class="close-sidebar" id="closeSidebarBtn"><i class="fas fa-times"></i></button>
        </div>
        <div class="user-profile">
            <img id="sidebarAvatar" class="avatar-img" src="https://ui-avatars.com/api/?name=User">
            <div class="user-name" id="sidebarName">Guest</div>
            <div id="adminIndicator" class="admin-badge hidden">ADMIN</div>
            <div id="ownerIndicator" class="admin-badge hidden" style="background:#fbbf24; color:#000;">👑 OWNER</div>
        </div>
        <div style="flex:1; overflow-y: auto;" id="channelsList"></div>
        <div class="nav-item" id="adminPanelBtn"><i class="fas fa-crown"></i> Admin Panel</div>
        <div class="nav-item" id="signOutSidebarBtn"><i class="fas fa-sign-out-alt"></i> Sign Out</div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="chat-header">
            <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
            <div class="channel-info"><i class="fas fa-hashtag"></i><span class="channel-name" id="currentChannelName">general</span></div>
            <button class="sign-out-btn" id="signOutTopBtn">Exit</button>
        </div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="input-area" id="inputArea">
            <div id="replyPreview" style="display:none; align-items:center; gap:6px; background:#1e293b; padding:4px 12px; border-radius:20px;">
                <i class="fas fa-reply"></i> <span id="replyingToText"></span>
                <button class="cancel-reply" id="cancelReplyBtn">✖</button>
            </div>
            <input type="text" id="messageInput" placeholder="Type a message... Shift+Click any message to reply/delete">
            <button id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
    </div>

    <div id="authOverlay" class="auth-overlay" style="position:fixed; top:0; left:0; right:0; bottom:0; background:#0a0a0f; z-index:200; display:flex; align-items:center; justify-content:center;">
        <div class="auth-card" style="background:#1e293b; padding:30px; border-radius:28px; text-align:center; max-width:350px;">
            <i class="fas fa-chart-line" style="font-size:48px; color:#fbbf24;"></i>
            <h2 style="margin:15px 0;">STONKS SEVER</h2>
            <p>Sign in with Google</p>
            <button id="signInBtn" style="background:#fbbf24; border:none; padding:12px 28px; border-radius:40px; margin-top:20px; width:100%;"><i class="fab fa-google"></i> Continue</button>
        </div>
    </div>
</div>

<div id="adminModal" class="modal"><div class="modal-content"><h3>Admin Controls</h3><p>Bot permissions & message management</p><div class="flex-between" style="margin:15px 0;"><span>🤖 Bot Delete Permission:</span><button id="toggleBotPermBtn" class="btn-gold">Toggle for Bots</button></div><button class="btn-danger" id="closeAdminModal">Close</button></div></div>
<div id="toastMsg" class="toast"></div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc", authDomain: "vertexpaste.firebaseapp.com", projectId: "vertexpaste", storageBucket: "vertexpaste.firebasestorage.app", messagingSenderId: "255275350380", appId: "1:255275350380:web:7be4e8add2cb5b04045b49" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    const OWNER_EMAIL = "defnot67kid@gmail.com";
    let currentUser = null, isAdmin = false, isOwner = false, currentChannelId = "general", unsubscribeMessages = null;
    let botDeletePermission = false;  // if true, bots can also delete messages
    let currentReplyTo = null; // { messageId, author, text }
    
    function escapeHtml(s) { if(!s) return ''; return String(s).replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    function formatTime(ts) { if(!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
    function showToast(msg) { const t=document.getElementById('toastMsg'); t.innerText=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
    
    // Permission check: can delete message? (owner, admin, or bot if permission granted)
    function canDelete(messageData) {
        if (!currentUser) return false;
        if (isOwner) return true;
        if (isAdmin) return true;
        if (messageData.isBot && botDeletePermission && messageData.uid === currentUser.uid) return true;
        if (messageData.uid === currentUser.uid) return true;
        return false;
    }
    
    // Delete message function
    async function deleteMessage(channelId, messageId) {
        if (!currentUser) return;
        const msgRef = db.collection("channels").doc(channelId).collection("messages").doc(messageId);
        const doc = await msgRef.get();
        if (!doc.exists) return;
        const data = doc.data();
        if (!canDelete(data)) { showToast("❌ No permission to delete this message"); return; }
        await msgRef.delete();
        showToast("🗑️ Message deleted");
    }
    
    // Reply function - sets reply context
    function setReplyTo(messageId, author, text) {
        currentReplyTo = { messageId, author, text };
        const previewDiv = document.getElementById('replyPreview');
        const replyingToText = document.getElementById('replyingToText');
        replyingToText.innerText = `Replying to @${author}: ${text.substring(0, 40)}${text.length > 40 ? '...' : ''}`;
        previewDiv.style.display = 'flex';
        document.getElementById('messageInput').focus();
    }
    
    function cancelReply() { currentReplyTo = null; document.getElementById('replyPreview').style.display = 'none'; }
    
    // Send message with reply support
    async function sendMessage() {
        if (!currentUser) { showToast("Sign in first"); return; }
        const input = document.getElementById('messageInput');
        let text = input.value.trim();
        if (!text) return;
        
        let finalText = text;
        let replyData = null;
        if (currentReplyTo) {
            replyData = { messageId: currentReplyTo.messageId, author: currentReplyTo.author, text: currentReplyTo.text };
            finalText = `> **Replying to @${currentReplyTo.author}:** ${currentReplyTo.text}\n\n${text}`;
            cancelReply();
        }
        
        await db.collection("channels").doc(currentChannelId).collection("messages").add({
            text: finalText,
            uid: currentUser.uid,
            displayName: currentUser.displayName,
            photoURL: currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.displayName || 'User')}&background=6366f1&color=fff`,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            isBot: false,
            replyTo: replyData || null
        });
        input.value = '';
    }
    
    // Bot command handler (simple)
    function handleBotCommands(msg, author) {
        const lower = msg.toLowerCase();
        if (lower === '/stonks') return { embed: true, html: `<div class="embed-card" style="border-left-color:#fbbf24;"><div class="embed-title">📈 STONKS MARKET</div><div>STNK: $142.50 🟢</div><div>CRPT: $87.30 🔴</div><div>MOON: $315.20 🟢</div></div>` };
        if (lower === '/help') return { embed: true, html: `<div class="embed-card">Commands: /stonks, /ping, /whoami, /moon</div>` };
        if (lower === '/ping') return { text: "🏓 Pong!" };
        if (lower === '/whoami') return { text: `👤 You are ${author}` };
        if (lower === '/moon') return { text: ["🌕 TO THE MOON!","📈 Bullish","🐻 Bear market","💎 HODL"][Math.floor(Math.random()*4)] };
        return null;
    }
    
    // Load channels structure
    async function loadChannels() {
        const docRef = db.collection("server").doc("structure");
        const docSnap = await docRef.get();
        if (docSnap.exists) return docSnap.data();
        const def = { categories: [{ name: "TEXT CHANNELS", channels: [{ id: "general", name: "general" }] }] };
        await docRef.set(def); return def;
    }
    
    async function renderSidebar() {
        const struct = await loadChannels();
        const container = document.getElementById('channelsList');
        let html = '';
        for (const cat of struct.categories) {
            html += `<div class="category-group"><div class="category-title">${escapeHtml(cat.name)}</div>`;
            for (const ch of cat.channels) {
                html += `<div class="channel-item ${currentChannelId === ch.id ? 'active' : ''}" data-channel-id="${ch.id}" data-channel-name="${ch.name}"><i class="fas fa-hashtag"></i> ${escapeHtml(ch.name)}</div>`;
            }
            html += `</div>`;
        }
        container.innerHTML = html;
        document.querySelectorAll('.channel-item').forEach(el => {
            el.addEventListener('click', () => switchChannel(el.dataset.channelId, el.dataset.channelName));
        });
    }
    
    function switchChannel(id, name) {
        if (unsubscribeMessages) unsubscribeMessages();
        currentChannelId = id;
        document.getElementById('currentChannelName').innerText = name;
        loadMessagesForChannel(id);
        renderSidebar();
        if (window.innerWidth <= 768) document.getElementById('sidebarPanel').classList.remove('mobile-open');
    }
    
    // Render messages with action buttons (Shift+click detection uses global shiftKey)
    function loadMessagesForChannel(channelId) {
        const container = document.getElementById('messagesContainer');
        unsubscribeMessages = db.collection("channels").doc(channelId).collection("messages").orderBy("createdAt","asc").onSnapshot(snapshot => {
            let html = '';
            snapshot.forEach(doc => {
                const d = doc.data();
                const msgId = doc.id;
                const isSystem = d.isBot;
                const replyHtml = d.replyTo ? `<div class="replying-to"><i class="fas fa-reply"></i> Replying to @${escapeHtml(d.replyTo.author)}: ${escapeHtml(d.replyTo.text.substring(0,50))}</div>` : '';
                html += `<div class="message ${isSystem ? 'system-message' : ''}" data-msg-id="${msgId}" data-msg-author="${escapeHtml(d.displayName)}" data-msg-text="${escapeHtml(d.text).replace(/"/g, '&quot;')}">
                    <img src="${d.photoURL || 'https://ui-avatars.com/api/?name=User'}" class="message-avatar" onerror="this.src='https://ui-avatars.com/api/?name=User'">
                    <div class="message-content">
                        <div class="message-author">${escapeHtml(d.displayName)}${d.isBot ? '<span class="bot-tag">BOT</span>' : ''}<span class="message-time">${formatTime(d.createdAt)}</span></div>
                        ${replyHtml}
                        <div class="message-text">${d.isEmbed ? d.text : escapeHtml(d.text)}</div>
                    </div>
                </div>`;
            });
            if (!html) html = '<div class="empty-chat">✨ No messages. Type /help</div>';
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
            
            // Attach shift+click listeners to messages
            document.querySelectorAll('.message').forEach(msgDiv => {
                msgDiv.addEventListener('click', async (e) => {
                    if (e.shiftKey) {
                        e.stopPropagation();
                        const msgId = msgDiv.dataset.msgId;
                        const author = msgDiv.dataset.msgAuthor;
                        const text = msgDiv.dataset.msgText;
                        // Fetch full message data to check permissions
                        const docSnap = await db.collection("channels").doc(channelId).collection("messages").doc(msgId).get();
                        if (!docSnap.exists) return;
                        const msgData = docSnap.data();
                        const canDel = canDelete(msgData);
                        // Show custom action menu
                        const existingMenu = msgDiv.querySelector('.message-actions');
                        if (existingMenu) existingMenu.remove();
                        const actionMenu = document.createElement('div');
                        actionMenu.className = 'message-actions';
                        actionMenu.innerHTML = `
                            <button class="action-btn reply" title="Reply"><i class="fas fa-reply"></i> Reply</button>
                            ${canDel ? `<button class="action-btn delete" title="Delete"><i class="fas fa-trash"></i> Delete</button>` : ''}
                        `;
                        msgDiv.style.position = 'relative';
                        msgDiv.appendChild(actionMenu);
                        actionMenu.querySelector('.reply')?.addEventListener('click', (e2) => {
                            e2.stopPropagation();
                            setReplyTo(msgId, author, text);
                            actionMenu.remove();
                        });
                        actionMenu.querySelector('.delete')?.addEventListener('click', async (e2) => {
                            e2.stopPropagation();
                            await deleteMessage(channelId, msgId);
                            actionMenu.remove();
                        });
                        // Remove menu after 3 seconds or click outside
                        setTimeout(() => { if(actionMenu.parentNode) actionMenu.remove(); }, 4000);
                        const removeOnClick = (e3) => { if (!actionMenu.contains(e3.target)) actionMenu.remove(); document.removeEventListener('click', removeOnClick); };
                        document.addEventListener('click', removeOnClick);
                    }
                });
            });
        });
    }
    
    // Admin panel - toggle bot delete permission
    async function openAdminPanel() {
        if (!isAdmin && !isOwner) { showToast("Admin only"); return; }
        const modal = document.getElementById('adminModal');
        document.getElementById('toggleBotPermBtn').onclick = () => {
            botDeletePermission = !botDeletePermission;
            showToast(`Bot delete permission: ${botDeletePermission ? "ON" : "OFF"}`);
            modal.classList.remove('active');
        };
        modal.classList.add('active');
    }
    
    // Auth & UI
    function updateUI(user) {
        const authOverlay = document.querySelector('#authOverlay');
        if (user) {
            authOverlay.style.display = 'none';
            document.getElementById('sidebarName').innerText = user.displayName || user.email;
            document.getElementById('sidebarAvatar').src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || 'User')}&background=6366f1&color=fff`;
            isAdmin = (user.email === OWNER_EMAIL); // owner is also admin
            isOwner = (user.email === OWNER_EMAIL);
            document.getElementById('adminIndicator').classList.toggle('hidden', !isAdmin);
            document.getElementById('ownerIndicator').classList.toggle('hidden', !isOwner);
            renderSidebar();
            loadMessagesForChannel(currentChannelId);
        } else {
            authOverlay.style.display = 'flex';
            if (unsubscribeMessages) unsubscribeMessages();
            document.getElementById('messagesContainer').innerHTML = '<div class="empty-chat">✨ Sign in to chat</div>';
            document.getElementById('sidebarName').innerText = 'Guest';
        }
    }
    
    async function signIn() { const provider = new firebase.auth.GoogleAuthProvider(); try { await auth.signInWithPopup(provider); showToast("Welcome!"); } catch(e) { showToast("Sign in failed"); } }
    async function signOut() { await auth.signOut(); updateUI(null); showToast("Signed out"); }
    
    document.getElementById('signInBtn')?.addEventListener('click', signIn);
    document.getElementById('signOutTopBtn')?.addEventListener('click', signOut);
    document.getElementById('signOutSidebarBtn')?.addEventListener('click', signOut);
    document.getElementById('sendBtn')?.addEventListener('click', sendMessage);
    document.getElementById('messageInput')?.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    document.getElementById('mobileMenuBtn')?.addEventListener('click', () => document.getElementById('sidebarPanel').classList.add('mobile-open'));
    document.getElementById('closeSidebarBtn')?.addEventListener('click', () => document.getElementById('sidebarPanel').classList.remove('mobile-open'));
    document.getElementById('adminPanelBtn')?.addEventListener('click', openAdminPanel);
    document.getElementById('closeAdminModal')?.addEventListener('click', () => document.getElementById('adminModal').classList.remove('active'));
    document.getElementById('cancelReplyBtn')?.addEventListener('click', cancelReply);
    document.querySelectorAll('.modal').forEach(modal => { modal.addEventListener('click', (e) => { if(e.target === modal) modal.classList.remove('active'); }); });
    
    auth.onAuthStateChanged(user => { currentUser = user; updateUI(user); });
</script>
</body>
</html>
