<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Stonks · Discord-like Chat Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #1e1f22;
            color: #dbdee1;
            height: 100vh;
            overflow: hidden;
        }

        /* Main Layout */
        .app {
            display: flex;
            height: 100vh;
        }

        /* Server Bar */
        .servers-bar {
            width: 72px;
            background: #1e1f22;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 8px;
            overflow-y: auto;
            border-right: 1px solid #2b2d31;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2b2d31;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            color: #dbdee1;
            font-size: 24px;
            overflow: hidden;
        }

        .server-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .server-icon:hover {
            border-radius: 16px;
            background: #5865f2;
        }

        .server-icon.active {
            border-radius: 16px;
            background: #5865f2;
        }

        .server-icon.add-server {
            background: #2b2d31;
            color: #23a55a;
        }

        .server-icon.add-server:hover {
            background: #23a55a;
            color: white;
        }

        /* Channel Sidebar */
        .channel-sidebar {
            width: 240px;
            background: #2b2d31;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1e1f22;
            transition: transform 0.3s ease;
        }

        .server-header {
            padding: 16px;
            border-bottom: 1px solid #1e1f22;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .server-header:hover {
            background: #32353b;
        }

        .categories-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .category {
            margin-bottom: 16px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #949ba4;
            text-transform: uppercase;
        }

        .category-header:hover {
            color: #dbdee1;
        }

        .category-actions {
            display: none;
            gap: 4px;
        }

        .category-header:hover .category-actions {
            display: flex;
        }

        .category-actions button {
            background: none;
            border: none;
            color: #949ba4;
            cursor: pointer;
            font-size: 10px;
            padding: 2px 4px;
        }

        .channel-item {
            padding: 6px 8px 6px 28px;
            margin: 1px 0;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #949ba4;
        }

        .channel-item:hover {
            background: #404249;
            color: #dbdee1;
        }

        .channel-item.active {
            background: #404249;
            color: #dbdee1;
        }

        .voice-channel {
            background: rgba(88, 101, 242, 0.1);
            border-left: 2px solid #5865f2;
        }

        .voice-users {
            margin-left: 24px;
            margin-top: 4px;
            padding-left: 8px;
            border-left: 2px solid #5865f2;
        }

        .voice-user {
            padding: 4px 8px;
            margin: 2px 0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #313338;
        }

        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid #1e1f22;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-profile-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e1f22;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .user-profile-btn img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 12px;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .message:hover {
            background: #32353b;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .message-content {
            flex: 1;
        }

        .message-author {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .message-time {
            font-size: 10px;
            color: #949ba4;
            margin-left: 8px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        /* Voice Overlay / Black Screen */
        .voice-overlay {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 280px;
            background: #1e1f22;
            border-radius: 12px;
            border: 1px solid #2b2d31;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .voice-overlay-header {
            padding: 12px;
            background: #2b2d31;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .voice-overlay-user {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .voice-overlay-user img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 12px;
        }

        .mic-control {
            margin-top: 12px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .mic-control button {
            background: #2b2d31;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        /* Black Screen for Voice */
        .voice-black-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        .voice-black-screen img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #5865f2;
        }

        .voice-black-screen.hidden {
            display: none;
        }

        /* Input Area */
        .input-area {
            padding: 16px;
            background: #313338;
            border-top: 1px solid #1e1f22;
        }

        .input-row {
            display: flex;
            gap: 12px;
            background: #383a40;
            border-radius: 8px;
            padding: 8px 16px;
        }

        .input-row input {
            flex: 1;
            background: none;
            border: none;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .send-btn {
            background: #5865f2;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2b2d31;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 16px;
            border-bottom: 1px solid #1e1f22;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            background: #1e1f22;
            border: 1px solid #383a40;
            border-radius: 4px;
            color: white;
        }

        button {
            background: #5865f2;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        button.danger {
            background: #da373c;
        }

        button.success {
            background: #23a55a;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1f22;
            padding: 8px 16px;
            border-radius: 8px;
            z-index: 3000;
            display: none;
        }

        .toast.show {
            display: block;
        }

        /* Mobile Menu Button */
        .mobile-menu-btn {
            display: none;
            background: #2b2d31;
            border: none;
            color: white;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 12px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .servers-bar {
                width: 56px;
            }
            
            .channel-sidebar {
                position: fixed;
                left: -240px;
                top: 0;
                height: 100%;
                z-index: 1500;
                transition: left 0.3s;
            }
            
            .channel-sidebar.mobile-open {
                left: 56px;
            }
            
            .mobile-menu-btn {
                display: block;
            }
            
            .voice-overlay {
                width: 240px;
                bottom: 10px;
                right: 10px;
            }
            
            .voice-black-screen img {
                width: 80px;
                height: 80px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1f22;
        }

        ::-webkit-scrollbar-thumb {
            background: #2b2d31;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #404249;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Server List -->
    <div class="servers-bar" id="serversBar">
        <div class="server-icon add-server" id="createServerBtn">
            <i class="fas fa-plus"></i>
            <div class="server-name-tooltip">Create Server</div>
        </div>
    </div>

    <!-- Channel Sidebar -->
    <div class="channel-sidebar" id="channelSidebar">
        <div class="server-header" id="serverHeader">
            <span id="currentServerName">Select a server</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="categories-container" id="categoriesContainer">
            <div style="text-align: center; padding: 20px; color: #949ba4;">
                Create or join a server to start chatting
            </div>
        </div>
        <div style="padding: 12px; display: flex; gap: 8px;">
            <button id="createChannelBtn" style="flex: 1; background: #23a55a;">+ Channel</button>
            <button id="createCategoryBtn" style="flex: 1; background: #5865f2;">+ Category</button>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
        <div class="chat-header">
            <div style="display: flex; align-items: center;">
                <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
                <div class="channel-info">
                    <i class="fas fa-hashtag"></i>
                    <span id="currentChannelName"># general</span>
                </div>
            </div>
            <div class="user-controls">
                <div class="user-profile-btn" id="userProfileBtn">
                    <img id="userAvatar" src="" alt="">
                    <span id="userDisplayName"></span>
                </div>
            </div>
        </div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="input-area">
            <div class="input-row">
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Voice Black Screen -->
    <div id="voiceBlackScreen" class="voice-black-screen hidden">
        <img id="blackScreenAvatar" src="" alt="">
        <h3 id="blackScreenName">Voice Connected</h3>
        <div class="mic-control">
            <button id="blackScreenMicBtn"><i class="fas fa-microphone"></i> Mute</button>
            <button id="blackScreenLeaveBtn" class="danger">Leave</button>
        </div>
    </div>

    <!-- Voice Overlay -->
    <div class="voice-overlay" id="voiceOverlay" style="display: none;">
        <div class="voice-overlay-header">
            <span><i class="fas fa-microphone"></i> Voice Connected</span>
            <button id="leaveVoiceBtn" style="background: #da373c; padding: 4px 8px;">Leave</button>
        </div>
        <div class="voice-overlay-user">
            <img id="voiceUserAvatar" src="" alt="">
            <span id="voiceUserName"></span>
            <div class="mic-control">
                <button id="toggleMicBtn"><i class="fas fa-microphone"></i> Mute</button>
            </div>
        </div>
    </div>
</div>

<!-- Modals -->
<div id="serverModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Create Server</h3>
            <button onclick="closeModal('serverModal')">✕</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Server Name</label>
                <input type="text" id="serverName" placeholder="My Server">
            </div>
            <div class="form-group">
                <label>Server Icon URL (optional)</label>
                <input type="text" id="serverIcon" placeholder="https://...">
            </div>
            <button onclick="createServer()">Create Server</button>
        </div>
    </div>
</div>

<div id="joinServerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Join Server</h3>
            <button onclick="closeModal('joinServerModal')">✕</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Server ID</label>
                <input type="text" id="joinServerId" placeholder="Enter server ID">
            </div>
            <button onclick="joinServer()">Join Server</button>
        </div>
    </div>
</div>

<div id="channelModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Create Channel</h3>
            <button onclick="closeModal('channelModal')">✕</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Channel Type</label>
                <select id="channelType">
                    <option value="text">Text Channel</option>
                    <option value="voice">Voice Channel</option>
                </select>
            </div>
            <div class="form-group">
                <label>Channel Name</label>
                <input type="text" id="channelName" placeholder="new-channel">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="categorySelect"></select>
            </div>
            <button onclick="createChannel()">Create Channel</button>
        </div>
    </div>
</div>

<div id="profileModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Edit Profile</h3>
            <button onclick="closeModal('profileModal')">✕</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Display Name</label>
                <input type="text" id="profileDisplayName">
            </div>
            <div class="form-group">
                <label>Avatar URL</label>
                <input type="text" id="profileAvatar" placeholder="https://...">
            </div>
            <button onclick="updateProfile()">Save Changes</button>
        </div>
    </div>
</div>

<div id="categoryModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Create Category</h3>
            <button onclick="closeModal('categoryModal')">✕</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Category Name</label>
                <input type="text" id="categoryName" placeholder="GENERAL">
            </div>
            <button onclick="createNewCategory()">Create Category</button>
        </div>
    </div>
</div>

<div id="editCategoryModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Edit Category</h3>
            <button onclick="closeModal('editCategoryModal')">✕</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Category Name</label>
                <input type="text" id="editCategoryName">
            </div>
            <button onclick="saveCategoryEdit()">Save Changes</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc",
        authDomain: "vertexpaste.firebaseapp.com",
        projectId: "vertexpaste",
        storageBucket: "vertexpaste.firebasestorage.app",
        messagingSenderId: "255275350380",
        appId: "1:255275350380:web:7be4e8add2cb5b04045b49"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Global State
    let currentUser = null;
    let currentServer = null;
    let currentChannel = null;
    let currentVoiceChannel = null;
    let mediaStream = null;
    let isMuted = false;
    let currentEditingCategory = null;
    const CO_OWNER_EMAIL = "defnot67kid@gmail.com";

    // Helper Functions
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function closeModal(modalId) {
        document.getElementById(modalId).classList.remove('active');
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Load Servers
    async function loadServers() {
        if (!currentUser) return;
        
        const serversSnapshot = await db.collection('users').doc(currentUser.uid).collection('servers').get();
        const serversBar = document.getElementById('serversBar');
        
        const addBtn = serversBar.querySelector('.add-server');
        serversBar.innerHTML = '';
        serversBar.appendChild(addBtn);
        
        for (const doc of serversSnapshot.docs) {
            const serverDoc = await db.collection('servers').doc(doc.id).get();
            const server = serverDoc.data();
            
            if (server) {
                const serverIcon = document.createElement('div');
                serverIcon.className = 'server-icon';
                if (currentServer && currentServer.id === doc.id) serverIcon.classList.add('active');
                serverIcon.innerHTML = server.icon ? 
                    `<img src="${server.icon}" alt="${server.name}">` : 
                    `<i class="fas fa-server"></i>`;
                serverIcon.onclick = () => switchServer(doc.id, server);
                serversBar.appendChild(serverIcon);
            }
        }
        
        const joinBtn = document.createElement('div');
        joinBtn.className = 'server-icon add-server';
        joinBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i>';
        joinBtn.onclick = () => document.getElementById('joinServerModal').classList.add('active');
        serversBar.appendChild(joinBtn);
    }

    // Switch Server
    async function switchServer(serverId, serverData) {
        currentServer = { id: serverId, ...serverData };
        document.getElementById('currentServerName').textContent = serverData.name;
        
        const categoriesSnapshot = await db.collection('servers').doc(serverId).collection('categories').orderBy('order').get();
        const container = document.getElementById('categoriesContainer');
        container.innerHTML = '';
        
        for (const catDoc of categoriesSnapshot.docs) {
            const category = catDoc.data();
            const channelsSnapshot = await db.collection('servers').doc(serverId).collection('categories').doc(catDoc.id).collection('channels').get();
            
            const categoryDiv = document.createElement('div');
            categoryDiv.className = 'category';
            categoryDiv.innerHTML = `
                <div class="category-header">
                    <span>${escapeHtml(category.name)}</span>
                    <div class="category-actions">
                        <button onclick="editCategory('${catDoc.id}', '${escapeHtml(category.name)}')"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteCategory('${catDoc.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
                <div class="channels-container" id="channels-${catDoc.id}"></div>
            `;
            
            const channelsContainer = categoryDiv.querySelector(`.channels-container`);
            
            for (const chDoc of channelsSnapshot.docs) {
                const channel = chDoc.data();
                const channelDiv = document.createElement('div');
                channelDiv.className = `channel-item ${channel.type === 'voice' ? 'voice-channel' : ''}`;
                channelDiv.innerHTML = `
                    <i class="fas fa-${channel.type === 'voice' ? 'volume-up' : 'hashtag'}"></i>
                    ${escapeHtml(channel.name)}
                `;
                channelDiv.onclick = () => {
                    if (channel.type === 'text') {
                        switchChannel(chDoc.id, channel);
                    } else if (channel.type === 'voice') {
                        joinVoiceChannel(chDoc.id, channel);
                    }
                };
                
                channelsContainer.appendChild(channelDiv);
            }
            
            container.appendChild(categoryDiv);
        }
    }

    // Switch Text Channel
    let currentChannelListener = null;
    
    async function switchChannel(channelId, channelData) {
        currentChannel = { id: channelId, ...channelData };
        document.getElementById('currentChannelName').textContent = `# ${channelData.name}`;
        
        const messagesSnapshot = await db.collection('servers')
            .doc(currentServer.id)
            .collection('channels')
            .doc(channelId)
            .collection('messages')
            .orderBy('timestamp', 'asc')
            .limit(100)
            .get();
        
        const container = document.getElementById('messagesContainer');
        container.innerHTML = '';
        
        const messages = [];
        messagesSnapshot.forEach(doc => {
            messages.push({ id: doc.id, ...doc.data() });
        });
        
        messages.reverse().forEach(msg => {
            const messageDiv = createMessageElement(msg);
            container.appendChild(messageDiv);
        });
        
        if (currentChannelListener) currentChannelListener();
        currentChannelListener = db.collection('servers')
            .doc(currentServer.id)
            .collection('channels')
            .doc(channelId)
            .collection('messages')
            .orderBy('timestamp', 'asc')
            .onSnapshot(snapshot => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        const msg = change.doc.data();
                        const messageDiv = createMessageElement(msg);
                        container.appendChild(messageDiv);
                        container.scrollTop = container.scrollHeight;
                    }
                });
            });
        
        container.scrollTop = container.scrollHeight;
    }
    
    function createMessageElement(msg) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message';
        messageDiv.innerHTML = `
            <img src="${msg.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(msg.author)}" class="message-avatar" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(msg.author)}'">
            <div class="message-content">
                <div class="message-author">
                    ${escapeHtml(msg.author)}
                    <span class="message-time">${msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString() : 'Just now'}</span>
                </div>
                <div class="message-text">${escapeHtml(msg.text)}</div>
            </div>
        `;
        return messageDiv;
    }

    // Join Voice Channel
    async function joinVoiceChannel(channelId, channelData) {
        if (currentVoiceChannel) {
            await leaveVoiceChannel();
        }
        
        currentVoiceChannel = { id: channelId, ...channelData };
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaStream = stream;
            isMuted = false;
            
            // Show black screen
            const blackScreen = document.getElementById('voiceBlackScreen');
            document.getElementById('blackScreenAvatar').src = currentUser.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentUser.displayName);
            document.getElementById('blackScreenName').textContent = `Voice Channel: ${channelData.name}`;
            blackScreen.classList.remove('hidden');
            
            // Show overlay
            document.getElementById('voiceOverlay').style.display = 'block';
            document.getElementById('voiceUserAvatar').src = currentUser.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentUser.displayName);
            document.getElementById('voiceUserName').textContent = currentUser.displayName;
            
            await db.collection('servers')
                .doc(currentServer.id)
                .collection('voiceChannels')
                .doc(channelId)
                .collection('users')
                .doc(currentUser.uid)
                .set({
                    uid: currentUser.uid,
                    name: currentUser.displayName,
                    avatar: currentUser.photoURL,
                    muted: false,
                    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
            loadVoiceUsers(channelId);
            showToast(`Joined ${channelData.name}`);
        } catch (err) {
            console.error(err);
            showToast('Microphone permission denied');
        }
    }

    // Load Voice Users
    let voiceUsersListener = null;
    
    function loadVoiceUsers(channelId) {
        if (voiceUsersListener) voiceUsersListener();
        
        voiceUsersListener = db.collection('servers')
            .doc(currentServer.id)
            .collection('voiceChannels')
            .doc(channelId)
            .collection('users')
            .onSnapshot(snapshot => {
                const count = snapshot.size;
                const voiceChannelElement = document.querySelector(`.channel-item:has(i.fa-volume-up)`);
                if (voiceChannelElement) {
                    let usersContainer = voiceChannelElement.parentElement.querySelector('.voice-users');
                    if (!usersContainer) {
                        usersContainer = document.createElement('div');
                        usersContainer.className = 'voice-users';
                        voiceChannelElement.parentElement.appendChild(usersContainer);
                    }
                    usersContainer.innerHTML = '';
                    snapshot.forEach(doc => {
                        const user = doc.data();
                        const userDiv = document.createElement('div');
                        userDiv.className = 'voice-user';
                        userDiv.innerHTML = `
                            <img src="${user.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name)}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}'">
                            <span>${escapeHtml(user.name)}</span>
                            <i class="fas fa-${user.muted ? 'microphone-slash' : 'microphone'}" style="margin-left: auto; font-size: 12px;"></i>
                        `;
                        usersContainer.appendChild(userDiv);
                    });
                }
            });
    }

    // Leave Voice Channel
    async function leaveVoiceChannel() {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        
        if (currentVoiceChannel && currentServer) {
            await db.collection('servers')
                .doc(currentServer.id)
                .collection('voiceChannels')
                .doc(currentVoiceChannel.id)
                .collection('users')
                .doc(currentUser.uid)
                .delete();
        }
        
        if (voiceUsersListener) voiceUsersListener();
        
        currentVoiceChannel = null;
        document.getElementById('voiceOverlay').style.display = 'none';
        document.getElementById('voiceBlackScreen').classList.add('hidden');
        showToast('Left voice channel');
    }

    // Toggle Mic
    function toggleMic() {
        if (mediaStream) {
            const audioTrack = mediaStream.getAudioTracks()[0];
            if (audioTrack) {
                isMuted = !isMuted;
                audioTrack.enabled = !isMuted;
                
                const micIcon = document.querySelector('#toggleMicBtn i, #blackScreenMicBtn i');
                const btnText = isMuted ? 'Unmute' : 'Mute';
                document.getElementById('toggleMicBtn').innerHTML = isMuted ? 
                    '<i class="fas fa-microphone-slash"></i> Unmute' : 
                    '<i class="fas fa-microphone"></i> Mute';
                document.getElementById('blackScreenMicBtn').innerHTML = isMuted ? 
                    '<i class="fas fa-microphone-slash"></i> Unmute' : 
                    '<i class="fas fa-microphone"></i> Mute';
                
                if (currentVoiceChannel) {
                    db.collection('servers')
                        .doc(currentServer.id)
                        .collection('voiceChannels')
                        .doc(currentVoiceChannel.id)
                        .collection('users')
                        .doc(currentUser.uid)
                        .update({ muted: isMuted });
                }
            }
        }
    }

    // Create Server
    async function createServer() {
        const name = document.getElementById('serverName').value.trim();
        const icon = document.getElementById('serverIcon').value.trim();
        
        if (!name) {
            showToast('Server name required');
            return;
        }
        
        const serverRef = await db.collection('servers').add({
            name: name,
            icon: icon || null,
            ownerId: currentUser.uid,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        await db.collection('users').doc(currentUser.uid).collection('servers').doc(serverRef.id).set({
            joinedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        await db.collection('servers').doc(serverRef.id).collection('categories').add({
            name: 'GENERAL',
            order: 0
        });
        
        closeModal('serverModal');
        document.getElementById('serverName').value = '';
        document.getElementById('serverIcon').value = '';
        await loadServers();
        await switchServer(serverRef.id, { name: name, icon: icon });
        showToast('Server created!');
    }

    // Join Server
    async function joinServer() {
        const serverId = document.getElementById('joinServerId').value.trim();
        
        if (!serverId) {
            showToast('Server ID required');
            return;
        }
        
        const serverDoc = await db.collection('servers').doc(serverId).get();
        if (!serverDoc.exists) {
            showToast('Server not found');
            return;
        }
        
        await db.collection('users').doc(currentUser.uid).collection('servers').doc(serverId).set({
            joinedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        closeModal('joinServerModal');
        document.getElementById('joinServerId').value = '';
        await loadServers();
        showToast('Joined server!');
    }

    // Create Channel
    async function createChannel() {
        const type = document.getElementById('channelType').value;
        const name = document.getElementById('channelName').value.trim();
        const categoryId = document.getElementById('categorySelect').value;
        
        if (!name || !categoryId) {
            showToast('Channel name and category required');
            return;
        }
        
        await db.collection('servers')
            .doc(currentServer.id)
            .collection('categories')
            .doc(categoryId)
            .collection('channels')
            .add({
                name: name,
                type: type,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        
        closeModal('channelModal');
        document.getElementById('channelName').value = '';
        await switchServer(currentServer.id, currentServer);
        showToast('Channel created!');
    }

    // Create Category
    async function createNewCategory() {
        const name = document.getElementById('categoryName').value.trim();
        
        if (!name) {
            showToast('Category name required');
            return;
        }
        
        const categoriesCount = await db.collection('servers').doc(currentServer.id).collection('categories').get();
        
        await db.collection('servers')
            .doc(currentServer.id)
            .collection('categories')
            .add({
                name: name.toUpperCase(),
                order: categoriesCount.size
            });
        
        closeModal('categoryModal');
        document.getElementById('categoryName').value = '';
        await switchServer(currentServer.id, currentServer);
        showToast('Category created!');
    }

    // Edit Category
    function editCategory(catId, catName) {
        currentEditingCategory = catId;
        document.getElementById('editCategoryName').value = catName;
        document.getElementById('editCategoryModal').classList.add('active');
    }
    
    async function saveCategoryEdit() {
        const newName = document.getElementById('editCategoryName').value.trim();
        if (!newName || !currentEditingCategory) return;
        
        await db.collection('servers')
            .doc(currentServer.id)
            .collection('categories')
            .doc(currentEditingCategory)
            .update({ name: newName.toUpperCase() });
        
        closeModal('editCategoryModal');
        await switchServer(currentServer.id, currentServer);
        showToast('Category updated!');
    }
    
    // Delete Category
    async function deleteCategory(catId) {
        if (!confirm('Delete this category and all channels inside it?')) return;
        
        const channels = await db.collection('servers').doc(currentServer.id).collection('categories').doc(catId).collection('channels').get();
        for (const ch of channels.docs) {
            await ch.ref.delete();
        }
        await db.collection('servers').doc(currentServer.id).collection('categories').doc(catId).delete();
        await switchServer(currentServer.id, currentServer);
        showToast('Category deleted');
    }

    // Update Profile
    async function updateProfile() {
        const displayName = document.getElementById('profileDisplayName').value.trim();
        const avatar = document.getElementById('profileAvatar').value.trim();
        
        if (!displayName) {
            showToast('Display name required');
            return;
        }
        
        await currentUser.updateProfile({
            displayName: displayName,
            photoURL: avatar || null
        });
        
        await db.collection('users').doc(currentUser.uid).set({
            displayName: displayName,
            photoURL: avatar,
            email: currentUser.email
        }, { merge: true });
        
        document.getElementById('userDisplayName').textContent = displayName;
        document.getElementById('userAvatar').src = avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(displayName);
        
        closeModal('profileModal');
        showToast('Profile updated!');
    }

    // Send Message
    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        
        if (!text || !currentChannel || !currentServer) return;
        
        await db.collection('servers')
            .doc(currentServer.id)
            .collection('channels')
            .doc(currentChannel.id)
            .collection('messages')
            .add({
                text: text,
                author: currentUser.displayName,
                avatar: currentUser.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentUser.displayName),
                uid: currentUser.uid,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        
        input.value = '';
    }

    // Load Categories into Select
    async function loadCategorySelect() {
        if (!currentServer) return;
        
        const categoriesSnapshot = await db.collection('servers').doc(currentServer.id).collection('categories').get();
        const select = document.getElementById('categorySelect');
        select.innerHTML = '';
        
        categoriesSnapshot.forEach(doc => {
            const option = document.createElement('option');
            option.value = doc.id;
            option.textContent = doc.data().name;
            select.appendChild(option);
        });
    }

    // Toggle Mobile Sidebar
    function toggleMobileSidebar() {
        const sidebar = document.getElementById('channelSidebar');
        sidebar.classList.toggle('mobile-open');
    }
    
    function closeMobileSidebar() {
        const sidebar = document.getElementById('channelSidebar');
        sidebar.classList.remove('mobile-open');
    }

    // Auth State
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('userDisplayName').textContent = user.displayName || user.email;
            document.getElementById('userAvatar').src = user.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.displayName || 'User');
            document.getElementById('profileDisplayName').value = user.displayName || '';
            document.getElementById('profileAvatar').value = user.photoURL || '';
            
            await loadServers();
        } else {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider);
        }
    });

    // Event Listeners
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
    document.getElementById('createServerBtn').addEventListener('click', () => {
        document.getElementById('serverModal').classList.add('active');
    });
    document.getElementById('createChannelBtn').addEventListener('click', async () => {
        await loadCategorySelect();
        document.getElementById('channelModal').classList.add('active');
    });
    document.getElementById('createCategoryBtn').addEventListener('click', () => {
        document.getElementById('categoryModal').classList.add('active');
    });
    document.getElementById('userProfileBtn').addEventListener('click', () => {
        document.getElementById('profileModal').classList.add('active');
    });
    document.getElementById('leaveVoiceBtn').addEventListener('click', leaveVoiceChannel);
    document.getElementById('toggleMicBtn').addEventListener('click', toggleMic);
    document.getElementById('blackScreenMicBtn').addEventListener('click', toggleMic);
    document.getElementById('blackScreenLeaveBtn').addEventListener('click', leaveVoiceChannel);
    document.getElementById('mobileMenuBtn').addEventListener('click', toggleMobileSidebar);
    
    // Close sidebar when clicking outside on mobile
    document.addEventListener('click', (e) => {
        const sidebar = document.getElementById('channelSidebar');
        const menuBtn = document.getElementById('mobileMenuBtn');
        if (window.innerWidth <= 768 && sidebar.classList.contains('mobile-open')) {
            if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
                closeMobileSidebar();
            }
        }
    });
    
    // Make functions global for onclick handlers
    window.closeModal = closeModal;
    window.createServer = createServer;
    window.joinServer = joinServer;
    window.createChannel = createChannel;
    window.createNewCategory = createNewCategory;
    window.updateProfile = updateProfile;
    window.editCategory = editCategory;
    window.saveCategoryEdit = saveCategoryEdit;
    window.deleteCategory = deleteCategory;
</script>
</body>
</html>
