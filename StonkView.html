<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Stonks Hub · Discord-like Servers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #e2e8f0; height: 100vh; overflow: hidden; }
        .app { display: flex; height: 100%; width: 100%; overflow: hidden; }

        /* SERVER LIST (leftmost) */
        .server-list {
            width: 72px;
            background: #0f0f14;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 16px 0;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .server-icon {
            width: 48px;
            height: 48px;
            background: #1e293b;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            color: #fbbf24;
            font-weight: bold;
        }
        .server-icon.active {
            border-radius: 16px;
            background: linear-gradient(135deg, #fbbf24, #ef4444);
            color: white;
        }
        .server-icon:hover { border-radius: 16px; background: #334155; }
        .add-server-btn {
            background: #1f2937;
            border: 2px dashed #fbbf24;
            color: #fbbf24;
        }
        .server-tooltip {
            position: absolute;
            left: 70px;
            background: #000c;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 100;
            display: none;
        }
        .server-icon:hover .server-tooltip { display: block; }

        /* SIDEBAR (channels & categories) */
        .sidebar {
            width: 260px;
            background: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
        .server-name-header { font-weight: 700; font-size: 1rem; }
        .server-actions { display: flex; gap: 8px; }
        .server-actions button { background: #1f2937; border: none; color: #fbbf24; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
        .category-group { margin: 12px 0; }
        .category-title { font-size: 0.7rem; text-transform: uppercase; color: #9ca3af; padding: 6px 16px; display: flex; justify-content: space-between; cursor: pointer; }
        .add-channel-btn { background: none; border: none; color: #fbbf24; cursor: pointer; font-size: 12px; }
        .channel-item { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 32px; border-radius: 8px; cursor: pointer; color: #9ca3af; font-size: 0.85rem; }
        .channel-item.active { background: #1f2937; color: #fbbf24; }
        .channel-item:hover { background: #1f2937; }

        /* CHAT AREA */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f172a;
            overflow: hidden;
            min-width: 0;
        }
        .chat-header { padding: 12px 20px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; background: #0f172a; }
        .channel-info { display: flex; align-items: center; gap: 8px; }
        .invite-btn { background: #1e293b; border: none; padding: 6px 14px; border-radius: 20px; color: #fbbf24; cursor: pointer; font-size: 0.8rem; }
        .messages-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message { display: flex; gap: 10px; max-width: 100%; }
        .message-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .message-content { background: #1e293b; padding: 8px 14px; border-radius: 18px; word-break: break-word; flex: 1; }
        .message-author { font-weight: 600; font-size: 0.75rem; display: flex; gap: 6px; align-items: baseline; }
        .message-time { font-size: 0.6rem; color: #94a3b8; }
        .message-text { font-size: 0.85rem; margin-top: 4px; }
        .system-message .message-content { background: #1a1f2e; border-left: 3px solid #fbbf24; }

        .input-area { padding: 12px; border-top: 1px solid #1e293b; background: #0f172a; display: flex; gap: 10px; }
        .input-area input { flex: 1; background: #1e293b; border: none; padding: 12px 16px; border-radius: 30px; color: white; outline: none; }
        .input-area button { background: #fbbf24; border: none; padding: 0 20px; border-radius: 30px; font-weight: bold; cursor: pointer; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #0f172a; border-radius: 28px; padding: 24px; width: 90%; max-width: 450px; border: 1px solid #334155; }
        .modal-content input, .modal-content select { background: #1e293b; border: none; padding: 10px; border-radius: 12px; color: white; width: 100%; margin: 8px 0; }
        .btn-gold { background: #fbbf24; color: #0f172a; border: none; padding: 8px 18px; border-radius: 30px; font-weight: bold; cursor: pointer; margin-top: 12px; }
        .btn-outline { background: transparent; border: 1px solid #fbbf24; color: #fbbf24; padding: 6px 14px; border-radius: 30px; cursor: pointer; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 8px 20px; border-radius: 40px; z-index: 3000; border-left: 3px solid #fbbf24; }
        .hidden { display: none; }
        .admin-badge, .owner-badge { font-size: 0.6rem; background: #ef4444; padding: 2px 8px; border-radius: 20px; margin-left: 6px; }
        .owner-badge { background: #fbbf24; color: black; }
        @media (max-width: 700px) { .server-list { width: 60px; } .sidebar { position: fixed; left: 0; top: 0; height: 100%; transform: translateX(-100%); z-index: 1100; } .sidebar.open { transform: translateX(0); } .overlay { position: fixed; inset: 0; background: #00000080; z-index: 1050; display: none; } .overlay.active { display: block; } }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .member-list { font-size: 12px; margin-top: 4px; color: #9ca3af; }
    </style>
</head>
<body>
<div class="app">
    <!-- SERVER LIST (leftmost bar) -->
    <div class="server-list" id="serverListContainer"></div>

    <!-- Sidebar (channels + categories) -->
    <div class="sidebar" id="sidebarPanel">
        <div class="sidebar-header">
            <div class="server-name-header" id="currentServerName">Loading...</div>
            <div class="server-actions">
                <button id="createCategoryBtn" title="Create Category"><i class="fas fa-folder-plus"></i></button>
                <button id="invitePeopleBtn" title="Invite"><i class="fas fa-user-plus"></i></button>
                <button id="deleteServerBtn" title="Delete Server" style="color:#ef4444;"><i class="fas fa-trash"></i></button>
            </div>
        </div>
        <div style="flex:1; overflow-y: auto;" id="channelsListContainer"></div>
        <div style="padding: 12px; border-top: 1px solid #1f2937; font-size: 12px;">
            <div><i class="fas fa-user"></i> <span id="userDisplay">Guest</span><span id="roleBadge"></span></div>
            <button id="signOutBtn" style="background: none; border: none; color: #fbbf24; margin-top: 6px; cursor: pointer;">Sign out</button>
        </div>
    </div>
    <div class="overlay" id="mobileOverlay"></div>

    <!-- CHAT AREA -->
    <div class="chat-area">
        <div class="chat-header">
            <div class="channel-info">
                <i class="fas fa-hashtag"></i>
                <span id="currentChannelName">general</span>
            </div>
            <button class="invite-btn" id="headerInviteBtn"><i class="fas fa-link"></i> Invite</button>
        </div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
    </div>
</div>

<!-- MODALS -->
<div id="createServerModal" class="modal"><div class="modal-content"><h3>Create New Server</h3><input type="text" id="newServerName" placeholder="Server name"><button id="confirmCreateServer" class="btn-gold">Create</button><button id="closeCreateModal" class="btn-outline" style="margin-top:8px;">Cancel</button></div></div>
<div id="createCategoryModal" class="modal"><div class="modal-content"><h3>New Category</h3><input type="text" id="categoryName" placeholder="Category name (e.g., GAMING)"><button id="confirmCreateCategory" class="btn-gold">Add Category</button><button id="closeCatModal" class="btn-outline">Cancel</button></div></div>
<div id="createChannelModal" class="modal"><div class="modal-content"><h3>New Channel</h3><input type="text" id="channelName" placeholder="Channel name"><select id="categorySelect"></select><button id="confirmCreateChannel" class="btn-gold">Create</button><button id="closeChanModal" class="btn-outline">Cancel</button></div></div>
<div id="inviteModal" class="modal"><div class="modal-content"><h3>Invite Link</h3><p>Share this code: <strong id="inviteCodeDisplay"></strong></p><p>Anyone with the code can join!</p><button id="closeInviteModal" class="btn-gold">Close</button></div></div>
<div id="joinServerModal" class="modal"><div class="modal-content"><h3>Join Server</h3><input type="text" id="joinCodeInput" placeholder="Paste invite code"><button id="confirmJoinServer" class="btn-gold">Join</button><button id="closeJoinModal" class="btn-outline">Cancel</button></div></div>

<div id="toastMsg" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc",
        authDomain: "vertexpaste.firebaseapp.com",
        projectId: "vertexpaste",
        storageBucket: "vertexpaste.firebasestorage.app",
        messagingSenderId: "255275350380",
        appId: "1:255275350380:web:7be4e8add2cb5b04045b49"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const OWNER_EMAIL = "defnot67kid@gmail.com";
    let currentUser = null;
    let currentServerId = null;
    let currentChannelId = null;
    let unsubscribeMessages = null;
    let isOwnerGlobal = false;

    // Helper
    function showToast(msg) { const t = document.getElementById('toastMsg'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    function escapeHtml(s) { return String(s).replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])); }

    // Fetch all servers user is member of OR owner (co-owner sees all)
    async function fetchUserServers() {
        if (!currentUser) return [];
        if (isOwnerGlobal) {
            const allServersSnap = await db.collection("servers").get();
            return allServersSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        } else {
            const memberSnap = await db.collection("serverMembers").where("userId", "==", currentUser.uid).get();
            const serverIds = memberSnap.docs.map(d => d.data().serverId);
            if (serverIds.length === 0) return [];
            const servers = await Promise.all(serverIds.map(id => db.collection("servers").doc(id).get()));
            return servers.filter(s => s.exists).map(s => ({ id: s.id, ...s.data() }));
        }
    }

    // Render server icons (left bar)
    async function renderServerList() {
        const servers = await fetchUserServers();
        const container = document.getElementById('serverListContainer');
        let html = '';
        for (const sv of servers) {
            html += `<div class="server-icon ${currentServerId === sv.id ? 'active' : ''}" data-server-id="${sv.id}">
                        <span>${sv.name.charAt(0).toUpperCase()}</span>
                        <div class="server-tooltip">${escapeHtml(sv.name)}</div>
                    </div>`;
        }
        html += `<div class="server-icon add-server-btn" id="addServerBtn"><i class="fas fa-plus"></i><div class="server-tooltip">Create Server</div></div>`;
        html += `<div class="server-icon" id="joinServerBtn"><i class="fas fa-sign-in-alt"></i><div class="server-tooltip">Join Server</div></div>`;
        container.innerHTML = html;
        document.querySelectorAll('.server-icon[data-server-id]').forEach(el => {
            el.addEventListener('click', () => switchServer(el.dataset.serverId));
        });
        document.getElementById('addServerBtn')?.addEventListener('click', () => document.getElementById('createServerModal').classList.add('active'));
        document.getElementById('joinServerBtn')?.addEventListener('click', () => document.getElementById('joinServerModal').classList.add('active'));
    }

    // Switch server: load structure and default channel
    async function switchServer(serverId) {
        if (unsubscribeMessages) unsubscribeMessages();
        currentServerId = serverId;
        const serverDoc = await db.collection("servers").doc(serverId).get();
        if (!serverDoc.exists) return;
        const serverData = serverDoc.data();
        document.getElementById('currentServerName').innerText = serverData.name || "Server";
        await loadServerChannels(serverId);
        renderServerList();
        closeSidebarMobile();
    }

    async function loadServerChannels(serverId) {
        const structRef = db.collection("serverStructure").doc(serverId);
        let struct = (await structRef.get()).data();
        if (!struct) {
            struct = { categories: [{ name: "TEXT CHANNELS", channels: [{ id: "general", name: "general" }] }] };
            await structRef.set(struct);
        }
        if (!currentChannelId || !struct.categories.some(c => c.channels.some(ch => ch.id === currentChannelId))) {
            currentChannelId = struct.categories[0]?.channels[0]?.id || "general";
        }
        renderSidebarChannels(struct);
        loadMessagesForChannel(currentServerId, currentChannelId);
        document.getElementById('currentChannelName').innerText = getChannelNameById(struct, currentChannelId) || currentChannelId;
    }

    function getChannelNameById(struct, chId) {
        for (const cat of struct.categories)
            for (const ch of cat.channels)
                if (ch.id === chId) return ch.name;
        return chId;
    }

    function renderSidebarChannels(struct) {
        const container = document.getElementById('channelsListContainer');
        let html = '';
        for (const cat of struct.categories) {
            html += `<div class="category-group">
                        <div class="category-title">
                            <span>${escapeHtml(cat.name)}</span>
                            <button class="add-channel-btn" data-category="${escapeHtml(cat.name)}"><i class="fas fa-plus-circle"></i></button>
                        </div>`;
            for (const ch of cat.channels) {
                html += `<div class="channel-item ${currentChannelId === ch.id ? 'active' : ''}" data-channel-id="${ch.id}">
                            <i class="fas fa-hashtag"></i> ${escapeHtml(ch.name)}
                         </div>`;
            }
            html += `</div>`;
        }
        container.innerHTML = html;
        document.querySelectorAll('.channel-item').forEach(el => {
            el.addEventListener('click', () => {
                const newId = el.dataset.channelId;
                if (currentChannelId !== newId) {
                    currentChannelId = newId;
                    loadMessagesForChannel(currentServerId, currentChannelId);
                    renderSidebarChannels(struct);
                    document.getElementById('currentChannelName').innerText = getChannelNameById(struct, currentChannelId);
                }
                closeSidebarMobile();
            });
        });
        document.querySelectorAll('.add-channel-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const categoryName = btn.dataset.category;
                openCreateChannelModal(categoryName);
            });
        });
    }

    async function loadMessagesForChannel(serverId, channelId) {
        const container = document.getElementById('messagesContainer');
        if (unsubscribeMessages) unsubscribeMessages();
        unsubscribeMessages = db.collection("servers").doc(serverId).collection("channels").doc(channelId).collection("messages")
            .orderBy("createdAt", "asc")
            .onSnapshot(snapshot => {
                let html = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    html += `<div class="message ${d.isBot ? 'system-message' : ''}">
                                <img src="${escapeHtml(d.photoURL || 'https://ui-avatars.com/api/?name=User')}" class="message-avatar">
                                <div class="message-content">
                                    <div class="message-author">${escapeHtml(d.displayName)}<span class="message-time">${d.createdAt ? new Date(d.createdAt.toDate()).toLocaleTimeString() : ''}</span></div>
                                    <div class="message-text">${escapeHtml(d.text)}</div>
                                </div>
                            </div>`;
                });
                if (!html) html = '<div class="empty-chat" style="text-align:center;color:#6b7280;">✨ No messages. Start chatting!</div>';
                container.innerHTML = html;
                container.scrollTop = container.scrollHeight;
            });
    }

    async function sendMessage() {
        if (!currentUser || !currentServerId || !currentChannelId) return;
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;
        await db.collection("servers").doc(currentServerId).collection("channels").doc(currentChannelId).collection("messages").add({
            text, uid: currentUser.uid, displayName: currentUser.displayName,
            photoURL: currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.displayName || 'User')}`,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(), isBot: false
        });
        input.value = '';
    }

    // Server creation (with automatic membership and owner)
    async function createServer(serverName) {
        if (!currentUser) return;
        const serverRef = db.collection("servers").doc();
        const serverId = serverRef.id;
        await serverRef.set({ name: serverName, ownerId: currentUser.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        await db.collection("serverMembers").doc().set({ serverId, userId: currentUser.uid, role: "owner" });
        await db.collection("serverStructure").doc(serverId).set({ categories: [{ name: "TEXT CHANNELS", channels: [{ id: "general", name: "general" }] }] });
        showToast(`Server "${serverName}" created!`);
        await switchServer(serverId);
        renderServerList();
    }

    // Delete server (only owner or global owner can delete, but STONKS HUB main server can't be deleted)
    async function deleteCurrentServer() {
        if (!currentServerId) return;
        const serverDoc = await db.collection("servers").doc(currentServerId).get();
        const serverData = serverDoc.data();
        if (serverData.name === "Stonks Hub") { showToast("❌ Cannot delete Stonks Hub (main server)!"); return; }
        const canDelete = isOwnerGlobal || (currentUser && serverData.ownerId === currentUser.uid);
        if (!canDelete) { showToast("Only server owner or global admin can delete."); return; }
        if (confirm(`Delete server "${serverData.name}" permanently?`)) {
            const membersSnap = await db.collection("serverMembers").where("serverId", "==", currentServerId).get();
            membersSnap.forEach(d => d.ref.delete());
            await db.collection("servers").doc(currentServerId).delete();
            await db.collection("serverStructure").doc(currentServerId).delete();
            showToast("Server deleted.");
            currentServerId = null;
            await renderServerList();
            // auto-select first available server
            const servers = await fetchUserServers();
            if (servers.length) await switchServer(servers[0].id);
            else { document.getElementById('currentServerName').innerText = "No Server"; document.getElementById('channelsListContainer').innerHTML = ""; }
        }
    }

    // Invite system: generate code
    async function generateInvite() {
        if (!currentServerId) return;
        const code = Math.random().toString(36).substring(2, 10).toUpperCase();
        await db.collection("invites").doc(code).set({ serverId: currentServerId, createdBy: currentUser.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        document.getElementById('inviteCodeDisplay').innerText = code;
        document.getElementById('inviteModal').classList.add('active');
    }

    async function joinWithCode(code) {
        const inviteDoc = await db.collection("invites").doc(code).get();
        if (!inviteDoc.exists) { showToast("Invalid invite code"); return; }
        const serverId = inviteDoc.data().serverId;
        const existing = await db.collection("serverMembers").where("serverId", "==", serverId).where("userId", "==", currentUser.uid).get();
        if (!existing.empty) { showToast("Already a member!"); return; }
        await db.collection("serverMembers").add({ serverId, userId: currentUser.uid, role: "member" });
        showToast("Joined server!");
        await renderServerList();
        await switchServer(serverId);
    }

    async function createCategory() {
        if (!currentServerId) return;
        const catName = document.getElementById('categoryName').value.trim();
        if (!catName) return;
        const structRef = db.collection("serverStructure").doc(currentServerId);
        const struct = (await structRef.get()).data() || { categories: [] };
        struct.categories.push({ name: catName, channels: [] });
        await structRef.set(struct);
        document.getElementById('createCategoryModal').classList.remove('active');
        document.getElementById('categoryName').value = '';
        loadServerChannels(currentServerId);
        showToast(`Category "${catName}" added`);
    }

    async function createChannel(categoryName, channelName) {
        if (!currentServerId || !channelName) return;
        const structRef = db.collection("serverStructure").doc(currentServerId);
        const struct = (await structRef.get()).data();
        const cat = struct.categories.find(c => c.name === categoryName);
        if (!cat) return;
        const newId = channelName.toLowerCase().replace(/\s/g, '-') + Date.now();
        cat.channels.push({ id: newId, name: channelName });
        await structRef.set(struct);
        loadServerChannels(currentServerId);
        showToast(`#${channelName} created`);
    }

    function openCreateChannelModal(categoryName) {
        document.getElementById('categorySelect').innerHTML = '';
        const select = document.getElementById('categorySelect');
        db.collection("serverStructure").doc(currentServerId).get().then(doc => {
            const struct = doc.data();
            struct.categories.forEach(c => { const opt = document.createElement('option'); opt.value = c.name; opt.innerText = c.name; select.appendChild(opt); });
            select.value = categoryName;
        });
        document.getElementById('createChannelModal').classList.add('active');
    }

    // sidebars mobile
    function openSidebarMobile() { document.getElementById('sidebarPanel').classList.add('open'); document.getElementById('mobileOverlay').classList.add('active'); }
    function closeSidebarMobile() { document.getElementById('sidebarPanel').classList.remove('open'); document.getElementById('mobileOverlay').classList.remove('active'); }

    // Auth UI
    function updateAuthUI(user) {
        const authOverlay = document.getElementById('authOverlay');
        if (user) {
            if (document.getElementById('authOverlay')) document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('userDisplay').innerText = user.displayName || user.email;
            const isOwner = (user.email === OWNER_EMAIL);
            isOwnerGlobal = isOwner;
            const roleSpan = document.getElementById('roleBadge');
            if (isOwner) roleSpan.innerHTML = '<span class="owner-badge">👑 GLOBAL OWNER</span>';
            else roleSpan.innerHTML = '';
            renderServerList().then(async () => {
                const servers = await fetchUserServers();
                if (servers.length > 0 && !currentServerId) await switchServer(servers[0].id);
                else if (servers.length === 0) { document.getElementById('currentServerName').innerText = "No servers"; }
            });
        } else {
            if (!document.getElementById('authOverlay')) {
                const div = document.createElement('div'); div.id = 'authOverlay'; div.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0f;z-index:9999;display:flex;align-items:center;justify-content:center;";
                div.innerHTML = `<div style="background:#1e293b;padding:30px;border-radius:28px;text-align:center;"><i class="fas fa-chart-line" style="font-size:48px;color:#fbbf24;"></i><h2>Stonks Hub</h2><p>Discord-like servers, categories, invites</p><button id="googleSignInBtn" style="background:#fbbf24;border:none;padding:12px 28px;border-radius:40px;margin-top:20px;font-weight:600;">Sign in with Google</button></div>`;
                document.body.appendChild(div);
                document.getElementById('googleSignInBtn')?.addEventListener('click', () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()));
            }
        }
    }

    // Event Listeners
    document.getElementById('sendBtn')?.addEventListener('click', sendMessage);
    document.getElementById('messageInput')?.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
    document.getElementById('signOutBtn')?.addEventListener('click', () => auth.signOut());
    document.getElementById('createCategoryBtn')?.addEventListener('click', () => document.getElementById('createCategoryModal').classList.add('active'));
    document.getElementById('invitePeopleBtn')?.addEventListener('click', generateInvite);
    document.getElementById('headerInviteBtn')?.addEventListener('click', generateInvite);
    document.getElementById('deleteServerBtn')?.addEventListener('click', deleteCurrentServer);
    document.getElementById('confirmCreateServer')?.addEventListener('click', async () => { const name = document.getElementById('newServerName').value; if (name) await createServer(name); document.getElementById('createServerModal').classList.remove('active'); });
    document.getElementById('closeCreateModal')?.addEventListener('click', () => document.getElementById('createServerModal').classList.remove('active'));
    document.getElementById('confirmCreateCategory')?.addEventListener('click', createCategory);
    document.getElementById('closeCatModal')?.addEventListener('click', () => document.getElementById('createCategoryModal').classList.remove('active'));
    document.getElementById('confirmCreateChannel')?.addEventListener('click', async () => { const chanName = document.getElementById('channelName').value; const cat = document.getElementById('categorySelect').value; if (chanName && cat) await createChannel(cat, chanName); document.getElementById('createChannelModal').classList.remove('active'); });
    document.getElementById('closeChanModal')?.addEventListener('click', () => document.getElementById('createChannelModal').classList.remove('active'));
    document.getElementById('closeInviteModal')?.addEventListener('click', () => document.getElementById('inviteModal').classList.remove('active'));
    document.getElementById('confirmJoinServer')?.addEventListener('click', async () => { const code = document.getElementById('joinCodeInput').value; if (code) await joinWithCode(code); document.getElementById('joinServerModal').classList.remove('active'); });
    document.getElementById('closeJoinModal')?.addEventListener('click', () => document.getElementById('joinServerModal').classList.remove('active'));
    document.getElementById('mobileOverlay')?.addEventListener('click', closeSidebarMobile);
    if (document.querySelector('.server-list')) document.querySelector('.server-list')?.addEventListener('click', (e) => { if (window.innerWidth <= 700 && e.target.closest('.server-icon')) closeSidebarMobile(); });
    // Add menu for mobile open sidebar
    const menuBtn = document.createElement('button'); menuBtn.innerHTML = '<i class="fas fa-bars"></i>'; menuBtn.style.cssText = "position:fixed;bottom:20px;left:20px;background:#fbbf24;border:none;border-radius:50%;width:48px;height:48px;z-index:1200;display:none;"; document.body.appendChild(menuBtn);
    if (window.innerWidth <= 700) menuBtn.style.display = 'flex'; else menuBtn.style.display = 'none';
    menuBtn.addEventListener('click', openSidebarMobile);
    window.addEventListener('resize', () => { if (window.innerWidth <= 700) menuBtn.style.display = 'flex'; else menuBtn.style.display = 'none'; });

    auth.onAuthStateChanged(user => { currentUser = user; updateAuthUI(user); });
    // Preload Stonks Hub default server creation if none exists
    setTimeout(async () => {
        const allServers = await db.collection("servers").get();
        if (allServers.empty) {
            const hubRef = db.collection("servers").doc();
            await hubRef.set({ name: "Stonks Hub", ownerId: "system", createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            await db.collection("serverStructure").doc(hubRef.id).set({ categories: [{ name: "GENERAL", channels: [{ id: "welcome", name: "welcome" }, { id: "general", name: "general" }] }] });
            console.log("Stonks Hub created");
        }
    }, 1000);
</script>
<div id="authOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0f;z-index:9999;display:flex;align-items:center;justify-content:center;">
    <div style="background:#1e293b;padding:30px;border-radius:28px;text-align:center;"><i class="fas fa-chart-line" style="font-size:48px;color:#fbbf24;"></i><h2>Stonks Hub</h2><p>Create servers, categories, invite friends</p><button id="googleSignInBtn" style="background:#fbbf24;border:none;padding:12px 28px;border-radius:40px;margin-top:20px;font-weight:600;">Sign in with Google</button></div>
</div>
<script>
    document.getElementById('googleSignInBtn')?.addEventListener('click', () => firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()));
</script>
</body>
</html>
