<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Stonks Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #e2e8f0; }

        .app { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

        /* SERVER LIST */
        .server-list { width: 72px; min-width: 72px; background: #0f0f14; border-right: 1px solid #1f2937; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 0; overflow-y: auto; flex-shrink: 0; }
        .server-icon { width: 48px; height: 48px; background: #1e293b; border-radius: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; position: relative; color: #fbbf24; font-weight: bold; font-size: 18px; flex-shrink: 0; }
        .server-icon.active { border-radius: 16px; background: linear-gradient(135deg, #fbbf24, #ef4444); color: white; }
        .server-icon:hover { border-radius: 16px; background: #334155; }
        .add-server-btn, .join-server-btn { background: #1f2937; border: 2px dashed #fbbf24; }
        .server-tooltip { position: absolute; left: 58px; background: #1e293b; border: 1px solid #334155; padding: 4px 10px; border-radius: 8px; font-size: 12px; white-space: nowrap; display: none; z-index: 100; pointer-events: none; }
        .server-icon:hover .server-tooltip { display: block; }

        /* SIDEBAR */
        .sidebar { width: 260px; min-width: 260px; background: #111827; border-right: 1px solid #1f2937; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; z-index: 1100; }
        .sidebar-header { padding: 14px 12px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .server-name-header { font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .server-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .server-actions button { background: #1f2937; border: none; color: #fbbf24; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
        .server-actions button:hover { background: #334155; }
        .sidebar-channels { flex: 1; overflow-y: auto; overflow-x: hidden; }
        .category-group { margin: 4px 0; }
        .category-header { display: flex; align-items: center; padding: 6px 8px 6px 6px; cursor: pointer; color: #9ca3af; font-size: 0.68rem; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; gap: 4px; }
        .category-header:hover { color: #fbbf24; }
        .category-chevron { font-size: 9px; width: 12px; }
        .category-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cat-actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
        .cat-action-btn { background: none; border: none; color: #6b7280; cursor: pointer; font-size: 11px; padding: 2px 4px; border-radius: 4px; }
        .cat-action-btn:hover { color: #fbbf24; background: #1f2937; }
        .channels-container.collapsed { display: none; }
        .channel-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 20px; border-radius: 6px; cursor: pointer; color: #9ca3af; font-size: 0.82rem; transition: 0.1s; margin: 1px 4px; position: relative; }
        .channel-item.active { background: #1f2937; color: #fbbf24; }
        .channel-item:hover { background: #1a2332; color: #e2e8f0; }
        .channel-item:hover .ch-settings-btn { opacity: 1; }
        .channel-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ch-settings-btn { opacity: 0; background: none; border: none; color: #6b7280; cursor: pointer; font-size: 11px; padding: 2px 4px; border-radius: 4px; flex-shrink: 0; }
        .ch-settings-btn:hover { color: #fbbf24; background: #334155; }
        .voice-channel { color: #34d399; }
        .voice-members-sidebar { padding: 2px 8px 4px 30px; font-size: 0.68rem; color: #6b7280; display: flex; flex-wrap: wrap; gap: 4px; }
        .voice-member-chip { background: #1f2937; border-radius: 20px; padding: 2px 8px; display: inline-flex; align-items: center; gap: 4px; }
        .member-info { padding: 10px 12px; border-top: 1px solid #1f2937; font-size: 13px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .owner-badge { background: #fbbf24; color: black; padding: 1px 6px; border-radius: 20px; font-size: 9px; margin-left: 4px; }

        /* MAIN CONTENT */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; background: #0f172a; }
        .chat-header { padding: 12px 16px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; background: #0f172a; flex-shrink: 0; }
        .channel-info { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .channel-info span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .header-btns { display: flex; gap: 8px; flex-shrink: 0; }
        .header-btn { background: #1e293b; border: none; padding: 6px 12px; border-radius: 20px; color: #fbbf24; cursor: pointer; font-size: 0.78rem; }
        .header-btn:hover { background: #334155; }
        .hamburger-btn { display: none; background: none; border: none; color: #fbbf24; font-size: 18px; cursor: pointer; padding: 4px 8px; }

        /* TEXT CHAT */
        .text-chat-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .messages-container { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
        .message { display: flex; gap: 10px; animation: fadeIn 0.2s; }
        .message-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .message-content { background: #1e293b; padding: 8px 12px; border-radius: 16px; word-break: break-word; min-width: 0; flex: 1; }
        .message-author { font-weight: 600; font-size: 0.72rem; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
        .message-time { font-size: 0.58rem; color: #94a3b8; }
        .message-text { font-size: 0.83rem; margin-top: 3px; line-height: 1.45; }
        .input-area { padding: 10px 12px; border-top: 1px solid #1e293b; background: #0f172a; display: flex; gap: 8px; flex-shrink: 0; }
        .input-area input { flex: 1; background: #1e293b; border: none; padding: 10px 14px; border-radius: 30px; color: white; outline: none; font-size: 0.9rem; min-width: 0; }
        .input-area input::placeholder { color: #6b7280; }
        .send-btn { background: #fbbf24; border: none; padding: 0 16px; border-radius: 30px; font-weight: bold; cursor: pointer; color: #0f172a; font-size: 0.85rem; flex-shrink: 0; }
        .send-btn:hover { background: #f59e0b; }

        /* VOICE VIEW */
        .voice-view { flex: 1; display: flex; flex-direction: column; background: #060b14; overflow: hidden; }
        .voice-view-body { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; position: relative; overflow-y: auto; padding: 20px; }
        .voice-participants-grid { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: center; max-width: 700px; }
        .voice-participant-card { display: flex; flex-direction: column; align-items: center; gap: 8px; background: #11182780; padding: 12px 16px; border-radius: 24px; }
        .voice-participant-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid #1f2937; }
        .voice-participant-avatar.speaking { border-color: #34d399; box-shadow: 0 0 12px #34d39970; }
        .voice-controls { display: flex; gap: 12px; align-items: center; padding: 14px 20px; background: #0d1727; border-top: 1px solid #1e293b; justify-content: center; flex-shrink: 0; }
        .voice-ctrl-btn { width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer; background: #1e293b; color: white; font-size: 18px; transition: 0.15s; }
        .voice-ctrl-btn:hover { background: #334155; }
        .btn-mic.muted { background: #3b1a1a; color: #ef4444; }
        .btn-share-screen.active { background: #1d4ed8; color: white; }
        .btn-leave { background: #3b1a1a; color: #ef4444; }
        .screenshare-container { width: 100%; max-width: 800px; background: #000000cc; display: flex; flex-direction: column; min-height: 200px; border-radius: 16px; overflow: hidden; }
        .screenshare-video-wrap { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; min-height: 160px; }
        .screenshare-video { width: 100%; height: 100%; object-fit: contain; max-height: 320px; background: #000; }
        .screenshare-viewers { background: #0d1727; padding: 8px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.7rem; }

        /* MODALS */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; padding: 16px; }
        .modal.active { display: flex; }
        .modal-content { background: #0f172a; border-radius: 20px; padding: 24px; width: 100%; max-width: 440px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { font-size: 1.1rem; font-weight: 700; }
        .modal-content input, .modal-content select, .modal-content textarea { background: #1e293b; border: 1px solid #334155; color: white; padding: 10px 14px; border-radius: 10px; font-size: 0.9rem; width: 100%; outline: none; font-family: inherit; }
        .modal-content textarea { resize: vertical; min-height: 80px; }
        .modal-btns { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-gold { background: #fbbf24; color: #0f172a; border: none; padding: 8px 18px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-gold:hover { background: #f59e0b; }
        .btn-outline { background: transparent; border: 1px solid #fbbf24; color: #fbbf24; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-size: 0.85rem; }
        .btn-outline:hover { background: #fbbf2420; }
        .btn-danger { background: #3b1a1a; border: none; color: #ef4444; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-size: 0.85rem; }

        /* Channel settings rules list */
        .rules-list { display: flex; flex-direction: column; gap: 8px; }
        .rule-item { background: #1e293b; border-radius: 10px; padding: 10px 12px; display: flex; align-items: flex-start; gap: 10px; }
        .rule-item-text { flex: 1; font-size: 0.82rem; color: #e2e8f0; }
        .rule-del-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 12px; padding: 2px; }

        /* Mic permission */
        .mic-perm-body { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }

        /* Toast */
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 8px 20px; border-radius: 40px; z-index: 9999; border-left: 3px solid #fbbf24; opacity: 0; transition: opacity 0.3s; pointer-events: none; font-size: 0.85rem; white-space: nowrap; }
        .toast.show { opacity: 1; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        /* Mobile */
        .overlay { position: fixed; inset: 0; background: #00000080; z-index: 1050; display: none; }
        .overlay.active { display: block; }

        @media (max-width: 700px) {
            .server-list { width: 56px; min-width: 56px; }
            .server-icon { width: 40px; height: 40px; font-size: 15px; }
            .sidebar { position: fixed; left: 0; top: 0; height: 100%; width: 260px; min-width: 260px; transform: translateX(-260px); transition: transform 0.25s; z-index: 1100; }
            .sidebar.open { transform: translateX(0); }
            .hamburger-btn { display: block; }
            .voice-participant-avatar { width: 52px; height: 52px; }
            .main-content { width: 100%; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- SERVER LIST -->
    <div class="server-list" id="serverListContainer"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebarPanel">
        <div class="sidebar-header">
            <div class="server-name-header">
                <span id="currentServerName">Stonks Hub</span>
                <span id="serverOwnerCrown"></span>
            </div>
            <div class="server-actions" id="ownerServerActions" style="display:none;">
                <button id="createCategoryBtn" title="New Category"><i class="fas fa-folder-plus"></i></button>
                <button id="invitePeopleBtn" title="Invite"><i class="fas fa-user-plus"></i></button>
                <button id="deleteServerBtn" title="Delete" style="color:#ef4444;"><i class="fas fa-trash"></i></button>
            </div>
            <div class="server-actions" id="memberServerActions">
                <button id="invitePeopleBtnMember" title="Invite"><i class="fas fa-user-plus"></i></button>
            </div>
        </div>
        <div class="sidebar-channels" id="channelsListContainer"></div>
        <div class="member-info">
            <span><i class="fas fa-user-circle"></i> <span id="userDisplay"></span><span id="roleBadge"></span></span>
            <button id="signOutBtn" style="background:none;border:none;color:#fbbf24;cursor:pointer;" title="Sign out"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>

    <div class="overlay" id="mobileOverlay"></div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="chat-header">
            <div class="channel-info">
                <button class="hamburger-btn" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
                <i class="fas fa-hashtag" id="channelTypeIcon"></i>
                <span id="currentChannelName">general</span>
            </div>
            <div class="header-btns">
                <button class="header-btn" id="headerInviteBtn"><i class="fas fa-link"></i> Invite</button>
            </div>
        </div>

        <!-- TEXT CHAT -->
        <div class="text-chat-view" id="textChatView" style="display:flex;">
            <div class="messages-container" id="messagesContainer"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Message...">
                <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- VOICE VIEW -->
        <div id="voiceChatView" class="voice-view" style="display:none;">
            <div class="voice-view-body" id="voiceViewBody">
                <div id="screenShareDynamicArea" style="width:100%;max-width:800px;"></div>
                <div class="voice-participants-grid" id="voiceParticipantsGrid"></div>
            </div>
            <div class="voice-controls">
                <button class="voice-ctrl-btn btn-mic" id="micToggleBtn" title="Mute/Unmute"><i class="fas fa-microphone"></i></button>
                <button class="voice-ctrl-btn btn-share-screen" id="shareScreenBtn" title="Share Screen"><i class="fas fa-desktop"></i></button>
                <button class="voice-ctrl-btn btn-leave" id="leaveVoiceBtn" title="Leave"><i class="fas fa-phone-slash"></i></button>
            </div>
        </div>
    </div>
</div>

<!-- MODALS -->
<div id="createServerModal" class="modal">
    <div class="modal-content">
        <h3>New Server</h3>
        <input type="text" id="newServerName" placeholder="Server name">
        <div class="modal-btns">
            <button class="btn-gold" id="confirmCreateServer">Create</button>
            <button class="btn-outline" id="closeCreateModal">Cancel</button>
        </div>
    </div>
</div>
<div id="createCategoryModal" class="modal">
    <div class="modal-content">
        <h3>New Category</h3>
        <input type="text" id="categoryName" placeholder="Category name">
        <div class="modal-btns">
            <button class="btn-gold" id="confirmCreateCategory">Add</button>
            <button class="btn-outline" id="closeCatModal">Cancel</button>
        </div>
    </div>
</div>
<div id="createChannelModal" class="modal">
    <div class="modal-content">
        <h3>New Channel</h3>
        <input type="text" id="channelName" placeholder="Channel name">
        <select id="channelTypeSelect"><option value="text">📝 Text</option><option value="voice">🎙️ Voice</option></select>
        <select id="categorySelect"></select>
        <div class="modal-btns">
            <button class="btn-gold" id="confirmCreateChannel">Create</button>
            <button class="btn-outline" id="closeChanModal">Cancel</button>
        </div>
    </div>
</div>
<div id="inviteModal" class="modal">
    <div class="modal-content">
        <h3>Invite Link</h3>
        <p style="font-size:0.85rem;color:#9ca3af;">Share this code:</p>
        <div style="background:#1e293b;padding:12px;border-radius:10px;font-size:1.2rem;font-weight:700;text-align:center;letter-spacing:2px;" id="inviteCodeDisplay"></div>
        <div class="modal-btns">
            <button class="btn-gold" id="copyInviteBtn"><i class="fas fa-copy"></i> Copy</button>
            <button class="btn-outline" id="closeInviteModal">Close</button>
        </div>
    </div>
</div>
<div id="joinServerModal" class="modal">
    <div class="modal-content">
        <h3>Join Server</h3>
        <input type="text" id="joinCodeInput" placeholder="Enter invite code">
        <div class="modal-btns">
            <button class="btn-gold" id="confirmJoinServer">Join</button>
            <button class="btn-outline" id="closeJoinModal">Cancel</button>
        </div>
    </div>
</div>
<div id="micPermModal" class="modal">
    <div class="modal-content">
        <div class="mic-perm-body">
            <i class="fas fa-microphone" style="font-size:40px;color:#fbbf24;"></i>
            <h3>Microphone Access</h3>
            <p style="color:#9ca3af;font-size:0.85rem;">Allow mic so others can hear you.</p>
            <div class="modal-btns" style="justify-content:center;">
                <button class="btn-gold" id="allowMicBtn">Allow Mic</button>
                <button class="btn-outline" id="denyMicBtn">Join Muted</button>
            </div>
        </div>
    </div>
</div>

<!-- CHANNEL SETTINGS MODAL -->
<div id="channelSettingsModal" class="modal">
    <div class="modal-content">
        <h3 id="chSettingsTitle">Channel Settings</h3>
        <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:0.78rem;color:#9ca3af;">Channel Name</label>
            <input type="text" id="chSettingsName" placeholder="Channel name">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:0.78rem;color:#9ca3af;">Channel Rules</label>
            <div class="rules-list" id="rulesListContainer"></div>
            <div style="display:flex;gap:8px;">
                <input type="text" id="newRuleInput" placeholder="Add a rule...">
                <button class="btn-gold" id="addRuleBtn" style="flex-shrink:0;">Add</button>
            </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:0.78rem;color:#9ca3af;">Description</label>
            <textarea id="chSettingsDesc" placeholder="Channel description..."></textarea>
        </div>
        <div class="modal-btns">
            <button class="btn-gold" id="saveChSettingsBtn">Save</button>
            <button class="btn-outline" id="closeChSettingsBtn">Cancel</button>
            <button class="btn-danger" id="deleteChBtn">Delete Channel</button>
        </div>
    </div>
</div>

<!-- CATEGORY SETTINGS MODAL -->
<div id="categorySettingsModal" class="modal">
    <div class="modal-content">
        <h3>Category Settings</h3>
        <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:0.78rem;color:#9ca3af;">Category Name</label>
            <input type="text" id="catSettingsName" placeholder="Category name">
        </div>
        <div class="modal-btns">
            <button class="btn-gold" id="saveCatSettingsBtn">Save</button>
            <button class="btn-outline" id="closeChCatSettingsBtn">Cancel</button>
            <button class="btn-danger" id="deleteCatBtn">Delete Category</button>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = { apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc", authDomain: "vertexpaste.firebaseapp.com", projectId: "vertexpaste", storageBucket: "vertexpaste.firebasestorage.app", messagingSenderId: "255275350380", appId: "1:255275350380:web:7be4e8add2cb5b04045b49" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();

const GLOBAL_OWNER_EMAIL = "defnot67kid@gmail.com";
let currentUser = null, currentServerId = null, currentChannelId = null, currentChannelType = "text";
let unsubMessages = null, unsubVoice = null, unsubScreenShare = null;
let isGlobalOwner = false, isServerOwner = false;
let localStream = null, screenStream = null;
let isMicMuted = false, isSharing = false, currentVoiceChannelId = null;
let rtcPeerConnections = {}, localAudioTrack = null;
let sidebarVoiceUnsubs = {};
let editingChannelId = null, editingChannelCatIndex = null;
let editingCatIndex = null;
let channelRulesCache = {};

// ---- UTILS ----
function showToast(msg) {
    const t = document.getElementById('toastMsg');
    t.innerText = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
}
function esc(s) {
    return String(s || '').replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
}
function isOwner() { return isGlobalOwner || isServerOwner; }

// ---- AUTH ----
auth.onAuthStateChanged(user => {
    currentUser = user;
    if (user) {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('userDisplay').innerHTML = esc(user.displayName || user.email);
        isGlobalOwner = user.email === GLOBAL_OWNER_EMAIL;
        document.getElementById('roleBadge').innerHTML = isGlobalOwner ? '<span class="owner-badge"><i class="fas fa-crown"></i> OWNER</span>' : '';
        initApp();
    } else {
        document.getElementById('authOverlay').style.display = 'flex';
    }
});

async function initApp() {
    await renderServerList();
    const servers = await fetchUserServers();
    if (servers.length && !currentServerId) await switchServer(servers[0].id);
}

async function fetchUserServers() {
    if (!currentUser) return [];
    if (isGlobalOwner) {
        const all = await db.collection("servers").get();
        return all.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    const snap = await db.collection("serverMembers").where("userId", "==", currentUser.uid).get();
    const ids = snap.docs.map(d => d.data().serverId);
    if (!ids.length) return [];
    const docs = await Promise.all(ids.map(id => db.collection("servers").doc(id).get()));
    return docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
}

async function switchServer(serverId) {
    if (unsubMessages) unsubMessages();
    await leaveVoiceIfIn();
    currentServerId = serverId;
    currentChannelId = null;

    const serverDoc = await db.collection("servers").doc(serverId).get();
    const serverData = serverDoc.data() || {};
    document.getElementById('currentServerName').innerHTML = esc(serverData.name || "Server");

    // Check server ownership
    isServerOwner = isGlobalOwner || (serverData.ownerId === currentUser?.uid);
    updateOwnerUI();

    await renderServerList();

}

function updateOwnerUI() {
    const ownerActs = document.getElementById('ownerServerActions');
    const memberActs = document.getElementById('memberServerActions');
    if (isOwner()) {
        ownerActs.style.display = 'flex';
        memberActs.style.display = 'none';

}

async function loadServerChannels(serverId) {
    const structRef = db.collection("serverStructure").doc(serverId);
    let struct = (await structRef.get()).data();
    if (!struct) {
        struct = { categories: [{ name: "GENERAL", channels: [{ id: "general", name: "general", type: "text", rules: [], desc: "" }] }] };
        await structRef.set(struct);
    }
    if (!currentChannelId) {
        const first = struct.categories[0]?.channels[0];
        currentChannelId = first?.id || "general";
        currentChannelType = first?.type || "text";
    } else {
        const ch = findChannel(struct, currentChannelId);
        currentChannelType = ch?.type || "text";
    }
    await renderSidebarChannels(struct);
    document.getElementById('currentChannelName').innerText = getChannelNameById(struct, currentChannelId);
    updateChannelHeaderIcon();
    if (currentChannelType === "text") {
        showTextView();
        loadMessagesForChannel(currentServerId, currentChannelId);
    } else if (currentChannelType === "voice") {
        joinVoiceChannel(currentChannelId);
    }
}

function findChannel(struct, chId) {
    for (const cat of struct.categories) for (const ch of cat.channels) if (ch.id === chId) return ch;
    return null;
}
function getChannelNameById(struct, chId) {
    const ch = findChannel(struct, chId); return ch ? ch.name : chId;
}
function updateChannelHeaderIcon() {
    const icon = document.getElementById('channelTypeIcon');
    icon.className = currentChannelType === "voice" ? "fas fa-microphone-alt" : "fas fa-hashtag";
}

async function joinVoiceChannel(channelId) {
    document.getElementById('micPermModal').classList.add('active');
    const doJoin = async (withMic) => {
        closeModal('micPermModal');
        if (withMic) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                localAudioTrack = localStream.getAudioTracks()[0];
                isMicMuted = false;
            } catch (e) { showToast("Mic denied, joining muted"); isMicMuted = true; }
        } else isMicMuted = true;
        currentVoiceChannelId = channelId;
        await registerVoicePresence(channelId, isMicMuted);
        showVoiceView();
        listenVoiceParticipants(channelId);
        listenScreenShare(channelId);
        updateMicBtnUI();
        initWebRTC(channelId);
    };
    const allow = document.getElementById('allowMicBtn');
    const deny = document.getElementById('denyMicBtn');
    const na = allow.cloneNode(true), nd = deny.cloneNode(true);
    allow.parentNode.replaceChild(na, allow); deny.parentNode.replaceChild(nd, deny);
    na.addEventListener('click', () => doJoin(true));
    nd.addEventListener('click', () => doJoin(false));
}

async function registerVoicePresence(channelId, muted) {
    if (!currentUser) return;
    const ref = db.collection("voicePresence").doc(currentServerId).collection("channels").doc(channelId).collection("members").doc(currentUser.uid);
    await ref.set({ uid: currentUser.uid, displayName: currentUser.displayName || currentUser.email, photoURL: currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.displayName||'U')}`, muted, joinedAt: firebase.firestore.FieldValue.serverTimestamp() });
    listenSignals();
}

async function leaveVoiceIfIn() {
    if (!currentVoiceChannelId || !currentUser) return;
    await db.collection("voicePresence").doc(currentServerId).collection("channels").doc(currentVoiceChannelId).collection("members").doc(currentUser.uid).delete().catch(() => {});
    if (unsubVoice) unsubVoice();
    if (unsubScreenShare) unsubScreenShare();
    if (isSharing) await stopScreenShare();
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; localAudioTrack = null; }
    Object.values(rtcPeerConnections).forEach(pc => pc.close());
    rtcPeerConnections = {};
    currentVoiceChannelId = null;
    showTextView();
}

function listenVoiceParticipants(channelId) {
    if (unsubVoice) unsubVoice();
    const ref = db.collection("voicePresence").doc(currentServerId).collection("channels").doc(channelId).collection("members");
    unsubVoice = ref.onSnapshot(snap => {
        const grid = document.getElementById('voiceParticipantsGrid');
        if (snap.empty) { grid.innerHTML = '<div style="color:#6b7280;">✨ No one here yet</div>'; return; }
        let html = '';

                    ${esc(d.displayName)}
                </div>

async function initWebRTC(channelId) {
    if (!currentUser) return;
    const membersRef = db.collection("voicePresence").doc(currentServerId).collection("channels").doc(channelId).collection("members");
    membersRef.onSnapshot(snap => {
        snap.docChanges().forEach(change => {
            const uid = change.doc.id;
            if (uid === currentUser.uid) return;
            if (change.type === 'added' && !rtcPeerConnections[uid]) createPeerConn(uid);
            if (change.type === 'removed' && rtcPeerConnections[uid]) { rtcPeerConnections[uid].close(); delete rtcPeerConnections[uid]; }
        });
    });
}

async function createPeerConn(remoteUid) {
    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    if (localAudioTrack && !isMicMuted) pc.addTrack(localAudioTrack);
    pc.ontrack = e => { if (e.track.kind === 'audio') { const a = new Audio(); a.srcObject = new MediaStream([e.track]); a.play().catch(() => {}); } };
    pc.onicecandidate = e => { if (e.candidate) sendSignal(remoteUid, { candidate: e.candidate }); };
    const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
    sendSignal(remoteUid, { sdp: pc.localDescription });
    rtcPeerConnections[remoteUid] = pc;
    return pc;
}

async function sendSignal(toUid, data) {
    if (!currentServerId || !currentVoiceChannelId || !currentUser) return;
    await db.collection("voiceSignals").doc(`${currentServerId}_${currentVoiceChannelId}`).collection(toUid).doc(currentUser.uid).set({ data, from: currentUser.uid, timestamp: Date.now() });
}

function listenSignals() {
    if (!currentVoiceChannelId || !currentUser) return;
    const ref = db.collection("voiceSignals").doc(`${currentServerId}_${currentVoiceChannelId}`).collection(currentUser.uid);
    ref.onSnapshot(snap => {
        snap.docChanges().forEach(async change => {
            if (change.type !== 'added') return;
            const fromUid = change.doc.id, sig = change.doc.data().data;
            let pc = rtcPeerConnections[fromUid];
            if (sig.sdp) {
                if (!pc) pc = await createPeerConn(fromUid);
                if (sig.sdp.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(sig.sdp));
                    const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
                    sendSignal(fromUid, { sdp: pc.localDescription });
                } else if (sig.sdp.type === 'answer') await pc.setRemoteDescription(new RTCSessionDescription(sig.sdp));
            } else if (sig.candidate && pc) await pc.addIceCandidate(new RTCIceCandidate(sig.candidate));
            change.doc.ref.delete();
        });
    });
}

function updateMicBtnUI() {
    const btn = document.getElementById('micToggleBtn');
    if (!btn) return;
    btn.classList.toggle('muted', isMicMuted);
    btn.innerHTML = isMicMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
    if (localAudioTrack) localAudioTrack.enabled = !isMicMuted;
    if (currentVoiceChannelId && currentUser)
        db.collection("voicePresence").doc(currentServerId).collection("channels").doc(currentVoiceChannelId).collection("members").doc(currentUser.uid).update({ muted: isMicMuted }).catch(() => {});
}

// ---- SCREEN SHARE ----
async function startScreenShare() {
    if (!currentVoiceChannelId) return;
    try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        isSharing = true; localScreenTrack = screenStream.getVideoTracks()[0];
        await db.collection("screenShares").doc(`${currentServerId}_${currentVoiceChannelId}`).set({ sharerUid: currentUser.uid, active: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        document.getElementById('shareScreenBtn').classList.add('active');
        showToast("Screen sharing started");
        displayLocalScreen();
        screenStream.getVideoTracks()[0].onended = () => stopScreenShare();
    } catch (e) { showToast("Screen share cancelled"); }
}

function displayLocalScreen() {
    const area = document.getElementById('screenShareDynamicArea');
    area.innerHTML = `<div class="screenshare-container">
        <div class="screenshare-video-wrap"><video id="localScreenVideo" class="screenshare-video" autoplay muted playsinline></video></div>
        <div class="screenshare-viewers"><i class="fas fa-eye"></i> You are sharing</div>
        <button id="stopShareBtn" style="margin:8px;background:#ef4444;border:none;padding:6px 14px;border-radius:20px;color:white;cursor:pointer;">Stop Sharing</button>
    </div>`;
    document.getElementById('localScreenVideo').srcObject = screenStream;
    document.getElementById('stopShareBtn')?.addEventListener('click', stopScreenShare);
}

async function stopScreenShare() {
    if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
    isSharing = false; localScreenTrack = null;
    document.getElementById('shareScreenBtn').classList.remove('active');
    if (currentServerId && currentVoiceChannelId)
        await db.collection("screenShares").doc(`${currentServerId}_${currentVoiceChannelId}`).set({ active: false }, { merge: true });
    document.getElementById('screenShareDynamicArea').innerHTML = '';
    showToast("Stopped sharing");
}

function listenScreenShare(channelId) {
    if (unsubScreenShare) unsubScreenShare();
    const ref = db.collection("screenShares").doc(`${currentServerId}_${channelId}`);
    unsubScreenShare = ref.onSnapshot(snap => {
        if (!snap.exists || !snap.data()?.active) { if (!isSharing) document.getElementById('screenShareDynamicArea').innerHTML = ''; return; }
        const data = snap.data();
        if (data.sharerUid !== currentUser?.uid && !isSharing) {
            document.getElementById('screenShareDynamicArea').innerHTML = `<div class="screenshare-container">
                <div class="screenshare-video-wrap"><video id="remoteScreenVideo" class="screenshare-video" autoplay playsinline></video></div>
                <div class="screenshare-viewers"><i class="fas fa-eye"></i> Watching screen...</div>
            </div>`;
        }
    });
}

async function deleteCurrentServer() {
    if (!currentServerId) return;
    const doc = await db.collection("servers").doc(currentServerId).get();
    if (doc.data()?.name === "Stonks Hub") { showToast("Cannot delete Stonks Hub"); return; }
    if (!confirm("Delete this server?")) return;
    const members = await db.collection("serverMembers").where("serverId", "==", currentServerId).get();
    members.forEach(d => d.ref.delete());
    await db.collection("servers").doc(currentServerId).delete();
    await db.collection("serverStructure").doc(currentServerId).delete();
    currentServerId = null;
    const servers = await fetchUserServers();
    if (servers.length) await switchServer(servers[0].id);
    renderServerList();
}

async function generateInvite() {
    if (!currentServerId) return;
    const code = Math.random().toString(36).substring(2, 10).toUpperCase();
    await db.collection("invites").doc(code).set({ serverId: currentServerId });
    document.getElementById('inviteCodeDisplay').innerText = code;
    openModal('inviteModal');
}

async function joinWithCode(code) {
    const invite = await db.collection("invites").doc(code).get();
    if (!invite.exists) { showToast("Invalid code"); return; }
    const serverId = invite.data().serverId;
    const existing = await db.collection("serverMembers").where("serverId", "==", serverId).where("userId", "==", currentUser.uid).get();
    if (!existing.empty) { showToast("Already a member"); return; }
    await db.collection("serverMembers").add({ serverId, userId: currentUser.uid, role: "member" });
    await renderServerList(); await switchServer(serverId);
    showToast("Joined server!");
}

async function createCategory(name) {
    if (!currentServerId) return;
    const ref = db.collection("serverStructure").doc(currentServerId);
    const struct = (await ref.get()).data() || { categories: [] };
    struct.categories.push({ name, channels: [] });
    await ref.set(struct);
    loadServerChannels(currentServerId);
}

async function createChannel(name, type, categoryName) {
    const ref = db.collection("serverStructure").doc(currentServerId);
    const struct = (await ref.get()).data();
    const cat = struct.categories.find(c => c.name === categoryName);
    if (!cat) return;
    const newId = name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now();
    cat.channels.push({ id: newId, name, type, rules: [], desc: "" });
    await ref.set(struct);
    loadServerChannels(currentServerId);
}

function openCreateChannelModal(categoryName) {
    db.collection("serverStructure").doc(currentServerId).get().then(doc => {
        const struct = doc.data();
        const sel = document.getElementById('categorySelect');
        sel.innerHTML = '';
        struct.categories.forEach(c => {
            const opt = document.createElement('option'); opt.value = c.name; opt.innerText = c.name; sel.appendChild(opt);
        });
        sel.value = categoryName;
    });
    openModal('createChannelModal');
}

// ---- MODAL HELPERS ----
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

// ---- SIDEBAR MOBILE ----
function closeSidebar() { document.getElementById('sidebarPanel').classList.remove('open'); document.getElementById('mobileOverlay').classList.remove('active'); }
function openSidebar() { document.getElementById('sidebarPanel').classList.add('open'); document.getElementById('mobileOverlay').classList.add('active'); }

// ---- EVENT LISTENERS ----
document.getElementById('sendBtn')?.addEventListener('click', sendMessage);
document.getElementById('messageInput')?.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
document.getElementById('signOutBtn')?.addEventListener('click', () => { leaveVoiceIfIn(); auth.signOut(); });
document.getElementById('createCategoryBtn')?.addEventListener('click', () => openModal('createCategoryModal'));
document.getElementById('invitePeopleBtn')?.addEventListener('click', generateInvite);
document.getElementById('invitePeopleBtnMember')?.addEventListener('click', generateInvite);
document.getElementById('headerInviteBtn')?.addEventListener('click', generateInvite);
document.getElementById('deleteServerBtn')?.addEventListener('click', deleteCurrentServer);
document.getElementById('hamburgerBtn')?.addEventListener('click', openSidebar);
document.getElementById('mobileOverlay')?.addEventListener('click', closeSidebar);

document.getElementById('confirmCreateServer')?.addEventListener('click', async () => {
    const n = document.getElementById('newServerName').value.trim(); if (n) await createServer(n); closeModal('createServerModal');
});
document.getElementById('closeCreateModal')?.addEventListener('click', () => closeModal('createServerModal'));
document.getElementById('confirmCreateCategory')?.addEventListener('click', async () => {
    const n = document.getElementById('categoryName').value.trim(); if (n) await createCategory(n); closeModal('createCategoryModal');
});
document.getElementById('closeCatModal')?.addEventListener('click', () => closeModal('createCategoryModal'));
document.getElementById('confirmCreateChannel')?.addEventListener('click', async () => {
    const name = document.getElementById('channelName').value.trim();
    const type = document.getElementById('channelTypeSelect').value;
    const cat = document.getElementById('categorySelect').value;
    if (name && cat) await createChannel(name, type, cat); closeModal('createChannelModal');
});
document.getElementById('closeChanModal')?.addEventListener('click', () => closeModal('createChannelModal'));
document.getElementById('closeInviteModal')?.addEventListener('click', () => closeModal('inviteModal'));
document.getElementById('copyInviteBtn')?.addEventListener('click', () => { navigator.clipboard.writeText(document.getElementById('inviteCodeDisplay').innerText); showToast("Copied!"); });
document.getElementById('confirmJoinServer')?.addEventListener('click', async () => {
    const c = document.getElementById('joinCodeInput').value.trim(); if (c) await joinWithCode(c); closeModal('joinServerModal');
});
document.getElementById('closeJoinModal')?.addEventListener('click', () => closeModal('joinServerModal'));
document.getElementById('micToggleBtn')?.addEventListener('click', () => { isMicMuted = !isMicMuted; updateMicBtnUI(); });
document.getElementById('leaveVoiceBtn')?.addEventListener('click', async () => { await leaveVoiceIfIn(); currentChannelId = null; loadServerChannels(currentServerId); });
document.getElementById('shareScreenBtn')?.addEventListener('click', () => { isSharing ? stopScreenShare() : startScreenShare(); });

// ---- INIT STONKS HUB ----
setTimeout(async () => {
    const all = await db.collection("servers").get();
    const exists = all.docs.some(d => d.data().name === "Stonks Hub");
    if (!exists) {
        const hub = db.collection("servers").doc();
        await hub.set({ name: "Stonks Hub", ownerId: "system" });
        await db.collection("serverStructure").doc(hub.id).set({ categories: [
            { name: "GENERAL", channels: [{ id: "welcome", name: "welcome", type: "text", rules: [], desc: "Welcome to Stonks Hub!" }] },
            { name: "VOICE", channels: [{ id: "voice-lounge", name: "General Voice", type: "voice", rules: [], desc: "" }] }
        ]});
    }
}, 1200);
</script>
