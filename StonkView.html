<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stonks Sever · Advanced Bot Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }
        .app { display: flex; height: 100vh; }
        .sidebar {
            width: 280px;
            background: #111827;
            border-right: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #1f2937; }
        .logo {
            font-weight: 800;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #fbbf24, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .admin-badge {
            background: linear-gradient(135deg, #ef4444, #f59e0b);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 8px;
            color: white;
        }
        .user-profile { padding: 20px; text-align: center; border-bottom: 1px solid #1f2937; }
        .avatar-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid #fbbf24; }
        .user-name { margin-top: 10px; font-weight: 600; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            color: #9ca3af;
        }
        .nav-item:hover, .nav-item.active { background: #1f2937; color: #fbbf24; }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f172a;
        }
        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .channel-info { display: flex; align-items: center; gap: 12px; }
        .channel-name { font-size: 1.2rem; font-weight: 600; }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message { display: flex; gap: 12px; max-width: 85%; }
        .message-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .message-content { background: #1e293b; padding: 8px 14px; border-radius: 18px; }
        .message-author { font-weight: 600; font-size: 0.8rem; display: flex; gap: 8px; align-items: baseline; }
        .message-time { font-size: 0.65rem; color: #94a3b8; }
        .message-text { font-size: 0.9rem; margin-top: 4px; }
        .system-message { background: rgba(245, 158, 11, 0.2); border-left: 3px solid #fbbf24; }
        .bot-tag { background: #8b5cf6; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; }
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 12px;
            background: #0f172a;
        }
        .input-area input { flex: 1; background: #1e293b; border: none; padding: 12px 18px; border-radius: 40px; color: white; outline: none; }
        .input-area button { background: #fbbf24; border: none; padding: 0 24px; border-radius: 40px; font-weight: bold; cursor: pointer; color: #0f172a; }
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0f;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card { max-width: 400px; background: #1e293b; padding: 40px; border-radius: 32px; text-align: center; }
        .auth-card button { background: #fbbf24; border: none; padding: 12px 32px; border-radius: 40px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1e293b;
            border-radius: 24px;
            padding: 28px;
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid #fbbf24;
        }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 10px;
            color: white;
            margin: 10px 0;
        }
        .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
        .btn-gold { background: #fbbf24; color: black; border: none; padding: 8px 20px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-purple { background: #8b5cf6; color: white; }
        .hidden { display: none; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(70px);
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 40px;
            z-index: 1100;
            transition: 0.3s;
            border-left: 3px solid #fbbf24;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .category-group { margin: 15px 0; }
        .category-title { font-size: 0.7rem; text-transform: uppercase; color: #6b7280; padding: 8px 12px; letter-spacing: 1px; }
        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px 8px 32px;
            border-radius: 8px;
            cursor: pointer;
            color: #9ca3af;
            font-size: 0.9rem;
        }
        .channel-item:hover, .channel-item.active { background: #1f2937; color: #fbbf24; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .bot-card {
            background: #0f172a;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #8b5cf6;
        }
        .CodeMirror {
            height: 250px;
            border-radius: 12px;
            margin: 10px 0;
        }
        .channel-select-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
            max-height: 150px;
            overflow-y: auto;
        }
        .channel-checkbox {
            background: #0f172a;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .channel-checkbox.selected { background: #fbbf24; color: #000; }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar" id="sidebarPanel" style="display: none;">
        <div class="sidebar-header"><div class="logo">📈 STONKS SEVER</div></div>
        <div class="user-profile">
            <img id="sidebarAvatar" class="avatar-img" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff">
            <div class="user-name" id="sidebarName">Loading...</div>
            <div id="adminIndicator" class="admin-badge hidden">👑 ADMIN</div>
        </div>
        <div style="flex:1; overflow-y: auto;" id="channelsList"></div>
        <div class="nav-item" id="adminPanelBtn" style="margin-top: auto; margin-bottom: 20px; background:#1f2937;">
            <i class="fas fa-crown"></i> Admin Panel
        </div>
        <div class="nav-item" id="signOutBtnNav"><i class="fas fa-sign-out-alt"></i> Sign Out</div>
    </div>
    <div class="chat-area" id="chatArea" style="display: none;">
        <div class="chat-header">
            <div class="channel-info"><i class="fas fa-hashtag"></i><span class="channel-name" id="currentChannelName">general</span></div>
            <button id="signOutBtnTop" style="background:#1e293b; border:none; padding:6px 16px; border-radius:20px; color:#fbbf24; cursor:pointer;">Exit</button>
        </div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
    </div>
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <i class="fas fa-chart-line" style="font-size: 64px; color: #fbbf24; margin-bottom: 20px;"></i>
            <h2>STONKS SEVER</h2>
            <p style="margin: 16px 0">Sign in with Google</p>
            <button id="signInBtn"><i class="fab fa-google"></i> Continue</button>
        </div>
    </div>
</div>

<!-- Advanced Admin Modal -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <h2><i class="fas fa-crown"></i> Advanced Admin Studio</h2>
        <div style="display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap;">
            <button class="btn-gold" id="tabCategoriesBtn">📁 Categories & Channels</button>
            <button class="btn-purple" id="tabBotsBtn">🤖 Advanced Bots</button>
            <button class="btn-gold" id="tabModerationBtn">🛡️ Auto-Moderation</button>
        </div>
        
        <!-- Tab 1: Categories -->
        <div id="categoriesTab">
            <h3>Manage Categories</h3>
            <div id="categoriesListAdmin" style="margin: 10px 0;"></div>
            <div class="flex-between"><input type="text" id="newCategoryName" placeholder="New category name" style="flex:1; margin-right:10px;"><button class="btn-gold" id="addCategoryBtn">+ Add</button></div>
            <hr style="margin: 20px 0;">
            <h3>Add Channel</h3>
            <select id="categorySelect" style="width:100%"></select>
            <input type="text" id="newChannelName" placeholder="Channel name"><button class="btn-gold" id="addChannelBtn" style="margin-top:10px;">+ Add Channel</button>
        </div>
        
        <!-- Tab 2: Advanced Bots (JS/Python) -->
        <div id="botsTab" style="display:none;">
            <h3><i class="fas fa-robot"></i> Bot Studio (JS/Python)</h3>
            <div id="botsList" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;"></div>
            <button class="btn-purple" id="createBotBtn">+ Create New Bot</button>
        </div>
        
        <!-- Tab 3: Auto-Moderation -->
        <div id="moderationTab" style="display:none;">
            <h3><i class="fas fa-shield-alt"></i> Auto-Moderation Rules</h3>
            <div id="modRulesList"></div>
            <div class="flex-between" style="margin-top: 20px;">
                <input type="text" id="newBadWord" placeholder="Bad word to filter" style="flex:1;">
                <button id="addBadWordBtn" class="btn-gold">Add Filter</button>
            </div>
            <button id="enableModerationBtn" class="btn-purple" style="margin-top:15px;">Enable Auto-Mod (Flag bad words)</button>
        </div>
        
        <div class="modal-buttons"><button id="closeAdminBtn" class="btn-danger">Close</button></div>
    </div>
</div>

<!-- Create/Edit Bot Modal -->
<div id="botEditorModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-code"></i> Bot Configuration</h3>
        <input type="text" id="botName" placeholder="Bot Name">
        <select id="botLang">
            <option value="javascript">JavaScript (Node-like)</option>
            <option value="python">Python (via eval simulation)</option>
        </select>
        <label>Bot Type:</label>
        <select id="botType">
            <option value="command">Command Bot (responds to /cmd)</option>
            <option value="auto">Auto Message (interval)</option>
            <option value="mod">Moderation Bot (auto actions)</option>
        </select>
        <label>Target Channels (leave empty for ALL channels):</label>
        <div id="channelSelector" class="channel-select-grid"></div>
        <label>Bot Script (JS or Python):</label>
        <textarea id="botScript" rows="6" placeholder='// JavaScript example:
// function onMessage(msg, author, channelId) { 
//   if (msg === "/ping") return "Pong!";
//   return null;
// }
// For auto type, use setInterval logic.'></textarea>
        <input type="number" id="botInterval" placeholder="Interval (minutes) for auto type" value="5">
        <div class="modal-buttons">
            <button id="saveBotAdvancedBtn" class="btn-gold">Save Bot</button>
            <button id="closeBotEditorBtn" class="btn-danger">Cancel</button>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc",
        authDomain: "vertexpaste.firebaseapp.com",
        projectId: "vertexpaste",
        storageBucket: "vertexpaste.firebasestorage.app",
        messagingSenderId: "255275350380",
        appId: "1:255275350380:web:7be4e8add2cb5b04045b49"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    const ADMIN_EMAIL = "defnot67kid@gmail.com";
    let currentUser = null, isAdmin = false, currentChannelId = "general", unsubscribeMessages = null;
    let botIntervals = [], activeBots = [];
    
    function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    function formatTime(ts) { if(!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
    function showToast(msg, type="info") { const t=document.getElementById('toastMsg'); t.innerText=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
    
    async function loadChannels() {
        const docRef = db.collection("server").doc("structure");
        const docSnap = await docRef.get();
        if(docSnap.exists) return docSnap.data();
        const def={categories:[{name:"TEXT CHANNELS",channels:[{id:"general",name:"general"},{id:"announcements",name:"announcements"}]},{name:"TRADING",channels:[{id:"stonks",name:"stonks"}]}]};
        await docRef.set(def); return def;
    }
    async function saveChannels(data) { await db.collection("server").doc("structure").set(data); }
    
    async function renderSidebar() {
        const struct=await loadChannels();
        const container=document.getElementById('channelsList');
        let html='';
        for(const cat of struct.categories){
            html+=`<div class="category-group"><div class="category-title">${escapeHtml(cat.name)}${isAdmin?' <span class="add-channel" onclick="openAdminPanel()"> <i class="fas fa-plus"></i></span>':''}</div>`;
            for(const ch of cat.channels){
                html+=`<div class="channel-item ${currentChannelId===ch.id?'active':''}" data-channel-id="${ch.id}" data-channel-name="${ch.name}"><i class="fas fa-hashtag"></i> ${escapeHtml(ch.name)}</div>`;
            }
            html+=`</div>`;
        }
        container.innerHTML=html;
        document.querySelectorAll('.channel-item').forEach(el=>{el.addEventListener('click',()=>{switchChannel(el.dataset.channelId, el.dataset.channelName);});});
    }
    function switchChannel(id,name){ if(unsubscribeMessages) unsubscribeMessages(); currentChannelId=id; document.getElementById('currentChannelName').innerText=name; loadMessagesForChannel(id); renderSidebar(); }
    
    function loadMessagesForChannel(channelId){
        const container=document.getElementById('messagesContainer');
        unsubscribeMessages=db.collection("channels").doc(channelId).collection("messages").orderBy("createdAt","asc").onSnapshot(snapshot=>{
            let html='';
            snapshot.forEach(doc=>{const d=doc.data(); html+=`<div class="message ${d.isBot?'system-message':''}"><img src="${d.photoURL||'https://ui-avatars.com/api/?name=User'}" class="message-avatar"><div class="message-content"><div class="message-author">${escapeHtml(d.displayName)}${d.isBot?'<span class="bot-tag">BOT</span>':''}<span class="message-time">${formatTime(d.createdAt)}</span></div><div class="message-text">${escapeHtml(d.text)}</div></div></div>`;});
            if(!html) html='<div class="empty-chat">✨ No messages yet</div>';
            container.innerHTML=html; container.scrollTop=container.scrollHeight;
        });
    }
    
    async function sendMessage(){
        if(!currentUser) return;
        const input=document.getElementById('messageInput'), text=input.value.trim();
        if(!text) return;
        await db.collection("channels").doc(currentChannelId).collection("messages").add({text,uid:currentUser.uid,displayName:currentUser.displayName,photoURL:currentUser.photoURL,createdAt:firebase.firestore.FieldValue.serverTimestamp(),isBot:false});
        input.value='';
        // Trigger moderation
        await checkModeration(text, currentUser.displayName, currentChannelId);
    }
    
    // Advanced Bot Execution & Moderation
    async function executeBotScript(bot, msg, author, channelId){
        if(!bot.script) return null;
        try{
            if(bot.language==='javascript'){
                const func = new Function('msg', 'author', 'channelId', 'db', bot.script + '; if(typeof onMessage==="function") return onMessage(msg, author, channelId);');
                return await func(msg, author, channelId, db);
            } else if(bot.language==='python'){
                // Simulated Python eval - basic string operations
                const pyMatch = bot.script.match(/def on_message\(msg\):\s*return\s*["'](.+?)["']/);
                if(pyMatch) return pyMatch[1];
                return null;
            }
        } catch(e){ console.error("Bot error",e); return null; }
    }
    
    async function checkModeration(text, author, channelId){
        const modDoc = await db.collection("config").doc("moderation").get();
        if(modDoc.exists && modDoc.data().enabled){
            const badWords = modDoc.data().badWords || [];
            for(const word of badWords){
                if(text.toLowerCase().includes(word.toLowerCase())){
                    await db.collection("channels").doc(channelId).collection("messages").add({
                        text: `⚠️ Auto-Mod: "${word}" is not allowed, ${author}.`,
                        displayName: "ModBot",
                        photoURL: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png",
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        isBot: true
                    });
                    break;
                }
            }
        }
    }
    
    async function initBots(){
        botIntervals.forEach(clearInterval);
        const botsSnap = await db.collection("bots").get();
        for(const docSnap of botsSnap.docs){
            const bot=docSnap.data();
            if(bot.type==='auto' && bot.active!==false){
                const intervalId = setInterval(async()=>{
                    let targetChannels = bot.channels || [];
                    const struct = await loadChannels();
                    let allChannels = [];
                    for(const cat of struct.categories){
                        for(const ch of cat.channels) allChannels.push(ch.id);
                    }
                    const channelsToSend = targetChannels.length ? targetChannels : allChannels;
                    for(const chId of channelsToSend){
                        await db.collection("channels").doc(chId).collection("messages").add({
                            text: `🤖 **${bot.name}**: ${bot.autoMessage || "Automated message"}`,
                            displayName: bot.name,
                            photoURL: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png",
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            isBot: true
                        });
                    }
                }, (bot.interval||5)*60*1000);
                botIntervals.push(intervalId);
            }
            // Command bots are handled on message send
        }
        activeBots = botsSnap.docs.map(d=>({id:d.id,...d.data()}));
    }
    
    async function onNewMessageForCommands(msg, author, authorId, channelId){
        if(!msg.startsWith('/')) return;
        for(const bot of activeBots){
            if(bot.type==='command'){
                const targetCh = bot.channels || [];
                if(targetCh.length && !targetCh.includes(channelId)) continue;
                const response = await executeBotScript(bot, msg, author, channelId);
                if(response){
                    await db.collection("channels").doc(channelId).collection("messages").add({
                        text: `🤖 **${bot.name}**: ${response}`,
                        displayName: bot.name,
                        photoURL: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png",
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        isBot: true
                    });
                    break;
                }
            }
        }
    }
    
    // UI Admin Functions
    async function openAdminPanel(){
        if(!isAdmin) return;
        const modal=document.getElementById('adminModal');
        const struct=await loadChannels();
        const catsDiv=document.getElementById('categoriesListAdmin');
        catsDiv.innerHTML='';
        struct.categories.forEach((cat,idx)=>{catsDiv.innerHTML+=`<div class="flex-between" style="background:#0f172a; padding:8px; margin:5px 0; border-radius:8px;"><span><i class="fas fa-folder"></i> ${escapeHtml(cat.name)}</span><button class="btn-danger" onclick="deleteCategory(${idx})">Delete</button></div>`;});
        const catSelect=document.getElementById('categorySelect');
        catSelect.innerHTML='';
        struct.categories.forEach((cat,idx)=>{catSelect.innerHTML+=`<option value="${idx}">${escapeHtml(cat.name)}</option>`;});
        
        const botsSnap=await db.collection("bots").get();
        const botsDiv=document.getElementById('botsList');
        botsDiv.innerHTML='';
        botsSnap.forEach(doc=>{const b=doc.data(); botsDiv.innerHTML+=`<div class="bot-card"><div class="flex-between"><div><strong>${escapeHtml(b.name)}</strong><br><small>${b.language||'js'} | ${b.type}</small></div><button class="btn-danger" onclick="deleteBot('${doc.id}')">Delete</button></div><div style="font-size:0.75rem;">Channels: ${b.channels?.join(', ')||'ALL'}</div></div>`;});
        
        const modDoc=await db.collection("config").doc("moderation").get();
        const modDiv=document.getElementById('modRulesList');
        if(modDoc.exists){
            modDiv.innerHTML=`<p>🔒 Moderation Enabled: ${modDoc.data().enabled?'Yes':'No'}</p><p>Bad words: ${(modDoc.data().badWords||[]).join(', ')||'none'}</p>`;
        } else { modDiv.innerHTML='<p>No moderation rules</p>'; }
        
        modal.classList.add('active');
    }
    window.deleteCategory=async(idx)=>{const struct=await loadChannels(); struct.categories.splice(idx,1); await saveChannels(struct); await renderSidebar(); openAdminPanel(); showToast("Deleted","info");};
    window.deleteBot=async(botId)=>{await db.collection("bots").doc(botId).delete(); await initBots(); openAdminPanel(); showToast("Bot deleted","info");};
    
    document.getElementById('addCategoryBtn')?.addEventListener('click',async()=>{const name=document.getElementById('newCategoryName').value.trim(); if(!name) return; const struct=await loadChannels(); struct.categories.push({name:name.toUpperCase(),channels:[]}); await saveChannels(struct); await renderSidebar(); openAdminPanel(); document.getElementById('newCategoryName').value=''; showToast("Category added","success");});
    document.getElementById('addChannelBtn')?.addEventListener('click',async()=>{const catIdx=parseInt(document.getElementById('categorySelect').value); const chName=document.getElementById('newChannelName').value.trim(); if(!chName) return; const struct=await loadChannels(); const newId=chName.toLowerCase().replace(/\s/g,'_')+Date.now(); struct.categories[catIdx].channels.push({id:newId,name:chName}); await saveChannels(struct); await renderSidebar(); openAdminPanel(); document.getElementById('newChannelName').value=''; showToast("Channel added","success");});
    
    // Bot Editor with channel targeting
    let editingBotId=null;
    async function populateChannelSelector(selectedChannels=[]){
        const struct=await loadChannels();
        const container=document.getElementById('channelSelector');
        let allChannels=[];
        for(const cat of struct.categories){
            for(const ch of cat.channels) allChannels.push(ch);
        }
        container.innerHTML=allChannels.map(ch=>`<div class="channel-checkbox ${selectedChannels.includes(ch.id)?'selected':''}" data-channel-id="${ch.id}">#${escapeHtml(ch.name)}</div>`).join('');
        container.querySelectorAll('.channel-checkbox').forEach(el=>{
            el.addEventListener('click',()=>{el.classList.toggle('selected');});
        });
    }
    document.getElementById('createBotBtn')?.addEventListener('click',async()=>{
        editingBotId=null;
        document.getElementById('botName').value=''; document.getElementById('botScript').value='// function onMessage(msg, author, channelId) { if(msg==="/ping") return "Pong!"; }'; document.getElementById('botInterval').value='5';
        await populateChannelSelector([]);
        document.getElementById('botEditorModal').classList.add('active');
    });
    document.getElementById('saveBotAdvancedBtn')?.addEventListener('click',async()=>{
        const name=document.getElementById('botName').value.trim();
        const lang=document.getElementById('botLang').value;
        const type=document.getElementById('botType').value;
        const script=document.getElementById('botScript').value;
        const interval=parseInt(document.getElementById('botInterval').value);
        const channelCheckboxes=document.querySelectorAll('#channelSelector .channel-checkbox.selected');
        const channels=Array.from(channelCheckboxes).map(cb=>cb.dataset.channelId);
        let autoMessage='';
        if(type==='auto'){
            const match=script.match(/return\s+["'](.+?)["']/);
            autoMessage=match?match[1]:'Auto message';
        }
        if(!name){showToast("Bot name required","error"); return;}
        const botData={name,language:lang,type,script,interval,channels,autoMessage,active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
        if(editingBotId) await db.collection("bots").doc(editingBotId).set(botData);
        else await db.collection("bots").add(botData);
        await initBots();
        document.getElementById('botEditorModal').classList.remove('active');
        openAdminPanel();
        showToast(`Bot "${name}" saved`,"success");
    });
    
    document.getElementById('addBadWordBtn')?.addEventListener('click',async()=>{
        const word=document.getElementById('newBadWord').value.trim();
        if(!word) return;
        const modRef=db.collection("config").doc("moderation");
        const doc=await modRef.get();
        let words=doc.exists?doc.data().badWords:[];
        if(!words.includes(word)) words.push(word);
        await modRef.set({badWords:words,enabled:doc.exists?doc.data().enabled:true});
        document.getElementById('newBadWord').value='';
        openAdminPanel();
        showToast("Filter added","success");
    });
    document.getElementById('enableModerationBtn')?.addEventListener('click',async()=>{
        await db.collection("config").doc("moderation").set({enabled:true,badWords:[]},{merge:true});
        showToast("Auto-moderation enabled","success");
        openAdminPanel();
    });
    
    // Tab switching
    const catsTab=document.getElementById('categoriesTab'), botsTab=document.getElementById('botsTab'), modTab=document.getElementById('moderationTab');
    document.getElementById('tabCategoriesBtn')?.addEventListener('click',()=>{catsTab.style.display='block'; botsTab.style.display='none'; modTab.style.display='none';});
    document.getElementById('tabBotsBtn')?.addEventListener('click',()=>{catsTab.style.display='none'; botsTab.style.display='block'; modTab.style.display='none';});
    document.getElementById('tabModerationBtn')?.addEventListener('click',()=>{catsTab.style.display='none'; botsTab.style.display='none'; modTab.style.display='block';});
    
    // Override message listener to trigger commands
    const originalSend = sendMessage;
    window.sendMessage = async function(){
        if(!currentUser) return;
        const input=document.getElementById('messageInput'), text=input.value.trim();
        if(!text) return;
        await db.collection("channels").doc(currentChannelId).collection("messages").add({text,uid:currentUser.uid,displayName:currentUser.displayName,photoURL:currentUser.photoURL,createdAt:firebase.firestore.FieldValue.serverTimestamp(),isBot:false});
        input.value='';
        await onNewMessageForCommands(text, currentUser.displayName, currentUser.uid, currentChannelId);
        await checkModeration(text, currentUser.displayName, currentChannelId);
    };
    document.getElementById('sendBtn').onclick=()=>window.sendMessage();
    document.getElementById('messageInput').addEventListener('keypress',(e)=>{if(e.key==='Enter') window.sendMessage();});
    
    function updateUI(user){
        const overlay=document.getElementById('authOverlay'), sidebar=document.getElementById('sidebarPanel'), chat=document.getElementById('chatArea');
        if(user){
            overlay.style.display='none'; sidebar.style.display='flex'; chat.style.display='flex';
            document.getElementById('sidebarName').innerText=user.displayName||user.email;
            document.getElementById('sidebarAvatar').src=user.photoURL||`https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName||'User')}`;
            isAdmin=(user.email===ADMIN_EMAIL);
            document.getElementById('adminIndicator').classList.toggle('hidden',!isAdmin);
            document.getElementById('adminPanelBtn').style.display=isAdmin?'flex':'none';
            renderSidebar(); loadMessagesForChannel(currentChannelId); initBots();
        } else {
            overlay.style.display='flex'; sidebar.style.display='none'; chat.style.display='none';
            if(unsubscribeMessages) unsubscribeMessages();
        }
    }
    async function signIn(){ const provider=new firebase.auth.GoogleAuthProvider(); try{ await auth.signInWithPopup(provider); showToast("Welcome","success");} catch(e){ showToast("Sign in failed","error");} }
    async function signOut(){ await auth.signOut(); updateUI(null); showToast("Signed out","info");}
    document.getElementById('signInBtn')?.addEventListener('click',signIn);
    document.getElementById('signOutBtnNav')?.addEventListener('click',signOut);
    document.getElementById('signOutBtnTop')?.addEventListener('click',signOut);
    document.getElementById('closeAdminBtn')?.addEventListener('click',()=>document.getElementById('adminModal').classList.remove('active'));
    document.getElementById('closeBotEditorBtn')?.addEventListener('click',()=>document.getElementById('botEditorModal').classList.remove('active'));
    document.getElementById('adminPanelBtn')?.addEventListener('click',openAdminPanel);
    auth.onAuthStateChanged(user=>{ currentUser=user; updateUI(user); });
    window.openAdminPanel=openAdminPanel;
</script>
</body>
</html>
