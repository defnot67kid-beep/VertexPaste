<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Stonks Hub · Voice & Screen Share</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #e2e8f0; height: 100vh; overflow: hidden; }
        .app { display: flex; height: 100%; width: 100%; overflow: hidden; }
        .server-list { width: 72px; background: #0f0f14; border-right: 1px solid #1f2937; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 0; overflow-y: auto; flex-shrink: 0; }
        .server-icon { width: 48px; height: 48px; background: #1e293b; border-radius: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; position: relative; color: #fbbf24; font-weight: bold; }
        .server-icon.active { border-radius: 16px; background: linear-gradient(135deg, #fbbf24, #ef4444); color: white; }
        .server-icon:hover { border-radius: 16px; background: #334155; }
        .add-server-btn, .join-server-btn { background: #1f2937; border: 2px dashed #fbbf24; }
        .server-tooltip { position: absolute; left: 70px; background: #000c; padding: 4px 10px; border-radius: 20px; font-size: 12px; white-space: nowrap; display: none; z-index: 100; }
        .server-icon:hover .server-tooltip { display: block; }
        .sidebar { width: 280px; background: #111827; border-right: 1px solid #1f2937; display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.2s; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
        .server-name-header { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
        .server-actions { display: flex; gap: 8px; }
        .server-actions button { background: #1f2937; border: none; color: #fbbf24; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
        .category-group { margin: 8px 0; }
        .category-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px; cursor: pointer; color: #9ca3af; font-size: 0.7rem; text-transform: uppercase; font-weight: 600; }
        .category-header:hover { background: #1a2332; color: #fbbf24; }
        .category-header i { font-size: 10px; margin-right: 6px; }
        .channels-container { overflow: hidden; transition: max-height 0.2s; }
        .channels-container.collapsed { display: none; }
        .channel-item { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 32px; border-radius: 8px; cursor: pointer; color: #9ca3af; font-size: 0.85rem; }
        .channel-item.active { background: #1f2937; color: #fbbf24; }
        .channel-item:hover { background: #1f2937; }
        .voice-channel { color: #34d399; }
        .podcast-channel { color: #a78bfa; }
        .member-info { padding: 12px; border-top: 1px solid #1f2937; font-size: 13px; display: flex; align-items: center; justify-content: space-between; }
        .crown { color: #fbbf24; margin-left: 4px; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0f172a; overflow: hidden; min-width: 0; }
        .chat-header { padding: 12px 20px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; background: #0f172a; }
        .channel-info { display: flex; align-items: center; gap: 8px; }
        .invite-btn { background: #1e293b; border: none; padding: 6px 14px; border-radius: 20px; color: #fbbf24; cursor: pointer; font-size: 0.8rem; }
        
        /* VOICE CHANNEL UI */
        .voice-container { flex: 1; display: flex; flex-direction: column; background: #0a0a0f; overflow: hidden; }
        .screen-share-area { flex: 2; background: #000000; display: flex; flex-direction: column; position: relative; min-height: 0; }
        .share-canvas { flex: 1; display: flex; align-items: center; justify-content: center; background: #111; position: relative; }
        #screenVideo { width: 100%; height: 100%; object-fit: contain; background: black; display: none; }
        .no-share-placeholder { color: #475569; text-align: center; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .fullscreen-btn { position: absolute; bottom: 16px; right: 16px; background: #1e293b; border: none; color: white; padding: 8px 12px; border-radius: 30px; cursor: pointer; z-index: 10; }
        .fullscreen-btn:hover { background: #fbbf24; color: black; }
        
        .participants-area { background: #111827; border-top: 1px solid #1f2937; padding: 12px; max-height: 200px; overflow-y: auto; }
        .participant-list { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
        .participant { display: flex; flex-direction: column; align-items: center; gap: 6px; background: #1e293b; padding: 10px; border-radius: 16px; min-width: 80px; position: relative; }
        .participant-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #fbbf24; }
        .participant-name { font-size: 12px; font-weight: 500; }
        .mic-icon { position: absolute; bottom: 0; right: 5px; background: #0f172a; border-radius: 20px; padding: 2px 5px; font-size: 10px; }
        .mic-on { color: #34d399; }
        .mic-off { color: #ef4444; }
        
        .voice-controls { padding: 12px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; gap: 12px; justify-content: center; }
        .voice-btn { background: #1e293b; border: none; color: white; padding: 10px 20px; border-radius: 40px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .voice-btn.leave { background: #ef4444; }
        .voice-btn.share { background: #fbbf24; color: black; }
        
        .message { display: flex; gap: 10px; max-width: 100%; animation: fadeIn 0.2s; }
        .message-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .message-content { background: #1e293b; padding: 8px 14px; border-radius: 18px; word-break: break-word; flex: 1; }
        .message-author { font-weight: 600; font-size: 0.75rem; display: flex; gap: 6px; align-items: baseline; }
        .message-time { font-size: 0.6rem; color: #94a3b8; }
        .message-text { font-size: 0.85rem; margin-top: 4px; }
        .embed-link { margin-top: 8px; border-left: 3px solid #fbbf24; background: #0f172a; border-radius: 12px; padding: 10px; }
        .input-area { padding: 12px; border-top: 1px solid #1e293b; background: #0f172a; display: flex; gap: 10px; }
        .input-area input { flex: 1; background: #1e293b; border: none; padding: 12px 16px; border-radius: 30px; color: white; outline: none; }
        .input-area button { background: #fbbf24; border: none; padding: 0 20px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #0f172a; border-radius: 28px; padding: 24px; width: 90%; max-width: 450px; border: 1px solid #334155; }
        .modal-content input, .modal-content select { background: #1e293b; border: none; padding: 10px; border-radius: 12px; color: white; width: 100%; margin: 8px 0; }
        .btn-gold { background: #fbbf24; color: #0f172a; border: none; padding: 8px 18px; border-radius: 30px; font-weight: bold; cursor: pointer; margin-top: 12px; }
        .btn-outline { background: transparent; border: 1px solid #fbbf24; color: #fbbf24; padding: 6px 14px; border-radius: 30px; cursor: pointer; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 8px 20px; border-radius: 40px; z-index: 3000; border-left: 3px solid #fbbf24; }
        .hidden { display: none; }
        .owner-badge { background: #fbbf24; color: black; padding: 2px 8px; border-radius: 20px; font-size: 10px; margin-left: 6px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 700px) { .server-list { width: 60px; } .sidebar { position: fixed; left: 0; top: 0; height: 100%; transform: translateX(-100%); z-index: 1100; } .sidebar.open { transform: translateX(0); } .overlay { position: fixed; inset: 0; background: #00000080; z-index: 1050; display: none; } .overlay.active { display: block; } }
        .fullscreen { position: fixed !important; top: 0; left: 0; width: 100vw !important; height: 100vh !important; z-index: 9999; background: black; }
    </style>
</head>
<body>
<div class="app">
    <div class="server-list" id="serverListContainer"></div>
    <div class="sidebar" id="sidebarPanel">
        <div class="sidebar-header"><div class="server-name-header"><span id="currentServerName">Stonks Hub</span><span id="serverOwnerCrown"></span></div><div class="server-actions"><button id="createCategoryBtn"><i class="fas fa-folder-plus"></i></button><button id="invitePeopleBtn"><i class="fas fa-user-plus"></i></button><button id="deleteServerBtn" style="color:#ef4444;"><i class="fas fa-trash"></i></button></div></div>
        <div style="flex:1; overflow-y: auto;" id="channelsListContainer"></div>
        <div class="member-info"><span><i class="fas fa-user-circle"></i> <span id="userDisplay"></span><span id="roleBadge"></span></span><button id="signOutBtn" style="background:none; border:none; color:#fbbf24;"><i class="fas fa-sign-out-alt"></i></button></div>
    </div>
    <div class="overlay" id="mobileOverlay"></div>
    <div class="chat-area" id="chatArea">
        <div class="chat-header"><div class="channel-info"><i class="fas fa-hashtag" id="channelTypeIcon"></i><span id="currentChannelName">general</span></div><button class="invite-btn" id="headerInviteBtn"><i class="fas fa-link"></i> Invite</button></div>
        <div id="dynamicContentArea" style="flex:1; display: flex; flex-direction: column; overflow: hidden;"></div>
    </div>
</div>

<!-- Modals -->
<div id="createServerModal" class="modal"><div class="modal-content"><h3>Create Server</h3><input type="text" id="newServerName" placeholder="Server name"><button id="confirmCreateServer" class="btn-gold">Create</button><button id="closeCreateModal" class="btn-outline">Cancel</button></div></div>
<div id="createCategoryModal" class="modal"><div class="modal-content"><h3>New Category</h3><input type="text" id="categoryName" placeholder="Category name"><button id="confirmCreateCategory" class="btn-gold">Add</button><button id="closeCatModal" class="btn-outline">Cancel</button></div></div>
<div id="createChannelModal" class="modal"><div class="modal-content"><h3>New Channel</h3><input type="text" id="channelName" placeholder="Channel name"><select id="channelTypeSelect"><option value="text">📝 Text</option><option value="voice">🎙️ Voice</option><option value="podcast">🎧 Podcast</option></select><select id="categorySelect"></select><button id="confirmCreateChannel" class="btn-gold">Create</button><button id="closeChanModal" class="btn-outline">Cancel</button></div></div>
<div id="inviteModal" class="modal"><div class="modal-content"><h3>Invite</h3><p>Code: <strong id="inviteCodeDisplay"></strong></p><button id="closeInviteModal" class="btn-gold">Close</button></div></div>
<div id="joinServerModal" class="modal"><div class="modal-content"><h3>Join Server</h3><input type="text" id="joinCodeInput" placeholder="Invite code"><button id="confirmJoinServer" class="btn-gold">Join</button><button id="closeJoinModal" class="btn-outline">Cancel</button></div></div>
<div id="toastMsg" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = { apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc", authDomain: "vertexpaste.firebaseapp.com", projectId: "vertexpaste", storageBucket: "vertexpaste.firebasestorage.app", messagingSenderId: "255275350380", appId: "1:255275350380:web:7be4e8add2cb5b04045b49" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const OWNER_EMAIL = "defnot67kid@gmail.com";
    let currentUser = null, currentServerId = null, currentChannelId = null, currentChannelType = "text";
    let unsubscribeMessages = null, isGlobalOwner = false;
    
    // Voice Channel State (simulated real-time)
    let voiceParticipants = new Map(); // userId -> { name, avatar, micOn }
    let screenShareStream = null; let screenVideoElement = null;
    let isSharingScreen = false;
    let voiceChannelInterval = null;
    
    function showToast(msg) { const t = document.getElementById('toastMsg'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    function escapeHtml(s) { return String(s).replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])); }
    
    async function fetchUserServers() {
        if (!currentUser) return [];
        if (isGlobalOwner) { const all = await db.collection("servers").get(); return all.docs.map(d => ({ id: d.id, ...d.data() })); }
        const memberSnap = await db.collection("serverMembers").where("userId", "==", currentUser.uid).get();
        const serverIds = memberSnap.docs.map(d => d.data().serverId);
        if (!serverIds.length) return [];
        const servers = await Promise.all(serverIds.map(id => db.collection("servers").doc(id).get()));
        return servers.filter(s => s.exists).map(s => ({ id: s.id, ...s.data() }));
    }
    
    async function renderServerList() {
        const servers = await fetchUserServers();
        const container = document.getElementById('serverListContainer');
        let html = '';
        for (const sv of servers) html += `<div class="server-icon ${currentServerId === sv.id ? 'active' : ''}" data-server-id="${sv.id}"><span>${sv.name.charAt(0).toUpperCase()}</span><div class="server-tooltip">${escapeHtml(sv.name)}</div></div>`;
        html += `<div class="server-icon add-server-btn" id="addServerBtn"><i class="fas fa-plus"></i><div class="server-tooltip">Create</div></div>`;
        html += `<div class="server-icon join-server-btn" id="joinServerBtn"><i class="fas fa-sign-in-alt"></i><div class="server-tooltip">Join</div></div>`;
        container.innerHTML = html;
        document.querySelectorAll('.server-icon[data-server-id]').forEach(el => el.addEventListener('click', () => switchServer(el.dataset.serverId)));
        document.getElementById('addServerBtn')?.addEventListener('click', () => document.getElementById('createServerModal').classList.add('active'));
        document.getElementById('joinServerBtn')?.addEventListener('click', () => document.getElementById('joinServerModal').classList.add('active'));
    }
    
    async function switchServer(serverId) {
        if (unsubscribeMessages) unsubscribeMessages();
        if (voiceChannelInterval) clearInterval(voiceChannelInterval);
        currentServerId = serverId;
        const serverDoc = await db.collection("servers").doc(serverId).get();
        document.getElementById('currentServerName').innerHTML = escapeHtml(serverDoc.data()?.name || "Server");
        const isOwner = serverDoc.data()?.ownerId === currentUser?.uid;
        document.getElementById('serverOwnerCrown').innerHTML = isOwner ? '<i class="fas fa-crown crown"></i>' : '';
        await loadServerChannels(serverId);
        await renderServerList();
        closeSidebarMobile();
    }
    
    async function loadServerChannels(serverId) {
        const structRef = db.collection("serverStructure").doc(serverId);
        let struct = (await structRef.get()).data();
        if (!struct) { struct = { categories: [{ name: "TEXT CHANNELS", channels: [{ id: "general", name: "general", type: "text" }] }] }; await structRef.set(struct); }
        if (!currentChannelId || !findChannel(struct, currentChannelId)) { const first = findFirstTextChannel(struct); currentChannelId = first?.id || "general"; currentChannelType = first?.type || "text"; }
        else { const ch = findChannel(struct, currentChannelId); if (ch) currentChannelType = ch.type || "text"; }
        renderSidebarChannels(struct);
        if (currentChannelType === "text") renderTextChannel();
        else if (currentChannelType === "voice") renderVoiceChannel(currentChannelId);
        else if (currentChannelType === "podcast") renderPodcastChannel(currentChannelId);
        document.getElementById('currentChannelName').innerText = getChannelNameById(struct, currentChannelId);
        updateChannelIcon();
    }
    
    function findChannel(struct, chId) { for (const cat of struct.categories) for (const ch of cat.channels) if (ch.id === chId) return ch; return null; }
    function findFirstTextChannel(struct) { for (const cat of struct.categories) for (const ch of cat.channels) if (ch.type !== "voice" && ch.type !== "podcast") return ch; return struct.categories[0]?.channels[0]; }
    function getChannelNameById(struct, chId) { const ch = findChannel(struct, chId); return ch ? ch.name : chId; }
    function updateChannelIcon() { const icon = document.getElementById('channelTypeIcon'); icon.className = currentChannelType === "voice" ? "fas fa-microphone-alt" : (currentChannelType === "podcast" ? "fas fa-podcast" : "fas fa-hashtag"); }
    
    function renderSidebarChannels(struct) {
        const container = document.getElementById('channelsListContainer');
        let html = '';
        for (let i = 0; i < struct.categories.length; i++) {
            const cat = struct.categories[i];
            const isExpanded = localStorage.getItem(`collapse_${currentServerId}_${i}`) !== 'false';
            html += `<div class="category-group"><div class="category-header" data-cat-index="${i}"><i class="fas fa-chevron-${isExpanded ? 'down' : 'right'}"></i><span class="category-name">${escapeHtml(cat.name)}</span><button class="add-channel-btn" data-category="${escapeHtml(cat.name)}"><i class="fas fa-plus-circle"></i></button></div><div class="channels-container ${isExpanded ? '' : 'collapsed'}" data-cat-body="${i}">`;
            for (const ch of cat.channels) {
                let icon = ch.type === "voice" ? "fa-microphone-alt" : (ch.type === "podcast" ? "fa-podcast" : "fa-hashtag");
                html += `<div class="channel-item ${currentChannelId === ch.id ? 'active' : ''}" data-channel-id="${ch.id}" data-channel-type="${ch.type || 'text'}"><i class="fas ${icon}"></i> ${escapeHtml(ch.name)}</div>`;
            }
            html += `</div></div>`;
        }
        container.innerHTML = html;
        document.querySelectorAll('.category-header').forEach(h => { h.addEventListener('click', (e) => { if (e.target.classList.contains('add-channel-btn')) return; const idx = h.dataset.catIndex; const body = document.querySelector(`.channels-container[data-cat-body="${idx}"]`); if (body) { const collapsed = body.classList.toggle('collapsed'); const icon = h.querySelector('i'); icon.className = `fas fa-chevron-${collapsed ? 'right' : 'down'}`; localStorage.setItem(`collapse_${currentServerId}_${idx}`, (!collapsed).toString()); } }); });
        document.querySelectorAll('.channel-item').forEach(el => { el.addEventListener('click', () => { currentChannelId = el.dataset.channelId; currentChannelType = el.dataset.channelType || "text"; updateChannelIcon(); loadServerChannels(currentServerId); }); });
        document.querySelectorAll('.add-channel-btn').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); openCreateChannelModal(btn.dataset.category); }); });
    }
    
    // TEXT CHANNEL RENDER
    function renderTextChannel() {
        const area = document.getElementById('dynamicContentArea');
        area.innerHTML = `<div class="messages-container" id="messagesContainer" style="flex:1; overflow-y:auto; padding:16px;"></div><div class="input-area"><input type="text" id="messageInput" placeholder="Type a message..."><button id="sendBtn"><i class="fas fa-paper-plane"></i> Send</button></div>`;
        loadMessagesForChannel(currentServerId, currentChannelId);
        document.getElementById('sendBtn')?.addEventListener('click', sendMessage);
        document.getElementById('messageInput')?.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
    }
    
    async function loadMessagesForChannel(serverId, channelId) {
        if (unsubscribeMessages) unsubscribeMessages();
        const container = document.getElementById('messagesContainer');
        if (!container) return;
        unsubscribeMessages = db.collection("servers").doc(serverId).collection("channels").doc(channelId).collection("messages").orderBy("createdAt", "asc").onSnapshot(snapshot => {
            let html = '';
            snapshot.forEach(doc => { const d = doc.data(); let embedHtml = ''; if (d.embed) embedHtml = `<div class="embed-link"><div class="embed-title">${escapeHtml(d.embed.title || '')}</div><div class="embed-description">${escapeHtml(d.embed.description || '')}</div></div>`; html += `<div class="message"><img src="${escapeHtml(d.photoURL)}" class="message-avatar"><div class="message-content"><div class="message-author">${escapeHtml(d.displayName)}<span class="message-time">${d.createdAt ? new Date(d.createdAt.toDate()).toLocaleTimeString() : ''}</span></div><div class="message-text">${escapeHtml(d.text)}</div>${embedHtml}</div></div>`; });
            if (!html) html = '<div style="text-align:center;color:#6b7280;padding:40px;">✨ No messages</div>';
            container.innerHTML = html; container.scrollTop = container.scrollHeight;
        });
    }
    
    async function sendMessage() { if (!currentUser || currentChannelType !== "text") return; const input = document.getElementById('messageInput'); const text = input.value.trim(); if (!text) return; input.value = ''; await db.collection("servers").doc(currentServerId).collection("channels").doc(currentChannelId).collection("messages").add({ text, uid: currentUser.uid, displayName: currentUser.displayName, photoURL: currentUser.photoURL, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); }
    
    // VOICE CHANNEL with screen share simulation
    function renderVoiceChannel(channelId) {
        const area = document.getElementById('dynamicContentArea');
        area.innerHTML = `<div class="voice-container"><div class="screen-share-area"><div class="share-canvas" id="shareCanvas"><video id="screenVideo" autoplay playsinline></video><div id="noSharePlaceholder" class="no-share-placeholder"><i class="fas fa-desktop" style="font-size:48px;opacity:0.5"></i><span>No one is sharing their screen</span></div><button id="fullscreenBtn" class="fullscreen-btn" style="display:none;"><i class="fas fa-expand"></i> Fullscreen</button></div></div><div class="participants-area"><div class="participant-list" id="participantList"></div></div><div class="voice-controls"><button id="toggleMicBtn" class="voice-btn"><i class="fas fa-microphone"></i> Mute</button><button id="shareScreenBtn" class="voice-btn share"><i class="fas fa-desktop"></i> Share Screen</button><button id="leaveVoiceBtn" class="voice-btn leave"><i class="fas fa-phone-slash"></i> Disconnect</button></div></div>`;
        
        // Simulate joining voice channel: add current user to participants
        if (!voiceParticipants.has(currentUser.uid)) {
            voiceParticipants.set(currentUser.uid, { name: currentUser.displayName, avatar: currentUser.photoURL, micOn: true });
        }
        // Simulate random other users for demo
        if (voiceParticipants.size === 1) { voiceParticipants.set("user2", { name: "CryptoTrader", avatar: "https://ui-avatars.com/api/?name=CT", micOn: true }); voiceParticipants.set("user3", { name: "StonkMaster", avatar: "https://ui-avatars.com/api/?name=SM", micOn: false }); }
        
        updateParticipantList();
        let userMicMuted = false;
        document.getElementById('toggleMicBtn')?.addEventListener('click', () => { userMicMuted = !userMicMuted; const p = voiceParticipants.get(currentUser.uid); if (p) p.micOn = !userMicMuted; updateParticipantList(); document.getElementById('toggleMicBtn').innerHTML = userMicMuted ? '<i class="fas fa-microphone-slash"></i> Unmute' : '<i class="fas fa-microphone"></i> Mute'; showToast(userMicMuted ? "Microphone muted" : "Microphone on"); });
        
        const shareBtn = document.getElementById('shareScreenBtn');
        const screenVideo = document.getElementById('screenVideo');
        const noShareDiv = document.getElementById('noSharePlaceholder');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        shareBtn?.addEventListener('click', async () => {
            if (isSharingScreen) { stopScreenShare(); return; }
            try { const stream = await navigator.mediaDevices.getDisplayMedia({ video: true }); screenShareStream = stream; screenVideo.srcObject = stream; screenVideo.style.display = 'block'; noShareDiv.style.display = 'none'; fullscreenBtn.style.display = 'flex'; isSharingScreen = true; shareBtn.innerHTML = '<i class="fas fa-stop"></i> Stop Share'; stream.getVideoTracks()[0].onended = () => stopScreenShare(); showToast("Screen sharing started"); } catch(e) { showToast("Screen share cancelled"); } });
        
        function stopScreenShare() { if (screenShareStream) { screenShareStream.getTracks().forEach(t => t.stop()); screenVideo.srcObject = null; } screenVideo.style.display = 'none'; noShareDiv.style.display = 'flex'; fullscreenBtn.style.display = 'none'; isSharingScreen = false; if (shareBtn) shareBtn.innerHTML = '<i class="fas fa-desktop"></i> Share Screen'; }
        
        fullscreenBtn?.addEventListener('click', () => { const canvas = document.querySelector('.share-canvas'); if (!document.fullscreenElement) canvas.requestFullscreen(); else document.exitFullscreen(); });
        
        document.getElementById('leaveVoiceBtn')?.addEventListener('click', () => { stopScreenShare(); voiceParticipants.clear(); if (voiceChannelInterval) clearInterval(voiceChannelInterval); loadServerChannels(currentServerId); showToast("Disconnected from voice"); });
        
        voiceChannelInterval = setInterval(() => { if (currentChannelType === "voice") updateParticipantList(); }, 2000);
    }
    
    function updateParticipantList() {
        const container = document.getElementById('participantList');
        if (!container) return;
        let html = '';
        for (let [uid, p] of voiceParticipants.entries()) {
            html += `<div class="participant"><img src="${escapeHtml(p.avatar)}" class="participant-avatar"><span class="participant-name">${escapeHtml(p.name)}</span><div class="mic-icon ${p.micOn ? 'mic-on' : 'mic-off'}"><i class="fas fa-${p.micOn ? 'microphone' : 'microphone-slash'}"></i></div></div>`;
        }
        container.innerHTML = html || '<div style="color:#6b7280;padding:12px;">No participants</div>';
    }
    
    function renderPodcastChannel(channelId) { const area = document.getElementById('dynamicContentArea'); area.innerHTML = `<div class="voice-container" style="justify-content:center;align-items:center;"><div style="background:#1e293b;border-radius:32px;padding:40px;text-align:center;"><i class="fas fa-podcast" style="font-size:64px;color:#a78bfa;"></i><h2 style="margin-top:16px;">Podcast Studio 🎧</h2><p>You're listening to ${escapeHtml(channelId)}</p><button id="exitPodcastBtn" class="voice-btn leave" style="margin-top:24px;"><i class="fas fa-sign-out-alt"></i> Exit</button></div></div>`; document.getElementById('exitPodcastBtn')?.addEventListener('click', () => loadServerChannels(currentServerId)); }
    
    // Server Management
    async function createServer(name) { if (!currentUser) return; const serverRef = db.collection("servers").doc(); await serverRef.set({ name, ownerId: currentUser.uid }); await db.collection("serverMembers").add({ serverId: serverRef.id, userId: currentUser.uid, role: "owner" }); await db.collection("serverStructure").doc(serverRef.id).set({ categories: [{ name: "TEXT CHANNELS", channels: [{ id: "general", name: "general", type: "text" }] }] }); showToast(`Server "${name}" created`); await switchServer(serverRef.id); renderServerList(); }
    async function deleteCurrentServer() { if (!currentServerId) return; const doc = await db.collection("servers").doc(currentServerId).get(); if (doc.data()?.name === "Stonks Hub") { showToast("Cannot delete Stonks Hub"); return; } const can = isGlobalOwner || (currentUser && doc.data()?.ownerId === currentUser.uid); if (!can) { showToast("Only owner"); return; } if (confirm("Delete server?")) { await db.collection("servers").doc(currentServerId).delete(); await db.collection("serverStructure").doc(currentServerId).delete(); const members = await db.collection("serverMembers").where("serverId", "==", currentServerId).get(); members.forEach(m => m.ref.delete()); showToast("Server deleted"); currentServerId = null; const servers = await fetchUserServers(); if (servers.length) await switchServer(servers[0].id); else { document.getElementById('currentServerName').innerHTML = "No Server"; document.getElementById('dynamicContentArea').innerHTML = ''; } renderServerList(); } }
    async function generateInvite() { if (!currentServerId) return; const code = Math.random().toString(36).substring(2, 10).toUpperCase(); await db.collection("invites").doc(code).set({ serverId: currentServerId }); document.getElementById('inviteCodeDisplay').innerText = code; document.getElementById('inviteModal').classList.add('active'); }
    async function joinWithCode(code) { const invite = await db.collection("invites").doc(code).get(); if (!invite.exists) { showToast("Invalid"); return; } const serverId = invite.data().serverId; const existing = await db.collection("serverMembers").where("serverId", "==", serverId).where("userId", "==", currentUser.uid).get(); if (!existing.empty) { showToast("Already member"); return; } await db.collection("serverMembers").add({ serverId, userId: currentUser.uid }); showToast("Joined!"); await renderServerList(); await switchServer(serverId); }
    async function createCategory(name) { if (!currentServerId) return; const ref = db.collection("serverStructure").doc(currentServerId); const struct = (await ref.get()).data() || { categories: [] }; struct.categories.push({ name, channels: [] }); await ref.set(struct); loadServerChannels(currentServerId); showToast(`Category ${name}`); }
    async function createChannel(name, type, categoryName) { const ref = db.collection("serverStructure").doc(currentServerId); const struct = (await ref.get()).data(); const cat = struct.categories.find(c => c.name === categoryName); if (!cat) return; const newId = name.toLowerCase().replace(/\s/g, '-') + Date.now(); cat.channels.push({ id: newId, name, type }); await ref.set(struct); loadServerChannels(currentServerId); showToast(`${type} channel created`); }
    function openCreateChannelModal(catName) { const sel = document.getElementById('categorySelect'); sel.innerHTML = ''; db.collection("serverStructure").doc(currentServerId).get().then(doc => { const struct = doc.data(); struct.categories.forEach(c => { const opt = document.createElement('option'); opt.value = c.name; opt.innerText = c.name; sel.appendChild(opt); }); sel.value = catName; }); document.getElementById('createChannelModal').classList.add('active'); }
    
    function openSidebarMobile() { document.getElementById('sidebarPanel').classList.add('open'); document.getElementById('mobileOverlay').classList.add('active'); }
    function closeSidebarMobile() { document.getElementById('sidebarPanel').classList.remove('open'); document.getElementById('mobileOverlay').classList.remove('active'); }
    
    function updateAuthUI(user) { if (user) { if (document.getElementById('authOverlay')) document.getElementById('authOverlay').style.display = 'none'; document.getElementById('userDisplay').innerHTML = escapeHtml(user.displayName || user.email); isGlobalOwner = (user.email === OWNER_EMAIL); document.getElementById('roleBadge').innerHTML = isGlobalOwner ? '<span class="owner-badge"><i class="fas fa-crown"></i> OWNER</span>' : ''; renderServerList().then(async () => { const servers = await fetchUserServers(); if (servers.length && !currentServerId) await switchServer(servers[0].id); }); } }
    
    document.getElementById('signOutBtn')?.addEventListener('click', () => auth.signOut());
    document.getElementById('createCategoryBtn')?.addEventListener('click', () => document.getElementById('createCategoryModal').classList.add('active'));
    document.getElementById('invitePeopleBtn')?.addEventListener('click', generateInvite);
    document.getElementById('headerInviteBtn')?.addEventListener('click', generateInvite);
    document.getElementById('deleteServerBtn')?.addEventListener('click', deleteCurrentServer);
    document.getElementById('confirmCreateServer')?.addEventListener('click', async () => { const n = document.getElementById('newServerName').value; if (n) await createServer(n); document.getElementById('createServerModal').classList.remove('active'); });
    document.getElementById('closeCreateModal')?.addEventListener('click', () => document.getElementById('createServerModal').classList.remove('active'));
    document.getElementById('confirmCreateCategory')?.addEventListener('click', async () => { const n = document.getElementById('categoryName').value; if (n) await createCategory(n); document.getElementById('createCategoryModal').classList.remove('active'); document.getElementById('categoryName').value = ''; });
    document.getElementById('closeCatModal')?.addEventListener('click', () => document.getElementById('createCategoryModal').classList.remove('active'));
    document.getElementById('confirmCreateChannel')?.addEventListener('click', async () => { const name = document.getElementById('channelName').value; const type = document.getElementById('channelTypeSelect').value; const cat = document.getElementById('categorySelect').value; if (name && cat) await createChannel(name, type, cat); document.getElementById('createChannelModal').classList.remove('active'); document.getElementById('channelName').value = ''; });
    document.getElementById('closeChanModal')?.addEventListener('click', () => document.getElementById('createChannelModal').classList.remove('active'));
    document.getElementById('closeInviteModal')?.addEventListener('click', () => document.getElementById('inviteModal').classList.remove('active'));
    document.getElementById('confirmJoinServer')?.addEventListener('click', async () => { const c = document.getElementById('joinCodeInput').value; if (c) await joinWithCode(c); document.getElementById('joinServerModal').classList.remove('active'); });
    document.getElementById('closeJoinModal')?.addEventListener('click', () => document.getElementById('joinServerModal').classList.remove('active'));
    document.getElementById('mobileOverlay')?.addEventListener('click', closeSidebarMobile);
    const menuBtn = document.createElement('button'); menuBtn.innerHTML = '<i class="fas fa-bars"></i>'; menuBtn.style.cssText = "position:fixed;bottom:20px;left:20px;background:#fbbf24;border:none;border-radius:50%;width:48px;height:48px;z-index:1200;display:none;"; document.body.appendChild(menuBtn); if (window.innerWidth <= 700) menuBtn.style.display = 'flex'; else menuBtn.style.display = 'none'; menuBtn.addEventListener('click', openSidebarMobile); window.addEventListener('resize', () => { if (window.innerWidth <= 700) menuBtn.style.display = 'flex'; else menuBtn.style.display = 'none'; });
    auth.onAuthStateChanged(user => { currentUser = user; updateAuthUI(user); });
    setTimeout(async () => { const all = await db.collection("servers").get(); if (all.empty) { const hub = db.collection("servers").doc(); await hub.set({ name: "Stonks Hub", ownerId: "system" }); await db.collection("serverStructure").doc(hub.id).set({ categories: [{ name: "VOICE ZONE", channels: [{ id: "vc1", name: "General Voice", type: "voice" }] }, { name: "TEXT", channels: [{ id: "general", name: "general", type: "text" }] }] }); } }, 500);
</script>
<div id="authOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0f;z-index:9999;display:flex;align-items:center;justify-content:center;"><div style="background:#1e293b;padding:30px;border-radius:28px;text-align:center;"><i class="fas fa-chart-line" style="font-size:48px;color:#fbbf24;"></i><h2>Stonks Hub</h2><p>Voice + Screen Share</p><button id="googleSignInBtn" style="background:#fbbf24;border:none;padding:12px 28px;border-radius:40px;margin-top:20px;font-weight:600;">Sign in with Google</button></div></div>
<script> document.getElementById('googleSignInBtn')?.addEventListener('click', () => firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())); </script>
</body>
