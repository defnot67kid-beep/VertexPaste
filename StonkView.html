<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Stonks Hub · Voice & Screen Share + Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #e2e8f0; height: 100vh; overflow: hidden; }
        .app { display: flex; height: 100%; width: 100%; overflow: hidden; }
        .server-list { width: 72px; background: #0f0f14; border-right: 1px solid #1f2937; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 0; overflow-y: auto; flex-shrink: 0; }
        .server-icon { width: 48px; height: 48px; background: #1e293b; border-radius: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; position: relative; color: #fbbf24; font-weight: bold; }
        .server-icon.active { border-radius: 16px; background: linear-gradient(135deg, #fbbf24, #ef4444); color: white; }
        .server-icon:hover { border-radius: 16px; background: #334155; }
        .add-server-btn, .join-server-btn { background: #1f2937; border: 2px dashed #fbbf24; }
        .server-tooltip { position: absolute; left: 70px; background: #000c; padding: 4px 10px; border-radius: 20px; font-size: 12px; white-space: nowrap; display: none; z-index: 100; }
        .server-icon:hover .server-tooltip { display: block; }
        .sidebar { width: 280px; background: #111827; border-right: 1px solid #1f2937; display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.2s; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
        .server-name-header { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
        .server-actions { display: flex; gap: 8px; }
        .server-actions button { background: #1f2937; border: none; color: #fbbf24; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
        .category-group { margin: 8px 0; }
        .category-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px; cursor: pointer; color: #9ca3af; font-size: 0.7rem; text-transform: uppercase; font-weight: 600; }
        .category-header:hover { background: #1a2332; color: #fbbf24; }
        .category-header i { font-size: 10px; margin-right: 6px; }
        .channels-container { overflow: hidden; transition: max-height 0.2s; }
        .channels-container.collapsed { display: none; }
        .channel-item-wrapper { display: flex; align-items: center; justify-content: space-between; padding-right: 8px; }
        .channel-item { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 32px; border-radius: 8px; cursor: pointer; color: #9ca3af; font-size: 0.85rem; flex: 1; }
        .channel-item.active { background: #1f2937; color: #fbbf24; }
        .channel-item:hover { background: #1f2937; }
        .channel-settings-icon { opacity: 0; cursor: pointer; color: #9ca3af; font-size: 12px; transition: 0.1s; padding: 4px; }
        .channel-item-wrapper:hover .channel-settings-icon { opacity: 1; }
        .channel-settings-icon:hover { color: #fbbf24; }
        .member-info { padding: 12px; border-top: 1px solid #1f2937; font-size: 13px; display: flex; align-items: center; justify-content: space-between; }
        .crown { color: #fbbf24; margin-left: 4px; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0f172a; overflow: hidden; min-width: 0; }
        .chat-header { padding: 12px 20px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; background: #0f172a; }
        .channel-info { display: flex; align-items: center; gap: 8px; }
        .invite-btn { background: #1e293b; border: none; padding: 6px 14px; border-radius: 20px; color: #fbbf24; cursor: pointer; font-size: 0.8rem; }
        
        /* VOICE CHANNEL UI */
        .voice-container { flex: 1; display: flex; flex-direction: column; background: #0a0a0f; overflow: hidden; }
        .screen-share-area { flex: 2; background: #000000; display: flex; flex-direction: column; position: relative; min-height: 0; display: none; }
        .screen-share-area.active { display: flex; }
        .share-canvas { flex: 1; display: flex; align-items: center; justify-content: center; background: #111; position: relative; }
        #screenVideo { width: 100%; height: 100%; object-fit: contain; background: black; }
        .fullscreen-btn { position: absolute; bottom: 16px; right: 16px; background: #1e293b; border: none; color: white; padding: 8px 12px; border-radius: 30px; cursor: pointer; z-index: 10; }
        .participants-main { flex: 1; display: flex; align-items: flex-start; justify-content: flex-start; flex-wrap: wrap; gap: 16px; padding: 20px; overflow-y: auto; align-content: flex-start; }
        .participant-card { display: flex; flex-direction: column; align-items: center; gap: 8px; background: #1e293b; padding: 16px; border-radius: 20px; min-width: 100px; transition: 0.2s; }
        .participant-avatar { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #fbbf24; }
        .participant-name { font-size: 13px; font-weight: 500; }
        .mic-status { font-size: 10px; padding: 2px 8px; border-radius: 20px; }
        .mic-on { color: #34d399; background: #0f172a; }
        .mic-off { color: #ef4444; background: #0f172a; }
        .participants-sidebar { background: #111827; border-top: 1px solid #1f2937; padding: 12px; max-height: 180px; overflow-y: auto; display: none; }
        .participants-sidebar.active { display: block; }
        .participant-list-side { display: flex; flex-wrap: wrap; gap: 10px; }
        .participant-side-item { display: flex; align-items: center; gap: 8px; background: #1e293b; padding: 5px 12px; border-radius: 30px; font-size: 12px; }
        .voice-controls { padding: 12px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; gap: 12px; justify-content: center; }
        .voice-btn { background: #1e293b; border: none; color: white; padding: 10px 20px; border-radius: 40px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .voice-btn.leave { background: #ef4444; }
        .voice-btn.share { background: #fbbf24; color: black; }
        
        .message { display: flex; gap: 10px; max-width: 100%; animation: fadeIn 0.2s; }
        .message-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .message-content { background: #1e293b; padding: 8px 14px; border-radius: 18px; word-break: break-word; flex: 1; }
        .input-area { padding: 12px; border-top: 1px solid #1e293b; background: #0f172a; display: flex; gap: 10px; }
        .input-area input { flex: 1; background: #1e293b; border: none; padding: 12px 16px; border-radius: 30px; color: white; outline: none; }
        .input-area button { background: #fbbf24; border: none; padding: 0 20px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        
        /* SETTINGS MODAL - FULL SCREEN */
        .settings-modal { display: none; position: fixed; inset: 0; background: #0a0a0f; z-index: 10000; flex-direction: column; }
        .settings-modal.active { display: flex; }
        .settings-header { background: #111827; padding: 16px 24px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
        .settings-tabs { display: flex; gap: 8px; background: #0f172a; padding: 12px 24px; border-bottom: 1px solid #1f2937; }
        .settings-tab { padding: 8px 20px; border-radius: 30px; cursor: pointer; background: #1e293b; color: #94a3b8; font-size: 14px; }
        .settings-tab.active { background: #fbbf24; color: #0f172a; font-weight: 600; }
        .settings-content { flex: 1; overflow-y: auto; padding: 24px; }
        .settings-pane { display: none; max-width: 800px; margin: 0 auto; width: 100%; }
        .settings-pane.active { display: block; }
        .setting-group { margin-bottom: 24px; }
        .setting-label { font-weight: 600; margin-bottom: 8px; display: block; }
        .setting-desc { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
        .setting-input { width: 100%; background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 12px; color: white; }
        select.setting-input { cursor: pointer; }
        .toggle-switch { display: inline-block; width: 50px; height: 26px; background: #334155; border-radius: 30px; position: relative; cursor: pointer; transition: 0.2s; }
        .toggle-switch.active { background: #fbbf24; }
        .toggle-switch:after { content: ""; position: absolute; width: 22px; height: 22px; background: white; border-radius: 50%; top: 2px; left: 3px; transition: 0.2s; }
        .toggle-switch.active:after { left: 25px; }
        .permission-list { margin-top: 16px; background: #111827; border-radius: 16px; padding: 12px; }
        .permission-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #1f2937; }
        .permission-item:last-child { border-bottom: none; }
        .remove-perm { color: #ef4444; cursor: pointer; background: none; border: none; }
        .add-permission-btn { background: #1e293b; border: none; color: #fbbf24; padding: 8px 16px; border-radius: 30px; margin-top: 12px; cursor: pointer; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #0f172a; border-radius: 28px; padding: 24px; width: 90%; max-width: 450px; }
        .btn-gold { background: #fbbf24; color: #0f172a; border: none; padding: 8px 18px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .btn-outline { background: transparent; border: 1px solid #fbbf24; color: #fbbf24; padding: 6px 14px; border-radius: 30px; cursor: pointer; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 8px 20px; border-radius: 40px; z-index: 11000; border-left: 3px solid #fbbf24; }
        .hidden { display: none; }
        .owner-badge { background: #fbbf24; color: black; padding: 2px 8px; border-radius: 20px; font-size: 10px; margin-left: 6px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 700px) { .server-list { width: 60px; } .sidebar { position: fixed; left: 0; top: 0; height: 100%; transform: translateX(-100%); z-index: 1100; } .sidebar.open { transform: translateX(0); } .overlay { position: fixed; inset: 0; background: #00000080; z-index: 1050; display: none; } .overlay.active { display: block; } }
    </style>
</head>
<body>
<div class="app">
    <div class="server-list" id="serverListContainer"></div>
    <div class="sidebar" id="sidebarPanel">
        <div class="sidebar-header"><div class="server-name-header"><span id="currentServerName">Stonks Hub</span><span id="serverOwnerCrown"></span></div><div class="server-actions"><button id="createCategoryBtn"><i class="fas fa-folder-plus"></i></button><button id="invitePeopleBtn"><i class="fas fa-user-plus"></i></button><button id="deleteServerBtn" style="color:#ef4444;"><i class="fas fa-trash"></i></button></div></div>
        <div style="flex:1; overflow-y: auto;" id="channelsListContainer"></div>
        <div class="member-info"><span><i class="fas fa-user-circle"></i> <span id="userDisplay"></span><span id="roleBadge"></span></span><button id="signOutBtn" style="background:none; border:none; color:#fbbf24;"><i class="fas fa-sign-out-alt"></i></button></div>
    </div>
    <div class="overlay" id="mobileOverlay"></div>
    <div class="chat-area" id="chatArea">
        <div class="chat-header"><div class="channel-info"><i class="fas fa-hashtag" id="channelTypeIcon"></i><span id="currentChannelName">general</span></div><button class="invite-btn" id="headerInviteBtn"><i class="fas fa-link"></i> Invite</button></div>
        <div id="dynamicContentArea" style="flex:1; display: flex; flex-direction: column; overflow: hidden;"></div>
    </div>
</div>

<!-- Full Screen Settings Modal -->
<div id="settingsModal" class="settings-modal">
    <div class="settings-header"><h3><i class="fas fa-cog"></i> Channel Settings</h3><button id="closeSettingsBtn" class="btn-outline"><i class="fas fa-times"></i> Close</button></div>
    <div class="settings-tabs" id="settingsTabs">
        <div class="settings-tab active" data-tab="overview">Overview</div>
        <div class="settings-tab" data-tab="permissions">Permissions</div>
    </div>
    <div class="settings-content">
        <div class="settings-pane active" id="overviewPane">
            <div class="setting-group"><label class="setting-label">Channel Name</label><input type="text" id="channelNameInput" class="setting-input" placeholder="Channel name"></div>
            <div class="setting-group"><label class="setting-label">Channel Topic</label><input type="text" id="channelTopicInput" class="setting-input" placeholder="What's this channel about?"></div>
            <div class="setting-group"><label class="setting-label">Slow Mode</label><select id="slowModeSelect" class="setting-input"><option value="0">Off</option><option value="5">5 seconds</option><option value="10">10 seconds</option><option value="15">15 seconds</option><option value="30">30 seconds</option><option value="60">1 minute</option><option value="120">2 minutes</option><option value="300">5 minutes</option><option value="600">10 minutes</option><option value="900">15 minutes</option><option value="1800">30 minutes</option><option value="3600">1 hour</option><option value="7200">2 hours</option><option value="21600">6 hours</option></select></div>
        </div>
        <div class="settings-pane" id="permissionsPane">
            <div class="setting-group"><label class="setting-label">Private Channel</label><div class="setting-desc">Make this channel visible only to specific people or roles</div><div id="privateToggle" class="toggle-switch"></div></div>
            <div id="privateChannelPanel" style="display:none; margin-top: 20px;">
                <div class="setting-group"><label class="setting-label">Allowed Roles</label><div id="allowedRolesList" class="permission-list"></div><button id="addRoleBtn" class="add-permission-btn"><i class="fas fa-plus"></i> Add Role</button></div>
                <div class="setting-group"><label class="setting-label">Allowed Members</label><div id="allowedMembersList" class="permission-list"></div><button id="addMemberBtn" class="add-permission-btn"><i class="fas fa-user-plus"></i> Add Member</button></div>
            </div>
        </div>
    </div>
</div>

<!-- Other Modals -->
<div id="createServerModal" class="modal"><div class="modal-content"><h3>Create Server</h3><input type="text" id="newServerName"><button id="confirmCreateServer" class="btn-gold">Create</button><button id="closeCreateModal" class="btn-outline">Cancel</button></div></div>
<div id="createCategoryModal" class="modal"><div class="modal-content"><h3>New Category</h3><input type="text" id="categoryName"><button id="confirmCreateCategory" class="btn-gold">Add</button><button id="closeCatModal" class="btn-outline">Cancel</button></div></div>
<div id="createChannelModal" class="modal"><div class="modal-content"><h3>New Channel</h3><input type="text" id="channelName" placeholder="Channel name"><select id="channelTypeSelect"><option value="text">Text</option><option value="voice">Voice</option><option value="podcast">Podcast</option></select><select id="categorySelect"></select><button id="confirmCreateChannel" class="btn-gold">Create</button><button id="closeChanModal" class="btn-outline">Cancel</button></div></div>
<div id="inviteModal" class="modal"><div class="modal-content"><h3>Invite</h3><p>Code: <strong id="inviteCodeDisplay"></strong></p><button id="closeInviteModal" class="btn-gold">Close</button></div></div>
<div id="joinServerModal" class="modal"><div class="modal-content"><h3>Join Server</h3><input type="text" id="joinCodeInput"><button id="confirmJoinServer" class="btn-gold">Join</button><button id="closeJoinModal" class="btn-outline">Cancel</button></div></div>
<div id="toastMsg" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = { apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc", authDomain: "vertexpaste.firebaseapp.com", projectId: "vertexpaste", storageBucket: "vertexpaste.firebasestorage.app", messagingSenderId: "255275350380", appId: "1:255275350380:web:7be4e8add2cb5b04045b49" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const OWNER_EMAIL = "defnot67kid@gmail.com";
    let currentUser = null, currentServerId = null, currentChannelId = null, currentChannelType = "text";
    let unsubscribeMessages = null, isGlobalOwner = false;
    let currentEditingChannel = null;
    let localStream = null, isMicMuted = false, screenStream = null, isSharingScreen = false;
    let voiceUnsubscribe = null, screenUnsubscribe = null;

    function showToast(msg) { const t = document.getElementById('toastMsg'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    function escapeHtml(s) { return String(s).replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])); }
    
    async function fetchUserServers() { if (!currentUser) return []; if (isGlobalOwner) { const all = await db.collection("servers").get(); return all.docs.map(d => ({ id: d.id, ...d.data() })); } const memberSnap = await db.collection("serverMembers").where("userId", "==", currentUser.uid).get(); const serverIds = memberSnap.docs.map(d => d.data().serverId); if (!serverIds.length) return []; const servers = await Promise.all(serverIds.map(id => db.collection("servers").doc(id).get())); return servers.filter(s => s.exists).map(s => ({ id: s.id, ...s.data() })); }
    async function renderServerList() { const servers = await fetchUserServers(); const container = document.getElementById('serverListContainer'); let html = ''; for (const sv of servers) html += `<div class="server-icon ${currentServerId === sv.id ? 'active' : ''}" data-server-id="${sv.id}"><span>${sv.name.charAt(0).toUpperCase()}</span><div class="server-tooltip">${escapeHtml(sv.name)}</div></div>`; html += `<div class="server-icon add-server-btn" id="addServerBtn"><i class="fas fa-plus"></i><div class="server-tooltip">Create</div></div><div class="server-icon join-server-btn" id="joinServerBtn"><i class="fas fa-sign-in-alt"></i><div class="server-tooltip">Join</div></div>`; container.innerHTML = html; document.querySelectorAll('.server-icon[data-server-id]').forEach(el => el.addEventListener('click', () => switchServer(el.dataset.serverId))); document.getElementById('addServerBtn')?.addEventListener('click', () => document.getElementById('createServerModal').classList.add('active')); document.getElementById('joinServerBtn')?.addEventListener('click', () => document.getElementById('joinServerModal').classList.add('active')); }
    
    async function switchServer(serverId) { if (unsubscribeMessages) unsubscribeMessages(); leaveVoiceChannel(); currentServerId = serverId; const serverDoc = await db.collection("servers").doc(serverId).get(); document.getElementById('currentServerName').innerHTML = escapeHtml(serverDoc.data()?.name || "Server"); const isOwner = serverDoc.data()?.ownerId === currentUser?.uid; document.getElementById('serverOwnerCrown').innerHTML = isOwner ? '<i class="fas fa-crown crown"></i>' : ''; await loadServerChannels(serverId); await renderServerList(); closeSidebarMobile(); }
    
    async function loadServerChannels(serverId) { const structRef = db.collection("serverStructure").doc(serverId); let struct = (await structRef.get()).data(); if (!struct) { struct = { categories: [{ name: "TEXT CHANNELS", channels: [{ id: "general", name: "general", type: "text", topic: "", slowMode: 0 }] }] }; await structRef.set(struct); } if (!currentChannelId || !findChannel(struct, currentChannelId)) { const first = findFirstTextChannel(struct); currentChannelId = first?.id || "general"; currentChannelType = first?.type || "text"; } else { const ch = findChannel(struct, currentChannelId); if (ch) currentChannelType = ch.type || "text"; } renderSidebarChannels(struct); if (currentChannelType === "text") renderTextChannel(); else if (currentChannelType === "voice") renderVoiceChannel(currentChannelId); else if (currentChannelType === "podcast") renderPodcastChannel(currentChannelId); document.getElementById('currentChannelName').innerText = getChannelNameById(struct, currentChannelId); updateChannelIcon(); }
    
    function findChannel(struct, chId) { for (const cat of struct.categories) for (const ch of cat.channels) if (ch.id === chId) return ch; return null; }
    function findFirstTextChannel(struct) { for (const cat of struct.categories) for (const ch of cat.channels) if (ch.type !== "voice" && ch.type !== "podcast") return ch; return struct.categories[0]?.channels[0]; }
    function getChannelNameById(struct, chId) { const ch = findChannel(struct, chId); return ch ? ch.name : chId; }
    function updateChannelIcon() { const icon = document.getElementById('channelTypeIcon'); icon.className = currentChannelType === "voice" ? "fas fa-microphone-alt" : (currentChannelType === "podcast" ? "fas fa-podcast" : "fas fa-hashtag"); }
    
    function renderSidebarChannels(struct) { const container = document.getElementById('channelsListContainer'); let html = ''; for (let i = 0; i < struct.categories.length; i++) { const cat = struct.categories[i]; const isExpanded = localStorage.getItem(`collapse_${currentServerId}_${i}`) !== 'false'; html += `<div class="category-group"><div class="category-header" data-cat-index="${i}"><i class="fas fa-chevron-${isExpanded ? 'down' : 'right'}"></i><span class="category-name">${escapeHtml(cat.name)}</span><button class="add-channel-btn" data-category="${escapeHtml(cat.name)}"><i class="fas fa-plus-circle"></i></button></div><div class="channels-container ${isExpanded ? '' : 'collapsed'}" data-cat-body="${i}">`; for (const ch of cat.channels) { let icon = ch.type === "voice" ? "fa-microphone-alt" : (ch.type === "podcast" ? "fa-podcast" : "fa-hashtag"); html += `<div class="channel-item-wrapper"><div class="channel-item ${currentChannelId === ch.id ? 'active' : ''}" data-channel-id="${ch.id}" data-channel-type="${ch.type || 'text'}"><i class="fas ${icon}"></i> ${escapeHtml(ch.name)}</div><i class="fas fa-cog channel-settings-icon" data-channel-id="${ch.id}" data-channel-name="${escapeHtml(ch.name)}"></i></div>`; } html += `</div></div>`; } container.innerHTML = html; document.querySelectorAll('.channel-item').forEach(el => { el.addEventListener('click', () => { currentChannelId = el.dataset.channelId; currentChannelType = el.dataset.channelType || "text"; updateChannelIcon(); loadServerChannels(currentServerId); }); }); document.querySelectorAll('.channel-settings-icon').forEach(icon => { icon.addEventListener('click', (e) => { e.stopPropagation(); const chId = icon.dataset.channelId; openChannelSettings(chId); }); }); document.querySelectorAll('.category-header').forEach(h => { h.addEventListener('click', (e) => { if (e.target.classList.contains('add-channel-btn')) return; const idx = h.dataset.catIndex; const body = document.querySelector(`.channels-container[data-cat-body="${idx}"]`); if (body) { const collapsed = body.classList.toggle('collapsed'); const icon = h.querySelector('i'); icon.className = `fas fa-chevron-${collapsed ? 'right' : 'down'}`; localStorage.setItem(`collapse_${currentServerId}_${idx}`, (!collapsed).toString()); } }); }); document.querySelectorAll('.add-channel-btn').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); openCreateChannelModal(btn.dataset.category); }); }); }
    
    async function openChannelSettings(channelId) { const struct = (await db.collection("serverStructure").doc(currentServerId).get()).data(); const channel = findChannel(struct, channelId); if (!channel) return; currentEditingChannel = { id: channelId, ...channel }; document.getElementById('channelNameInput').value = channel.name || ''; document.getElementById('channelTopicInput').value = channel.topic || ''; document.getElementById('slowModeSelect').value = channel.slowMode || '0'; const privateEnabled = channel.private || false; const toggle = document.getElementById('privateToggle'); if (privateEnabled) toggle.classList.add('active'); else toggle.classList.remove('active'); document.getElementById('privateChannelPanel').style.display = privateEnabled ? 'block' : 'none'; if (privateEnabled) { updatePermissionList('allowedRolesList', channel.allowedRoles || []); updatePermissionList('allowedMembersList', channel.allowedMembers || []); } document.getElementById('settingsModal').classList.add('active'); }
    
    function updatePermissionList(containerId, items) { const container = document.getElementById(containerId); if (!container) return; container.innerHTML = items.map(item => `<div class="permission-item"><span>${escapeHtml(item)}</span><button class="remove-perm" data-item="${escapeHtml(item)}"><i class="fas fa-times"></i></button></div>`).join(''); document.querySelectorAll(`#${containerId} .remove-perm`).forEach(btn => { btn.addEventListener('click', async () => { const item = btn.dataset.item; await saveChannelSettings({ [containerId === 'allowedRolesList' ? 'allowedRoles' : 'allowedMembers']: items.filter(i => i !== item) }); openChannelSettings(currentEditingChannel.id); }); }); }
    
    async function saveChannelSettings(updates) { const structRef = db.collection("serverStructure").doc(currentServerId); const struct = (await structRef.get()).data(); for (let cat of struct.categories) { const idx = cat.channels.findIndex(ch => ch.id === currentEditingChannel.id); if (idx !== -1) { cat.channels[idx] = { ...cat.channels[idx], ...updates }; break; } } await structRef.set(struct); showToast("Settings saved"); loadServerChannels(currentServerId); }
    
    document.getElementById('closeSettingsBtn')?.addEventListener('click', () => document.getElementById('settingsModal').classList.remove('active'));
    document.getElementById('channelNameInput')?.addEventListener('change', (e) => saveChannelSettings({ name: e.target.value }));
    document.getElementById('channelTopicInput')?.addEventListener('change', (e) => saveChannelSettings({ topic: e.target.value }));
    document.getElementById('slowModeSelect')?.addEventListener('change', (e) => saveChannelSettings({ slowMode: parseInt(e.target.value) }));
    document.getElementById('privateToggle')?.addEventListener('click', () => { const isActive = document.getElementById('privateToggle').classList.toggle('active'); document.getElementById('privateChannelPanel').style.display = isActive ? 'block' : 'none'; saveChannelSettings({ private: isActive, allowedRoles: isActive ? [] : undefined, allowedMembers: isActive ? [] : undefined }); });
    document.querySelectorAll('.settings-tab').forEach(tab => { tab.addEventListener('click', () => { document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active')); tab.classList.add('active'); document.querySelectorAll('.settings-pane').forEach(p => p.classList.remove('active')); document.getElementById(tab.dataset.tab + 'Pane').classList.add('active'); }); });
    document.getElementById('addRoleBtn')?.addEventListener('click', () => { const role = prompt("Enter role name:"); if (role) { const structRef = db.collection("serverStructure").doc(currentServerId); structRef.get().then(async doc => { const struct = doc.data(); for (let cat of struct.categories) { const ch = cat.channels.find(c => c.id === currentEditingChannel.id); if (ch) { ch.allowedRoles = [...(ch.allowedRoles || []), role]; break; } } await structRef.set(struct); openChannelSettings(currentEditingChannel.id); }); } });
    document.getElementById('addMemberBtn')?.addEventListener('click', () => { const member = prompt("Enter member username:"); if (member) { const structRef = db.collection("serverStructure").doc(currentServerId); structRef.get().then(async doc => { const struct = doc.data(); for (let cat of struct.categories) { const ch = cat.channels.find(c => c.id === currentEditingChannel.id); if (ch) { ch.allowedMembers = [...(ch.allowedMembers || []), member]; break; } } await structRef.set(struct); openChannelSettings(currentEditingChannel.id); }); } });
    
    function renderTextChannel() { const area = document.getElementById('dynamicContentArea'); area.innerHTML = `<div class="messages-container" id="messagesContainer" style="flex:1; overflow-y:auto; padding:16px;"></div><div class="input-area"><input type="text" id="messageInput" placeholder="Type a message..."><button id="sendBtn">Send</button></div>`; loadMessagesForChannel(currentServerId, currentChannelId); document.getElementById('sendBtn')?.addEventListener('click', sendMessage); document.getElementById('messageInput')?.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); }); }
    async function loadMessagesForChannel(serverId, channelId) { if (unsubscribeMessages) unsubscribeMessages(); const container = document.getElementById('messagesContainer'); if (!container) return; unsubscribeMessages = db.collection("servers").doc(serverId).collection("channels").doc(channelId).collection("messages").orderBy("createdAt", "asc").onSnapshot(snapshot => { let html = ''; snapshot.forEach(doc => { const d = doc.data(); html += `<div class="message"><img src="${escapeHtml(d.photoURL)}" class="message-avatar"><div class="message-content"><div class="message-author">${escapeHtml(d.displayName)}<span class="message-time">${d.createdAt ? new Date(d.createdAt.toDate()).toLocaleTimeString() : ''}</span></div><div class="message-text">${escapeHtml(d.text)}</div></div></div>`; }); if (!html) html = '<div style="text-align:center;color:#6b7280;padding:40px;">✨ No messages</div>'; container.innerHTML = html; container.scrollTop = container.scrollHeight; }); }
    async function sendMessage() { if (!currentUser || currentChannelType !== "text") return; const input = document.getElementById('messageInput'); const text = input.value.trim(); if (!text) return; input.value = ''; await db.collection("servers").doc(currentServerId).collection("channels").doc(currentChannelId).collection("messages").add({ text, uid: currentUser.uid, displayName: currentUser.displayName, photoURL: currentUser.photoURL, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); }
    
    // Voice channel with proper participants grid (left to right, wrap)
    async function renderVoiceChannel(channelId) { const area = document.getElementById('dynamicContentArea'); area.innerHTML = `<div class="voice-container"><div class="screen-share-area" id="screenShareArea"><div class="share-canvas"><video id="screenVideo" autoplay playsinline style="width:100%;height:100%;object-fit:contain;"></video><button id="fullscreenBtn" class="fullscreen-btn" style="display:none;"><i class="fas fa-expand"></i> Fullscreen</button></div></div><div class="participants-main" id="participantsMainGrid"></div><div class="participants-sidebar" id="participantsSidebar"></div><div class="voice-controls"><button id="toggleMicBtn" class="voice-btn"><i class="fas fa-microphone"></i> Mute</button><button id="shareScreenBtn" class="voice-btn share"><i class="fas fa-desktop"></i> Share Screen</button><button id="leaveVoiceBtn" class="voice-btn leave"><i class="fas fa-phone-slash"></i> Disconnect</button></div></div>`; await requestMicrophone(); const voiceStateRef = db.collection("voiceStates").doc(`${channelId}_${currentUser.uid}`); await voiceStateRef.set({ userId: currentUser.uid, displayName: currentUser.displayName, photoURL: currentUser.photoURL, micOn: !isMicMuted, channelId, serverId: currentServerId, joinedAt: firebase.firestore.FieldValue.serverTimestamp() }); if (voiceUnsubscribe) voiceUnsubscribe(); voiceUnsubscribe = db.collection("voiceStates").where("channelId", "==", channelId).where("serverId", "==", currentServerId).onSnapshot(snapshot => { const participants = []; snapshot.forEach(doc => participants.push(doc.data())); updateVoiceUI(participants); }); screenUnsubscribe = db.collection("screenShares").doc(channelId).onSnapshot(doc => { const data = doc.data(); const screenArea = document.getElementById('screenShareArea'); if (data && data.active && data.screenUrl) { screenArea.classList.add('active'); document.getElementById('screenVideo').src = data.screenUrl; document.getElementById('fullscreenBtn').style.display = 'flex'; } else { screenArea.classList.remove('active'); document.getElementById('fullscreenBtn').style.display = 'none'; document.getElementById('screenVideo').src = ''; } }); document.getElementById('toggleMicBtn')?.addEventListener('click', toggleMicrophone); document.getElementById('shareScreenBtn')?.addEventListener('click', toggleScreenShare); document.getElementById('leaveVoiceBtn')?.addEventListener('click', () => leaveVoiceChannel()); document.getElementById('fullscreenBtn')?.addEventListener('click', () => { const canvas = document.querySelector('.share-canvas'); if (canvas) canvas.requestFullscreen(); }); }
    
    function updateVoiceUI(participants) { const mainGrid = document.getElementById('participantsMainGrid'); const screenArea = document.getElementById('screenShareArea'); const hasScreenShare = screenArea?.classList.contains('active'); if (!hasScreenShare) { mainGrid.style.display = 'flex'; let gridHtml = ''; for (const p of participants) { gridHtml += `<div class="participant-card"><img src="${escapeHtml(p.photoURL)}" class="participant-avatar"><span class="participant-name">${escapeHtml(p.displayName)}</span><div class="mic-status ${p.micOn ? 'mic-on' : 'mic-off'}"><i class="fas fa-${p.micOn ? 'microphone' : 'microphone-slash'}"></i></div></div>`; } mainGrid.innerHTML = gridHtml || '<div style="color:#6b7280;text-align:center;">No one else is here</div>'; const sidebar = document.getElementById('participantsSidebar'); sidebar.classList.remove('active'); } else { mainGrid.style.display = 'flex'; mainGrid.innerHTML = ''; const sidebar = document.getElementById('participantsSidebar'); sidebar.classList.add('active'); let listHtml = '<div class="participant-list-side">'; for (const p of participants) { listHtml += `<div class="participant-side-item"><img src="${escapeHtml(p.photoURL)}" style="width:28px;height:28px;border-radius:50%;"><span>${escapeHtml(p.displayName)}</span><i class="fas fa-${p.micOn ? 'microphone' : 'microphone-slash'}" style="font-size:10px;"></i></div>`; } listHtml += '</div>'; sidebar.innerHTML = listHtml; } }
    
    async function requestMicrophone() { try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); isMicMuted = false; return true; } catch(e) { isMicMuted = true; return false; } }
    async function toggleMicrophone() { if (!localStream) await requestMicrophone(); if (localStream) { const audioTrack = localStream.getAudioTracks()[0]; if (audioTrack) audioTrack.enabled = !audioTrack.enabled; isMicMuted = !audioTrack?.enabled; } else { isMicMuted = !isMicMuted; } const btn = document.getElementById('toggleMicBtn'); if (btn) btn.innerHTML = isMicMuted ? '<i class="fas fa-microphone-slash"></i> Unmute' : '<i class="fas fa-microphone"></i> Mute'; if (currentChannelId && currentUser) await db.collection("voiceStates").doc(`${currentChannelId}_${currentUser.uid}`).update({ micOn: !isMicMuted }); }
    async function toggleScreenShare() { if (isSharingScreen) { if (screenStream) screenStream.getTracks().forEach(t => t.stop()); await db.collection("screenShares").doc(currentChannelId).delete(); isSharingScreen = false; showToast("Screen share stopped"); } else { try { const stream = await navigator.mediaDevices.getDisplayMedia({ video: true }); screenStream = stream; const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' }); const chunks = []; mediaRecorder.ondataavailable = e => chunks.push(e.data); mediaRecorder.onstop = async () => { const blob = new Blob(chunks, { type: 'video/webm' }); const url = URL.createObjectURL(blob); await db.collection("screenShares").doc(currentChannelId).set({ active: true, screenUrl: url, sharedBy: currentUser.uid, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); }; mediaRecorder.start(); stream.getVideoTracks()[0].onended = () => { mediaRecorder.stop(); isSharingScreen = false; }; isSharingScreen = true; showToast("Sharing screen..."); setTimeout(() => mediaRecorder.stop(), 100); } catch(e) { showToast("Screen share cancelled"); } } const btn = document.getElementById('shareScreenBtn'); if (btn) btn.innerHTML = isSharingScreen ? '<i class="fas fa-stop"></i> Stop Share' : '<i class="fas fa-desktop"></i> Share Screen'; }
    async function leaveVoiceChannel() { if (currentChannelId && currentUser) await db.collection("voiceStates").doc(`${currentChannelId}_${currentUser.uid}`).delete().catch(()=>{}); if (voiceUnsubscribe) voiceUnsubscribe(); if (screenUnsubscribe) screenUnsubscribe(); if (localStream) localStream.getTracks().forEach(t => t.stop()); if (screenStream) screenStream.getTracks().forEach(t => t.stop()); localStream = null; isSharingScreen = false; loadServerChannels(currentServerId); }
    function renderPodcastChannel(channelId) { const area = document.getElementById('dynamicContentArea'); area.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center;"><div style="background:#1e293b;border-radius:32px;padding:40px;text-align:center;"><i class="fas fa-podcast" style="font-size:64px;color:#a78bfa;"></i><h2>Podcast Studio 🎧</h2><button id="exitPodcastBtn" class="voice-btn leave" style="margin-top:24px;">Exit</button></div></div>`; document.getElementById('exitPodcastBtn')?.addEventListener('click', () => loadServerChannels(currentServerId)); }
    
    async function createServer(name) { if (!currentUser) return; const serverRef = db.collection("servers").doc(); await serverRef.set({ name, ownerId: currentUser.uid }); await db.collection("serverMembers").add({ serverId: serverRef.id, userId: currentUser.uid, role: "owner" }); await db.collection("serverStructure").doc(serverRef.id).set({ categories: [{ name: "TEXT CHANNELS", channels: [{ id: "general", name: "general", type: "text" }] }] }); showToast(`Server "${name}" created`); await switchServer(serverRef.id); renderServerList(); }
    async function deleteCurrentServer() { if (!currentServerId) return; const doc = await db.collection("servers").doc(currentServerId).get(); if (doc.data()?.name === "Stonks Hub") { showToast("Cannot delete Stonks Hub"); return; } const can = isGlobalOwner || (currentUser && doc.data()?.ownerId === currentUser.uid); if (!can) { showToast("Only owner"); return; } if (confirm("Delete server?")) { await db.collection("servers").doc(currentServerId).delete(); await db.collection("serverStructure").doc(currentServerId).delete(); const members = await db.collection("serverMembers").where("serverId", "==", currentServerId).get(); members.forEach(m => m.ref.delete()); showToast("Server deleted"); currentServerId = null; const servers = await fetchUserServers(); if (servers.length) await switchServer(servers[0].id); else { document.getElementById('currentServerName').innerHTML = "No Server"; document.getElementById('dynamicContentArea').innerHTML = ''; } renderServerList(); } }
    async function generateInvite() { if (!currentServerId) return; const code = Math.random().toString(36).substring(2, 10).toUpperCase(); await db.collection("invites").doc(code).set({ serverId: currentServerId }); document.getElementById('inviteCodeDisplay').innerText = code; document.getElementById('inviteModal').classList.add('active'); }
    async function joinWithCode(code) { const invite = await db.collection("invites").doc(code).get(); if (!invite.exists) { showToast("Invalid"); return; } const serverId = invite.data().serverId; const existing = await db.collection("serverMembers").where("serverId", "==", serverId).where("userId", "==", currentUser.uid).get(); if (!existing.empty) { showToast("Already member"); return; } await db.collection("serverMembers").add({ serverId, userId: currentUser.uid }); showToast("Joined!"); await renderServerList(); await switchServer(serverId); }
    async function createCategory(name) { if (!currentServerId) return; const ref = db.collection("serverStructure").doc(currentServerId); const struct = (await ref.get()).data() || { categories: [] }; struct.categories.push({ name, channels: [] }); await ref.set(struct); loadServerChannels(currentServerId); showToast(`Category ${name}`); }
    async function createChannel(name, type, categoryName) { const ref = db.collection("serverStructure").doc(currentServerId); const struct = (await ref.get()).data(); const cat = struct.categories.find(c => c.name === categoryName); if (!cat) return; const newId = name.toLowerCase().replace(/\s/g, '-') + Date.now(); cat.channels.push({ id: newId, name, type, topic: "", slowMode: 0 }); await ref.set(struct); loadServerChannels(currentServerId); showToast(`${type} channel created`); }
    function openCreateChannelModal(catName) { const sel = document.getElementById('categorySelect'); sel.innerHTML = ''; db.collection("serverStructure").doc(currentServerId).get().then(doc => { const struct = doc.data(); struct.categories.forEach(c => { const opt = document.createElement('option'); opt.value = c.name; opt.innerText = c.name; sel.appendChild(opt); }); sel.value = catName; }); document.getElementById('createChannelModal').classList.add('active'); }
    function openSidebarMobile() { document.getElementById('sidebarPanel').classList.add('open'); document.getElementById('mobileOverlay').classList.add('active'); }
    function closeSidebarMobile() { document.getElementById('sidebarPanel').classList.remove('open'); document.getElementById('mobileOverlay').classList.remove('active'); }
    function updateAuthUI(user) { if (user) { if (document.getElementById('authOverlay')) document.getElementById('authOverlay').style.display = 'none'; document.getElementById('userDisplay').innerHTML = escapeHtml(user.displayName || user.email); isGlobalOwner = (user.email === OWNER_EMAIL); document.getElementById('roleBadge').innerHTML = isGlobalOwner ? '<span class="owner-badge"><i class="fas fa-crown"></i> OWNER</span>' : ''; renderServerList().then(async () => { const servers = await fetchUserServers(); if (servers.length && !currentServerId) await switchServer(servers[0].id); }); } }
    
    document.getElementById('signOutBtn')?.addEventListener('click', () => auth.signOut());
    document.getElementById('createCategoryBtn')?.addEventListener('click', () => document.getElementById('createCategoryModal').classList.add('active'));
    document.getElementById('invitePeopleBtn')?.addEventListener('click', generateInvite);
    document.getElementById('headerInviteBtn')?.addEventListener('click', generateInvite);
    document.getElementById('deleteServerBtn')?.addEventListener('click', deleteCurrentServer);
    document.getElementById('confirmCreateServer')?.addEventListener('click', async () => { const n = document.getElementById('newServerName').value; if (n) await createServer(n); document.getElementById('createServerModal').classList.remove('active'); });
    document.getElementById('closeCreateModal')?.addEventListener('click', () => document.getElementById('createServerModal').classList.remove('active'));
    document.getElementById('confirmCreateCategory')?.addEventListener('click', async () => { const n = document.getElementById('categoryName').value; if (n) await createCategory(n); document.getElementById('createCategoryModal').classList.remove('active'); document.getElementById('categoryName').value = ''; });
    document.getElementById('closeCatModal')?.addEventListener('click', () => document.getElementById('createCategoryModal').classList.remove('active'));
    document.getElementById('confirmCreateChannel')?.addEventListener('click', async () => { const name = document.getElementById('channelName').value; const type = document.getElementById('channelTypeSelect').value; const cat = document.getElementById('categorySelect').value; if (name && cat) await createChannel(name, type, cat); document.getElementById('createChannelModal').classList.remove('active'); document.getElementById('channelName').value = ''; });
    document.getElementById('closeChanModal')?.addEventListener('click', () => document.getElementById('createChannelModal').classList.remove('active'));
    document.getElementById('closeInviteModal')?.addEventListener('click', () => document.getElementById('inviteModal').classList.remove('active'));
    document.getElementById('confirmJoinServer')?.addEventListener('click', async () => { const c = document.getElementById('joinCodeInput').value; if (c) await joinWithCode(c); document.getElementById('joinServerModal').classList.remove('active'); });
    document.getElementById('closeJoinModal')?.addEventListener('click', () => document.getElementById('joinServerModal').classList.remove('active'));
    document.getElementById('mobileOverlay')?.addEventListener('click', closeSidebarMobile);
    const menuBtn = document.createElement('button'); menuBtn.innerHTML = '<i class="fas fa-bars"></i>'; menuBtn.style.cssText = "position:fixed;bottom:20px;left:20px;background:#fbbf24;border:none;border-radius:50%;width:48px;height:48px;z-index:1200;display:none;"; document.body.appendChild(menuBtn); if (window.innerWidth <= 700) menuBtn.style.display = 'flex'; else menuBtn.style.display = 'none'; menuBtn.addEventListener('click', openSidebarMobile);
    auth.onAuthStateChanged(user => { currentUser = user; updateAuthUI(user); });
    setTimeout(async () => { const all = await db.collection("servers").get(); if (all.empty) { const hub = db.collection("servers").doc(); await hub.set({ name: "Stonks Hub", ownerId: "system" }); await db.collection("serverStructure").doc(hub.id).set({ categories: [{ name: "VOICE ZONE", channels: [{ id: "vc_main", name: "General Voice", type: "voice" }] }, { name: "TEXT", channels: [{ id: "general", name: "general", type: "text" }] }] }); } }, 500);
</script>
<div id="authOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0f;z-index:9999;display:flex;align-items:center;justify-content:center;"><div style="background:#1e293b;padding:30px;border-radius:28px;text-align:center;"><i class="fas fa-chart-line" style="font-size:48px;color:#fbbf24;"></i><h2>Stonks Hub</h2><p>Voice + Screen Share + Channel Settings</p><button id="googleSignInBtn" style="background:#fbbf24;border:none;padding:12px 28px;border-radius:40px;margin-top:20px;font-weight:600;">Sign in with Google</button></div></div>
<script> document.getElementById('googleSignInBtn')?.addEventListener('click', () => firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())); </script>
