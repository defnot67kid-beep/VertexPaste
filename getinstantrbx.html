        body {

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .portal-card {
            max-width: 780px;
            width: 100%;
            background: rgba(12, 18, 32, 0.92);
            backdrop-filter: blur(16px);
            border-radius: 2.2rem;
            border: 1px solid rgba(255, 190, 70, 0.3);
            box-shadow: 0 28px 40px -14px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .step-pane {
            padding: 2rem 1.8rem 2.2rem;
        }

        h2 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFE3A4, #FFA83C);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.4rem;
        }

        .sub {
            color: #9db2e0;
            font-size: 0.85rem;
            border-left: 3px solid #FFA83C;
            padding-left: 0.75rem;
            margin-bottom: 1.8rem;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 600;
            color: #f0f3fc;
            margin-bottom: 1.2rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1.2rem 0;
        }

        .btn {
            border: none;
            background: #1f2946;
            color: white;
            font-weight: 600;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(98deg, #F2A65A, #FF8C42);
            color: #131c2c;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(242, 166, 90, 0.3);
        }

        .btn-primary:hover {
            transform: scale(0.97);
            filter: brightness(1.05);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #4c6085;
            color: #ccdcff;
        }

        .roblox-login-area {
            background: #0a1022cc;
            border-radius: 1.5rem;
            padding: 1.3rem;
            margin: 0.8rem 0;
            border: 1px solid #314267;
        }

        .username-input {
            width: 100%;
            padding: 14px 18px;
            background: #0e162f;
            border: 1px solid #445177;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .username-input:focus {
            border-color: #FFB347;
            box-shadow: 0 0 0 3px rgba(255, 180, 71, 0.3);
        }

        .privacy-box {
            background: #070d21b3;
            border-radius: 1.4rem;
            padding: 1.3rem;
            border: 1px solid #3c4770;
        }

        .accept-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 1rem 0 0.5rem;
        }

        .media-preview {
            background: #030917;
            border-radius: 28px;
            padding: 1rem;
            text-align: center;
        }

        .preview-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000aa;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #5e6e97;
            margin-bottom: 1rem;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .action-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 0.8rem 0;
        }

        .status-message {
            background: #0e172b;
            padding: 0.7rem;
            border-radius: 40px;
            font-size: 0.85rem;
            text-align: center;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 180, 70, 0.3);
            border-radius: 50%;
            border-top-color: #FFB347;
            animation: spin 0.7s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .admin-dashboard {
            margin-top: 0.5rem;
            background: #010617cc;
            border-radius: 1.8rem;
            padding: 1.2rem;
            border: 1px solid #f5a62355;
        }

        .submissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
            margin-top: 18px;
            max-height: 550px;
            overflow-y: auto;
            padding: 6px;
        }

        .submission-card {
            background: #0b1022;
            border-radius: 20px;
            padding: 12px;
            border: 1px solid #ffb34755;
            transition: 0.2s;
        }

        .media-thumb {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 16px;
            background: #000;
            cursor: pointer;
            transition: 0.2s;
        }

        .blurred-img {
            filter: blur(28px);
        }

        .unblurred-img {
            filter: blur(0px);
        }

        .admin-badge-label {
            background: #f5a62320;
            color: #FFCC80;
            border-radius: 60px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .validate-btn {
            background: #2c6e2c;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
        }
        
        .validate-btn.approved {
            background: #2c6e2c;
            opacity: 0.7;
            cursor: default;
        }

        .unblur-toggle {
            background: #a05e1a;
            margin-top: 6px;
            width: 100%;
            font-size: 0.7rem;
            padding: 6px;
        }

        .refresh-btn {
            background: #3a5a8c;
            margin-bottom: 12px;
            width: auto;
            padding: 8px 16px;
            font-size: 0.8rem;
        }

        footer {

            text-align: center;
            color: #6580b0;
            padding: 1rem;

        hr {

            margin: 12px 0;
