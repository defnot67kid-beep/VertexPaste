<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Roblox Gamepass Sync — Firebase Sender</title>
    <!-- Firebase SDKs (modular style, latest v9+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getDatabase, ref, push, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

        // Your provided Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc",
            authDomain: "vertexpaste.firebaseapp.com",
            projectId: "vertexpaste",
            storageBucket: "vertexpaste.firebasestorage.app",
            messagingSenderId: "255275350380",
            appId: "1:255275350380:web:7be4e8add2cb5b04045b49"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        // Reference to main collection: "gamepassEntries" (auto-creates if not exists)
        const gamepassRef = ref(database, 'gamepassEntries');

        // DOM elements
        const gamepassInput = document.getElementById('gamepassIdInput');
        const sendButton = document.getElementById('sendButton');
        const statusDiv = document.getElementById('statusMessage');
        const resultIdSpan = document.getElementById('resultId');

        // Helper: Show status with success/error styling
        function showStatus(message, isError = false) {
            statusDiv.textContent = message;
            statusDiv.classList.remove('hidden', 'success', 'error');
            if (isError) {
                statusDiv.classList.add('error');
            } else {
                statusDiv.classList.add('success');
            }
            // Auto-hide status after 4 seconds if it's a success (optional)
            if (!isError) {
                setTimeout(() => {
                    if (statusDiv.classList.contains('success')) {
                        statusDiv.classList.add('hidden');
                    }
                }, 4500);
            } else {
                // Error stays longer but also can fade? we keep visible, but let user see.
                setTimeout(() => {
                    if (statusDiv.classList.contains('error')) {
                        statusDiv.classList.add('hidden');
                    }
                }, 6000);
            }
        }

        // Core function: push gamepass ID to Firebase
        async function sendGamepassToFirebase(gamepassId) {
            if (!gamepassId || gamepassId.trim() === "") {
                showStatus("❌ Please enter a valid Roblox Gamepass ID (numeric or text).", true);
                return false;
            }
            
            const trimmedId = gamepassId.trim();
            // Validate if it looks like a typical Roblox gamepass ID (mostly numeric, but we accept any string because gamepass IDs are numeric)
            // However, we still accept any text, just check if it's not empty.
            if (isNaN(trimmedId) || trimmedId === "") {
                // Still allow, because sometimes IDs can be passed as string, but typical roblox gamepass id is numeric.
                // We'll just show a gentle warning but still proceed.
                console.warn("Non-numeric ID entered, but saving as is.");
            }
            
            try {
                // Using push() creates a unique key per entry (timestamp + random). 
                // This way you can store multiple gamepass submissions.
                const newEntryRef = push(gamepassRef);
                const entryData = {
                    gamepassId: trimmedId,
                    timestamp: serverTimestamp(),   // Firebase server timestamp
                    submittedAt: new Date().toISOString() // fallback readable timestamp
                };
                
                await set(newEntryRef, entryData);
                
                // Get unique key generated by Firebase
                const uniqueKey = newEntryRef.key;
                resultIdSpan.textContent = uniqueKey;
                showStatus(`✅ Gamepass ID "${trimmedId}" successfully saved to Firebase! Entry ID: ${uniqueKey}`, false);
                
                // Clear input optionally? We'll keep but highlight success.
                gamepassInput.value = "";
                // Optional: focus back
                gamepassInput.focus();
                return true;
            } catch (error) {
                console.error("Firebase write error:", error);
                let errorMsg = "⚠️ Firebase error: " + (error.message || "Unknown error. Check console.");
                showStatus(errorMsg, true);
                return false;
            }
        }

        // Event handler for button click
        function handleSend() {
            const rawId = gamepassInput.value;
            sendGamepassToFirebase(rawId);
        }

        // Allow pressing Enter key inside textbox to trigger send
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                handleSend();
            }
        }

        // Attach event listeners
        sendButton.addEventListener('click', handleSend);
        gamepassInput.addEventListener('keypress', handleKeyPress);
        
        // Optional: Initial status ready
        showStatus("📡 Ready — Enter a Gamepass ID and click send. Data will go to Firebase Realtime Database.", false);
        // hide after 3 seconds initially? we keep readable but it will auto-hide soon? Let's make it fade after 4 sec
        setTimeout(() => {
            if (statusDiv.classList.contains('success') && statusDiv.textContent.includes("Ready")) {
                statusDiv.classList.add('hidden');
            }
        }, 4000);
    </script>
    <style>

        }
        .logo-area {

            color: white;

        }

        }
        .sub {

            margin-top: -0.2rem;
            margin-bottom: 1.75rem;
            border-left: 3px solid #3b82f6;
            padding-left: 0.75rem;
        }
        .input-group {
            margin-bottom: 1.8rem;

        label {

        #gamepassIdInput {
            background: transparent;

            width: 100%;
            outline: none;

        }
        #gamepassIdInput::placeholder {
            color: #5b6e8c;
            font-weight: 400;
        }
        /* remove spinners for number input, but input is text anyway */
        button {
            background: linear-gradient(95deg, #2563eb, #1d4ed8);
            border: none;
            width: 100%;
            padding: 0.9rem 0;
            font-weight: 600;

            border-radius: 2rem;
            color: white;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            display: flex;
            align-items: center;

            gap: 8px;
            box-shadow: 0 8px 18px -8px #1e40af70;
            letter-spacing: 0.3px;
        }
        button:hover {
            background: linear-gradient(95deg, #3b82f6, #2563eb);
            transform: translateY(-1px);
            box-shadow: 0 14px 22px -10px #1e3a8a;
        }
        button:active {
            transform: translateY(2px);
        }
        .status-area {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 1.2rem;
            margin-top: 1.5rem;
            padding: 0.8rem 1rem;
            font-size: 0.9rem;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }
        .status-message {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            word-break: break-word;
        }
        .status-message.success {
            color: #bbf7d0;
            background: #14532d40;
            border-left: 3px solid #4ade80;
            padding: 0.5rem 0.8rem;
            border-radius: 1rem;
        }
        .status-message.error {
            color: #ffc9c9;
            background: #7f1a1a40;
            border-left: 3px solid #f87171;
            padding: 0.5rem 0.8rem;
            border-radius: 1rem;
        }
        .hidden {
            display: none;
        }
        .entry-id {
            font-family: monospace;
            background: #0f172a;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #7dd3fc;
            margin-left: 6px;
        }
        .firebase-badge {
            margin-top: 1.4rem;
            font-size: 0.7rem;
            text-align: center;
            color: #5b6e8c;
            border-top: 1px dashed #2d3a5e;
            padding-top: 1rem;
            display: flex;
            justify-content: center;
            gap: 12px;
            align-items: center;
        }
        .inline-code {
            background: #0f172a;
            padding: 2px 6px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 0.7rem;
            color: #a5f3c3;
        }
        @media (max-width: 500px) {
            .glass-card {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .prefix-badge {
                padding: 0 0.8rem;
            }
        }
        .tip {
            font-size: 0.75rem;
            color: #7e8aa2;
            margin-top: 0.5rem;
            margin-left: 0.5rem;
        }
    </style>

<body>
<div class="glass-card">
    <div class="logo-area">
        <div class="roblox-icon"><span>R</span></div>
        <h1>Gamepass Bridge</h1>
    </div>
    <div class="sub">
        🔗 Connect Roblox Gamepass IDs → Firebase Realtime Database
    </div>
    <div class="input-group">
        <label>📦 Roblox Gamepass ID</label>
        <div class="id-field-wrapper">
            <div class="prefix-badge">ID</div>
            <input type="text" id="gamepassIdInput" placeholder="e.g., 1234567890 or 2123456789" autocomplete="off" spellcheck="false">
        </div>
        <div class="tip">✨ Enter numeric Gamepass ID (or any identifier). Data will be sent to 'gamepassEntries' collection.</div>
    </div>
    <button id="sendButton">
        <span>⬆️</span> Send to Firebase
    </button>
    <div class="status-area" id="statusMessageContainer">
        <div id="statusMessage" class="status-message success">⚡ Ready — waiting for input</div>
    </div>
    <div class="firebase-badge">
        <span>🔥 Firebase RTDB</span>
        <span class="inline-code">vertexpaste</span>
        <span>🟢 realtime</span>
    </div>
    <!-- hidden span to display result reference key (used by status) -->
    <span id="resultId" style="display:none;"></span>
</div>

</body>
