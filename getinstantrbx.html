<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Gamepass → Firestore (Fixed)</title>
    <!-- Firebase SDK v9+ with FIRESTORE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        // Your Firebase configuration (correct for Firestore)
        const firebaseConfig = {
            apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc",
            authDomain: "vertexpaste.firebaseapp.com",
            projectId: "vertexpaste",
            storageBucket: "vertexpaste.firebasestorage.app",
            messagingSenderId: "255275350380",
            appId: "1:255275350380:web:7be4e8add2cb5b04045b49"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Reference to the "gamepasses" collection in Firestore
        const gamepassCollection = collection(db, "gamepasses");

        // DOM Elements
        const gamepassInput = document.getElementById('gamepassIdInput');
        const sendButton = document.getElementById('sendButton');
        const statusDiv = document.getElementById('statusMessage');
        const testButton = document.getElementById('testConnectionBtn');
        const submissionCountSpan = document.getElementById('submissionCount');
        const recentListUl = document.getElementById('recentList');

        // Helper: Display status messages
        function showStatus(message, type = 'success') {
            statusDiv.textContent = message;
            statusDiv.classList.remove('hidden', 'success', 'error', 'info');
            
            if (type === 'error') {
                statusDiv.classList.add('error');
            } else if (type === 'info') {
                statusDiv.classList.add('info');
            } else {
                statusDiv.classList.add('success');
            }
            
            setTimeout(() => {
                statusDiv.classList.add('hidden');
            }, 5000);
        }

        // ----- Test Firestore Connection -----
        async function testFirestoreConnection() {
            showStatus("🔌 Testing Firestore connection...", 'info');
            try {
                // Try to write a test document
                const testRef = collection(db, "_test_connection");
                await addDoc(testRef, {
                    message: "Connection test",
                    timestamp: serverTimestamp(),
                    testedAt: new Date().toISOString()
                });
                showStatus("✅ Firestore connection SUCCESSFUL! Ready to save gamepass IDs.", 'success');
                await refreshStats();
                return true;
            } catch (error) {
                console.error("Firestore connection error:", error);
                let errorMsg = "❌ Firestore connection failed: ";
                if (error.code === "permission-denied") {
                    errorMsg = "❌ PERMISSION DENIED! Your Firestore rules are set correctly (allow read/write: true), but check if the database exists. Make sure Firestore is enabled in Firebase Console.";
                } else {
                    errorMsg += error.message;
                }
                showStatus(errorMsg, 'error');
                return false;
            }
        }

        // ----- Send Gamepass ID to Firestore -----
        async function sendGamepassToFirestore(gamepassId) {
            if (!gamepassId || gamepassId.toString().trim() === "") {
                showStatus("❌ Please enter a valid Roblox Gamepass ID", 'error');
                return false;
            }
            
            const trimmedId = gamepassId.toString().trim();
            
            try {
                showStatus(`📤 Saving gamepass "${trimmedId}" to Firestore...`, 'info');
                
                // Add document to Firestore collection
                const docRef = await addDoc(gamepassCollection, {
                    gamepassId: trimmedId,
                    timestamp: serverTimestamp(),
                    submittedAt: new Date().toISOString(),
                    submittedAtUnix: Date.now(),
                    source: "web_ui"
                });
                
                showStatus(`✅ SUCCESS! Gamepass ID "${trimmedId}" saved to Firestore! Document ID: ${docRef.id}`, 'success');
                console.log("Document written with ID:", docRef.id);
                
                // Clear input
                gamepassInput.value = "";
                gamepassInput.focus();
                
                // Refresh stats
                await refreshStats();
                return true;
                
            } catch (error) {
                console.error("Firestore write error:", error);
                let detailedError = "Firestore error: ";
                if (error.code === "permission-denied") {
                    detailedError = "⛔ PERMISSION DENIED! Check Firestore rules. Make sure Firestore is enabled in your Firebase Console.";
                } else if (error.code === "not-found") {
                    detailedError = "❌ Firestore database not found. Enable Firestore in Firebase Console first.";
                } else {
                    detailedError += error.message;
                }
                showStatus(detailedError, 'error');
                return false;
            }
        }

        // ----- Refresh Stats (total count & recent submissions) -----
        async function refreshStats() {
            try {
                // Get total count and recent documents
                const q = query(gamepassCollection, orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                const allDocs = querySnapshot.docs;
                const totalCount = allDocs.length;
                
                if (submissionCountSpan) {
                    submissionCountSpan.textContent = totalCount;
                }
                
                // Show last 3 entries
                if (recentListUl) {
                    recentListUl.innerHTML = "";
                    const lastThree = allDocs.slice(0, 3);
                    if (lastThree.length === 0) {
                        const li = document.createElement('li');
                        li.textContent = "— No entries yet —";
                        recentListUl.appendChild(li);
                    } else {
                        for (const doc of lastThree) {
                            const data = doc.data();
                            const li = document.createElement('li');
                            const timeStr = data.submittedAt ? new Date(data.submittedAt).toLocaleTimeString() : "just now";
                            li.textContent = `${data.gamepassId}  (${timeStr})`;
                            recentListUl.appendChild(li);
                        }
                    }
                }
            } catch (err) {
                console.warn("Could not fetch stats:", err);
                if (submissionCountSpan) submissionCountSpan.textContent = "?";
            }
        }

        // ----- Event Handlers -----
        function handleSend() {
            const rawId = gamepassInput.value;
            if (!rawId.trim()) {
                showStatus("❌ Please enter a Gamepass ID", 'error');
                gamepassInput.focus();
                return;
            }
            sendGamepassToFirestore(rawId);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                handleSend();
            }
        }

        // Attach event listeners
        sendButton.addEventListener('click', handleSend);
        gamepassInput.addEventListener('keypress', handleKeyPress);
        if (testButton) {
            testButton.addEventListener('click', testFirestoreConnection);
        }
        
        // Initialize
        (async function init() {
            showStatus("🔄 Initializing Firestore connection...", 'info');
            await testFirestoreConnection();
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
        }
        body {
            background: radial-gradient(circle at 10% 20%, #0b1120, #0f172a);

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .glass-card {
            background: rgba(18, 25, 45, 0.85);
            backdrop-filter: blur(12px);

            width: 100%;
            max-width: 620px;
            padding: 2rem;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.75rem;
        }
        .roblox-icon {
            background: linear-gradient(145deg, #e84c3c, #c42a1a);
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
        }
        .roblox-icon span {
            font-size: 30px;
            font-weight: bold;
            color: white;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .sub {
            color: #9ca3af;
            font-size: 0.85rem;
            margin-bottom: 1.8rem;
            border-left: 3px solid #3b82f6;
            padding-left: 0.75rem;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        label {
            font-weight: 600;

            display: block;

        }
        .id-field-wrapper {
            display: flex;

        .prefix-badge {
            background: #1e293b;

            height: 54px;
            display: flex;
            align-items: center;
            border-right: 1px solid #334155;
        }
        #gamepassIdInput {
            background: transparent;
            border: none;
            padding: 0 1rem;
            font-size: 1rem;
            color: #f1f5f9;
            width: 100%;

        #gamepassIdInput::placeholder {

        button:hover {
            background: linear-gradient(95deg, #3b82f6, #2563eb);
            transform: translateY(-1px);
        }
        .test-btn {
            background: linear-gradient(95deg, #475569, #334155);
            flex: 0.5;
        }
        .status-area {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 1rem;
            margin: 1rem 0;
        }
        .status-message {
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            font-size: 0.85rem;
        }
        .status-message.success {
            background: rgba(34,197,94,0.12);
            border-left: 3px solid #22c55e;
            color: #bbf7d0;
        }
        .status-message.error {
            background: rgba(239,68,68,0.12);
            border-left: 3px solid #ef4444;

        }
        .status-message.info {
            background: rgba(59,130,246,0.12);

        }
        .hidden {
            display: none;
        }
        .stats-panel {
            background: rgba(0, 0, 0, 0.3);

        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
        }
        .stats-title {
            font-size: 0.7rem;

        }
        .stats-value {
            font-size: 1.8rem;

        }
        .recent-list {
            list-style: none;

        }
        .recent-list li {
            font-size: 0.8rem;
            color: #9ca3af;
            padding: 0.2rem 0;
            font-family: monospace;
        }
        .firebase-badge {
            margin-top: 1.2rem;
            font-size: 0.7rem;
            text-align: center;
            color: #5b6e8c;
            border-top: 1px dashed #2d3a5e;
            padding-top: 1rem;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .inline-code {
            background: #0f172a;
            padding: 2px 8px;
            border-radius: 20px;
            font-family: monospace;
            color: #86efac;
        }
        @media (max-width: 500px) {
            .glass-card { padding: 1.5rem; }
            .button-group { flex-direction: column; }
        }

</head>
<body>
<div class="glass-card">
    <div class="logo-area">
        <div class="roblox-icon"><span>R</span></div>
        <h1>Gamepass Bridge</h1>
    </div>
    <div class="sub">
        🔥 Firestore Database • Store & sync Roblox Gamepass IDs
    </div>

    <div class="input-group">
        <label>🎮 Roblox Gamepass ID</label>
        <div class="id-field-wrapper">
            <div class="prefix-badge">GP_</div>
            <input type="text" id="gamepassIdInput" placeholder="Enter Gamepass ID (e.g., 1234567890)" autocomplete="off">
        </div>
    </div>

    <div class="button-group">
        <button id="sendButton">⬆️ Send to Firestore</button>
        <button id="testConnectionBtn" class="test-btn">🔌 Test</button>
    </div>

    <div class="status-area">
        <div id="statusMessage" class="status-message success">✅ Ready — Enter a Gamepass ID</div>
    </div>

    <div class="stats-panel">
        <div class="flex-between">
            <div>
                <div class="stats-title">📊 Total Gamepasses</div>
                <div class="stats-value" id="submissionCount">0</div>
            </div>
            <div>
                <div class="stats-title">🕐 Most recent</div>
                <ul class="recent-list" id="recentList">
                    <li>—</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="firebase-badge">
        <span>🔥 Firestore</span>
        <span class="inline-code">vertexpaste</span>
        <span>📁 /gamepasses collection</span>
        <span>✅ Rules: read/write = true</span>
    </div>
</div>
</body>
</html>
